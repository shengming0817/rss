[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# serving-only：剥离 runtime default `operator-cli`（clap），`cargo tree -p server -i clap` 须为空。
runtime = { path = "../../assemblies/runtime", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
