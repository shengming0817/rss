[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# serving-only：剥离 runtime default `operator-cli`（clap）。Medium 守卫：
# INVARIANT SERVING-OPERATOR-CLI-ABSENT-01（xtask shipped_feature_guard）。
runtime = { path = "../../assemblies/runtime", default-features = false }
runtimeexec = { path = "../../crates/runtimeexec" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
