schemaVersion = 1
id = "identity-refresh-localtx"
contractId = "identity.refresh"
txModel = "tenant-scoped-uow"
spec = "journeys/identity-refresh-localtx-journey.toml"
runner = "journeys/tests/identity_refresh_localtx_journey.rs"
marker = "IDENTITY_REFRESH"

[[cases]]
id = "identity-refresh-happy"
scenario = "happy"
httpStatus = 201
errorCode = "none"
retryable = false
attempts = 1
commits = 1
redactSentinels = ["refresh-happy-secret-sentinel"]

[[cases]]
id = "identity-refresh-unknown"
scenario = "auth-failure"
httpStatus = 401
errorCode = "ERR_CORE_UNAUTHENTICATED"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["refresh-unknown-secret-sentinel"]

[[cases]]
id = "identity-refresh-malformed"
scenario = "validation-failure"
httpStatus = 400
errorCode = "ERR_CORE_VALIDATION"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["refresh-malformed-secret-sentinel"]

[[cases]]
id = "identity-refresh-contention-winner"
scenario = "contention"
httpStatus = 201
errorCode = "none"
retryable = false
attempts = 1
commits = 1
redactSentinels = ["refresh-contention-secret-sentinel"]

[[cases]]
id = "identity-refresh-contention-loser"
scenario = "contention"
httpStatus = 401
errorCode = "ERR_CORE_UNAUTHENTICATED"
retryable = false
attempts = 2
commits = 2
redactSentinels = ["refresh-contention-secret-sentinel"]

[[cases]]
id = "identity-refresh-commit-unknown"
scenario = "commit-unknown"
httpStatus = 500
errorCode = "ERR_CORE_INTERNAL"
retryable = false
attempts = 1
redactSentinels = ["refresh-commit-unknown-secret-sentinel"]
