schemaVersion = 1
id = "identity-logout-localtx"
contractId = "identity.logout"
txModel = "tenant-scoped-uow"
spec = "journeys/identity-logout-localtx-journey.toml"
runner = "journeys/tests/localtx_validation_journey.rs"
marker = "IDENTITY_LOGOUT"

[[cases]]
id = "identity-logout-happy"
scenario = "happy"
httpStatus = 200
errorCode = "none"
retryable = false
attempts = 1
commits = 1
redactSentinels = ["$sessionId"]

[[cases]]
id = "identity-logout-unauthenticated"
scenario = "auth-failure"
httpStatus = 401
errorCode = "ERR_CORE_UNAUTHENTICATED"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["$sessionId"]

[[cases]]
id = "identity-logout-other-owner"
scenario = "auth-failure"
httpStatus = 403
errorCode = "ERR_CORE_FORBIDDEN"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["$sessionId"]

[[cases]]
id = "identity-logout-validation-failure"
scenario = "validation-failure"
httpStatus = 400
errorCode = "ERR_CORE_VALIDATION"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["logout-shape-sentinel"]

[[cases]]
id = "identity-logout-contention"
scenario = "contention"
httpStatus = 200
errorCode = "none"
retryable = false
attempts = 2
commits = 1
redactSentinels = ["$sessionId"]

[[cases]]
id = "identity-logout-repeat"
scenario = "contention"
httpStatus = 200
errorCode = "none"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["$sessionId"]

[[cases]]
id = "identity-logout-cross-tenant"
scenario = "contention"
httpStatus = 200
errorCode = "none"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["$sessionId"]
