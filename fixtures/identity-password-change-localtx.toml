schemaVersion = 1
id = "identity-password-change-localtx"
contractId = "identity.password-change"
txModel = "repo-atomic-cas"
spec = "journeys/identity-password-change-localtx-journey.toml"
runner = "journeys/tests/identity_password_change_localtx_journey.rs"
marker = "IDENTITY_PASSWORD_CHANGE"

[[cases]]
id = "identity-password-change-happy"
scenario = "happy"
httpStatus = 200
errorCode = "none"
retryable = false
attempts = 1
commits = 1
redactSentinels = ["journey-current-password-sentinel", "journey-new-password-sentinel"]

[[cases]]
id = "identity-password-change-unauthenticated"
scenario = "auth-failure"
httpStatus = 401
errorCode = "ERR_CORE_UNAUTHENTICATED"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["journey-current-password-sentinel", "journey-new-password-sentinel"]

[[cases]]
id = "identity-password-change-invalid-subject"
scenario = "auth-failure"
httpStatus = 403
errorCode = "ERR_CORE_FORBIDDEN"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["journey-current-password-sentinel", "journey-new-password-sentinel"]

[[cases]]
id = "identity-password-change-validation-failure"
scenario = "validation-failure"
httpStatus = 400
errorCode = "ERR_CORE_VALIDATION"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["journey-current-password-sentinel", "journey-new-password-sentinel"]

[[cases]]
id = "identity-password-change-conflict"
scenario = "conflict"
httpStatus = 409
errorCode = "ERR_CORE_VERSION_CONFLICT"
retryable = true
attempts = 1
commits = 0
redactSentinels = ["journey-current-password-sentinel", "journey-conflict-password-a-sentinel", "journey-conflict-password-b-sentinel"]
