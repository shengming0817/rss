schemaVersion = 1
id = "settings-secret-publish-localtx"
contractId = "settings.secret-publish"
txModel = "repo-atomic-cas"
spec = "journeys/settings-secret-publish-localtx-journey.toml"
runner = "journeys/tests/settings_secret_publish_localtx_journey.rs"
marker = "SETTINGS_SECRET_PUBLISH"

[[cases]]
id = "settings-secret-publish-happy"
scenario = "happy"
httpStatus = 201
errorCode = "none"
retryable = false
attempts = 1
commits = 1
redactSentinels = ["journey-vault", "tenant-a/happy-secret-sentinel"]

[[cases]]
id = "settings-secret-publish-auth-failure"
scenario = "auth-failure"
httpStatus = 401
errorCode = "ERR_CORE_UNAUTHENTICATED"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["auth-store-sentinel", "auth/ref-sentinel"]

[[cases]]
id = "settings-secret-publish-validation-failure"
scenario = "validation-failure"
httpStatus = 400
errorCode = "ERR_CORE_VALIDATION"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["invalid-store-sentinel", "invalid-ref-sentinel"]

[[cases]]
id = "settings-secret-publish-conflict"
scenario = "conflict"
httpStatus = 409
errorCode = "ERR_CORE_VERSION_CONFLICT"
retryable = true
attempts = 1
commits = 0
redactSentinels = ["conflict-store-a-sentinel", "conflict/ref-a-sentinel", "conflict-store-b-sentinel", "conflict/ref-b-sentinel"]
