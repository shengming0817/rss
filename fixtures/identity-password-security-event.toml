schemaVersion = 1
id = "identity-password-security-event"
contractId = "identity.password-change"
txModel = "producer-transaction"
spec = "journeys/identity-password-security-event-journey.toml"
runner = "journeys/tests/identity_password_security_event_journey.rs"
marker = "IDENTITY_PASSWORD_CHANGE"
delegatedEvidence = [
  "adapters/postgres::identity_security_full_snapshot_cas_rejects_timestamp_only_staleness",
  "adapters/postgres::password_change_security_event_fault_matrix_rolls_back_every_stage",
]

[[cases]]
id = "identity-password-security-event-happy"
scenario = "password-security-event"
operation = "password-change"
httpStatus = 200
commits = 1
credentialVersionDelta = 1
accountEpochDelta = 1
revokedGrants = 2
revokedFamilies = 2
eventKind = "passwordChanged"
oldAccessStatus = 401
oldRefreshStatus = 401
redactSentinels = [
  "journey-current-password-sentinel",
  "journey-new-password-sentinel",
]

[[cases]]
id = "identity-password-security-event-unauthenticated"
scenario = "failure-zero-effects"
operation = "password-change"
httpStatus = 401
redactSentinels = [
  "journey-current-password-sentinel",
  "journey-failure-new-password-sentinel",
]

[[cases]]
id = "identity-password-security-event-concurrent-conflict"
scenario = "password-security-event-concurrent-conflict"
operation = "password-change"
httpStatus = 200
competingHttpStatus = 409
commits = 1
initialCredentialVersion = 1
credentialVersionDelta = 1
accountEpochDelta = 1
revokedGrants = 2
revokedFamilies = 2
eventKind = "passwordChanged"
redactSentinels = [
  "journey-current-password-sentinel",
  "journey-new-password-sentinel",
]

[[cases]]
id = "identity-password-security-event-invalid-subject"
scenario = "failure-zero-effects"
operation = "password-change"
httpStatus = 401
redactSentinels = [
  "journey-current-password-sentinel",
  "journey-failure-new-password-sentinel",
]

[[cases]]
id = "identity-password-security-event-wrong-current-password"
scenario = "failure-zero-effects"
operation = "password-change"
httpStatus = 403
redactSentinels = [
  "journey-wrong-current-password-sentinel",
  "journey-failure-new-password-sentinel",
]

[[cases]]
id = "identity-password-security-event-policy-rejected"
scenario = "failure-zero-effects"
operation = "password-change"
httpStatus = 400
redactSentinels = [
  "journey-current-password-sentinel",
  "policy-bad",
]

