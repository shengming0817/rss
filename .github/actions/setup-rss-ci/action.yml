name: Setup RSS Rust CI
description: Restore validated RSS CI caches and install the exact pinned Rust tools for one closed lane.

inputs:
  lane:
    description: Closed fixed-job lane and cache profile.
    required: true
  compiler-partition:
    description: Closed compiler target/cache partition derived from the validated invocation.
    required: true
  toolchain:
    description: Pinned stable Rust toolchain identity used in cache keys.
    required: true
  nightly:
    description: Optional pinned nightly toolchain required by the selected tools.
    required: false
    default: ""
  download-cache-epoch:
    description: Explicit epoch for incompatible Cargo download-cache changes.
    required: true
  tool-cache-epoch:
    description: Explicit epoch for incompatible tool-cache changes.
    required: true
  compiler-cache-epoch:
    description: Explicit epoch for incompatible compiler-cache changes.
    required: true

outputs:
  cache-context:
    description: Closed v2 cache lifecycle context consumed only by finalize-rss-ci.
    value: ${{ steps.cache-context.outputs.value }}

runs:
  using: composite
  steps:
    - name: Resolve pinned tools
      id: tool-policy
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
        RSS_COMPILER_PARTITION: ${{ inputs.compiler-partition }}
      run: |
        set -euo pipefail
        install_action_tools="$(.github/scripts/ci-tool-adapters.sh specs --lane "$RSS_LANE" --backend install-action)"
        binstall_tools="$(.github/scripts/ci-tool-adapters.sh specs --lane "$RSS_LANE" --backend binstall)"
        adapter_sha256="$(sha256sum .github/scripts/ci-tool-adapters.sh | cut -d' ' -f1)"
        catalog_sha256="$(sha256sum .github/scripts/ci-tool-catalog.txt | cut -d' ' -f1)"
        sccache_spec="$(.github/scripts/ci-tool-adapters.sh sccache-spec)"
        IFS='|' read -r sccache_name sccache_version sccache_backend sccache_relative sccache_probe <<< "$sccache_spec"
        [ "$sccache_name" = sccache ] && [ "$sccache_backend" = install-action ] && [ "$sccache_probe" = sccache ]
        {
          echo "install-action-tools=$install_action_tools"
          echo "binstall-tools=$binstall_tools"
          echo "adapter-sha256=$adapter_sha256"
          echo "catalog-sha256=$catalog_sha256"
          echo "sccache-version=$sccache_version"
          echo "sccache-relative=$sccache_relative"
        } >> "$GITHUB_OUTPUT"

    - name: Validate inputs and derive cache keys
      id: cache-keys
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
        RSS_COMPILER_PARTITION: ${{ inputs.compiler-partition }}
        RSS_TOOLCHAIN: ${{ inputs.toolchain }}
        RSS_NIGHTLY: ${{ inputs.nightly }}
        RSS_INSTALL_ACTION_TOOLS: ${{ steps.tool-policy.outputs.install-action-tools }}
        RSS_BINSTALL_TOOLS: ${{ steps.tool-policy.outputs.binstall-tools }}
        RSS_ADAPTER_SHA256: ${{ steps.tool-policy.outputs.adapter-sha256 }}
        RSS_CATALOG_SHA256: ${{ steps.tool-policy.outputs.catalog-sha256 }}
        RSS_SCCACHE_VERSION: ${{ steps.tool-policy.outputs.sccache-version }}
        RSS_DOWNLOAD_CACHE_EPOCH: ${{ inputs.download-cache-epoch }}
        RSS_TOOL_CACHE_EPOCH: ${{ inputs.tool-cache-epoch }}
        RSS_COMPILER_CACHE_EPOCH: ${{ inputs.compiler-cache-epoch }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.lane }}
        RSS_FALLBACK_TARGET: ${{ runner.temp }}/rss-tool-build-target
        RSS_JOB_TARGET: ${{ runner.temp }}/rss-cargo-target/${{ inputs.lane }}/${{ inputs.compiler-partition }}
        RSS_DOWNLOAD_ROOT: ${{ runner.temp }}/rss-cargo-home
        RSS_COMPILER_ROOT: ${{ runner.temp }}/rss-sccache-cache
      run: |
        set -euo pipefail
        input_hash="$(sha256sum Cargo.lock .cargo/config.toml rust-toolchain.toml | sha256sum | cut -d' ' -f1)"
        tools_hash="$(printf '%s\n' \
          'taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5' \
          'cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65@1.20.1' \
          "$RSS_ADAPTER_SHA256" \
          "$RSS_CATALOG_SHA256" \
          "$RSS_INSTALL_ACTION_TOOLS" \
          "$RSS_BINSTALL_TOOLS" | sha256sum | cut -d' ' -f1)"
        # derive-keys is the closed identity validator and must run before any
        # input-derived path is created or reset.
        .github/scripts/ci-cache-maintain.sh derive-keys \
          --os "$RUNNER_OS" \
          --arch "$RUNNER_ARCH" \
          --toolchain "$RSS_TOOLCHAIN" \
          --nightly "$RSS_NIGHTLY" \
          --lane "$RSS_LANE" \
          --profile "$RSS_LANE" \
          --compiler-partition "$RSS_COMPILER_PARTITION" \
          --download-cache-epoch "$RSS_DOWNLOAD_CACHE_EPOCH" \
          --tool-cache-epoch "$RSS_TOOL_CACHE_EPOCH" \
          --compiler-cache-epoch "$RSS_COMPILER_CACHE_EPOCH" \
          --sccache-version "$RSS_SCCACHE_VERSION" \
          --input-hash "$input_hash" \
          --tools-hash "$tools_hash" \
          --run-id "$GITHUB_RUN_ID" \
          --run-attempt "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
        .github/scripts/ci-cache-maintain.sh prepare-roots \
          --workspace "$GITHUB_WORKSPACE" \
          --tool-root "$RSS_TOOL_ROOT" \
          --runner-temp "$RUNNER_TEMP" \
          --fallback-target "$RSS_FALLBACK_TARGET"
        .github/scripts/ci-cache-maintain.sh reset-descendant \
          --parent "$RUNNER_TEMP" \
          --path "$RSS_DOWNLOAD_ROOT"
        .github/scripts/ci-cache-maintain.sh reset-descendant \
          --parent "$RUNNER_TEMP" \
          --path "$RSS_COMPILER_ROOT"
        mkdir -p "$RSS_JOB_TARGET"
        {
          echo "CARGO_HOME=$RSS_DOWNLOAD_ROOT"
          echo "CARGO_TARGET_DIR=$RSS_JOB_TARGET"
        } >> "$GITHUB_ENV"

    - name: Restore Cargo downloads
      id: download-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.temp }}/rss-cargo-home/registry/cache
          ${{ runner.temp }}/rss-cargo-home/registry/index
          ${{ runner.temp }}/rss-cargo-home/git/db
        key: ${{ steps.cache-keys.outputs.download-primary-key }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.download-input-restore-prefix }}
          ${{ steps.cache-keys.outputs.download-restore-prefix }}

    - name: Reset Cargo downloads after restore failure
      id: download-reset
      if: ${{ steps.download-cache.outcome == 'failure' }}
      continue-on-error: true
      shell: bash
      run: .github/scripts/ci-cache-maintain.sh reset-descendant --parent "$RUNNER_TEMP" --path "$RUNNER_TEMP/rss-cargo-home"

    - name: Expose fail-open Cargo download root
      id: download-configure
      if: ${{ always() }}
      shell: bash
      env:
        RSS_DOWNLOAD_RESTORE_OUTCOME: ${{ steps.download-cache.outcome }}
        RSS_DOWNLOAD_RESET_OUTCOME: ${{ steps.download-reset.outcome }}
      run: |
        set -euo pipefail
        download_root="$RUNNER_TEMP/rss-cargo-home"
        enabled=true
        if { [ "$RSS_DOWNLOAD_RESTORE_OUTCOME" != success ] && [ "$RSS_DOWNLOAD_RESET_OUTCOME" != success ]; } || ! .github/scripts/ci-cache-maintain.sh measure --path "$download_root" >/dev/null 2>&1; then
          download_root="$RUNNER_TEMP/rss-cargo-home-cold-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          .github/scripts/ci-cache-maintain.sh reset-descendant --parent "$RUNNER_TEMP" --path "$download_root"
          enabled=false
          echo '::warning::Cargo download snapshot unavailable; using an isolated cold Cargo home'
        fi
        echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        echo "CARGO_HOME=$download_root" >> "$GITHUB_ENV"

    - name: Restore exact sealed tools
      id: tools-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: .cache/ci-tools/${{ inputs.lane }}
        key: ${{ steps.cache-keys.outputs.tools-primary-key }}

    - name: Install Rust toolchains
      shell: bash
      env:
        RSS_SETUP_NIGHTLY: ${{ inputs.nightly }}
      run: |
        set -euo pipefail
        rustup component add rustfmt clippy llvm-tools-preview
        if [ -n "$RSS_SETUP_NIGHTLY" ]; then
          rustup toolchain install "$RSS_SETUP_NIGHTLY" --profile minimal --component rustc-dev --component llvm-tools-preview --component rust-src
        fi
        rustup show

    - name: Validate restored sealed tools
      id: tools-cache-verify
      if: ${{ steps.tools-cache.outcome == 'success' && steps.tools-cache.outputs.cache-hit == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
        RSS_COMPILER_PARTITION: ${{ inputs.compiler-partition }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.lane }}
      run: .github/scripts/ci-tool-adapters.sh verify --mode cache --lane "$RSS_LANE" --root "$RSS_TOOL_ROOT"

    - name: Reset missing or invalid tool cache
      id: tools-reset
      if: ${{ steps.tools-cache.outcome != 'success' || steps.tools-cache.outputs.cache-hit != 'true' || steps.tools-cache-verify.outcome != 'success' }}
      shell: bash
      env:
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.lane }}
      run: .github/scripts/ci-cache-maintain.sh reset-descendant --parent "$GITHUB_WORKSPACE" --path "$RSS_TOOL_ROOT"

    - name: Install cargo-binstall
      if: ${{ steps.tool-policy.outputs.binstall-tools != '' && steps.tools-cache-verify.outcome != 'success' }}
      uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65
      with:
        version: 1.20.1

    - name: Install fallback tools
      if: ${{ steps.tool-policy.outputs.binstall-tools != '' && steps.tools-cache-verify.outcome != 'success' }}
      shell: bash
      env:
        RSS_BINSTALL_TOOLS: ${{ steps.tool-policy.outputs.binstall-tools }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.lane }}
        CARGO_TARGET_DIR: ${{ runner.temp }}/rss-tool-build-target
        CARGO_BINSTALL_DISABLE_TELEMETRY: "true"
      run: |
        set -euo pipefail
        mkdir -p "$RSS_TOOL_ROOT/bin"
        IFS=',' read -r -a specs <<< "$RSS_BINSTALL_TOOLS"
        for spec in "${specs[@]}"; do
          cargo binstall --locked --no-confirm --disable-strategies quick-install --disable-telemetry --root "$RSS_TOOL_ROOT" "$spec"
        done

    - name: Install pinned prebuilt tools
      if: ${{ steps.tool-policy.outputs.install-action-tools != '' && steps.tools-cache-verify.outcome != 'success' }}
      uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5
      env:
        HOME: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.lane }}
      with:
        tool: ${{ steps.tool-policy.outputs.install-action-tools }}
        fallback: none

    - name: Validate and expose sealed tools
      id: tools-verify
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.lane }}
        RSS_CACHED_TOOLS_OUTCOME: ${{ steps.tools-cache-verify.outcome }}
        RSS_SCCACHE_RELATIVE: ${{ steps.tool-policy.outputs.sccache-relative }}
      run: |
        set -euo pipefail
        mode=fresh
        if [ "$RSS_CACHED_TOOLS_OUTCOME" = success ]; then mode=cache; fi
        .github/scripts/ci-tool-adapters.sh verify --mode "$mode" --lane "$RSS_LANE" --root "$RSS_TOOL_ROOT"
        compiler_cache_path="$(.github/scripts/ci-tool-adapters.sh verify-sccache --candidate "$RSS_TOOL_ROOT/$RSS_SCCACHE_RELATIVE")"
        echo "RSS_INTERNAL_SCCACHE_PATH=$compiler_cache_path" >> "$GITHUB_ENV"
        echo "$RSS_TOOL_ROOT/.install-action/bin" >> "$GITHUB_PATH"
        echo "$RSS_TOOL_ROOT/bin" >> "$GITHUB_PATH"

    - name: Save sealed tools from trusted runs
      id: tools-save
      if: ${{ steps.tools-cache-verify.outcome != 'success' && steps.tools-verify.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: .cache/ci-tools/${{ inputs.lane }}
        key: ${{ steps.cache-keys.outputs.tools-primary-key }}

    - name: Restore compiler objects
      id: compiler-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/rss-sccache-cache
        key: ${{ steps.cache-keys.outputs.compiler-primary-key }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.compiler-input-restore-prefix }}
          ${{ steps.cache-keys.outputs.compiler-broad-restore-prefix }}

    - name: Reset compiler cache after restore failure
      id: compiler-reset
      if: ${{ steps.compiler-cache.outcome != 'success' }}
      continue-on-error: true
      shell: bash
      run: .github/scripts/ci-cache-maintain.sh reset-descendant --parent "$RUNNER_TEMP" --path "$RUNNER_TEMP/rss-sccache-cache"

    - name: Expose fail-open compiler cache
      id: compiler-configure
      if: ${{ always() }}
      shell: bash
      env:
        RSS_COMPILER_RESTORE_OUTCOME: ${{ steps.compiler-cache.outcome }}
        RSS_COMPILER_RESET_OUTCOME: ${{ steps.compiler-reset.outcome }}
      run: |
        set -euo pipefail
        enabled=false
        if [ "$RSS_COMPILER_RESTORE_OUTCOME" = success ] || [ "$RSS_COMPILER_RESET_OUTCOME" = success ]; then
          if .github/scripts/ci-cache-maintain.sh measure --path "$RUNNER_TEMP/rss-sccache-cache" >/dev/null 2>&1; then
            enabled=true
          fi
        fi
        echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        echo "RSS_SCCACHE_ENABLED=$enabled" >> "$GITHUB_ENV"
        if [ "$enabled" = false ]; then
          echo '::warning::sccache snapshot unavailable; compiling without a cache wrapper'
          exit 0
        fi
        mkdir -p "$RUNNER_TEMP/rss-sccache"
        {
          echo "RUSTC_WRAPPER=$RSS_INTERNAL_SCCACHE_PATH"
          echo 'CARGO_INCREMENTAL=0'
          echo 'SCCACHE_IGNORE_SERVER_IO_ERROR=1'
          echo 'SCCACHE_CACHE_SIZE=2G'
          echo "SCCACHE_DIR=$RUNNER_TEMP/rss-sccache-cache"
          echo "SCCACHE_SERVER_UDS=$RUNNER_TEMP/rss-sccache/server.sock"
        } >> "$GITHUB_ENV"

    - name: Zero compiler cache statistics
      id: zero-sccache-stats
      if: ${{ steps.compiler-configure.outputs.enabled == 'true' }}
      continue-on-error: true
      shell: bash
      run: |
        "$RSS_INTERNAL_SCCACHE_PATH" --zero-stats

    - name: Seal cache lifecycle context
      id: cache-context
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
        RSS_COMPILER_PARTITION: ${{ inputs.compiler-partition }}
        RSS_DOWNLOAD_PRIMARY: ${{ steps.cache-keys.outputs.download-primary-key }}
        RSS_DOWNLOAD_OUTCOME: ${{ steps.download-cache.outcome }}
        RSS_DOWNLOAD_HIT: ${{ steps.download-cache.outputs.cache-hit }}
        RSS_DOWNLOAD_MATCHED: ${{ steps.download-cache.outputs.cache-matched-key }}
        RSS_DOWNLOAD_ENABLED: ${{ steps.download-configure.outputs.enabled }}
        RSS_COMPILER_PRIMARY: ${{ steps.cache-keys.outputs.compiler-primary-key }}
        RSS_COMPILER_OUTCOME: ${{ steps.compiler-cache.outcome }}
        RSS_COMPILER_HIT: ${{ steps.compiler-cache.outputs.cache-hit }}
        RSS_COMPILER_MATCHED: ${{ steps.compiler-cache.outputs.cache-matched-key }}
        RSS_COMPILER_ENABLED: ${{ steps.compiler-configure.outputs.enabled }}
      run: |
        set -euo pipefail
        context="$(jq -cn \
          --arg schema rss-ci-cache-context-v2 \
          --arg lane "$RSS_LANE" \
          --arg partition "$RSS_COMPILER_PARTITION" \
          --arg download_primary "$RSS_DOWNLOAD_PRIMARY" \
          --arg download_outcome "$RSS_DOWNLOAD_OUTCOME" \
          --arg download_hit "$RSS_DOWNLOAD_HIT" \
          --arg download_matched "$RSS_DOWNLOAD_MATCHED" \
          --arg download_enabled "$RSS_DOWNLOAD_ENABLED" \
          --arg compiler_primary "$RSS_COMPILER_PRIMARY" \
          --arg compiler_outcome "$RSS_COMPILER_OUTCOME" \
          --arg compiler_hit "$RSS_COMPILER_HIT" \
          --arg compiler_matched "$RSS_COMPILER_MATCHED" \
          --arg compiler_enabled "$RSS_COMPILER_ENABLED" \
          '{schema:$schema,lane:$lane,partition:$partition,download:{primary:$download_primary,restore_outcome:$download_outcome,hit:$download_hit,matched:$download_matched,enabled:$download_enabled},compiler:{primary:$compiler_primary,restore_outcome:$compiler_outcome,hit:$compiler_hit,matched:$compiler_matched,enabled:$compiler_enabled}}')"
        echo "value=$context" >> "$GITHUB_OUTPUT"
