name: Setup RSS Rust CI
description: Restore isolated exact caches, install the pinned Rust toolchain, and install lane tools.

inputs:
  lane:
    description: Stable cache ownership lane.
    required: true
  profile:
    description: Cargo profile and isolated tool-cache namespace.
    required: true
  toolchain:
    description: Pinned stable Rust toolchain identity used in cache keys.
    required: true
  nightly:
    description: Optional pinned nightly toolchain required by public-api.
    required: false
    default: ""
  prebuilt-tools:
    description: Comma-separated name@semver specs supported by taiki-e/install-action.
    required: false
    default: ""
  fallback-tools:
    description: Comma-separated name@semver specs installed by cargo-binstall.
    required: false
    default: ""
  tool-cache-epoch:
    description: Explicit epoch for incompatible tool-cache changes.
    required: true
  writer-mode:
    description: Exact boolean eligibility decided by the caller trigger policy.
    required: true
  evidence-enabled:
    description: Whether the caller initialized the evidence lifecycle.
    required: true

outputs:
  download-primary-key:
    description: Primary download-cache key; evidence must not persist this value.
    value: ${{ steps.cache-keys.outputs.download-primary-key }}
  download-matched-key:
    description: Matched download-cache key; evidence must not persist this value.
    value: ${{ steps.download-cache.outputs.cache-matched-key }}
  download-hit:
    description: Whether the download cache was an exact primary-key hit.
    value: ${{ steps.download-cache.outputs.cache-hit }}
  target-primary-key:
    description: Primary target-cache key; evidence must not persist this value.
    value: ${{ steps.cache-keys.outputs.target-primary-key }}
  target-matched-key:
    description: Matched target-cache key; evidence must not persist this value.
    value: ${{ steps.target-cache.outputs.cache-matched-key }}
  target-hit:
    description: Whether the target cache was an exact primary-key hit.
    value: ${{ steps.target-cache.outputs.cache-hit }}
  tools-primary-key:
    description: Primary tool-cache key; evidence must not persist this value.
    value: ${{ steps.cache-keys.outputs.tools-primary-key }}
  tools-matched-key:
    description: Matched tool-cache key; evidence must not persist this value.
    value: ${{ steps.tools-cache.outputs.cache-matched-key }}
  tools-hit:
    description: Whether the tool cache was an exact primary-key hit.
    value: ${{ steps.tools-cache.outputs.cache-hit }}
  build-restore-result:
    value: ${{ steps.after-cache.outputs.build-result }}
  build-restored-footprint-bytes:
    value: ${{ steps.after-cache.outputs.build-bytes }}
  tools-restore-result:
    value: ${{ steps.after-cache.outputs.tools-result }}
  tools-restored-footprint-bytes:
    value: ${{ steps.after-cache.outputs.tools-bytes }}

runs:
  using: composite
  steps:
    - name: Validate policy inputs and derive exact cache keys
      id: cache-keys
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
        RSS_PROFILE: ${{ inputs.profile }}
        RSS_TOOLCHAIN: ${{ inputs.toolchain }}
        RSS_NIGHTLY: ${{ inputs.nightly }}
        RSS_PREBUILT_TOOLS: ${{ inputs.prebuilt-tools }}
        RSS_FALLBACK_TOOLS: ${{ inputs.fallback-tools }}
        RSS_TOOL_CACHE_EPOCH: ${{ inputs.tool-cache-epoch }}
        RSS_WRITER_MODE: ${{ inputs.writer-mode }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.profile }}
        RSS_FALLBACK_TARGET: ${{ runner.temp }}/rss-tool-build-target
      run: |
        set -euo pipefail
        case "$RSS_LANE" in ci-meta|ci-core|ci-security|ci-coverage|integration|audit) ;; *) exit 64 ;; esac
        case "$RSS_PROFILE" in ci-meta|ci-core|ci-security|ci-coverage|integration|audit) ;; *) exit 64 ;; esac
        [ "$RSS_PROFILE" = "$RSS_LANE" ] || exit 64
        case "$RSS_WRITER_MODE" in true|false) ;; *) exit 64 ;; esac
        RSS_NIGHTLY_ID="${RSS_NIGHTLY:-none}"
        .github/scripts/ci-cache-maintain.sh prepare-roots --workspace "$GITHUB_WORKSPACE" --tool-root "$RSS_TOOL_ROOT" --runner-temp "$RUNNER_TEMP" --fallback-target "$RSS_FALLBACK_TARGET"
        .github/scripts/ci-cache-maintain.sh validate-tools --specs "$RSS_PREBUILT_TOOLS" --tool-root "$RSS_TOOL_ROOT" --fallback-target "$RSS_FALLBACK_TARGET"
        .github/scripts/ci-cache-maintain.sh validate-tools --specs "$RSS_FALLBACK_TOOLS" --tool-root "$RSS_TOOL_ROOT" --fallback-target "$RSS_FALLBACK_TARGET"
        source_hash="$(sha256sum Cargo.lock .cargo/config.toml rust-toolchain.toml | sha256sum | cut -d' ' -f1)"
        tree_identity="$(.github/scripts/ci-cache-maintain.sh tree-identity --workspace "$GITHUB_WORKSPACE")"
        tools_hash="$(printf '%s\n' 'taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a' 'cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65@1.20.1' "$RSS_PREBUILT_TOOLS" "$RSS_FALLBACK_TOOLS" | sha256sum | cut -d' ' -f1)"
        common="$RSS_LANE-${RUNNER_OS}-${RUNNER_ARCH}-$RSS_TOOLCHAIN-$RSS_NIGHTLY_ID-$RSS_PROFILE"
        echo "download-primary-key=rss-download-v3-$common-$source_hash" >> "$GITHUB_OUTPUT"
        echo "target-primary-key=rss-target-v3-$common-$source_hash-$tree_identity" >> "$GITHUB_OUTPUT"
        echo "tools-primary-key=rss-tools-$RSS_TOOL_CACHE_EPOCH-$RSS_LANE-${RUNNER_OS}-${RUNNER_ARCH}-$RSS_TOOLCHAIN-$RSS_PROFILE-$tools_hash" >> "$GITHUB_OUTPUT"

    - name: Restore exact Cargo download cache
      id: download-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
          ~/.cargo/git/db
        key: ${{ steps.cache-keys.outputs.download-primary-key }}

    - name: Restore exact target cache
      id: target-cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/cargo-target
        key: ${{ steps.cache-keys.outputs.target-primary-key }}

    - name: Restore exact tool cache
      id: tools-cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/ci-tools/${{ inputs.profile }}
        key: ${{ steps.cache-keys.outputs.tools-primary-key }}

    - name: Measure restored cache footprints
      id: restored-footprints
      shell: bash
      env:
        DOWNLOAD_MATCHED: ${{ steps.download-cache.outputs.cache-matched-key }}
        TARGET_MATCHED: ${{ steps.target-cache.outputs.cache-matched-key }}
        TOOLS_MATCHED: ${{ steps.tools-cache.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        download_bytes=0
        if [ -n "$DOWNLOAD_MATCHED" ]; then
          registry_cache_bytes="$(.github/scripts/ci-cache-maintain.sh measure --path "$HOME/.cargo/registry/cache")"
          registry_index_bytes="$(.github/scripts/ci-cache-maintain.sh measure --path "$HOME/.cargo/registry/index")"
          git_db_bytes="$(.github/scripts/ci-cache-maintain.sh measure --path "$HOME/.cargo/git/db")"
          download_bytes="$((registry_cache_bytes + registry_index_bytes + git_db_bytes))"
        fi
        target_bytes=0
        if [ -n "$TARGET_MATCHED" ]; then
          target_bytes="$(.github/scripts/ci-cache-maintain.sh measure --path "$GITHUB_WORKSPACE/.cache/cargo-target")"
        fi
        tools_bytes=0
        if [ -n "$TOOLS_MATCHED" ]; then
          tools_bytes="$(.github/scripts/ci-cache-maintain.sh measure --path "$GITHUB_WORKSPACE/.cache/ci-tools/${{ inputs.profile }}")"
        fi
        echo "build-bytes=$((download_bytes + target_bytes))" >> "$GITHUB_OUTPUT"
        echo "tools-bytes=$tools_bytes" >> "$GITHUB_OUTPUT"

    - name: Rust toolchain
      shell: bash
      env:
        RSS_SETUP_NIGHTLY: ${{ inputs.nightly }}
      run: |
        set -euo pipefail
        rustup component add rustfmt clippy llvm-tools-preview
        if [ -n "$RSS_SETUP_NIGHTLY" ]; then
          rustup toolchain install "${RSS_SETUP_NIGHTLY}" --profile minimal --component rustc-dev --component llvm-tools-preview --component rust-src
        fi
        rustup show

    - name: Install pinned prebuilt tools
      if: ${{ inputs.prebuilt-tools != '' && steps.tools-cache.outputs.cache-hit != 'true' }}
      uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a
      env:
        HOME: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.profile }}
      with:
        tool: ${{ inputs.prebuilt-tools }}
        fallback: none

    - name: Install cargo-binstall
      if: ${{ inputs.fallback-tools != '' && steps.tools-cache.outputs.cache-hit != 'true' }}
      uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65
      with:
        version: 1.20.1

    - name: Install and verify fallback tools
      if: ${{ inputs.fallback-tools != '' && steps.tools-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        RSS_FALLBACK_TOOLS: ${{ inputs.fallback-tools }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.profile }}
        CARGO_TARGET_DIR: ${{ runner.temp }}/rss-tool-build-target
        CARGO_BINSTALL_DISABLE_TELEMETRY: "true"
      run: |
        set -euo pipefail
        mkdir -p "$RSS_TOOL_ROOT/bin"
        IFS=',' read -r -a specs <<< "$RSS_FALLBACK_TOOLS"
        for spec in "${specs[@]}"; do
          cargo binstall --locked --no-confirm --disable-strategies quick-install --disable-telemetry --root "$RSS_TOOL_ROOT" "$spec"
          .github/scripts/ci-cache-maintain.sh verify-tool --root "$RSS_TOOL_ROOT" --spec "$spec"
        done

    - name: Validate and expose isolated tool cache
      shell: bash
      env:
        RSS_PREBUILT_TOOLS: ${{ inputs.prebuilt-tools }}
        RSS_FALLBACK_TOOLS: ${{ inputs.fallback-tools }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.profile }}
        RSS_TOOLS_HIT: ${{ steps.tools-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        validation=verify-tool
        if [ "$RSS_TOOLS_HIT" = true ]; then validation=validate-tool-layout; fi
        IFS=',' read -r -a specs <<< "$RSS_PREBUILT_TOOLS"
        for spec in "${specs[@]}"; do
          if [ -n "$spec" ]; then .github/scripts/ci-cache-maintain.sh "$validation" --root "$RSS_TOOL_ROOT/.install-action" --spec "$spec"; fi
        done
        IFS=',' read -r -a specs <<< "$RSS_FALLBACK_TOOLS"
        for spec in "${specs[@]}"; do
          if [ -n "$spec" ]; then .github/scripts/ci-cache-maintain.sh "$validation" --root "$RSS_TOOL_ROOT" --spec "$spec"; fi
        done
        echo "$RSS_TOOL_ROOT/.install-action/bin" >> "$GITHUB_PATH"
        echo "$RSS_TOOL_ROOT/bin" >> "$GITHUB_PATH"

    - name: Capture after-cache evidence
      id: after-cache
      if: ${{ always() && inputs.evidence-enabled == 'true' }}
      shell: bash
      env:
        DOWNLOAD_MATCHED: ${{ steps.download-cache.outputs.cache-matched-key }}
        DOWNLOAD_HIT: ${{ steps.download-cache.outputs.cache-hit }}
        TARGET_MATCHED: ${{ steps.target-cache.outputs.cache-matched-key }}
        TARGET_HIT: ${{ steps.target-cache.outputs.cache-hit }}
        TOOLS_MATCHED: ${{ steps.tools-cache.outputs.cache-matched-key }}
        TOOLS_HIT: ${{ steps.tools-cache.outputs.cache-hit }}
        CACHE_KEYS_OUTCOME: ${{ steps.cache-keys.outcome }}
        DOWNLOAD_CACHE_OUTCOME: ${{ steps.download-cache.outcome }}
        TARGET_CACHE_OUTCOME: ${{ steps.target-cache.outcome }}
        TOOLS_CACHE_OUTCOME: ${{ steps.tools-cache.outcome }}
        RESTORE_FOOTPRINTS_OUTCOME: ${{ steps.restored-footprints.outcome }}
        WRITER_MODE: ${{ inputs.writer-mode }}
      run: |
        set -euo pipefail
        build_result=unknown
        build_bytes=0
        if [ "$CACHE_KEYS_OUTCOME" = success ] && [ "$DOWNLOAD_CACHE_OUTCOME" = success ] && [ "$TARGET_CACHE_OUTCOME" = success ] && [ "$RESTORE_FOOTPRINTS_OUTCOME" = success ]; then
          build_result="$(.github/scripts/ci-cache-result.sh aggregate --first-hit "$DOWNLOAD_HIT" --first-matched "$DOWNLOAD_MATCHED" --second-hit "$TARGET_HIT" --second-matched "$TARGET_MATCHED")"
          build_bytes="${{ steps.restored-footprints.outputs.build-bytes }}"
        fi
        tools_result=unknown
        tools_bytes=0
        if [ "$CACHE_KEYS_OUTCOME" = success ] && [ "$TOOLS_CACHE_OUTCOME" = success ] && [ "$RESTORE_FOOTPRINTS_OUTCOME" = success ]; then
          tools_result="$(.github/scripts/ci-cache-result.sh classify --hit "$TOOLS_HIT" --matched "$TOOLS_MATCHED")"
          tools_bytes="${{ steps.restored-footprints.outputs.tools-bytes }}"
        fi
        save_mode=read-only
        if [ "$WRITER_MODE" = true ]; then save_mode=writer; fi
        echo "build-result=$build_result" >> "$GITHUB_OUTPUT"
        echo "build-bytes=$build_bytes" >> "$GITHUB_OUTPUT"
        echo "tools-result=$tools_result" >> "$GITHUB_OUTPUT"
        echo "tools-bytes=$tools_bytes" >> "$GITHUB_OUTPUT"
        .github/scripts/ci-evidence.sh snapshot after-cache --output "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" --build-restore-result "$build_result" --build-restored-footprint-bytes "$build_bytes" --build-save-mode "$save_mode" --build-candidate-size-bytes 0 --build-save-outcome unknown --tools-restore-result "$tools_result" --tools-restored-footprint-bytes "$tools_bytes" --tools-save-mode "$save_mode" --tools-candidate-size-bytes 0 --tools-save-outcome unknown
        .github/scripts/ci-disk-budget.sh --stage after-cache --path "$GITHUB_WORKSPACE"
