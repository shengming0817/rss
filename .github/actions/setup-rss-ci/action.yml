name: Setup RSS Rust CI
description: Install pinned Rust tools and restore action-native caches for a fixed CI job.

inputs:
  lane:
    description: Closed tool-adapter lane used to select the exact pinned tool set.
    required: true
  profile:
    description: Closed cache namespace paired with the tool-adapter lane.
    required: true
  toolchain:
    description: Pinned stable Rust toolchain identity used in cache keys.
    required: true
  nightly:
    description: Optional pinned nightly toolchain required by the selected tools.
    required: false
    default: ""
  tool-cache-epoch:
    description: Explicit epoch for incompatible tool-cache changes.
    required: true
  compiler-cache-identity:
    description: Canonical fixed-job identity used to isolate compiler cache snapshots.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve pinned tools
      id: tool-policy
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
      run: |
        set -euo pipefail
        install_action_tools="$(.github/scripts/ci-tool-adapters.sh specs --lane "$RSS_LANE" --backend install-action)"
        binstall_tools="$(.github/scripts/ci-tool-adapters.sh specs --lane "$RSS_LANE" --backend binstall)"
        adapter_sha256="$(sha256sum .github/scripts/ci-tool-adapters.sh | cut -d' ' -f1)"
        catalog_sha256="$(sha256sum .github/scripts/ci-tool-catalog.txt | cut -d' ' -f1)"
        {
          echo "install-action-tools=$install_action_tools"
          echo "binstall-tools=$binstall_tools"
          echo "adapter-sha256=$adapter_sha256"
          echo "catalog-sha256=$catalog_sha256"
        } >> "$GITHUB_OUTPUT"

    - name: Validate inputs and derive cache keys
      id: cache-keys
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
        RSS_PROFILE: ${{ inputs.profile }}
        RSS_TOOLCHAIN: ${{ inputs.toolchain }}
        RSS_NIGHTLY: ${{ inputs.nightly }}
        RSS_INSTALL_ACTION_TOOLS: ${{ steps.tool-policy.outputs.install-action-tools }}
        RSS_BINSTALL_TOOLS: ${{ steps.tool-policy.outputs.binstall-tools }}
        RSS_ADAPTER_SHA256: ${{ steps.tool-policy.outputs.adapter-sha256 }}
        RSS_CATALOG_SHA256: ${{ steps.tool-policy.outputs.catalog-sha256 }}
        RSS_TOOL_CACHE_EPOCH: ${{ inputs.tool-cache-epoch }}
        RSS_COMPILER_CACHE_IDENTITY: ${{ inputs.compiler-cache-identity }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.profile }}
        RSS_FALLBACK_TARGET: ${{ runner.temp }}/rss-tool-build-target
        RSS_JOB_TARGET: ${{ runner.temp }}/rss-cargo-target/${{ inputs.compiler-cache-identity }}
      run: |
        set -euo pipefail
        case "$RSS_LANE" in check|test-affected|integration-critical|audit) ;; *) exit 64 ;; esac
        case "$RSS_PROFILE" in check|test-affected|integration-critical|audit) ;; *) exit 64 ;; esac
        [ "$RSS_PROFILE" = "$RSS_LANE" ] || exit 64
        [[ "$RSS_TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 64
        [[ -z "$RSS_NIGHTLY" || "$RSS_NIGHTLY" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 64
        [[ "$RSS_TOOL_CACHE_EPOCH" =~ ^v[1-9][0-9]*$ ]] || exit 64
        [[ "$RSS_COMPILER_CACHE_IDENTITY" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || exit 64
        [ "${#RSS_COMPILER_CACHE_IDENTITY}" -le 64 ] || exit 64
        [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 64
        RSS_NIGHTLY_ID="${RSS_NIGHTLY:-none}"
        .github/scripts/ci-cache-maintain.sh prepare-roots --workspace "$GITHUB_WORKSPACE" --tool-root "$RSS_TOOL_ROOT" --runner-temp "$RUNNER_TEMP" --fallback-target "$RSS_FALLBACK_TARGET"
        mkdir -p "$RSS_JOB_TARGET"
        source_hash="$(sha256sum Cargo.lock .cargo/config.toml rust-toolchain.toml | sha256sum | cut -d' ' -f1)"
        tools_hash="$(printf '%s\n' 'taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5' 'cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65@1.20.1' "$RSS_ADAPTER_SHA256" "$RSS_CATALOG_SHA256" "$RSS_INSTALL_ACTION_TOOLS" "$RSS_BINSTALL_TOOLS" | sha256sum | cut -d' ' -f1)"
        common="${RUNNER_OS}-${RUNNER_ARCH}-$RSS_TOOLCHAIN-$RSS_NIGHTLY_ID"
        compiler_prefix="rss-sccache-v2-$common-$RSS_COMPILER_CACHE_IDENTITY-$source_hash-"
        echo "download-primary-key=rss-download-v4-$common-$source_hash" >> "$GITHUB_OUTPUT"
        echo "tools-primary-key=rss-tools-$RSS_TOOL_CACHE_EPOCH-$common-$RSS_PROFILE-$tools_hash" >> "$GITHUB_OUTPUT"
        echo "compiler-cache-primary-key=$compiler_prefix$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
        echo "compiler-cache-restore-prefix=$compiler_prefix" >> "$GITHUB_OUTPUT"
        echo "CARGO_TARGET_DIR=$RSS_JOB_TARGET" >> "$GITHUB_ENV"

    - name: Cache exact Cargo downloads
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
          ~/.cargo/git/db
        key: ${{ steps.cache-keys.outputs.download-primary-key }}

    - name: Restore exact pinned tools
      id: tools-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: .cache/ci-tools/${{ inputs.profile }}
        key: ${{ steps.cache-keys.outputs.tools-primary-key }}

    - name: Cache compiler outputs for this fixed job
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/rss-sccache-cache
        key: ${{ steps.cache-keys.outputs.compiler-cache-primary-key }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.compiler-cache-restore-prefix }}

    - name: Install Rust toolchains
      shell: bash
      env:
        RSS_SETUP_NIGHTLY: ${{ inputs.nightly }}
      run: |
        set -euo pipefail
        rustup component add rustfmt clippy llvm-tools-preview
        if [ -n "$RSS_SETUP_NIGHTLY" ]; then
          rustup toolchain install "${RSS_SETUP_NIGHTLY}" --profile minimal --component rustc-dev --component llvm-tools-preview --component rust-src
        fi
        rustup show

    - name: Install cargo-binstall
      if: ${{ steps.tool-policy.outputs.binstall-tools != '' && steps.tools-cache.outputs.cache-hit != 'true' }}
      uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65
      with:
        version: 1.20.1

    - name: Install fallback tools
      if: ${{ steps.tool-policy.outputs.binstall-tools != '' && steps.tools-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        RSS_BINSTALL_TOOLS: ${{ steps.tool-policy.outputs.binstall-tools }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.profile }}
        CARGO_TARGET_DIR: ${{ runner.temp }}/rss-tool-build-target
        CARGO_BINSTALL_DISABLE_TELEMETRY: "true"
      run: |
        set -euo pipefail
        mkdir -p "$RSS_TOOL_ROOT/bin"
        IFS=',' read -r -a specs <<< "$RSS_BINSTALL_TOOLS"
        for spec in "${specs[@]}"; do
          cargo binstall --locked --no-confirm --disable-strategies quick-install --disable-telemetry --root "$RSS_TOOL_ROOT" "$spec"
        done

    - name: Install pinned prebuilt tools
      if: ${{ steps.tool-policy.outputs.install-action-tools != '' && steps.tools-cache.outputs.cache-hit != 'true' }}
      uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5
      env:
        HOME: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.profile }}
      with:
        tool: ${{ steps.tool-policy.outputs.install-action-tools }}
        fallback: none

    - name: Validate and expose pinned tools
      id: tools-verify
      shell: bash
      env:
        RSS_LANE: ${{ inputs.lane }}
        RSS_TOOL_ROOT: ${{ github.workspace }}/.cache/ci-tools/${{ inputs.profile }}
        RSS_TOOLS_HIT: ${{ steps.tools-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        mode=fresh
        if [ "$RSS_TOOLS_HIT" = true ]; then mode=cache; fi
        .github/scripts/ci-tool-adapters.sh verify --mode "$mode" --lane "$RSS_LANE" --root "$RSS_TOOL_ROOT"
        compiler_cache_spec="$(.github/scripts/ci-tool-adapters.sh sccache-spec)"
        IFS='|' read -r compiler_cache_name compiler_cache_version compiler_cache_backend compiler_cache_relative compiler_cache_probe <<< "$compiler_cache_spec"
        [ "$compiler_cache_name" = sccache ] && [ "$compiler_cache_backend" = install-action ] && [ "$compiler_cache_probe" = sccache ]
        compiler_cache_path="$(.github/scripts/ci-tool-adapters.sh verify-sccache --candidate "$RSS_TOOL_ROOT/$compiler_cache_relative")"
        mkdir -p "$RUNNER_TEMP/rss-sccache" "$RUNNER_TEMP/rss-sccache-cache"
        {
          echo "RSS_INTERNAL_SCCACHE_PATH=$compiler_cache_path"
          echo "RUSTC_WRAPPER=$compiler_cache_path"
          echo 'CARGO_INCREMENTAL=0'
          echo 'SCCACHE_IGNORE_SERVER_IO_ERROR=1'
          echo "SCCACHE_DIR=$RUNNER_TEMP/rss-sccache-cache"
          echo "SCCACHE_SERVER_UDS=$RUNNER_TEMP/rss-sccache/server.sock"
        } >> "$GITHUB_ENV"
        echo "$RSS_TOOL_ROOT/.install-action/bin" >> "$GITHUB_PATH"
        echo "$RSS_TOOL_ROOT/bin" >> "$GITHUB_PATH"

    - name: Save sealed pinned tools from trusted runs
      id: tools-save
      if: ${{ steps.tools-cache.outputs.cache-hit != 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'schedule') }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: .cache/ci-tools/${{ inputs.profile }}
        key: ${{ steps.cache-keys.outputs.tools-primary-key }}
