name: RSS fixed Rust job

on:
  workflow_call:
    inputs:
      job:
        description: Closed fixed CI job identity.
        required: true
        type: string
      integration-group:
        description: Closed integration execution group; empty for non-integration jobs.
        required: false
        default: ""
        type: string
      selection:
        description: Canonical SelectionPlan JSON emitted by preflight.
        required: true
        type: string
      source-revision:
        description: Exact revision selected by the caller.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  RSS_NIGHTLY_PINNED: nightly-2026-04-16

jobs:
  execute:
    name: cargo xtask ci run / ${{ inputs.job }} / ${{ inputs.integration-group || 'unpartitioned' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout execution revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source-revision }}

      - name: Validate fixed invocation and derive identities
        id: policy
        env:
          RSS_FIXED_JOB: ${{ inputs.job }}
          RSS_INTEGRATION_GROUP: ${{ inputs.integration-group }}
          RSS_SELECTION: ${{ inputs.selection }}
        run: |
          set -euo pipefail
          case "$RSS_FIXED_JOB:$RSS_INTEGRATION_GROUP" in
            check:) nightly="$RSS_NIGHTLY_PINNED"; partition=check; suffix=check ;;
            test-affected:) nightly=''; partition=test-affected; suffix=test-affected ;;
            integration-critical:postgres|integration-critical:transport|integration-critical:runtime)
              nightly=''; partition="$RSS_INTEGRATION_GROUP"; suffix="$RSS_INTEGRATION_GROUP" ;;
            *)
              printf 'invalid fixed invocation: job=%s integration-group=%s; allowed: check:<empty>, test-affected:<empty>, integration-critical:{postgres,transport,runtime}\n' \
                "$RSS_FIXED_JOB" "${RSS_INTEGRATION_GROUP:-<empty>}" >&2
              exit 64
              ;;
          esac
          [ -n "$RSS_SELECTION" ]
          case "$RSS_SELECTION" in *$'\n'*|*$'\r'*) exit 64 ;; esac
          {
            echo "nightly=$nightly"
            echo "compiler-partition=$partition"
            echo "artifact-suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
      - name: Setup RSS Rust CI
        id: rss-setup
        uses: ./.github/actions/setup-rss-ci
        with:
          lane: ${{ inputs.job }}
          compiler-partition: ${{ steps.policy.outputs.compiler-partition }}
          toolchain: 1.96.0
          nightly: ${{ steps.policy.outputs.nightly }}
          download-cache-epoch: v7
          tool-cache-epoch: v4
          compiler-cache-epoch: v4

      - name: Prepare group integration lifecycle
        id: integration-prepare
        if: ${{ inputs.job == 'integration-critical' }}
        env:
          RSS_GROUP: ${{ steps.policy.outputs.artifact-suffix }}
          RSS_SCOPE: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.policy.outputs.artifact-suffix }}
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/integration-service-logs-$RSS_SCOPE"
          evidence="$RUNNER_TEMP/integration-lifecycle-$RSS_GROUP.json"
          {
            echo "RSS_CI_CONTAINER_SCOPE=$RSS_SCOPE"
            echo "RSS_CI_INTEGRATION_SHARD=$RSS_GROUP"
            echo 'RSS_CI_INTEGRATION_PARTITION=unpartitioned'
            echo "RSS_CI_CONTAINER_LOG_DIR=$log_dir"
            echo "RSS_CI_LIFECYCLE_EVIDENCE=$evidence"
          } >> "$GITHUB_ENV"
          .github/scripts/integration-services.sh bootstrap --scope "$RSS_SCOPE" --shard "$RSS_GROUP" --partition unpartitioned --log-dir "$log_dir" --evidence "$evidence"
          .github/scripts/integration-services.sh prepare --scope "$RSS_SCOPE" --shard "$RSS_GROUP" --partition unpartitioned --log-dir "$log_dir" --evidence "$evidence"

      - name: Execute fixed invocation
        id: xtask
        env:
          RSS_FIXED_JOB: ${{ inputs.job }}
          RSS_INTEGRATION_GROUP: ${{ inputs.integration-group }}
          RSS_SELECTION: ${{ inputs.selection }}
        run: |
          set -euo pipefail
          cargo build --locked -p xtask
          args=(ci run --job "$RSS_FIXED_JOB" --selection "$RSS_SELECTION")
          if [ "$RSS_FIXED_JOB" = integration-critical ]; then
            args+=(--integration-group "$RSS_INTEGRATION_GROUP")
          fi
          timeout --signal=TERM --kill-after=30s 32m "$CARGO_TARGET_DIR/debug/xtask" "${args[@]}"

      - name: Collect integration failure logs
        id: integration-collect
        if: ${{ always() && inputs.job == 'integration-critical' && steps.integration-prepare.outcome == 'success' }}
        env:
          RSS_XTASK_OUTCOME: ${{ steps.xtask.outcome }}
        run: |
          set -euo pipefail
          case "$RSS_XTASK_OUTCOME" in success|failure|cancelled|skipped) ;; *) exit 64 ;; esac
          timeout --signal=TERM --kill-after=30s 5m .github/scripts/integration-services.sh collect --scope "$RSS_CI_CONTAINER_SCOPE" --shard "$RSS_CI_INTEGRATION_SHARD" --partition "$RSS_CI_INTEGRATION_PARTITION" --log-dir "$RSS_CI_CONTAINER_LOG_DIR" --evidence "$RSS_CI_LIFECYCLE_EVIDENCE" --outcome "$RSS_XTASK_OUTCOME" --archive "$RUNNER_TEMP/integration-service-logs-${{ steps.policy.outputs.artifact-suffix }}.tar.gz"

      - name: Snapshot integration services before cleanup
        id: integration-snapshot
        if: ${{ always() && inputs.job == 'integration-critical' && steps.integration-prepare.outcome == 'success' }}
        run: timeout --signal=TERM --kill-after=5s 30s .github/scripts/integration-services.sh snapshot --scope "$RSS_CI_CONTAINER_SCOPE" --shard "$RSS_CI_INTEGRATION_SHARD" --partition "$RSS_CI_INTEGRATION_PARTITION" --log-dir "$RSS_CI_CONTAINER_LOG_DIR" --evidence "$RSS_CI_LIFECYCLE_EVIDENCE"

      - name: Cleanup integration services
        id: integration-cleanup
        if: ${{ always() && inputs.job == 'integration-critical' && steps.integration-prepare.outcome == 'success' }}
        run: timeout --signal=TERM --kill-after=30s 5m .github/scripts/integration-services.sh cleanup --scope "$RSS_CI_CONTAINER_SCOPE" --shard "$RSS_CI_INTEGRATION_SHARD" --partition "$RSS_CI_INTEGRATION_PARTITION" --log-dir "$RSS_CI_CONTAINER_LOG_DIR" --evidence "$RSS_CI_LIFECYCLE_EVIDENCE"

      - name: Upload integration diagnostics on failure
        id: upload-integration-failure
        if: ${{ failure() && inputs.job == 'integration-critical' && steps.policy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.policy.outputs.artifact-suffix }}
          path: |
            ${{ runner.temp }}/integration-lifecycle-${{ steps.policy.outputs.artifact-suffix }}.json
            ${{ runner.temp }}/integration-service-logs-${{ steps.policy.outputs.artifact-suffix }}.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Finalize RSS Rust CI caches
        id: rss-finalize
        if: ${{ always() && !cancelled() && steps.rss-setup.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/finalize-rss-ci
        with:
          cache-context: ${{ steps.rss-setup.outputs.cache-context }}
          execution-outcome: ${{ steps.xtask.outcome }}
          save-eligible: ${{ steps.xtask.outcome == 'success' || steps.xtask.outcome == 'failure' }}
