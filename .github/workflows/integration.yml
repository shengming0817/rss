name: Integration Tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, "codex/**", "feature/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: integration / ${{ matrix.shard }} / ${{ matrix.partition-label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: postgres-domain, partition: "", partition-label: unpartitioned }
          - { shard: event-transport, partition: 1/2, partition-label: 1-of-2 }
          - { shard: event-transport, partition: 2/2, partition-label: 2-of-2 }
          - { shard: runtime-http-auth, partition: 1/2, partition-label: 1-of-2 }
          - { shard: runtime-http-auth, partition: 2/2, partition-label: 2-of-2 }
          - { shard: consistency-fault, partition: "", partition-label: unpartitioned }
          - { shard: cdc-projection-saga, partition: "", partition-label: unpartitioned }
    uses: ./.github/workflows/rss-rust-lane.yml
    with:
      lane: integration
      shard: ${{ matrix.shard }}
      partition: ${{ matrix.partition }}
      partition-label: ${{ matrix.partition-label }}
