# .github/workflows/codeql.yml — CodeQL SAST（issue #1145 第⑤项）。
#
# GitHub Actions 是 RSS 的 CI/SAST 承载面；CodeQL 结果进入 GitHub Security tab。Rust 已 GA
# （CodeQL 2.23.3，2025-10）+ `build-mode: none` 免编译——提取器
# 直读源码，无需 cargo build / toolchain，故 workflow 最小（checkout → init → analyze）。
#
# 激活前置（org 一次性，仓库无法代办）：GitHub 启用 code scanning（private 仓需 GitHub Advanced
# Security）。未启用前 workflow committed 但不产 alert。
#
# action 固定到已审计的 v4 commit；升级通过显式 PR 完成。
#
# ref: github/codeql-action README.md@main（v4 latest major + languages:rust / build-mode:none）
# ref: actions/starter-workflows code-scanning/codeql.yml@main（advanced setup 样板：init → analyze + security-events:write）
name: CodeQL

on:
  # develop push 触发扫描。
  push:
    branches: [develop]
  # backstop：push 漏触 / 未变代码新披露规则时，每周一兜底重扫。
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:rust"
