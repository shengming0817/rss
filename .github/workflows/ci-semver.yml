name: RSS SemVer
on:
  workflow_call:
    inputs:
      baseline:
        required: true
        type: string
      head:
        required: true
        type: string
      mode:
        default: affected
        type: string
      packages:
        default: ''
        type: string
      cold_cache:
        default: false
        type: boolean
      warm_run:
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact comparison baseline revision
        required: true
        type: string
      head:
        description: Exact candidate revision to checkout
        required: true
        type: string
      mode:
        description: Explicit comparison or all protected packages
        default: compare
        type: choice
        options: [compare, all]
      packages:
        description: Comma-separated Release Surface packages (required for compare)
        default: ''
        type: string
      cold_cache:
        description: Measure a cold tool download and save an isolated snapshot
        default: false
        type: boolean
      warm_run:
        description: Exact successful cold run ID-attempt
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  semver:
    runs-on: ubuntu-latest
    env:
      CI_BASE: ${{ inputs.baseline }}
      CI_HEAD: ${{ inputs.head }}
      CI_SEMVER_MODE: ${{ inputs.mode }}
      RSS_TARGET_POOL_N: 'off'
      RSS_COMPILER_CACHE: 'off'
    steps:
      - name: Set job-owned tool paths
        run: |
          echo "SEMVER_ARCHIVE=$RUNNER_TEMP/semver-package/archive.tar.gz" >> "$GITHUB_ENV"
          echo "SEMVER_BIN_DIR=$RUNNER_TEMP/semver-bin" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
          fetch-depth: 0
      - run: python3 hack/ci-pipeline.py --install-toolchain
      - name: Bind optional explicit package scope
        env:
          PACKAGES: ${{ inputs.packages }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$PACKAGES" ]; then
            [ "$MODE" = compare ] || { echo "packages require compare mode" >&2; exit 1; }
            [[ "$PACKAGES" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]
            echo "CI_SEMVER_PACKAGES=$PACKAGES" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.mode == 'affected'
        with:
          name: selection
          path: .local-ci-runs/current
      - name: Select through Make
        id: select
        env:
          CI_PLAN: ${{ inputs.mode == 'affected' && '.local-ci-runs/current/plan.json' || '' }}
        run: make ci CI_PART=select
      - name: Derive tool cache identity
        if: steps.select.outputs.semver == 'true'
        id: key
        env:
          COLD: ${{ inputs.cold_cache }}
          WARM: ${{ inputs.warm_run }}
        run: |
          key="$(bash hack/semver-install.sh --identity)"
          key="${key#key=}"
          if [ -n "$WARM" ]; then
            test "$COLD" != true
            [[ "$WARM" =~ ^[0-9]+-[0-9]+$ ]]
            echo "run=${WARM%-*}" >> "$GITHUB_OUTPUT"
            key="$key-cold-$WARM"
          elif [ "$COLD" = true ]; then
            key="$key-cold-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.select.outputs.semver == 'true' && inputs.warm_run != ''
        with:
          name: semver-${{ inputs.warm_run }}
          run-id: ${{ steps.key.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/semver-cold
      - name: Restore exact tool archive
        if: steps.select.outputs.semver == 'true' && inputs.cold_cache != true
        id: restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SEMVER_ARCHIVE }}
          key: ${{ steps.key.outputs.key }}
      - name: Verify or download fixed tool
        if: steps.select.outputs.semver == 'true'
        id: install
        env:
          RESTORE: ${{ steps.restore.outcome }}
        run: |
          if [ "$RESTORE" = failure ]; then rm -f -- "$SEMVER_ARCHIVE"; fi
          bash hack/semver-install.sh
      - name: Require complete exact warm evidence
        if: steps.select.outputs.semver == 'true' && inputs.warm_run != ''
        env:
          HIT: ${{ steps.restore.outputs.cache-hit }}
          SOURCE: ${{ steps.install.outputs.source }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          assert os.environ['HIT'] == 'true' and os.environ['SOURCE'] == 'cache'
          cold = Path(os.environ['RUNNER_TEMP']) / 'semver-cold'
          receipt = json.loads((cold / 'cache.json').read_text())
          plan = json.loads(Path('.local-ci-runs/current/plan.json').read_text())['semver']
          result = json.loads((cold / 'result.json').read_text())
          assert result['exit'] == 0 and result['results'] and result['plan'] == plan
          assert receipt == {'cold': True, 'key': os.environ['KEY'], 'source': 'download', 'save': 'success'}
          PY
      - name: Execute only selected SemVer checks
        if: steps.select.outputs.semver == 'true'
        id: execute
        env:
          CI_PLAN: .local-ci-runs/current/plan.json
        run: make ci CI_PART=semver
      - name: Require formal result
        if: always() && steps.select.outputs.semver == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.local-ci-runs/current')
          result = json.loads((root / 'semver/result.json').read_text())
          plan = json.loads((root / 'plan.json').read_text())['semver']
          expected = [(item['package'], config) for item in plan['checks'] for config in item['configurations']]
          assert expected and result['plan'] == plan and result['exit'] == 0
          assert [(r['package'], r['configuration']) for r in result['results']] == expected
          assert all(r['exit'] == 0 and r['failure'] is None for r in result['results'])
          PY
      - name: Save verified tool archive
        if: always() && steps.install.outputs.verified == 'true' && steps.restore.outputs.cache-hit != 'true'
        id: save
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SEMVER_ARCHIVE }}
          key: ${{ steps.key.outputs.key }}
      - name: Record tool cache facts
        id: cache_facts
        continue-on-error: true
        if: always() && steps.select.outputs.semver == 'true'
        env:
          COLD: ${{ inputs.cold_cache }}
          KEY: ${{ steps.key.outputs.key }}
          SOURCE: ${{ steps.install.outputs.source }}
          SAVE: ${{ steps.save.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path('.local-ci-runs/current/semver')
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'cache.json').write_text(json.dumps({'cold': os.environ['COLD'] == 'true',
              'key': os.environ['KEY'], 'source': os.environ['SOURCE'], 'save': os.environ['SAVE']}))
          if os.environ['SAVE'] == 'failure': print('::warning::SemVer tool cache save failed')
          PY
      - name: Warn on unavailable cache diagnostics
        if: always() && steps.cache_facts.outcome == 'failure'
        run: echo '::warning::SemVer cache diagnostics unavailable'
      - name: Enforce explicit cold measurement completeness
        if: always() && steps.select.outputs.semver == 'true' && inputs.cold_cache
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.local-ci-runs/current/semver')
          cache = json.loads((root / 'cache.json').read_text())
          result = json.loads((root / 'result.json').read_text())
          assert result['exit'] == 0 and result['results']
          assert cache['cold'] is True and cache['source'] == 'download' and cache['save'] == 'success'
          PY
      - name: Preserve required SemVer result
        if: always() && steps.select.outputs.semver == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semver-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local-ci-runs/current/semver
          include-hidden-files: true
          if-no-files-found: error
