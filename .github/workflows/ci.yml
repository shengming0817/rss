name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      baseline:
        description: Earlier Git revision used for SemVer comparison
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rss-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component llvm-tools-preview
          rustup default 1.96.0
      - name: Install pinned Cargo tools
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5
        with:
          tool: cargo-nextest@0.9.137,cargo-semver-checks@0.49.0,cargo-llvm-cov@0.8.7,cargo-deny@0.19.9
          fallback: none
      - name: Run package-selected checks
        if: ${{ github.event_name == 'pull_request' }}
        run: make ci CI_BASE=${{ github.event.pull_request.base.sha }}
      - name: Run full workspace checks after develop push
        if: ${{ github.event_name == 'push' }}
        run: make ci-full CI_BASE=${{ github.event.before }}
      - name: Run manually requested full workspace checks
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          baseline="$(/usr/bin/git rev-parse --verify "$REQUESTED_BASELINE^{commit}")"
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          make ci-full CI_BASE="$baseline"
