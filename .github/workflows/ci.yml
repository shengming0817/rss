name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selector:
    name: selector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - name: Checkout selection revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Select fixed CI work
        id: select
        env:
          RSS_CI_FORCE_FULL: ${{ vars.RSS_CI_FORCE_FULL }}
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- ci plan \
            --event-path "$GITHUB_EVENT_PATH" \
            --policy .config/ci-impact.toml \
            --output "$RUNNER_TEMP/ci-selection.json" \
            --github-output "$GITHUB_OUTPUT"

  check:
    name: check
    needs: selector
    uses: ./.github/workflows/rss-rust-job.yml
    with:
      job: check
      selection: ${{ needs.selector.outputs.selection }}
      source-revision: ${{ github.sha }}

  test-affected:
    name: test-affected
    needs: selector
    uses: ./.github/workflows/rss-rust-job.yml
    with:
      job: test-affected
      selection: ${{ needs.selector.outputs.selection }}
      source-revision: ${{ github.sha }}

  integration-critical:
    name: integration-critical
    needs: selector
    uses: ./.github/workflows/rss-rust-job.yml
    with:
      job: integration-critical
      selection: ${{ needs.selector.outputs.selection }}
      source-revision: ${{ github.sha }}

  scheduled-audit-fallback:
    name: scheduled-audit-fallback
    if: ${{ always() && github.event_name == 'schedule' && needs.selector.result != 'success' }}
    needs: selector
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout scheduled audit revision
        id: audit-checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Setup scheduled audit tools
        id: audit-setup
        uses: ./.github/actions/setup-rss-ci
        with:
          lane: audit
          profile: audit
          toolchain: 1.96.0
          nightly: ""
          tool-cache-epoch: v4
          compiler-cache-identity: audit

      - name: Scan prose for stale governance claims
        id: audit-prose-scan
        continue-on-error: true
        run: bash hack/automation/prose-advisory-scan.sh scan

      - name: Run scheduled audit fallback
        id: audit-run
        run: cargo run --locked -p xtask -- ci audit

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [selector, check, test-affected, integration-critical]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout result gate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Require every fixed job to succeed
        id: fixed-job-gate
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- ci gate \
            --selector-result "${{ needs.selector.result }}" \
            --check-result "${{ needs.check.result }}" \
            --test-affected-result "${{ needs.test-affected.result }}" \
            --integration-critical-result "${{ needs.integration-critical.result }}"
