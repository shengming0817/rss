name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, "codex/**", "feature/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-meta:
    uses: ./.github/workflows/rss-rust-lane.yml
    with:
      lane: ci-meta

  ci-core:
    needs: ci-meta
    uses: ./.github/workflows/rss-rust-lane.yml
    with:
      lane: ci-core

  ci-security:
    uses: ./.github/workflows/rss-rust-lane.yml
    with:
      lane: ci-security

  ci-coverage:
    needs: ci-meta
    uses: ./.github/workflows/rss-rust-lane.yml
    with:
      lane: ci-coverage
