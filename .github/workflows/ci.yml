name: CI
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      baseline:
        description: Earlier Git revision used for SemVer comparison
        required: true
        type: string
      cold_cache:
        description: Skip restores and save successful cold snapshots
        default: false
        type: boolean
      warm_run:
        description: Successful cold run ID-attempt for exact same-SHA cache restoration
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: rss-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      integration_groups: ${{ steps.select.outputs.integration_groups }}
      active: ${{ steps.select.outputs.active }}
      coverage: ${{ steps.select.outputs.coverage }}
      baseline: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve baseline and warm-run identity
        id: base
        env:
          BASELINE: ${{ inputs.baseline || github.event.pull_request.base.sha || github.event.before }}
          WARM_RUN: ${{ inputs.warm_run }}
          COLD_CACHE: ${{ inputs.cold_cache || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline="$(/usr/bin/git rev-parse --verify "$BASELINE^{commit}")"
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
          if [ -n "$WARM_RUN" ]; then
            test "$COLD_CACHE" != true
            [[ "$WARM_RUN" =~ ^[0-9]+-[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/${WARM_RUN%-*}/attempts/${WARM_RUN##*-}" > "$RUNNER_TEMP/cold-run.json"
            gh run download "${WARM_RUN%-*}" --repo "$GITHUB_REPOSITORY" --name selection --dir "$RUNNER_TEMP/cold-selection"
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cold-run.json').read_text())
          assert run['head_sha'] == os.environ['GITHUB_SHA'] and run['conclusion'] == 'success'
          assert run['event'] == 'workflow_dispatch'
          measurement = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cold-selection/measurement.json').read_text())
          baseline = __import__('subprocess').check_output(['/usr/bin/git', 'rev-parse', os.environ['BASELINE'] + '^{commit}'], text=True).strip()
          assert measurement == {'cold': True, 'baseline': baseline, 'sha': os.environ['GITHUB_SHA']}
          PY
          fi
          mkdir -p .local-ci-runs/current
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          baseline = subprocess.check_output(['/usr/bin/git', 'rev-parse', os.environ['BASELINE'] + '^{commit}'], text=True).strip()
          Path('.local-ci-runs/current/measurement.json').write_text(json.dumps({'cold': os.environ['COLD_CACHE'] == 'true', 'baseline': baseline, 'sha': os.environ['GITHUB_SHA']}))
          PY
      - name: Select once through Make
        id: select
        env:
          CI_BASE: ${{ steps.base.outputs.sha }}
          CI_FULL: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          RSS_COMPILER_CACHE: 'off'
          RSS_TARGET_POOL_N: 'off'
        run: make ci CI_PART=select
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selection
          path: |
            .local-ci-runs/current/plan.json
            .local-ci-runs/current/measurement.json
          include-hidden-files: true
          if-no-files-found: error
  checks:
    needs: selection
    uses: ./.github/workflows/ci-compile.yml
    with:
      part: checks
      baseline: ${{ needs.selection.outputs.baseline }}
      coverage: false
      cold_cache: ${{ inputs.cold_cache || false }}
      warm_run: ${{ inputs.warm_run || '' }}
  build:
    needs: selection
    if: needs.selection.outputs.active == 'true'
    uses: ./.github/workflows/ci-compile.yml
    with:
      part: build
      baseline: ${{ needs.selection.outputs.baseline }}
      coverage: ${{ needs.selection.outputs.coverage == 'true' }}
      cold_cache: ${{ inputs.cold_cache || false }}
      warm_run: ${{ inputs.warm_run || '' }}
  unit:
    needs: build
    uses: ./.github/workflows/ci-execute.yml
    with:
      group: unit
  consumer:
    needs: [selection, build]
    uses: ./.github/workflows/ci-compile.yml
    with:
      part: consumer
      baseline: ${{ needs.selection.outputs.baseline }}
      coverage: false
      cold_cache: ${{ inputs.cold_cache || false }}
      warm_run: ${{ inputs.warm_run || '' }}
  integration:
    needs: [selection, build]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: ${{ fromJSON(needs.selection.outputs.integration_groups) }}
    uses: ./.github/workflows/ci-execute.yml
    with:
      group: ${{ matrix.group }}
  coverage:
    needs: [selection, build, unit, consumer, integration]
    if: always() && needs.build.result == 'success' && needs.selection.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - run: python3 hack/ci-pipeline.py --install-toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selection
          path: .local-ci-runs/current
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-build
          path: .local-ci-runs/current/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-*
          path: .local-ci-runs/current/results
          merge-multiple: true
      - name: Aggregate original profiles and enforce 80 percent
        env:
          CI_PLAN: .local-ci-runs/current/plan.json
          RSS_COMPILER_CACHE: 'off'
          RSS_TARGET_POOL_N: 'off'
        run: make ci CI_PART=coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: .local-ci-runs/current/coverage/lcov.info
          include-hidden-files: true
          if-no-files-found: warn
  cargo:
    name: cargo
    runs-on: ubuntu-latest
    needs: [selection, checks, build, unit, consumer, integration, coverage]
    if: always()
    steps:
      - name: Require every selected stage and coverage verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['selection']['result'] == 'success'
          assert results['checks']['result'] == 'success'
          active = results['selection']['outputs']['active'] == 'true'
          covered = results['selection']['outputs']['coverage'] == 'true'
          for job in ('build', 'unit', 'consumer', 'integration'):
              assert results[job]['result'] == ('success' if active else 'skipped'), job
          assert results['coverage']['result'] == ('success' if covered else 'skipped')
          PY
