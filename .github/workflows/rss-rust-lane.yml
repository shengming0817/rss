name: RSS Rust lane

on:
  workflow_call:
    inputs:
      ci-job-key:
        description: Closed CiJobKey derived by the typed planner.
        required: true
        type: string
      plan-digest:
        description: Canonical typed plan digest bound into job evidence.
        required: true
        type: string
      source-revision:
        description: Exact merge revision executed by this lane.
        required: true
        type: string
      lane:
        description: Closed CI lane identifier.
        required: true
        type: string
      shard:
        description: Closed integration capability shard; empty for every other lane.
        required: false
        default: ""
        type: string
      partition:
        description: Closed hash partition M/N; empty for unpartitioned jobs.
        required: false
        default: ""
        type: string
      partition-label:
        description: Filesystem-safe partition label paired with partition.
        required: false
        default: unpartitioned
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  RSS_NIGHTLY_PINNED: nightly-2026-04-16
  RSS_CI_EVIDENCE_FILE: ci-evidence.json
  RSS_CI_JOB_KEY: ${{ inputs.ci-job-key }}
  RSS_CI_PLAN_DIGEST: ${{ inputs.plan-digest }}
  RSS_CI_SOURCE_REVISION: ${{ inputs.source-revision }}
  RSS_CACHE_WRITER: ${{ (((inputs.lane == 'ci-meta' || inputs.lane == 'ci-core-prerequisites' || (inputs.lane == 'ci-core-tests' && inputs.partition == '1/2') || inputs.lane == 'ci-security' || inputs.lane == 'ci-coverage' || (inputs.lane == 'integration' && inputs.shard == 'postgres-domain' && inputs.partition == '')) && github.event_name == 'push') || (inputs.lane == 'audit' && github.event_name == 'schedule')) && github.ref == 'refs/heads/develop' && github.ref_protected }}

jobs:
  lane:
    name: cargo xtask ${{ inputs.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source-revision }}

      - name: Capture start evidence
        timeout-minutes: 2
        if: ${{ always() }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rss-cargo-target
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_TARGET_DIR"
          save_mode=read-only
          if [ "$RSS_CACHE_WRITER" = true ]; then save_mode=writer; fi
          .github/scripts/ci-evidence.sh snapshot start --output "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" --download-restore-result not-attempted --download-restored-footprint-bytes 0 --download-save-mode "$save_mode" --download-candidate-size-bytes 0 --download-save-outcome unknown --tools-restore-result not-attempted --tools-restored-footprint-bytes 0 --tools-save-mode "$save_mode" --tools-candidate-size-bytes 0 --tools-save-outcome unknown --compiler-cache-enabled false --compiler-cache-version none --compiler-cache-access disabled --compiler-cache-requests 0 --compiler-cache-hits 0 --compiler-cache-misses 0 --compiler-cache-non-cacheable 0 --compiler-cache-error-restore 0 --compiler-cache-error-stats 0 --compiler-cache-error-cache-io 0 --compiler-cache-error-no-requests 0 --compiler-cache-error-measure 0 --compiler-cache-error-save 0 --cpu-time-ms none --peak-rss-bytes none
          .github/scripts/ci-disk-budget.sh --stage start --path "$GITHUB_WORKSPACE"

      - name: Validate lane and derive closed policy
        id: policy
        timeout-minutes: 2
        env:
          RSS_LANE: ${{ inputs.lane }}
          RSS_SHARD: ${{ inputs.shard }}
          RSS_PARTITION: ${{ inputs.partition }}
          RSS_PARTITION_LABEL: ${{ inputs.partition-label }}
        run: |
          set -euo pipefail
          if [ "$RSS_LANE" = integration ]; then
            case "$RSS_SHARD" in
              postgres-domain|event-transport|runtime-http-auth|consistency-fault|cdc-projection-saga|object-storage) ;;
              *) exit 64 ;;
            esac
            case "$RSS_SHARD:$RSS_PARTITION" in
              postgres-domain:|event-transport:1/2|event-transport:2/2|runtime-http-auth:1/2|runtime-http-auth:2/2|consistency-fault:|cdc-projection-saga:|object-storage:) ;;
              *) exit 64 ;;
            esac
          elif [ "$RSS_LANE" = ci-core-tests ]; then
            case "$RSS_PARTITION" in 1/2|2/2) ;; *) exit 64 ;; esac
          elif [ -n "$RSS_SHARD" ]; then
            exit 64
          elif [ -n "$RSS_PARTITION" ]; then
            exit 64
          fi
          case "$RSS_PARTITION:$RSS_PARTITION_LABEL" in
            1/2:1-of-2|2/2:2-of-2|:unpartitioned) ;;
            *) exit 64 ;;
          esac
          case "$RSS_LANE" in
            ci-meta)
              echo 'profile=ci-meta'
              echo 'nightly='
              ;;
            ci-core-prerequisites)
              echo 'profile=ci-core-prerequisites'
              echo "nightly=$RSS_NIGHTLY_PINNED"
              ;;
            ci-core-tests)
              echo 'profile=ci-core-tests'
              echo 'nightly='
              ;;
            ci-security)
              echo 'profile=ci-security'
              echo 'nightly='
              ;;
            ci-coverage)
              echo 'profile=ci-coverage'
              echo "nightly=$RSS_NIGHTLY_PINNED"
              ;;
            integration)
              echo 'profile=integration'
              echo 'nightly='
              ;;
            audit)
              echo 'profile=audit'
              echo 'nightly='
              ;;
            *) exit 64 ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Setup RSS Rust CI
        id: setup
        timeout-minutes: 20
        uses: ./.github/actions/setup-rss-ci
        with:
          lane: ${{ inputs.lane }}
          profile: ${{ steps.policy.outputs.profile }}
          toolchain: 1.96.0
          nightly: ${{ steps.policy.outputs.nightly }}
          tool-cache-epoch: v4
          writer-mode: ${{ env.RSS_CACHE_WRITER }}
          evidence-enabled: true

      - name: Measure tool cache candidate
        id: measure-tools
        timeout-minutes: 2
        if: ${{ env.RSS_CACHE_WRITER == 'true' && steps.setup.outcome == 'success' && steps.setup.outputs.tools-hit != 'true' }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE/.cache/ci-tools/${{ steps.policy.outputs.profile }}"
          test -f "$tool_root/.rss-tool-seal-v1"
          echo "bytes=$(.github/scripts/ci-cache-maintain.sh measure --path "$tool_root")" >> "$GITHUB_OUTPUT"

      - name: Enforce pre-execution tool cache budget
        id: tools-budget
        timeout-minutes: 2
        if: ${{ env.RSS_CACHE_WRITER == 'true' && steps.measure-tools.outcome == 'success' }}
        run: .github/scripts/ci-disk-budget.sh --stage before-save --path "$GITHUB_WORKSPACE"

      - name: Save verified tool cache before repository execution
        id: save-tools
        timeout-minutes: 10
        if: ${{ env.RSS_CACHE_WRITER == 'true' && steps.setup.outcome == 'success' && steps.measure-tools.outcome == 'success' && steps.tools-budget.outcome == 'success' && steps.setup.outputs.tools-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/ci-tools/${{ steps.policy.outputs.profile }}
          key: ${{ steps.setup.outputs.tools-primary-key }}

      - name: Prepare integration service lifecycle
        id: integration-services-prepare
        timeout-minutes: 2
        if: ${{ always() && inputs.lane == 'integration' }}
        env:
          RSS_SHARD: ${{ inputs.shard }}
          RSS_PARTITION: ${{ inputs.partition }}
          RSS_PARTITION_LABEL: ${{ inputs.partition-label }}
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY_ID" in ''|*[!0-9]*) exit 64 ;; esac
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 64 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) exit 64 ;; esac
          case "$RSS_SHARD:$RSS_PARTITION_LABEL" in :|*[!a-z0-9:-]*) exit 64 ;; esac
          partition=$RSS_PARTITION
          if [ -z "$partition" ]; then partition=$RSS_PARTITION_LABEL; fi
          case "$partition" in unpartitioned|1/2|2/2) ;; *) exit 64 ;; esac
          scope="${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RSS_SHARD}-${RSS_PARTITION_LABEL}"
          log_dir="$RUNNER_TEMP/integration-service-logs-$scope"
          evidence="$RUNNER_TEMP/integration-lifecycle.json"
          {
            echo "RSS_CI_CONTAINER_SCOPE=$scope"
            echo "RSS_CI_INTEGRATION_SHARD=$RSS_SHARD"
            echo "RSS_CI_INTEGRATION_PARTITION=$partition"
            echo "RSS_CI_CONTAINER_LOG_DIR=$log_dir"
          } >> "$GITHUB_ENV"
          .github/scripts/integration-services.sh bootstrap --scope "$scope" --shard "$RSS_SHARD" --partition "$partition" --log-dir "$log_dir" --evidence "$evidence"
          .github/scripts/integration-services.sh prepare --scope "$scope" --shard "$RSS_SHARD" --partition "$partition" --log-dir "$log_dir" --evidence "$evidence"

      - name: Prove compiler cache warm-hit and failure transparency
        id: compiler-cache-smoke
        timeout-minutes: 5
        if: ${{ inputs.lane == 'ci-core-prerequisites' }}
        env:
          RUSTC_WRAPPER: ${{ steps.setup.outputs.compiler-cache-path }}
          RSS_INTERNAL_SCCACHE_PATH: ${{ steps.setup.outputs.compiler-cache-path }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/rss-sccache-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke/src"
          printf '%s\n' '[package]' 'name = "rss-sccache-smoke"' 'version = "0.0.0"' 'edition = "2024"' > "$smoke/Cargo.toml"
          printf '%s\n' 'pub fn answer() -> u64 { 42 }' > "$smoke/src/lib.rs"
          "$RSS_INTERNAL_SCCACHE_PATH" --zero-stats
          CARGO_TARGET_DIR="$smoke/target" cargo check --manifest-path "$smoke/Cargo.toml"
          rm -rf "$smoke/target"
          CARGO_TARGET_DIR="$smoke/target" cargo check --manifest-path "$smoke/Cargo.toml"
          "$RSS_INTERNAL_SCCACHE_PATH" --show-stats --stats-format json > "$smoke/warm-stats.json"
          jq -e '.stats.compile_requests > 0 and ([.stats.cache_hits.counts[]] | add // 0) > 0' "$smoke/warm-stats.json" >/dev/null
          mkdir -p "$smoke/unavailable"
          printf occupied > "$smoke/unavailable/cache-parent"
          SCCACHE_DIR="$smoke/unavailable/cache-parent/child" SCCACHE_SERVER_UDS="$smoke/unavailable-success.sock" CARGO_TARGET_DIR="$smoke/fallback-success" cargo check --manifest-path "$smoke/Cargo.toml"
          printf '%s\n' 'pub fn broken( {' > "$smoke/src/lib.rs"
          if SCCACHE_DIR="$smoke/unavailable/cache-parent/child" SCCACHE_SERVER_UDS="$smoke/unavailable-failure.sock" CARGO_TARGET_DIR="$smoke/fallback-failure" cargo check --manifest-path "$smoke/Cargo.toml"; then
            echo 'compiler error was swallowed by unavailable cache backend' >&2
            exit 1
          fi

      - name: Run closed xtask lane
        id: xtask
        timeout-minutes: 92
        env:
          RSS_LANE: ${{ inputs.lane }}
          RSS_SHARD: ${{ inputs.shard }}
          RSS_PARTITION: ${{ inputs.partition }}
          RSS_INTERNAL_SCCACHE_PATH: ${{ steps.setup.outputs.compiler-cache-path }}
          RUSTC_WRAPPER: ${{ steps.setup.outputs.compiler-cache-path }}
        run: |
          set -euo pipefail
          case "$RSS_LANE" in
            ci-meta) args=(ci-meta) ;;
            ci-core-prerequisites) args=(ci-core-prerequisites) ;;
            ci-core-tests) args=(ci-core-tests --partition "$RSS_PARTITION") ;;
            ci-security) args=(ci-security) ;;
            ci-coverage) args=(ci-coverage) ;;
            integration)
              args=(ci-integration --shard "$RSS_SHARD")
              if [ -n "$RSS_PARTITION" ]; then args+=(--partition "$RSS_PARTITION"); fi
              ;;
            audit) args=(audit) ;;
            *) exit 64 ;;
          esac
          cargo build --locked -p xtask
          reset_outcome=success
          if ! "$RSS_INTERNAL_SCCACHE_PATH" --zero-stats; then
            reset_outcome=degraded
          fi
          echo "compiler-cache-reset=$reset_outcome" >> "$GITHUB_OUTPUT"
          /usr/bin/time -f 'userSeconds=%U\nsystemSeconds=%S\npeakRssKiB=%M' -o "$RUNNER_TEMP/xtask-resource.txt" timeout --signal=TERM --kill-after=30s 90m "$CARGO_TARGET_DIR/debug/xtask" "${args[@]}"

      - name: Finalize integration outcome and collect failure logs
        id: integration-services-collect
        if: ${{ always() && inputs.lane == 'integration' && steps.integration-services-prepare.outcome == 'success' }}
        timeout-minutes: 12
        env:
          RSS_XTASK_OUTCOME: ${{ steps.xtask.outcome }}
        run: |
          set -euo pipefail
          case "$RSS_XTASK_OUTCOME" in success|failure|cancelled|skipped) ;; *) exit 64 ;; esac
          timeout --signal=TERM --kill-after=30s 10m .github/scripts/integration-services.sh collect --scope "$RSS_CI_CONTAINER_SCOPE" --shard "$RSS_CI_INTEGRATION_SHARD" --partition "$RSS_CI_INTEGRATION_PARTITION" --log-dir "$RSS_CI_CONTAINER_LOG_DIR" --evidence "$RUNNER_TEMP/integration-lifecycle.json" --outcome "$RSS_XTASK_OUTCOME" --archive "$RUNNER_TEMP/integration-service-logs.tar.gz"

      - name: Snapshot integration service disk before cleanup
        id: integration-services-snapshot
        if: ${{ always() && inputs.lane == 'integration' && steps.integration-services-prepare.outcome == 'success' }}
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 30s .github/scripts/integration-services.sh snapshot --scope "$RSS_CI_CONTAINER_SCOPE" --shard "$RSS_CI_INTEGRATION_SHARD" --partition "$RSS_CI_INTEGRATION_PARTITION" --log-dir "$RSS_CI_CONTAINER_LOG_DIR" --evidence "$RUNNER_TEMP/integration-lifecycle.json"

      - name: Cleanup integration services
        id: integration-services-cleanup
        if: ${{ always() && inputs.lane == 'integration' && steps.integration-services-prepare.outcome == 'success' }}
        timeout-minutes: 12
        run: timeout --signal=TERM --kill-after=30s 10m .github/scripts/integration-services.sh cleanup --scope "$RSS_CI_CONTAINER_SCOPE" --shard "$RSS_CI_INTEGRATION_SHARD" --partition "$RSS_CI_INTEGRATION_PARTITION" --log-dir "$RSS_CI_CONTAINER_LOG_DIR" --evidence "$RUNNER_TEMP/integration-lifecycle.json"

      - name: Capture after-build evidence
        id: after-build
        timeout-minutes: 3
        if: ${{ always() }}
        env:
          COMPILER_ENABLED: ${{ steps.setup.outputs.compiler-cache-enabled || 'false' }}
          COMPILER_VERSION: ${{ steps.setup.outputs.compiler-cache-version || 'none' }}
          COMPILER_ACCESS: ${{ steps.setup.outputs.compiler-cache-access || 'disabled' }}
          COMPILER_RESTORE_OUTCOME: ${{ steps.setup.outputs.compiler-cache-restore-outcome || 'skipped' }}
          COMPILER_RESET_OUTCOME: ${{ steps.xtask.outputs.compiler-cache-reset || 'skipped' }}
          RSS_INTERNAL_SCCACHE_PATH: ${{ steps.setup.outputs.compiler-cache-path }}
        run: |
          set -euo pipefail
          save_mode=read-only
          if [ "$RSS_CACHE_WRITER" = true ]; then save_mode=writer; fi
          requests=0 hits=0 misses=0 non_cacheable=0 stats_valid=false anti_vacuity_failure=false
          error_restore=0 error_stats=0 error_cache_io=0 error_no_requests=0 error_measure=0 error_save=0
          if [ "$COMPILER_RESTORE_OUTCOME" = failure ]; then error_restore=1; fi
          if [ "$COMPILER_RESET_OUTCOME" = degraded ]; then error_stats=$((error_stats + 1)); fi
          if [ "$COMPILER_ENABLED" = true ]; then
            stats_file="$RUNNER_TEMP/sccache-stats.json"
            if "$RSS_INTERNAL_SCCACHE_PATH" --show-stats --stats-format json > "$stats_file" 2>/dev/null &&
              stats_row="$(.github/scripts/ci-sccache-stats.sh parse --input "$stats_file" 2>/dev/null)" &&
              IFS=$'\t' read -r requests hits misses non_cacheable error_cache_io stats_extra <<< "$stats_row" &&
              [ -z "$stats_extra" ]; then
              stats_valid=true
            else
              error_stats=$((error_stats + 1))
            fi
          fi
          if [ "$COMPILER_RESET_OUTCOME" = success ] && [ "$stats_valid" = true ] && [ "${{ inputs.lane }}" = ci-core-prerequisites ] && [ "$requests" -le 0 ]; then
            error_no_requests=$((error_no_requests + 1))
            anti_vacuity_failure=true
          fi
          cpu_time_ms=none peak_rss_bytes=none
          if [ -f "$RUNNER_TEMP/xtask-resource.txt" ]; then
            cpu_time_ms="$(awk -F= '/^userSeconds=/{u=$2} /^systemSeconds=/{s=$2} END { if (u ~ /^[0-9]+([.][0-9]+)?$/ && s ~ /^[0-9]+([.][0-9]+)?$/) printf "%.0f", (u+s)*1000 }' "$RUNNER_TEMP/xtask-resource.txt")"
            peak_rss_bytes="$(awk -F= '/^peakRssKiB=/{ if ($2 ~ /^[0-9]+$/) printf "%.0f", $2*1024 }' "$RUNNER_TEMP/xtask-resource.txt")"
            [ -n "$cpu_time_ms" ] || cpu_time_ms=none
            [ -n "$peak_rss_bytes" ] || peak_rss_bytes=none
          fi
          {
            echo "requests=$requests"
            echo "hits=$hits"
            echo "misses=$misses"
            echo "non-cacheable=$non_cacheable"
            echo "error-restore=$error_restore"
            echo "error-stats=$error_stats"
            echo "error-cache-io=$error_cache_io"
            echo "error-no-requests=$error_no_requests"
            echo "error-measure=$error_measure"
            echo "error-save=$error_save"
            echo "cpu-time-ms=$cpu_time_ms"
            echo "peak-rss-bytes=$peak_rss_bytes"
          } >> "$GITHUB_OUTPUT"
          compiler_args=(--compiler-cache-enabled "$COMPILER_ENABLED" --compiler-cache-version "$COMPILER_VERSION" --compiler-cache-access "$COMPILER_ACCESS" --compiler-cache-requests "$requests" --compiler-cache-hits "$hits" --compiler-cache-misses "$misses" --compiler-cache-non-cacheable "$non_cacheable" --compiler-cache-error-restore "$error_restore" --compiler-cache-error-stats "$error_stats" --compiler-cache-error-cache-io "$error_cache_io" --compiler-cache-error-no-requests "$error_no_requests" --compiler-cache-error-measure "$error_measure" --compiler-cache-error-save "$error_save" --cpu-time-ms "$cpu_time_ms" --peak-rss-bytes "$peak_rss_bytes")
          .github/scripts/ci-evidence.sh ensure after-cache --output "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" --download-restore-result "${{ steps.setup.outputs.download-restore-result || 'unknown' }}" --download-restored-footprint-bytes "${{ steps.setup.outputs.download-restored-footprint-bytes || 0 }}" --download-save-mode "$save_mode" --download-candidate-size-bytes 0 --download-save-outcome unknown --tools-restore-result "${{ steps.setup.outputs.tools-restore-result || 'unknown' }}" --tools-restored-footprint-bytes "${{ steps.setup.outputs.tools-restored-footprint-bytes || 0 }}" --tools-save-mode "$save_mode" --tools-candidate-size-bytes "${{ steps.measure-tools.outputs.bytes || 0 }}" --tools-save-outcome unknown "${compiler_args[@]}"
          .github/scripts/ci-evidence.sh snapshot after-build --output "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" --outcome "${{ steps.xtask.outcome || 'skipped' }}" --download-restore-result "${{ steps.setup.outputs.download-restore-result || 'unknown' }}" --download-restored-footprint-bytes "${{ steps.setup.outputs.download-restored-footprint-bytes || 0 }}" --download-save-mode "$save_mode" --download-candidate-size-bytes 0 --download-save-outcome unknown --tools-restore-result "${{ steps.setup.outputs.tools-restore-result || 'unknown' }}" --tools-restored-footprint-bytes "${{ steps.setup.outputs.tools-restored-footprint-bytes || 0 }}" --tools-save-mode "$save_mode" --tools-candidate-size-bytes "${{ steps.measure-tools.outputs.bytes || 0 }}" --tools-save-outcome "${{ steps.save-tools.outcome == 'success' && 'attempted-success' || steps.save-tools.outcome == 'failure' && 'attempted-failure' || 'skipped' }}" "${compiler_args[@]}"
          .github/scripts/ci-disk-budget.sh --stage after-build --path "$GITHUB_WORKSPACE"
          [ "$anti_vacuity_failure" = false ]

      - name: Measure download cache candidate
        id: measure-download
        timeout-minutes: 3
        if: ${{ env.RSS_CACHE_WRITER == 'true' && steps.xtask.outcome == 'success' && steps.setup.outputs.download-hit != 'true' }}
        run: |
          set -euo pipefail
          registry_cache="$(.github/scripts/ci-cache-maintain.sh measure --path "$HOME/.cargo/registry/cache")"
          registry_index="$(.github/scripts/ci-cache-maintain.sh measure --path "$HOME/.cargo/registry/index")"
          git_db="$(.github/scripts/ci-cache-maintain.sh measure --path "$HOME/.cargo/git/db")"
          echo "download-bytes=$((registry_cache + registry_index + git_db))" >> "$GITHUB_OUTPUT"

      - name: Quiesce and measure compiler cache candidate
        id: measure-compiler-cache
        timeout-minutes: 3
        if: ${{ env.RSS_CACHE_WRITER == 'true' && steps.xtask.outcome == 'success' }}
        env:
          RSS_INTERNAL_SCCACHE_PATH: ${{ steps.setup.outputs.compiler-cache-path }}
        run: |
          set -euo pipefail
          "$RSS_INTERNAL_SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
          echo "bytes=$(.github/scripts/ci-cache-maintain.sh measure --path "$SCCACHE_DIR")" >> "$GITHUB_OUTPUT"

      - name: Capture before-save evidence and enforce cache budget
        id: before-save
        timeout-minutes: 3
        if: ${{ always() }}
        run: |
          set -euo pipefail
          save_mode=read-only
          if [ "$RSS_CACHE_WRITER" = true ]; then save_mode=writer; fi
          compiler_args=(--compiler-cache-enabled "${{ steps.setup.outputs.compiler-cache-enabled || 'false' }}" --compiler-cache-version "${{ steps.setup.outputs.compiler-cache-version || 'none' }}" --compiler-cache-access "${{ steps.setup.outputs.compiler-cache-access || 'disabled' }}" --compiler-cache-requests "${{ steps.after-build.outputs.requests || 0 }}" --compiler-cache-hits "${{ steps.after-build.outputs.hits || 0 }}" --compiler-cache-misses "${{ steps.after-build.outputs.misses || 0 }}" --compiler-cache-non-cacheable "${{ steps.after-build.outputs.non-cacheable || 0 }}" --compiler-cache-error-restore "${{ steps.after-build.outputs.error-restore || 0 }}" --compiler-cache-error-stats "${{ steps.after-build.outputs.error-stats || 0 }}" --compiler-cache-error-cache-io "${{ steps.after-build.outputs.error-cache-io || 0 }}" --compiler-cache-error-no-requests "${{ steps.after-build.outputs.error-no-requests || 0 }}" --compiler-cache-error-measure "${{ steps.after-build.outputs.error-measure || 0 }}" --compiler-cache-error-save "${{ steps.after-build.outputs.error-save || 0 }}" --cpu-time-ms "${{ steps.after-build.outputs.cpu-time-ms || 'none' }}" --peak-rss-bytes "${{ steps.after-build.outputs.peak-rss-bytes || 'none' }}")
          .github/scripts/ci-evidence.sh ensure after-build --output "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" --outcome skipped --download-restore-result "${{ steps.setup.outputs.download-restore-result || 'unknown' }}" --download-restored-footprint-bytes "${{ steps.setup.outputs.download-restored-footprint-bytes || 0 }}" --download-save-mode "$save_mode" --download-candidate-size-bytes 0 --download-save-outcome unknown --tools-restore-result "${{ steps.setup.outputs.tools-restore-result || 'unknown' }}" --tools-restored-footprint-bytes "${{ steps.setup.outputs.tools-restored-footprint-bytes || 0 }}" --tools-save-mode "$save_mode" --tools-candidate-size-bytes "${{ steps.measure-tools.outputs.bytes || 0 }}" --tools-save-outcome unknown "${compiler_args[@]}"
          budget_conclusion=skipped
          if [ "$RSS_CACHE_WRITER" = true ] && [ "${{ steps.xtask.outcome }}" = success ] && [ "${{ steps.measure-compiler-cache.outcome }}" = success ] && { [ "${{ steps.setup.outputs.download-hit }}" = true ] || [ "${{ steps.measure-download.outcome }}" = success ]; }; then
            if .github/scripts/ci-disk-budget.sh --stage before-save --path "$GITHUB_WORKSPACE"; then budget_conclusion=success; else budget_conclusion=failure; fi
          fi
          download_save_outcome=ineligible
          if [ "$budget_conclusion" = success ] && [ "${{ steps.setup.outputs.download-hit }}" != true ]; then download_save_outcome=eligible; fi
          .github/scripts/ci-evidence.sh snapshot before-save --output "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" --download-restore-result "${{ steps.setup.outputs.download-restore-result || 'unknown' }}" --download-restored-footprint-bytes "${{ steps.setup.outputs.download-restored-footprint-bytes || 0 }}" --download-save-mode "$save_mode" --download-candidate-size-bytes "${{ steps.measure-download.outputs.download-bytes || 0 }}" --download-save-outcome "$download_save_outcome" --tools-restore-result "${{ steps.setup.outputs.tools-restore-result || 'unknown' }}" --tools-restored-footprint-bytes "${{ steps.setup.outputs.tools-restored-footprint-bytes || 0 }}" --tools-save-mode "$save_mode" --tools-candidate-size-bytes "${{ steps.measure-tools.outputs.bytes || 0 }}" --tools-save-outcome "${{ steps.save-tools.outcome == 'success' && 'attempted-success' || steps.save-tools.outcome == 'failure' && 'attempted-failure' || 'skipped' }}" "${compiler_args[@]}"
          [ "$budget_conclusion" != failure ]

      - name: Save Cargo download cache
        id: save-download
        timeout-minutes: 10
        if: ${{ env.RSS_CACHE_WRITER == 'true' && steps.xtask.outcome == 'success' && steps.measure-download.outcome == 'success' && steps.before-save.outcome == 'success' && steps.setup.outputs.download-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.download-primary-key }}

      - name: Save compiler cache snapshot
        id: save-compiler-cache
        timeout-minutes: 10
        if: ${{ env.RSS_CACHE_WRITER == 'true' && steps.xtask.outcome == 'success' && steps.measure-compiler-cache.outcome == 'success' && steps.before-save.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rss-sccache-cache
          key: ${{ steps.setup.outputs.compiler-cache-primary-key }}

      - name: Capture after-save evidence
        timeout-minutes: 3
        if: ${{ always() }}
        run: |
          set -euo pipefail
          save_mode=read-only
          if [ "$RSS_CACHE_WRITER" = true ]; then save_mode=writer; fi
          error_measure=${{ steps.after-build.outputs.error-measure || 0 }}
          error_save=${{ steps.after-build.outputs.error-save || 0 }}
          if [ "${{ steps.measure-compiler-cache.outcome }}" = failure ]; then error_measure=$((error_measure + 1)); fi
          if [ "${{ steps.save-compiler-cache.outcome }}" = failure ]; then error_save=$((error_save + 1)); fi
          compiler_args=(--compiler-cache-enabled "${{ steps.setup.outputs.compiler-cache-enabled || 'false' }}" --compiler-cache-version "${{ steps.setup.outputs.compiler-cache-version || 'none' }}" --compiler-cache-access "${{ steps.setup.outputs.compiler-cache-access || 'disabled' }}" --compiler-cache-requests "${{ steps.after-build.outputs.requests || 0 }}" --compiler-cache-hits "${{ steps.after-build.outputs.hits || 0 }}" --compiler-cache-misses "${{ steps.after-build.outputs.misses || 0 }}" --compiler-cache-non-cacheable "${{ steps.after-build.outputs.non-cacheable || 0 }}" --compiler-cache-error-restore "${{ steps.after-build.outputs.error-restore || 0 }}" --compiler-cache-error-stats "${{ steps.after-build.outputs.error-stats || 0 }}" --compiler-cache-error-cache-io "${{ steps.after-build.outputs.error-cache-io || 0 }}" --compiler-cache-error-no-requests "${{ steps.after-build.outputs.error-no-requests || 0 }}" --compiler-cache-error-measure "$error_measure" --compiler-cache-error-save "$error_save" --cpu-time-ms "${{ steps.after-build.outputs.cpu-time-ms || 'none' }}" --peak-rss-bytes "${{ steps.after-build.outputs.peak-rss-bytes || 'none' }}")
          .github/scripts/ci-evidence.sh ensure before-save --output "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" --download-restore-result "${{ steps.setup.outputs.download-restore-result || 'unknown' }}" --download-restored-footprint-bytes "${{ steps.setup.outputs.download-restored-footprint-bytes || 0 }}" --download-save-mode "$save_mode" --download-candidate-size-bytes "${{ steps.measure-download.outputs.download-bytes || 0 }}" --download-save-outcome ineligible --tools-restore-result "${{ steps.setup.outputs.tools-restore-result || 'unknown' }}" --tools-restored-footprint-bytes "${{ steps.setup.outputs.tools-restored-footprint-bytes || 0 }}" --tools-save-mode "$save_mode" --tools-candidate-size-bytes "${{ steps.measure-tools.outputs.bytes || 0 }}" --tools-save-outcome "${{ steps.save-tools.outcome == 'success' && 'attempted-success' || steps.save-tools.outcome == 'failure' && 'attempted-failure' || 'skipped' }}" "${compiler_args[@]}"
          download_outcome=skipped
          if [ "${{ steps.save-download.outcome }}" = failure ]; then download_outcome=attempted-failure; elif [ "${{ steps.save-download.outcome }}" = success ]; then download_outcome=attempted-success; fi
          .github/scripts/ci-evidence.sh snapshot after-save --output "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" --download-restore-result "${{ steps.setup.outputs.download-restore-result || 'unknown' }}" --download-restored-footprint-bytes "${{ steps.setup.outputs.download-restored-footprint-bytes || 0 }}" --download-save-mode "$save_mode" --download-candidate-size-bytes "${{ steps.measure-download.outputs.download-bytes || 0 }}" --download-save-outcome "$download_outcome" --tools-restore-result "${{ steps.setup.outputs.tools-restore-result || 'unknown' }}" --tools-restored-footprint-bytes "${{ steps.setup.outputs.tools-restored-footprint-bytes || 0 }}" --tools-save-mode "$save_mode" --tools-candidate-size-bytes "${{ steps.measure-tools.outputs.bytes || 0 }}" --tools-save-outcome "${{ steps.save-tools.outcome == 'success' && 'attempted-success' || steps.save-tools.outcome == 'failure' && 'attempted-failure' || 'skipped' }}" "${compiler_args[@]}"

      - name: Stage job evidence
        timeout-minutes: 5
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf target/job-evidence
          mkdir -p target/job-evidence/ci
          cp "$RUNNER_TEMP/$RSS_CI_EVIDENCE_FILE" target/job-evidence/ci/ci-evidence.json
          if [ "${{ inputs.lane }}" = integration ]; then
            test -f "$RUNNER_TEMP/integration-lifecycle.json"
            jq -e '.collection.outcome == "success" or .collection.outcome == "failure" or .collection.outcome == "cancelled" or .collection.outcome == "skipped"' "$RUNNER_TEMP/integration-lifecycle.json" >/dev/null
            mkdir -p target/job-evidence/integration
            cp "$RUNNER_TEMP/integration-lifecycle.json" target/job-evidence/integration/lifecycle.json
            if [ -f "$RUNNER_TEMP/integration-service-logs.tar.gz" ]; then
              cp "$RUNNER_TEMP/integration-service-logs.tar.gz" target/job-evidence/integration/service-logs.tar.gz
            fi
          fi
          cargo run --locked -p xtask -- nextest-evidence stage

      - name: Upload CI evidence
        id: upload-evidence
        timeout-minutes: 10
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('ci-evidence-{0}-{1}-{2}-{3}-{4}', inputs.lane, inputs.shard || 'workspace', inputs.partition-label, github.run_id, github.run_attempt) }}
          path: target/job-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Evaluate CI SLO and write summary
        timeout-minutes: 3
        if: ${{ always() }}
        env:
          RSS_LANE: ${{ inputs.lane }}
          RSS_SHARD: ${{ inputs.shard }}
          RSS_PARTITION: ${{ inputs.partition }}
        run: |
          set -euo pipefail
          args=(ci-slo evaluate --lane "$RSS_LANE")
          if [ "$RSS_LANE" = integration ]; then args+=(--shard "$RSS_SHARD"); fi
          if [ -n "$RSS_PARTITION" ]; then args+=(--partition "$RSS_PARTITION"); fi
          args+=(--run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --upload-outcome "${{ steps.upload-evidence.outcome }}")
          args+=(--github-summary)
          cargo run --locked -p xtask -- "${args[@]}"
