name: RSS candidate package proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-candidate-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-package-proof:
    name: candidate-package-proof
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 6
    steps:
      - name: Checkout exact RSS revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Package the explicitly approved Release Surface
        env:
          RSS_PACKAGE_PROOF: ${{ runner.temp }}/rss-candidate-package-proof
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/rss-candidate-metadata.json"
          cargo metadata --locked --no-deps --format-version 1 > "$metadata"
          jq -e '.metadata["release-surface"].packages as $packages | ($packages | length) > 0 and (($packages | map(.package) | unique | length) == ($packages | length))' "$metadata" >/dev/null
          packages="$(jq -er '.metadata["release-surface"].packages[].package' "$metadata")"
          test -n "$packages"

          package_args=()
          : > "$RSS_PACKAGE_PROOF.packages.tsv"
          while IFS= read -r package; do
            count="$(jq --arg package "$package" '[.packages[] | select(.name == $package)] | length' "$metadata")"
            test "$count" = 1
            version="$(jq -er --arg package "$package" '.packages[] | select(.name == $package) | .version' "$metadata")"
            version_line="$(jq -er --arg package "$package" '.metadata["release-surface"].packages[] | select(.package == $package) | .["version-line"]' "$metadata")"
            [[ "$version" == "$version_line".* ]]
            printf '%s\t%s\t%s\n' "$package" "$version" "$GITHUB_SHA" >> "$RSS_PACKAGE_PROOF.packages.tsv"
            package_args+=(--package "$package")
          done <<< "$packages"

          for profile in default no-default all-features; do
            target="$RUNNER_TEMP/rss-candidate-$profile"
            case "$profile" in
              default) cargo package --locked --no-metadata --target-dir "$target" "${package_args[@]}" ;;
              no-default) cargo package --locked --no-metadata --no-default-features --target-dir "$target" "${package_args[@]}" ;;
              all-features) cargo package --locked --no-metadata --all-features --target-dir "$target" "${package_args[@]}" ;;
            esac
          done

          mkdir -p "$RSS_PACKAGE_PROOF"
          cp "$RUNNER_TEMP/rss-candidate-default/package/"*.crate "$RSS_PACKAGE_PROOF/"
          cp "$RSS_PACKAGE_PROOF.packages.tsv" "$RSS_PACKAGE_PROOF/packages.tsv"
          (cd "$RSS_PACKAGE_PROOF" && sha256sum -- *.crate > SHA256SUMS)
          while IFS=$'\t' read -r package version revision; do
            test "$revision" = "$GITHUB_SHA"
            test -f "$RSS_PACKAGE_PROOF/$package-$version.crate"
          done < "$RSS_PACKAGE_PROOF/packages.tsv"

      - name: Verify independent Projection artifact consumption
        env:
          RSS_PACKAGE_PROOF: ${{ runner.temp }}/rss-candidate-package-proof
        run: |
          python3 -m unittest discover -s hack/tests -p test_projection_package_proof.py
          python3 hack/projection-package-proof.py --artifacts "$RSS_PACKAGE_PROOF" --revision "$GITHUB_SHA"

      - name: Verify independent Reconcile artifact consumption
        env:
          RSS_PACKAGE_PROOF: ${{ runner.temp }}/rss-candidate-package-proof
        run: |
          python3 -m unittest discover -s hack/tests -p test_reconcile_package_proof.py
          python3 hack/reconcile-package-proof.py --artifacts "$RSS_PACKAGE_PROOF" --revision "$GITHUB_SHA"
      - name: Verify independent Observation artifact consumption
        env:
          RSS_PACKAGE_PROOF: ${{ runner.temp }}/rss-candidate-package-proof
        run: |
          python3 -m unittest discover -s hack/tests -p test_observation_package_proof.py
          python3 hack/observation-package-proof.py --artifacts "$RSS_PACKAGE_PROOF" --revision "$GITHUB_SHA"

      - name: Upload immutable package proof
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rss-candidate-package-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rss-candidate-package-proof
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish traceable package summary
        env:
          RSS_PACKAGE_PROOF: ${{ runner.temp }}/rss-candidate-package-proof
        run: |
          {
            echo "## RSS candidate packages"
            echo
            echo "Source revision: \`$GITHUB_SHA\`"
            echo
            echo '| Package | Version | SHA-256 |'
            echo '|---|---:|---|'
            while IFS=$'\t' read -r package version _revision; do
              digest="$(awk -v archive="$package-$version.crate" '$2 == archive { print $1 }' "$RSS_PACKAGE_PROOF/SHA256SUMS")"
              test -n "$digest"
              echo "| \`$package\` | \`$version\` | \`$digest\` |"
            done < "$RSS_PACKAGE_PROOF/packages.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
