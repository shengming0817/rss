name: Security audit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-security-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: rustsec advisory refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout default branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install pinned audit tools
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5
        with:
          tool: cargo-deny@0.19.9,cargo-audit@0.22.2
          fallback: none
      - name: Run advisory audit
        run: make audit
