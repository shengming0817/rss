# Outbox relay 可观测性告警规则（#1209，归属 Feature #1208）。
#
# Prometheus rule_files 格式。metric/label 契约单源见 docs/rules/observability.md §Outbox Relay Metrics
# 与 docs/ops/202606250430-002-outbox-relay-observability.md。改 metric 名/label 须同步 eventexec emit site
# （relay / consumer metrics）+ 本文件 + 上述文档。
#
# 校验：
#   promtool check rules docs/ops/outbox-relay-alerts.rules.yaml
#   (cd docs/ops && promtool test rules outbox-relay-alerts.test.yaml)
#
# 注：outbox scoped counter/gauge 均带 `domain`,`contract_id`,`tenant_id`；settlement failure 另带闭值
# `operation`,`reason`。
# 告警按 domain 聚合：depth=sum by(domain)，oldest age=max by(domain)，outbox/consumer DLX/requeue=sum by(domain)；
# saga DLX 保留 contract_id，按 (domain, contract_id) 聚合，保 annotation 可靠呈现来源。
groups:
  - name: outbox-relay
    rules:
      # 积压 SLO：某 domain 最老 pending 龄超 5min（投递延迟核心信号）。max_over_time[2m] 抗采样抖动
      # （sample_interval 上限 60s ⇒ 2min 窗内 ≥2 样本）；by(domain) 保来源可定位；for:2m 抗瞬时尖峰。
      - alert: OutboxBacklogOldestAgeHigh
        expr: max by (domain) (max_over_time(outbox_oldest_pending_age_seconds[2m])) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Outbox 最老 pending 龄超 5min SLO（domain={{ $labels.domain }}）"
          description: "outbox_oldest_pending_age_seconds={{ $value }}s on domain {{ $labels.domain }}；relay 投递滞后或卡死，检查 relay worker readyz（outbox_relay probe）与 broker 连通性。"

      # DLX 增长：某 domain 任意 entry 进 DLX（永久失败 / 重试预算耗尽）即告警——死信不可静默累积。
      - alert: OutboxDlxGrowth
        expr: sum by (domain) (increase(outbox_dlx_total[10m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Outbox entries 进入 DLX（domain={{ $labels.domain }}）"
          description: "近 10min outbox_dlx_total 增长 {{ $value }}（domain={{ $labels.domain }}）；永久失败事件需人工巡检 DLX 行（adapters/postgres outbox status='dlx'）。"

      # 同一 event id 的 automatic/redrive 绝对窗口到期：preflight 不再调用 broker，并将行留在 DLX。
      # increase > 0 先过滤零增长 series，避免 `or` 左值为 0 时遮住右侧首次-series 分支；右侧只在当前值
      # 非零且 10min offset 尚不存在时补捉首次单次事件。
      # 连续旧 series 有 offset，不走补偿分支；新 series 满 10min 后也自动退出，避免持续重复告警。
      - alert: OutboxSameIdWindowExpired
        expr: |
          sum by (domain, phase) (
            (increase(outbox_same_id_window_expired_total[10m]) > 0)
            or
            (
              (outbox_same_id_window_expired_total > 0)
              unless
              (outbox_same_id_window_expired_total offset 10m)
            )
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Outbox same-ID 投递窗口到期（domain={{ $labels.domain }}, phase={{ $labels.phase }}）"
          description: "近 10min outbox_same_id_window_expired_total 增长/首次 series 信号 {{ $value }}；broker publish 已被 fail-closed 跳过。检查 DLX、partition blocked 与 dlq.maintenance audit，不从 metric 查 event id 或 deadline。"

      # Settlement 持锁后发现 lease 已到期属于正确性信号。首次创建值为 1 的 counter 可能没有足够样本供
      # increase() 计算，因此以 5min offset 缺失补捉新 series；旧的静止 series 不重复分页。
      - alert: OutboxSettlementExpired
        expr: |
          sum by (domain) (
            (increase(outbox_relay_settlement_failure_total{reason="expired"}[5m]) > 0)
            or
            (
              (outbox_relay_settlement_failure_total{reason="expired"} > 0)
              unless
              (outbox_relay_settlement_failure_total{reason="expired"} offset 5m)
            )
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Outbox settlement lease 到期（domain={{ $labels.domain }}）"
          description: "近 5min settlement expired 增长/首次 series 信号 {{ $value }}；停止依赖性处置，检查 relay 调度、settle budget、数据库锁等待与连接池压力。"

      # payload protection/invariant 任一失败均代表 DLX 安全依赖或数据库闭契约失效，沿用 first-series
      # 补偿以捕获仅发生一次的 counter。
      - alert: OutboxSettlementIntegrityFailure
        expr: |
          sum by (domain, reason) (
            (increase(outbox_relay_settlement_failure_total{reason=~"payload_protection|invariant"}[5m]) > 0)
            or
            (
              (outbox_relay_settlement_failure_total{reason=~"payload_protection|invariant"} > 0)
              unless
              (outbox_relay_settlement_failure_total{reason=~"payload_protection|invariant"} offset 5m)
            )
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Outbox settlement 完整性失败（domain={{ $labels.domain }}, reason={{ $labels.reason }}）"
          description: "近 5min settlement {{ $labels.reason }} 增长/首次 series 信号 {{ $value }}；停止 relay 依赖性处置，检查 DLX key provider、0066 闭值契约与返回行形状。"

      # timeout/lost_lease/storage 持续高于 1/s 才告警。按 domain/reason 聚合，operation、contract
      # 与 tenant 仅用于 dashboard drilldown，不进入 alert identity。
      - alert: OutboxSettlementFailureRateHigh
        expr: sum by (domain, reason) (rate(outbox_relay_settlement_failure_total{reason=~"timeout|lost_lease|storage"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox settlement 失败率持续偏高（domain={{ $labels.domain }}, reason={{ $labels.reason }}）"
          description: "settlement failure rate={{ $value }}/s；检查数据库连接池、锁等待、事务/SQL、settle timeout 与 lease ownership。"

      # 积压深度持续高（次级信号；阈值按部署容量调，此处保守 10k 兜底防无界增长）。
      # 新增 contract/tenant label 后先按 domain 求和；for:5m 承担持续性判断，避免先对各 scope
      # 取窗口峰值再相加导致不同时间点峰值叠加误报。
      - alert: OutboxPendingDepthHigh
        expr: sum by (domain) (outbox_pending_depth) > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox pending 深度持续偏高（domain={{ $labels.domain }}）"
          description: "outbox_pending_depth={{ $value }} on domain {{ $labels.domain }}；relay 吞吐跟不上写入速率，考虑增大 relay batch 或排查 broker。"

      # 同 partition 队头进入 DLX 或长时间未发布会阻塞后继；metric 不暴露 partition_key，定位时从 DLQ event_id 入手。
      - alert: OutboxPartitionBlocked
        expr: sum by (domain, contract_id, tenant_id) (outbox_partition_blocked_depth) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Outbox partition 被队头阻塞（domain={{ $labels.domain }}, contract_id={{ $labels.contract_id }}）"
          description: "outbox_partition_blocked_depth={{ $value }}（tenant={{ $labels.tenant_id }}）；检查 outbox DLX 队头，按 runbook inspect/redrive，不要从 metric 追 partition_key。"

      # DLX archive-before-purge 任一 transient/invariant tick 都会停止删除。Degraded readyz 保持 200，
      # 因此该 counter 是值班分页面；首次 series 用 offset 分支补捉，避免 increase() 漏掉首个失败。
      - alert: DlxArchiveLifecycleFailure
        expr: |
          sum by (outcome) (
            (increase(retention_sweep_ticks_total{target="dead_letter",outcome=~"transient|invariant"}[5m]) > 0)
            or
            (
              (retention_sweep_ticks_total{target="dead_letter",outcome=~"transient|invariant"} > 0)
              unless
              (retention_sweep_ticks_total{target="dead_letter",outcome=~"transient|invariant"} offset 5m)
            )
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "DLX archive lifecycle 失败（outcome={{ $labels.outcome }}）"
          description: "近 5min DLX archive-before-purge tick 失败信号 {{ $value }}；删除已 fail-closed 停止。检查 dlx_lifecycle/dlx_archive_ready probe、独立 PG/Vault/S3 凭据、WORM/lifecycle policy 与 worker 日志。"

      # 正常候选应在固定 30s tick 内归档；持续超过 5min 表示 archive path 或 receipt CAS 卡住。
      - alert: DlxArchiveOldestPendingHigh
        expr: dead_letter_archive_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DLX 最老待归档记录超过 5min"
          description: "dead_letter_archive_oldest_pending_age_seconds={{ $value }}s；检查 pending depth、lifecycle failure 告警、archive bucket readiness 与 receipt CAS。该 gauge 为 NaN/缺失时先恢复 backlog sampler，不能按 0 解释。"

      # 重试风暴（次级早期信号）：broker 抖动引发批量 Requeue，pending 上涨但 DLX 未增（预算未耗尽）的
      # 窗口期，oldest-age 超阈前的领先指标。阈值按部署基线调（此处 5/s 兜底）。
      - alert: OutboxRequeueStorm
        expr: sum by (domain) (rate(outbox_publish_total{status="requeue"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox relay 重试风暴（domain={{ $labels.domain }}）"
          description: "requeue 速率 {{ $value }}/s on domain {{ $labels.domain }}；broker 瞬态失败持续退避重投，先于积压告警感知，排查 broker。"

      # relay tick 耗时过高（P95）：DB 慢查询/broker 慢导致 tick 变长 → 积压加速。领先于 oldest-age 告警。
      - alert: OutboxRelayTickSlow
        expr: histogram_quantile(0.95, sum by (phase, le) (rate(outbox_relay_tick_duration_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox relay tick P95 耗时过高（phase={{ $labels.phase }}）"
          description: "relay tick {{ $labels.phase }} 相 P95={{ $value }}s；claim 慢=DB 原子租约慢，publish 慢=broker/CAS 慢，排查对应依赖。"

      # Consumer app DLX store 写失败：死信未落库，worker health 已降级；必须人工排查 PG/Vault/KeyProvider。
      - alert: ConsumerDlxWriteError
        expr: sum by (domain) (increase(consumer_dlx_write_total{outcome="error"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Consumer app DLX 写失败（domain={{ $labels.domain }}）"
          description: "近 5min consumer_dlx_write_total{outcome=\"error\"} 增长 {{ $value }}（domain={{ $labels.domain }}）；检查 dead_letter 写入、Vault transit 与 consumer worker readyz。"

      # DLX 写失败后 release claim 也失败：不能 Requeue，否则 claim TTL 窗口内可能 Duplicate→Ack 吞掉。
      - alert: ConsumerReleaseFailed
        expr: sum by (domain) (increase(consumer_release_failed_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Consumer release claim 失败（domain={{ $labels.domain }}）"
          description: "近 5min consumer_release_failed_total 增长 {{ $value }}（domain={{ $labels.domain }}）；该路径会 broker Reject，需检查 inbox claim store 和 DLX 写失败根因。"

      # lease lost 是 hard-fence 正常控制流，但持续升高说明 handler 过慢、TTL 偏小或并发争用异常。
      - alert: ConsumerLeaseLostHigh
        expr: sum by (domain) (rate(consumer_lease_lost_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer lease lost 速率偏高（domain={{ $labels.domain }}）"
          description: "consumer_lease_lost_total rate={{ $value }}/s；检查 handler duration、inbox lease TTL、worker 并发与数据库延迟。"

      # Saga 补偿失败已写入 dead_letter：需要人工介入，不允许静默累积。
      - alert: SagaDeadLetterGrowth
        expr: sum by (domain, contract_id) (increase(saga_dead_letters_total{outcome="written"}[10m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Saga compensation 进入 DLX（domain={{ $labels.domain }}, contract_id={{ $labels.contract_id }}）"
          description: "近 10min saga_dead_letters_total{outcome=\"written\"} 增长 {{ $value }}（domain={{ $labels.domain }}, contract_id={{ $labels.contract_id }}）；补偿失败已写 dead_letter，需人工巡检 saga journal 与 dead_letter 行。"

      # Saga DLX 写失败：journal Failed 行是审计兜底，但 dead_letter 未落库。
      - alert: SagaDeadLetterWriteError
        expr: sum by (domain, contract_id) (increase(saga_dead_letters_total{outcome="write_error"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Saga DLX 写失败（domain={{ $labels.domain }}, contract_id={{ $labels.contract_id }}）"
          description: "近 5min saga_dead_letters_total{outcome=\"write_error\"} 增长 {{ $value }}（domain={{ $labels.domain }}, contract_id={{ $labels.contract_id }}）；检查 dead_letter 写入、Vault transit 与 saga executor error 日志。"
