rule_files:
  - outbox-relay-alerts.rules.yaml

evaluation_interval: 1m

tests:
  # A first settlement-expired sample must page even when increase() has only
  # one sample. Once the 5m offset exists, an unchanged counter stops paging.
  - interval: 1m
    input_series:
      - series: 'outbox_relay_settlement_failure_total{domain="orders",contract_id="order.created.v1",tenant_id="tenant-a",operation="published",reason="expired"}'
        values: '_x5 1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: OutboxSettlementExpired
        exp_alerts:
          - exp_labels:
              domain: orders
              severity: critical
            exp_annotations:
              summary: "Outbox settlement lease 到期（domain=orders）"
              description: "近 5min settlement expired 增长/首次 series 信号 1；停止依赖性处置，检查 relay 调度、settle budget、数据库锁等待与连接池压力。"
      - eval_time: 11m
        alertname: OutboxSettlementExpired
        exp_alerts: []

  # Sustained timeout/lost-lease/storage settlement failures retain the closed reason
  # label and aggregate away operation/contract/tenant cardinality.
  - interval: 1m
    input_series:
      - series: 'outbox_relay_settlement_failure_total{domain="billing",contract_id="invoice.issued.v1",tenant_id="tenant-b",operation="retry",reason="timeout"}'
        values: '0+120x12'
      - series: 'outbox_relay_settlement_failure_total{domain="billing",contract_id="invoice.issued.v1",tenant_id="tenant-c",operation="dlx",reason="lost_lease"}'
        values: '0+90x12'
      - series: 'outbox_relay_settlement_failure_total{domain="billing",contract_id="invoice.issued.v1",tenant_id="tenant-d",operation="published",reason="storage"}'
        values: '0+75x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxSettlementFailureRateHigh
        exp_alerts:
          - exp_labels:
              domain: billing
              reason: timeout
              severity: warning
            exp_annotations:
              summary: "Outbox settlement 失败率持续偏高（domain=billing, reason=timeout）"
              description: "settlement failure rate=2/s；检查数据库连接池、锁等待、事务/SQL、settle timeout 与 lease ownership。"
          - exp_labels:
              domain: billing
              reason: lost_lease
              severity: warning
            exp_annotations:
              summary: "Outbox settlement 失败率持续偏高（domain=billing, reason=lost_lease）"
              description: "settlement failure rate=1.5/s；检查数据库连接池、锁等待、事务/SQL、settle timeout 与 lease ownership。"
          - exp_labels:
              domain: billing
              reason: storage
              severity: warning
            exp_annotations:
              summary: "Outbox settlement 失败率持续偏高（domain=billing, reason=storage）"
              description: "settlement failure rate=1.25/s；检查数据库连接池、锁等待、事务/SQL、settle timeout 与 lease ownership。"

  # Invariant/protection failures page on the first sample and stop after the 5m offset exists.
  - interval: 1m
    input_series:
      - series: 'outbox_relay_settlement_failure_total{domain="identity",contract_id="identity.session-created",tenant_id="tenant-a",operation="dlx",reason="invariant"}'
        values: '_x5 1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: OutboxSettlementIntegrityFailure
        exp_alerts:
          - exp_labels:
              domain: identity
              reason: invariant
              severity: critical
            exp_annotations:
              summary: "Outbox settlement 完整性失败（domain=identity, reason=invariant）"
              description: "近 5min settlement invariant 增长/首次 series 信号 1；停止 relay 依赖性处置，检查 DLX key provider、0066 闭值契约与返回行形状。"
      - eval_time: 11m
        alertname: OutboxSettlementIntegrityFailure
        exp_alerts: []

  # A counter created at 1 stays invisible to increase() even after several
  # unchanged scrapes. Filtering zero increase before `or` lets the new-series
  # branch page until the 10m offset exists, then stop for the unchanged series.
  - interval: 1m
    input_series:
      - series: 'outbox_same_id_window_expired_total{domain="orders",contract_id="order.created.v1",tenant_id="tenant-a",phase="automatic"}'
        values: '_x10 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxSameIdWindowExpired
        exp_alerts:
          - exp_labels:
              domain: orders
              phase: automatic
              severity: critical
            exp_annotations:
              summary: "Outbox same-ID 投递窗口到期（domain=orders, phase=automatic）"
              description: "近 10min outbox_same_id_window_expired_total 增长/首次 series 信号 1；broker publish 已被 fail-closed 跳过。检查 DLX、partition blocked 与 dlq.maintenance audit，不从 metric 查 event id 或 deadline。"
      - eval_time: 12m
        alertname: OutboxSameIdWindowExpired
        exp_alerts:
          - exp_labels:
              domain: orders
              phase: automatic
              severity: critical
            exp_annotations:
              summary: "Outbox same-ID 投递窗口到期（domain=orders, phase=automatic）"
              description: "近 10min outbox_same_id_window_expired_total 增长/首次 series 信号 1；broker publish 已被 fail-closed 跳过。检查 DLX、partition blocked 与 dlq.maintenance audit，不从 metric 查 event id 或 deadline。"
      - eval_time: 21m
        alertname: OutboxSameIdWindowExpired
        exp_alerts: []

  # A series that already existed at the offset boundary and did not increase is
  # not a new expiry. This locks out repeated pages for an old non-zero counter.
  - interval: 1m
    input_series:
      - series: 'outbox_same_id_window_expired_total{domain="billing",contract_id="invoice.issued.v1",tenant_id="tenant-b",phase="redrive"}'
        values: '7x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: OutboxSameIdWindowExpired
        exp_alerts: []

  # Existing series still use increase(), so a later expiry remains observable.
  - interval: 1m
    input_series:
      - series: 'outbox_same_id_window_expired_total{domain="shipping",contract_id="shipment.created.v1",tenant_id="tenant-c",phase="automatic"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: OutboxSameIdWindowExpired
        exp_alerts:
          - exp_labels:
              domain: shipping
              phase: automatic
              severity: critical
            exp_annotations:
              summary: "Outbox same-ID 投递窗口到期（domain=shipping, phase=automatic）"
              description: "近 10min outbox_same_id_window_expired_total 增长/首次 series 信号 10；broker publish 已被 fail-closed 跳过。检查 DLX、partition blocked 与 dlq.maintenance audit，不从 metric 查 event id 或 deadline。"

  # Canonical reject counter: first sample pages, an unchanged old series does not,
  # and a later increment on an existing series remains observable.
  - interval: 1m
    input_series:
      - series: 'outbox_publish_total{status="reject"}'
        values: '_x10 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxDlxGrowth
        exp_alerts:
          - exp_labels:
              status: reject
              severity: critical
            exp_annotations:
              summary: "Outbox entries 进入 DLX"
              description: "近 10min outbox_publish_total{status=\"reject\"} 增长/首次 series 信号 1；永久失败事件需人工巡检 DLX 行（adapters/postgres outbox status='dlx'）。"
      - eval_time: 21m
        alertname: OutboxDlxGrowth
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'outbox_publish_total{status="reject"}'
        values: '7x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: OutboxDlxGrowth
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'outbox_publish_total{status="reject"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: OutboxDlxGrowth
        exp_alerts:
          - exp_labels:
              status: reject
              severity: critical
            exp_annotations:
              summary: "Outbox entries 进入 DLX"
              description: "近 10min outbox_publish_total{status=\"reject\"} 增长/首次 series 信号 10；永久失败事件需人工巡检 DLX 行（adapters/postgres outbox status='dlx'）。"

  # Consumer DLX write failures use the same first/static/later counter semantics.
  - interval: 1m
    input_series:
      - series: 'consumer_dlx_write_total{outcome="error"}'
        values: '_x5 1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ConsumerDlxWriteError
        exp_alerts:
          - exp_labels:
              outcome: error
              severity: critical
            exp_annotations:
              summary: "Consumer app DLX 写失败"
              description: "近 5min consumer_dlx_write_total{outcome=\"error\"} 增长/首次 series 信号 1；检查 dead_letter 写入、Vault transit 与 consumer worker readyz。"
      - eval_time: 11m
        alertname: ConsumerDlxWriteError
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'consumer_dlx_write_total{outcome="error"}'
        values: '7x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: ConsumerDlxWriteError
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'consumer_dlx_write_total{outcome="error"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: ConsumerDlxWriteError
        exp_alerts:
          - exp_labels:
              outcome: error
              severity: critical
            exp_annotations:
              summary: "Consumer app DLX 写失败"
              description: "近 5min consumer_dlx_write_total{outcome=\"error\"} 增长/首次 series 信号 5；检查 dead_letter 写入、Vault transit 与 consumer worker readyz。"

  # Consumer claim release failures also page on first sample only until a later increment.
  - interval: 1m
    input_series:
      - series: 'consumer_release_failed_total'
        values: '_x5 1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ConsumerReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Consumer release claim 失败"
              description: "近 5min consumer_release_failed_total 增长/首次 series 信号 1；该路径会 broker Requeue 并等待 release 成功或 TTL 重捞，需检查 inbox claim store 和 DLX 写失败根因。"
      - eval_time: 11m
        alertname: ConsumerReleaseFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'consumer_release_failed_total'
        values: '7x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: ConsumerReleaseFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'consumer_release_failed_total'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: ConsumerReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Consumer release claim 失败"
              description: "近 5min consumer_release_failed_total 增长/首次 series 信号 5；该路径会 broker Requeue 并等待 release 成功或 TTL 重捞，需检查 inbox claim store 和 DLX 写失败根因。"

  - interval: 1m
    input_series:
      - series: 'retention_sweep_ticks_total{target="dead_letter",outcome="transient"}'
        values: '_x5 1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlxArchiveLifecycleFailure
        exp_alerts:
          - exp_labels:
              outcome: transient
              severity: critical
            exp_annotations:
              summary: "DLX archive lifecycle 失败（outcome=transient）"
              description: "近 5min DLX archive-before-purge tick 失败信号 1；删除已 fail-closed 停止。检查 dlx_lifecycle/dlx_archive_ready probe、独立 PG/Vault/S3 凭据、WORM/lifecycle policy 与 worker 日志。"

  - interval: 1m
    input_series:
      - series: 'dead_letter_archive_oldest_pending_age_seconds'
        values: '360x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: DlxArchiveOldestPendingHigh
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "DLX 最老待归档记录超过 5min"
              description: "dead_letter_archive_oldest_pending_age_seconds=360s；检查 pending depth、lifecycle failure 告警、archive bucket readiness 与 receipt CAS。该 gauge 为 NaN/缺失时先恢复 backlog sampler，不能按 0 解释。"

  - interval: 1m
    input_series:
      - series: 'retention_sweep_ticks_total{target="certificate_revocations",outcome="transient"}'
        values: '_x5 1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: CertificateRevocationRetentionFailure
        exp_alerts:
          - exp_labels:
              outcome: transient
              severity: critical
            exp_annotations:
              summary: "证书撤销 retention 失败（outcome=transient）"
              description: "近 5min certificate_revocations retention tick 失败信号 1；检查 certificate_revocation_sweeper readyz、PostgreSQL 连接/锁等待、maintenance function capability 与 worker 日志。"

  - interval: 1m
    input_series:
      - series: 'retention_expired_oldest_age_seconds{target="certificate_revocations"}'
        values: '360x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: CertificateRevocationRetentionBacklogHigh
        exp_alerts:
          - exp_labels:
              target: certificate_revocations
              severity: critical
            exp_annotations:
              summary: "证书撤销过期证据滞留超过 eligibility grace 后 5min"
              description: "retention_expired_oldest_age_seconds=360s；检查 backlog depth、retention failure 告警、sweeper readyz 与 PostgreSQL maintenance function。NaN/缺失表示 sampler 不可用，不能按 0 解释。"

  - interval: 1m
    input_series:
      - series: 'retention_expired_oldest_age_seconds{target="certificate_revocations"}'
        values: '300x12'
      - series: 'retention_sweep_ticks_total{target="certificate_revocations",outcome="success"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: CertificateRevocationRetentionBacklogHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: CertificateRevocationRetentionFailure
        exp_alerts: []

  # Process-level Eventing thresholds are calibrated for the standard Identity+Settings deployment.
  - interval: 1m
    input_series:
      - series: 'outbox_pending_depth'
        values: '20001x12'
      - series: 'outbox_publish_total{status="requeue"}'
        values: '0+660x12'
      - series: 'consumer_lease_lost_total'
        values: '0+180x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: OutboxPendingDepthHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Outbox pending 深度持续偏高"
              description: "outbox_pending_depth=20001；relay 吞吐跟不上写入速率，考虑增大 relay batch 或排查 broker。"
      - eval_time: 10m
        alertname: OutboxRequeueStorm
        exp_alerts:
          - exp_labels:
              status: requeue
              severity: warning
            exp_annotations:
              summary: "Outbox relay 重试风暴"
              description: "requeue 速率 11/s；broker 瞬态失败持续退避重投，先于积压告警感知，排查 broker。"
      - eval_time: 10m
        alertname: ConsumerLeaseLostHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Consumer lease lost 速率偏高"
              description: "consumer_lease_lost_total rate=3/s；检查 handler duration、inbox lease TTL、worker 并发与数据库延迟。"
