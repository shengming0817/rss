[package]
name = "rss_diport_dto_debug_redacted"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：diport DTO 禁裸字节缓冲字段；动态 payload 用 RedactedBytes，固定宽度用 RedactedFixedBytes<N>（INVARIANT DIPORT-DTO-RAWBYTES-BAN-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep）

# 本 lint 按 **LOCAL_CRATE 名 == "diport"** 判守护范围（仅 DI-infra port crate 字节 payload 脱敏边界）。
# UI fixture 编译为单一 example crate、crate 名 = example target 名，故两个 example target：
#   - diport（crate 名 == "diport"）→ 红例：struct 持裸字节缓冲字段触发；绿子例（双 carrier 精确放行 / 非 u8 / #[allow]）内嵌；
#   - not_diport（crate 名不在守护范围）→ 绿例：同形字段不触发（anti-vacuity，验 LOCAL_CRATE 分支非恒报）。
# golden 随源文件名（ui/diport.stderr / ui/not_diport.stderr）。
[[example]]
name = "diport"
path = "ui/diport.rs"

[[example]]
name = "not_diport"
path = "ui/not_diport.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
