[package]
name = "rss_partition_serial_allowlist"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：consistency::PartitionSerialDelivery 仅 adapter / 组合根可 impl（impl-site allowlist，INVARIANT PARTITION-SERIAL-IMPL-ALLOWLIST-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep consistency）

# 本 lint 按 **impl 所在 package manifest 父目录**（`adapters` / `bins` / `assemblies`）判 allowlist。
# UI 只需单一 example target：红例（路径不含 allowlist 段 → 触发）内嵌绿子例（逃生门 #[allow]）。
# adapter-path 绿分支无法在 UI harness 模拟，由真 workspace `cargo dylint --all`（adapter 0 诊断）承载。
[[example]]
name = "rss_partition_serial_allowlist_ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture impl 真 consistency::PartitionSerialDelivery：lint 按被 impl trait 的 crate 名（consistency）
# + trait 名（PartitionSerialDelivery）匹配，本地 stub trait 无法触发。
consistency = { path = "../../crates/consistency" }

[package.metadata.rust-analyzer]
rustc_private = true
