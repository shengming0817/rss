[package]
name = "rss_crosstenant_callsite"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS G0.4 治理：限定 vocab 跨租户 All-scope mint 三步仅 authn 已校验 super-admin 路径可调用（callsite-allowlist，INVARIANT TENANCY-CROSSTENANT-CAP-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep vocab）

# 本 lint 按 **caller crate 名** 判 allowlist（≠ rss_spawn_missing_scope 只匹配 callee crate）。
# UI fixture 编译为单一 example crate、crate 名 = example target 名，故须两个 example target：
#   - crosstenant_callsite_ui（crate 名非 allowlist）→ 红例：调 funnel 触发；
#   - authn（crate 名 = 生产 allowlist 项）→ 绿例：调 funnel 不触发（anti-vacuity，验 allowlist 分支非恒报）。
# golden 随源文件名（ui/disallowed.stderr / ui/authn.stderr）。
[[example]]
name = "crosstenant_callsite_ui"
path = "ui/disallowed.rs"

[[example]]
name = "authn"
path = "ui/authn.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture 调真 vocab funnel：lint 按 callee crate 名（vocab）匹配，本地 stub 模块 crate 名不为 vocab 无法触发。
vocab = { path = "../../crates/vocab" }

[package.metadata.rust-analyzer]
rustc_private = true
