[package]
name = "rss_diport_impl_allowlist"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：diport provider port 仅 adapter / 组合根可 impl（impl-site allowlist，INVARIANT DIPORT-IMPL-ALLOWLIST-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep diport）

# 本 lint 先按 canonical trait DefPath 排除两个 lifecycle seam；其余 `diport` trait fail-closed 视为 provider
# port。impl-site allowlist 键 package 的 `CARGO_MANIFEST_DIR` 父目录（`adapters` / `bins`），
# 非源文件路径。故 UI 的 synthetic red/green 覆盖 trait 分类、item-level `#[allow]` 与
# anti-vacuity；真实 package 位置分支由 workspace Dylint 承载——见 src/lib.rs rustdoc「Known problems」。
[[example]]
name = "rss_diport_impl_allowlist_ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture impl 真 diport port trait：lint 按被 impl trait 的 crate 名（diport）匹配，本地 stub trait 无法触发。
diport = { path = "../../crates/diport" }

[package.metadata.rust-analyzer]
rustc_private = true
