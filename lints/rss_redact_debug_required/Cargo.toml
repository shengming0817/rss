[package]
name = "rss_redact_debug_required"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：高风险敏感 DTO 禁止裸 derive(Debug)，改用 #[derive(secure::Redact)] 字段级脱敏"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep）

[[example]]
name = "rss_redact_debug_required_ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
secure = { path = "../../crates/secure" }

[package.metadata.rust-analyzer]
rustc_private = true
