[package]
name = "rss_raw_credential_callsite"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS token trust boundary: permit diport::RawCredential construction only in the authn verification funnel"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "raw_credential_callsite_ui"
path = "ui/disallowed.rs"

[[example]]
name = "authn"
path = "ui/authn.rs"

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
diport = { path = "../../crates/diport" }

[package.metadata.rust-analyzer]
rustc_private = true
