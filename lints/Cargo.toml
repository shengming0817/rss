# RSS 自写 dylint lint workspace（嵌套独立 workspace，与根 stable 1.96 workspace 隔离）。
# 隔离机制：本 [workspace] 表使 lints/ 成为独立 workspace，根 workspace 不会下降编译它；
# 根 Cargo.toml 另有 exclude = ["lints"] 作显式防线。钉 nightly（rustc_private）见同目录 rust-toolchain.toml。
# 注册入口：根 Cargo.toml [workspace.metadata.dylint] libraries。运行：仓库根 `cargo dylint --all`。
[workspace]
resolver = "2"
members = [
  "rss_domain_no_serialize",
  "rss_spawn_missing_scope",
  "rss_crosstenant_callsite",
  "rss_dlq_operator_callsite",
  "rss_diport_impl_allowlist",
  "rss_principal_facet_impl_allowlist",
  "rss_authplan_callsite",
  "rss_raw_credential_callsite",
  "rss_authenticated_callsite",
  "rss_runtime_env_funnel",
  "rss_handler_local_principal_authz",
  "rss_diport_error_debug_redacted",
  "rss_diport_dto_debug_redacted",
  "rss_pdp_impl_adapter_only",
  "rss_projection_append_only",
  "rss_partition_serial_allowlist",
  "rss_diport_envelope_reserved_writer",
  "rss_redact_debug_required",
  "rss_adapter_no_business_fsm",
  "rss_test_no_bare_sleep",
]
