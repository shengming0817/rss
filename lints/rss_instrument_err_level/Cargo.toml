[package]
name = "rss_instrument_err_level"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：禁止 #[instrument(err)] 裸 err（无 level）；须 err(level = …)（INVARIANT INSTRUMENT-ERR-LEVEL-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接

[[example]]
name = "rss_instrument_err_level_ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"
# UI fixture 用真实 `#[tracing::instrument]`；lint lib 不引用。
tracing = "0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
