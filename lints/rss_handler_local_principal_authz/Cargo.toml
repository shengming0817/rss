[package]
name = "rss_handler_local_principal_authz"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS G0.4 治理：禁止 handler/domain 直接读取 httpserve::Authenticated tenant/principal/self subject 做本地授权（callsite-allowlist）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep httpserve）

# 本 lint 按 **caller crate 名** 判 allowlist（≠ 按 callee fn 名唯一判定）。
# `tenant_id` / `principal_kind` / `self_scoped_principal_id` 是常见名，必须额外校验 self-ty=Authenticated；UI fixture 验证 specificity。
# UI fixture 编译为单一 example crate、crate 名 = example target 名，故须三个 example target：
#   - handler_local_principal_authz_ui（crate 名非 allowlist）→ 红例：调 Authenticated tenant/principal/self getter 触发；
#   - httpserve（crate 名 = allowlist 项，定义 crate 内部豁免）→ 绿例：调 funnel 不触发（anti-vacuity，验 allowlist 分支非恒报）。
#   - runtime（crate 名 = runtime）→ 只放行 runtime bridge / mTLS authorizer，非 bridge 红例仍触发。
#   - diport（crate 名 = diport）→ 只放行 verified profile shape 构造器，非构造器红例仍触发。
# golden 随源文件名（ui/disallowed.stderr / ui/httpserve.stderr / ui/runtime.stderr / ui/diport.stderr）。
[[example]]
name = "handler_local_principal_authz_ui"
path = "ui/disallowed.rs"

[[example]]
name = "httpserve"
path = "ui/httpserve.rs"

[[example]]
name = "runtime"
path = "ui/runtime.rs"

[[example]]
name = "diport"
path = "ui/diport.rs"

[[example]]
name = "identity"
path = "ui/identity.rs"

[[example]]
name = "postgres"
path = "ui/postgres.rs"

[[example]]
name = "identityaudit"
path = "ui/identityaudit.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture 调真 httpserve funnel：lint 按 callee crate 名（httpserve）匹配，本地 stub 无法触发。
httpserve = { path = "../../crates/httpserve", features = ["test-util"] }
diport = { path = "../../crates/diport" }
primitives = { path = "../../crates/primitives" }
rss-request-context = { path = "../../crates/request-context" }

[package.metadata.rust-analyzer]
rustc_private = true
