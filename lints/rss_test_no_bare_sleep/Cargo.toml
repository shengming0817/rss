[package]
name = "rss_test_no_bare_sleep"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：测试上下文禁裸 tokio::time::sleep / std::thread::sleep（INVARIANT TEST-NO-BARE-SLEEP-01；#1495）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接

# ui fixture：example target 名按 `<lint>_ui` 取唯一；golden 仍随源 ui/main.stderr。
# production 绿例单独 example（无 --test），证明非 test 上下文不报。
# production_cfg_test：ambient `--cfg test` 下生产 backoff 仍绿。
# ref: dylint examples/general/await_holding_span_guard@v6.0.1
[[example]]
name = "rss_test_no_bare_sleep_ui"
path = "ui/main.rs"

[[example]]
name = "production"
path = "ui/production.rs"

[[example]]
name = "production_cfg_test"
path = "ui/production_cfg_test.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly-2026-04-16 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture 须用真 tokio：lint 按 crate 名 + def_path 匹配 `tokio::time::sleep`。
tokio = { version = "1", features = ["rt", "macros", "time"] }

[package.metadata.rust-analyzer]
rustc_private = true
