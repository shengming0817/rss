[package]
name = "rss_adapter_no_business_fsm"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：adapters 禁业务 FSM / statig（INVARIANT ADAPTER-NO-BUSINESS-FSM-01；ADR-023 / #1494）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接

# UI fixture：example crate 与 lint package 同属本 package ⇒ CARGO_PKG_NAME 激活；
# 真 adapters 绿向由 workspace `cargo dylint --all` 承载。
[[example]]
name = "rss_adapter_no_business_fsm_ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly-2026-04-16 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

[package.metadata.rust-analyzer]
rustc_private = true
