[package]
name = "rss_authenticated_callsite"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：限定认证证据、主体降维与 verified maintenance capability funnel 仅 runtime 组合根可调用"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep httpserve / vocab）

# 本 lint 按 **caller crate 名** 判 allowlist（≠ 按 callee fn 名唯一判定）。
# `new` 是极常见名，必须额外校验 self-ty=Authenticated；UI fixture 验证 specificity。
# UI fixture 编译为单一 example crate、crate 名 = example target 名，故须两个 example target：
#   - authenticated_callsite_ui（crate 名非 allowlist）→ 红例：调证据 / grant funnel 触发；
#   - runtime（crate 名 = 唯一合法组合根）→ 绿例：调 funnel 不触发（anti-vacuity，验 allowlist 分支非恒报）。
#   - identity / postgres / authn → grant 生产链精确 impl-method 绿例与同 crate 红控。
# golden 随源文件名（ui/disallowed.stderr / ui/runtime.stderr / ui/authn.stderr）。
# 绿例用 "runtime"：不与 rss_authplan_callsite 的 "primitives" 在共享 lints workspace 撞 target 名。
[[example]]
name = "authenticated_callsite_ui"
path = "ui/disallowed.rs"

[[example]]
name = "runtime"
path = "ui/runtime.rs"

[[example]]
name = "identity"
path = "ui/identity.rs"

[[example]]
name = "postgres"
path = "ui/postgres.rs"

[[example]]
name = "authn"
path = "ui/authn.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture 调真 httpserve funnel：lint 按 callee crate 名（httpserve）匹配，本地 stub 无法触发。
# vocab 供 PrincipalKind、primitives 供 RequiredScheme 实参。
httpserve = { path = "../../crates/httpserve" }
authn = { path = "../../crates/authn" }
diport = { path = "../../crates/diport" }
vocab = { path = "../../crates/vocab" }
primitives = { path = "../../crates/primitives" }

[package.metadata.rust-analyzer]
rustc_private = true
