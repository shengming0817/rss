[package]
name = "rss_pdp_impl_adapter_only"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：diport::Pdp 验签端口仅 provider adapter 可 impl——非 adapter crate 不得内联 always-allow Pdp（信任根，INVARIANT PDP-IMPL-ADAPTER-ONLY-01；T004.6 / #1198）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep diport）

# 本 lint 按 **impl 所在 package 的 manifest 父目录**（仅 `adapters` 放行）判 allowlist，故 UI 单一 example
# （crate 路径父目录非 `adapters`）即红例：impl 真 diport::Pdp 触发；non-Pdp diport trait / inherent /
# item-level #[allow] 不触发（specificity + 逃生门 anti-vacuity）。adapter-path 绿分支（adapters/oidc impl Pdp
# 不触发）无法在 UI harness 模拟，由真 workspace `cargo dylint --all`（oidc 0 诊断）承载——见 src/lib.rs。
[[example]]
name = "rss_pdp_impl_adapter_only_ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture impl 真 diport::Pdp：lint 按被 impl trait 的 crate 名（diport）+ trait 名（Pdp）匹配，本地 stub 无法触发。
diport = { path = "../../crates/diport" }
vocab = { path = "../../crates/vocab" }
rss-request-context = { path = "../../crates/request-context" }

[package.metadata.rust-analyzer]
rustc_private = true
