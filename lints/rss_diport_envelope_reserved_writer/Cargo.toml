[package]
name = "rss_diport_envelope_reserved_writer"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：diport::EnvelopeMetadata::insert_wire_pair（reserved-capable wire 透传写面）仅 adapter（adapters/）/ 组合根（bins/assemblies）可调（callsite allowlist，INVARIANT DIPORT-ENVELOPE-WIRE-WRITER-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep diport）

# 本 lint 按 **package manifest 父目录**（adapters/bins/assemblies）判 callsite allowlist，镜像
# rss_diport_impl_allowlist 的 impl_site_allowed 逻辑（callsite 场景复用相同判据）。
# UI fixture 编译为单一 example crate，manifest 父目录为 `lints/rss_diport_envelope_reserved_writer`
# → 父目录 `lints` ∉ adapters/bins/assemblies → insert_wire_pair 调用触发；try_insert / #[allow] 不触发。
[[example]]
name = "rss_diport_envelope_reserved_writer_ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture 调真 diport::EnvelopeMetadata::insert_wire_pair：lint 按方法 DefId krate 名（diport）
# 匹配，本地 stub struct 的方法无法触发（DefId krate 不是 diport）。
diport = { path = "../../crates/diport" }

[package.metadata.rust-analyzer]
rustc_private = true
