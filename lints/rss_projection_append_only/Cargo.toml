[package]
name = "rss_projection_append_only"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：projection_events 表禁 DELETE/TRUNCATE（append-only AST 辅助守卫，INVARIANT PROJECTION-APPEND-ONLY-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接

# ui fixture 注册为 example target，配合 src/lib.rs 的 dylint_testing::ui_test_example。
# ref: dylint examples/general/await_holding_span_guard@v6.0.1
[[example]]
name = "ui"
path = "ui/disallowed.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly-2026-04-16 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture 只用字符串字面量，无需 serde

[package.metadata.rust-analyzer]
rustc_private = true
