[package]
name = "rss_authplan_callsite"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS G0.4 治理：限定 primitives::authplan::AuthPlan::new / AuthPlan::none 仅组合根（assembly / bin crate）可调用（callsite-allowlist，INVARIANT AUTH-PLAN-MINT-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep primitives）

# 本 lint 按 **caller crate 名** 判 allowlist（≠ 按 callee fn 名唯一判定）。
# `new` / `none` 是极常见名，必须额外校验 self-ty=AuthPlan；UI fixture 验证 specificity。
# UI fixture 编译为单一 example crate、crate 名 = example target 名，故须两个 example target：
#   - authplan_callsite_ui（crate 名非 allowlist）→ 红例：调 AuthPlan::new / AuthPlan::none 触发；
#   - primitives（crate 名 = allowlist 项，定义 crate 内部豁免）→ 绿例：调 funnel 不触发（anti-vacuity，验 allowlist 分支非恒报）。
# golden 随源文件名（ui/disallowed.stderr / ui/primitives.stderr）。
[[example]]
name = "authplan_callsite_ui"
path = "ui/disallowed.rs"

[[example]]
name = "primitives"
path = "ui/primitives.rs"

[[example]]
name = "settingsonly"
path = "ui/settingsonly.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture 调真 primitives funnel：lint 按 callee crate 名（primitives）匹配，本地 stub 无法触发。
primitives = { path = "../../crates/primitives" }

[package.metadata.rust-analyzer]
rustc_private = true
