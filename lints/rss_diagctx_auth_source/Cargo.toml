[package]
name = "rss_diagctx_auth_source"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS 治理：诊断上下文不得成为认证或授权决策输入"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "rss_diagctx_auth_source_ui"
path = "ui/main.rs"

[[example]]
name = "authn"
path = "ui/authn.rs"

[[example]]
name = "httpserve"
path = "ui/httpserve.rs"

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
diagctx = { package = "rss-diag-context", path = "../../crates/diagctx", version = "0.1.0" }
diport = { path = "../../crates/diport" }
httpserve = { path = "../../crates/httpserve" }

[package.metadata.rust-analyzer]
rustc_private = true
