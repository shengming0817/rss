[package]
name = "rss_operator_authorization_callsite"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS operator authorization 治理：按 diport/eventexec 类型与精确生产 owner 限定构造入口（INVARIANT OPERATOR-AUTHORIZATION-CALLSITE-01）"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "operator_authorization_callsite_ui"
path = "ui/disallowed.rs"

[[example]]
name = "httpserve"
path = "ui/httpserve.rs"

[[example]]
name = "postgres"
path = "ui/postgres.rs"

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
eventexec = { path = "../../crates/eventexec" }
diport = { path = "../../crates/diport" }
dlqauthmint = { path = "../../crates/dlqauthmint" }
vocab = { path = "../../crates/vocab" }
uuid = "1"
rss-request-context = { path = "../../crates/request-context" }

[package.metadata.rust-analyzer]
rustc_private = true
