[package]
name = "rss_spawn_missing_scope"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS G0.4 治理：拦截 tokio::spawn/spawn_blocking 子任务读 ctx 却未在外层 runctx::scope 重绑（spawn footgun 静态防误用，INVARIANT SPAWN-CTX-REBIND-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep tokio/runctx）

# ui fixture 注册为 example target，使 dev-dependencies（tokio/runctx）对 fixture 可见；
# 配合 src/lib.rs 的 dylint_testing::ui_test_example。ref: dylint examples/general/await_holding_span_guard@v6.0.1
# target 名按 `<lint>_ui` 取唯一（非裸 `ui`）——多个 lint crate 同名 example 会在 `cargo test --workspace`
# 产生 artifact 路径碰撞（Cargo 警告、未来或升 hard error，见 rust-lang/cargo#6313）；golden 仍随源 ui/main.stderr。
[[example]]
name = "spawn_missing_scope_ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly-2026-04-16 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
# ui fixture 须用真 tokio + 真 runctx：lint 按 crate 名匹配（`tokio::spawn` / `runctx::try_*`），
# 本地 stub 模块 crate 名不为 tokio/runctx 故无法触发——与 rss_domain_no_serialize 用真 serde 同理。
tokio = { version = "1", features = ["rt"] }
runctx = { path = "../../crates/runctx" }

[package.metadata.rust-analyzer]
rustc_private = true
