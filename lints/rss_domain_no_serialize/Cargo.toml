[package]
name = "rss_domain_no_serialize"
version = "0.0.0"
edition = "2024"
publish = false
description = "RSS G0 治理：domain 实体禁止 derive serde Serialize/Deserialize（serde derive 冻结，INVARIANT SERDE-DOMAIN-FREEZE-01）"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib 供 [[example]] ui fixture 链接（ui_test_example 经此暴露 dev-dep serde）

# ui fixture 注册为 example target，使 dev-dependencies（serde）对 fixture 可见；
# 配合 src/lib.rs 的 dylint_testing::ui_test_example。ref: dylint examples/general/await_holding_span_guard@v6.0.1
[[example]]
name = "ui"
path = "ui/main.rs"

[dependencies]
# clippy_utils rev 与 lints/rust-toolchain.toml 的 nightly-2026-04-16 配对（dylint v6.0.1 模板），勿单独升级其一。
# 升级步骤见 lints/README.md「前置」。ref: dylint internal/template/Cargo.toml@v6.0.1
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"
serde = { version = "1", features = ["derive"] }   # ui fixture 的 derive 目标

[package.metadata.rust-analyzer]
rustc_private = true
