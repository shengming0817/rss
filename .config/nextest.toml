# RSS cargo-nextest 配置。进程隔离为 nextest 原生（每测试独立进程），无需配置键。
# 配合 reconcile L4 / saga 状态机 / projection 的幂等性守卫（见 docs/rules/）。
[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = "200ms"

[profile.ci-core]
fail-fast = false
retries = 0
flaky-result = "fail"
slow-timeout = { period = "120s", terminate-after = 2 }
leak-timeout = "200ms"
final-status-level = "slow"

[profile.ci-core.junit]
path = "junit.xml"

# 真集成 lane profile（#1137，`cargo xtask ci-integration --shard <name>`）：
# testcontainers self-provision 容器冷启动（尤其 rabbitmq-management ~250MB 首拉）可超默认 60s slow-timeout，
# 故放宽到 300s；fail-fast=false 让当前 shard 的其它测试继续产出故障证据。
# 危险 target 的串行批次只由 xtask integration shard registry 派生，并在 CLI 传 `--test-threads 1`；
# 本 profile 不维护第二份调度 selector。
[profile.integration]
slow-timeout = { period = "300s", terminate-after = 2 }
leak-timeout = "200ms"
fail-fast = false
retries = 0
flaky-result = "fail"

[profile.integration.junit]
path = "junit.xml"

# fault matrix 当前只有单个顶层测试；独立 profile 仅放宽故障注入 case 的上限，不伪装成可均衡拆分。
[profile.fault-matrix]
slow-timeout = { period = "600s", terminate-after = 1 }
leak-timeout = "200ms"
fail-fast = false
retries = 0
flaky-result = "fail"

[profile.fault-matrix.junit]
path = "junit.xml"

[test-groups.trybuild]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/^ui$/)'
test-group = "trybuild"

[[profile.ci-core.overrides]]
filter = 'test(/^ui$/)'
test-group = "trybuild"
