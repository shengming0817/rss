# RSS cargo-nextest 配置。进程隔离为 nextest 原生（每测试独立进程），无需配置键。
# 配合 reconcile L4 / saga 状态机 / projection 的幂等性守卫（见 docs/rules/）。
[profile.default]
# trybuild discovers the exact compiled feature set from Cargo fingerprint metadata.
archive.include = [{ path = "debug/.fingerprint", relative-to = "target", on-missing = "error" }]
retries = 0
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = "200ms"

[[profile.default.overrides]]
filter = 'package(/-integration$/)'
# Live-provider assertions normally complete well within one minute, but container and broker
# startup can cross that boundary under coverage load. Keep the fixture bounded without retrying.
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
