# RSS cargo-nextest 配置。进程隔离为 nextest 原生（每测试独立进程），无需配置键。
# 配合 reconcile L4 / saga 状态机 / projection 的幂等性守卫（见 docs/rules/）。
[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = "200ms"

[profile.ci]
fail-fast = false
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s" }
slow-timeout = { period = "120s", terminate-after = 2 }
final-status-level = "slow"

# 集成测试串行化（需外部资源；与 #[cfg(feature = "integration")] 隔离配合）。
[test-groups]
integration = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/integration/)'
test-group = "integration"
