# RSS cargo-nextest 配置。进程隔离为 nextest 原生（每测试独立进程），无需配置键。
# 配合 reconcile L4 / saga 状态机 / projection 的幂等性守卫（见 docs/rules/）。
[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = "200ms"

[test-groups.trybuild]
max-threads = 1

[test-groups.integration]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(/(^trybuild$|_trybuild$)/)'
test-group = "trybuild"

[[profile.default.overrides]]
filter = 'package(/-integration$/)'
test-group = "integration"
retries = 1
slow-timeout = { period = "300s", terminate-after = 1 }
