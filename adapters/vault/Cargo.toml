[package]
name = "vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# live_vault 故意不进 shard catalog：关掉 auto-discover，避免显式 [[test]] 被删后
# tests/live_vault.rs 默认无 RF 可构建/执行（#1978 F2）。
autotests = false

[lints]
workspace = true

# adapter 真身（#1011 Transit 签名切片）：始终 impl diport::ManagedResource；`backend` feature 开时增补
# impl diport::Signer（HashiCorp Vault Transit `sign`）。后端 HTTP 客户端经 feature 门控（default build 轻量、
# 仍保 freeze smoke 类型断言），与 redis/s3/amqp 同范式（仅声明真正用到的 dep，cargo-udeps 守）。
[dependencies]
# 实现 diport 已冻 DI port trait（Signer + KeyProvider + ManagedResource + SecretResolver，native AFIT）。
diport = { path = "../../crates/diport" }
# KeyProvider 明文/AAD 类型（Plaintext / DerivedAad）。Vault provider 只读受控出口，不把明文/AAD 写入日志。
secure = { path = "../../crates/secure", optional = true }
# SecretResolver::resolve 签名中的 TenantId（tenant 隔离位置参，Hard）。
vocab = { path = "../../crates/vocab" }
# Transit 签名 HTTP 客户端（TLS-agnostic）：reqwest default-features=false 不绑 crypto provider——
# TLS provider（rustls+ring，对齐 sqlx，避开 deny.toml openssl/aws-lc-sys/ring-license ban）与 roots 由
# 组合根在 Join 阶段经 reqwest tls feature 选定后构造并注入预配置 Client（对标 s3 注入 aws Client 不配 TLS）。
reqwest = { workspace = true, optional = true }
# 结构化日志（仅 backend）：tracing instrument span + warn。失败诊断把 reqwest 错误归类为低基数静态标签
# （classify_reqwest_error），不打印其 Display——比泛 adapter 的 secure::redact_error(Display) funnel 更保守，
# 契合 secrets-backend 敏感度（杜绝 endpoint URL 进日志）；KeyProvider 类型经 backend feature 依赖 secure。
tracing = { workspace = true, optional = true }
# 构造期配置校验错误（fail-fast，非静默）+ transit 响应解析错误。
thiserror = { workspace = true, optional = true }
# Transit `sign` 请求体构造（`{"input": base64(message)}`）/ 响应 `{"data":{"signature":..}}` 解析 + tagged 签名 base64 decode。
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# Vault token 内存清零（drop 时 zeroize，避免密钥物料残留进程内存）。
zeroize = { workspace = true, optional = true }

[features]
default = []
backend = ["dep:reqwest", "dep:tracing", "dep:thiserror", "dep:serde", "dep:serde_json", "dep:base64", "dep:zeroize", "dep:secure"]
# live Vault round-trip 集成测试门（在 backend 之上）：Cargo `[[test]] required-features`
# 是 eligibility 唯一 owner；缺 ADDR/TOKEN 时 env fail-closed（无 harness ignore）。
integration = ["backend"]
# Plain-HTTP SecretResolver construction is unavailable to production dependency graphs. Test
# assemblies opt in explicitly so loopback Vault fixtures remain possible without weakening `new`.
test-support = []

# Live Vault Transit round-trip：仅 `--features integration` 可构建；不登记 integration shard catalog。
[[test]]
name = "live_vault"
path = "tests/live_vault.rs"
required-features = ["integration"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
# live_vault / backend 单测注入 `reqwest::Client`（公开构造器签名暴露该类型）。
reqwest = { workspace = true }
# sign_impl HTTP 编排层确定性单测（loopback mock endpoint，无 live Vault）：reqwest 真发请求 → 测真实
# URL percent-encode / X-Vault-Token header / 非 2xx 状态分支 / 请求级 timeout。仅 backend-gated test 用
# （对标 s3 aws-smithy-mocks dev-dep），production lib 仍 crypto-free。
wiremock = { workspace = true }
