[package]
name = "otel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# adapter 真身（#1011 可观测性导出）：始终 impl diport::ManagedResource；`backend` feature 开时增补
# OTLP/gRPC trace 导出 pipeline + tracing-opentelemetry 桥接 Layer + observ::MetricLabel→KeyValue 映射。
# 后端经 feature 门控（default build 轻量、仍保 freeze smoke 类型断言），与 s3/redis/amqp 同范式
# （仅声明真正用到的 dep，cargo-udeps 守；冻结期预声明的未用基础 path 依赖在 W 阶段按 s3 先例剪除）。
[dependencies]
diport = { path = "../../crates/diport" }
# OTLP/gRPC trace 导出后端（仅 backend feature）：exporter pipeline + SDK provider + tracing 桥接 Layer。
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
# Layer 泛型约束（S: Subscriber + LookupSpan）与测试 span 发射需要 tracing / tracing-subscriber。
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# observ::MetricLabel 闭值集 → otel KeyValue 映射（observ #1006 W 阶段委派给本 adapter，本 crate 闭环其契约）。
observ = { path = "../../crates/observ", optional = true }
# 导出边界脱敏：RedactingSpanExporter 经 rss_redact::redact_field（敏感 key 单源 funnel）清洗 span 属性，
# 避免 authorization/access_token/session 等经 tracing→OTLP 裸传到 collector（`crates/observ`、`rss_redact::redact_error` 与 typed metric enums）。
rss-redact = { workspace = true, optional = true }
# OtelEndpoint::insecure_localhost 的 loopback 校验用 canonical URL parser（防 userinfo 伪装 host 绕过）。
url = { workspace = true, optional = true }
# pipeline 构建失败的 typed 错误（fail-fast，经 rss_redact::RedactedSource 脱敏）。
thiserror = { workspace = true, optional = true }
# ManagedResource::shutdown：SdkTracerProvider::shutdown 是同步阻塞（batch worker flush）；spawn_blocking
# 移出 async executor，使 bootstrap 的 per-resource timeout 可在 .await 让出点生效（见 lib.rs shutdown）。
tokio = { workspace = true, optional = true }

[features]
default = []
backend = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:observ",
  "dep:rss-redact",
  "dep:thiserror",
  "dep:tokio",
  "dep:url",
]
test-support = ["backend"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rstest = { workspace = true }
# round-trip 测试：SimpleSpanProcessor + InMemorySpanExporter 确定性捕获导出 span（无 live collector、
# 不拉额外 TLS crypto）。与上方 [dependencies] 的 optional 条目同名共存：cargo 仅在测试构建叠加 `testing`
# feature（production lib 依赖面不含 testing）；Cargo 会合并同一 package 的 normal/dev feature 集。
opentelemetry_sdk = { workspace = true, features = ["testing"] }
