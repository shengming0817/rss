[package]
name = "s3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# adapter 真身（#1011 对象存储）：始终 impl diport::ManagedResource；`backend` feature 开时增补
# impl diport::ObjectStore（aws-sdk-s3 put/get/delete）。后端 aws-sdk-s3 经 feature 门控（default
# build 轻量、仍保 freeze smoke 类型断言），与 redis/amqp 同范式（仅声明真正用到的 dep，cargo-udeps 守）。
[dependencies]
diport = { path = "../../crates/diport" }
# DLX lifecycle typed archive capability. The adapter only implements the port after its S3
# bucket has passed the WORM startup probe.
eventexec = { path = "../../crates/eventexec", optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
# redacted 结构化日志（仅 backend）：secure::redact_error funnel + tracing（observability.md：错误经 redact）。
secure = { path = "../../crates/secure", optional = true }
tracing = { workspace = true, optional = true }
# 构造期 bucket 校验错误（fail-fast，非静默）。
thiserror = { workspace = true, optional = true }
# get 读取 stream-first：把 aws ByteStream 经 futures::stream::unfold 映射为 diport::ObjectByteStream（不 collect 整对象）。
futures = { workspace = true, optional = true }
# S3 checksum headers are RFC 4648 base64 while the lifecycle port carries the raw SHA-256 digest.
base64 = { workspace = true, optional = true }

[features]
default = []
backend = ["dep:aws-sdk-s3", "dep:aws-smithy-http-client", "dep:secure", "dep:tracing", "dep:thiserror", "dep:futures", "dep:base64", "dep:eventexec"]
integration = ["backend", "testkit/containers"]

# RemoteOnly catalog Test targets：Cargo `[[test]] required-features = ["integration"]`
# 是 eligibility 唯一 owner（INTEGRATION-SHARD-ELIGIBILITY-01）。
[[test]]
name = "dlx_archive_store"
path = "tests/dlx_archive_store.rs"
required-features = ["integration"]

[[test]]
name = "integration_object_store"
path = "tests/integration_object_store.rs"
required-features = ["integration"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# aws-sdk-s3 客户端 mock：canned 响应（put/get/delete/NoSuchKey/错误）注入确定性测试，无 live 后端。
# dev-only 经 test-util 传递引入 hyper 作 mock http client 载体；受管 ObjectStorage shard 的 MinIO
# capability test 消费 production adapter 的 private-CA typed factory，不复制 TLS connector。
aws-smithy-mocks = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# test-util 仅测试启用（with_test_defaults_v2 + mock http client 由 mock_client! 注入）；不进 production lib
# 依赖面（production lib 仍不持 HTTP connector / hyper）。
aws-sdk-s3 = { workspace = true, features = ["test-util"] }
testkit = { path = "../../crates/testkit" }
vocab = { path = "../../crates/vocab" }
