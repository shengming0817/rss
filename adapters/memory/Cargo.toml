[package]
name = "memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Remaining in-memory DI audit and coordination ports.
# Transactional messaging doubles are owned by rss-transactional-messaging-testkit.
# adapter 只能被组合根依赖（deny.toml wrappers）。
[dependencies]
rss-request-context.workspace = true
diport = { path = "../../crates/diport" }
rss-contract.workspace = true
rss-data-protection.workspace = true
primitives = { path = "../../crates/primitives" }
# 单测亦构造 AuditEvent.tenant_id（canonical UUID，TenantId::parse 已写实）。
vocab = { path = "../../crates/vocab" }
zeroize = { workspace = true }

[dev-dependencies]
diport = { path = "../../crates/diport", features = ["test-support"] }
# 异步单测 runtime + StreamExt::next。
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
futures = { workspace = true, features = ["std", "async-await", "executor"] }
