[package]
name = "memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# in-mem DI port provider（RW-G1 追踪弹）：impl diport 的 Publisher / Subscriber / AuditSink / Clock，
# 供 journeys 组合根注入验接缝。runtime-agnostic（futures channel，不绑 tokio runtime）。
# adapter 只能被组合根依赖（deny.toml wrappers）。
[dependencies]
rss-request-context.workspace = true
consistency = { path = "../../crates/consistency" }
eventexec = { path = "../../crates/eventexec" }
diport = { path = "../../crates/diport" }
secure = { path = "../../crates/secure" }
primitives = { path = "../../crates/primitives" }
# AuthGrant aggregate/value types are canonically owned by authn; the memory adapter implements
# identity lifecycle ports over those values.
authn = { path = "../../crates/authn" }
# MemLeaderElector/MemFencedWriter 的 LeaseToken.epoch / FencedWriteRequest.epoch（单调 fencing token）。
# 单测亦构造 AuditEvent.tenant_id（canonical UUID，TenantId::parse 已写实）。
vocab = { path = "../../crates/vocab" }
# MemSagaDurableStore 内部按 saga_id.as_uuid()（uuid::Uuid）存储/过滤，须直接使用 uuid 类型。
uuid = { workspace = true }
# 事件总线 fan-out + 订阅流：futures channel（receiver 即 Stream）+ take_until 取消。
# ref: watermill pubsub/gochannel/pubsub.go@master（in-mem pub/sub 缓冲 channel）
futures = { workspace = true }
# 订阅取消信号：tokio_util CancellationToken（与 diport::Subscriber::subscribe 签名同源）。
tokio-util = { workspace = true }
# 域形 co-tx 端口 `identity::ports::AuthGrantLifecycle` 的 demo provider（MemAuthGrantLifecycle，#1192）：
# adapter→域 DIP 内向边（Option 2/ADR-005；经 deny.toml identity wrapper 加 memory 放行）。
identity = { path = "../../crates/identity" }
zeroize = { workspace = true }

[dev-dependencies]
diport = { path = "../../crates/diport", features = ["test-support"] }
# 异步单测 runtime + StreamExt::next。
tokio = { workspace = true }
futures = { workspace = true }
identity = { path = "../../crates/identity", features = ["test-support"] }
generated = { path = "../../generated" }
