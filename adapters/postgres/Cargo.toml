[package]
name = "postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
consistency = { path = "../../crates/consistency" }
diport = { path = "../../crates/diport" }
futures = { workspace = true }
rss-request-context.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
sqlx = { workspace = true }
# Hard witness for RSS's audited SQLx explicit-root exclusivity patch. If the patch/feature is
# removed, production adapter construction no longer compiles.
sqlx-core = { workspace = true, features = ["rss-exclusive-explicit-roots"] }
thiserror = { workspace = true }
zeroize.workspace = true

[features]
default = []
test-support = []

[dev-dependencies]
static_assertions = { workspace = true }
