[package]
name = "softca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# adapter 真身（#1010 dev-CA 签名切片）：始终 impl diport::ManagedResource；`backend` feature 开时增补
# impl diport::Signer（ECDSA P-256 软件 CA `sign`）。后端 crypto（ring）经 feature 门控（default build 轻量、
# 仍保 freeze smoke 类型断言），与 vault/redis/s3/amqp 同范式（仅声明真正用到的 dep，cargo-udeps 守——
# 故不预连未用的基础/引擎 crate）。
[dependencies]
rss-request-context.workspace = true
# 实现 diport 已冻 DI port trait（Signer + ManagedResource，native AFIT）。
diport = { path = "../../crates/diport" }
# 软件 CA 签名后端（仅 backend）：ECDSA P-256 sign-bytes（generate_pkcs8/from_pkcs8/sign）。ring 已在树、
# LICENSE 判 ISC 在 deny allow-list 内 ⇒ 零新增 crypto license 面。SHA-256 + 签名随机数由 ring 内部承载。
ring = { workspace = true, optional = true }
# 构造期 fail-fast 校验 + 签名 fail-closed 错误枚举（仅 backend）。
thiserror = { workspace = true, optional = true }
# 结构化可观测（仅 backend）：sign span + key-id 不匹配 warn（越权信号）/ 签名失败 error + CA 生命周期 info。
# 仅记 key/purpose 等非秘密归因字段——私钥物料 / message / 签名字节永不进 span（对标 adapters/vault transit instrument）。
tracing = { workspace = true, optional = true }

[features]
default = []
# adapter 真身：增补 impl diport::Signer（ECDSA P-256 dev CA）+ generate/from_pkcs8 构造器 + SoftCaError。
# 开启将引入 ring（ISC license，deny allow-list 内）+ thiserror + tracing（均 Apache/MIT/ISC，零新增 license 面）。
backend = ["dep:ring", "dep:thiserror", "dep:tracing"]

[dev-dependencies]
# 异步 Signer::sign / RevocationStore 单测运行时（multi_thread 验 Send 变体跨 spawn）。
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# RevocationStore 测试构造 CertScope 的强类型标识（TenantId / DeviceId）；仅测试用。
vocab = { path = "../../crates/vocab" }
ids = { path = "../../crates/ids" }
# Provider-neutral revocation behavior contract; dev-only keeps the shipped adapter graph unchanged.
testkit = { path = "../../crates/testkit" }
