# package 名 `redis-adapter`：deadpool-redis 传递引入 crates.io `redis`，若 package 也叫 `redis` 则
# `cargo -p redis` 与传递 `redis` package-id 歧义。`[lib] name = "redis"` 保留裸导入面（`use redis::…`，
# architecture.md §扁平 workspace 结构 的「裸后端名不污染 crate 名」约定），package-id 用 `-adapter` 后缀消歧。
[package]
name = "redis-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "redis"

[lints]
workspace = true

# adapter 真身（#1009 幂等 claimer）：impl diport::ManagedResource + consistency::IdempotencyStore。
# 后端 deadpool-redis 经 `backend` feature 门控（default build 轻量、仍保 freeze smoke）。
[dependencies]
diport = { path = "../../crates/diport" }
consistency = { path = "../../crates/consistency" }
deadpool-redis = { workspace = true, optional = true }
# redacted 结构化日志（仅 backend）：`secure::redact_error` funnel + `tracing`（observability.md：错误经 redact）。
secure = { path = "../../crates/secure", optional = true }
tracing = { workspace = true, optional = true }
# 构造期 TTL 校验错误（fail-fast，非静默钳制）。
thiserror = { workspace = true, optional = true }

[features]
default = []
backend = ["dep:deadpool-redis", "dep:secure", "dep:tracing", "dep:thiserror"]
# 集成测试需真实 redis 后端（#[cfg(feature = "integration")]，nextest 按名串行）。
integration = ["backend"]

[dev-dependencies]
tokio = { workspace = true }
rstest = { workspace = true }
