# package 名 `redis-adapter`：deadpool-redis 传递引入 crates.io `redis`，若 package 也叫 `redis` 则
# `cargo -p redis` 与传递 `redis` package-id 歧义。`[lib] name = "redis"` 保留裸导入面（`use redis::…`，
# 按 Cargo/deny package identity 约定，package-id 用 `-adapter` 后缀消歧。
[package]
name = "redis-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "redis"

[lints]
workspace = true

# adapter 真身（#1009 inbox claimer）：impl rss_runtime::ManagedResource + consistency::InboxStore。
# 后端 deadpool-redis 经 `backend` feature 门控（default build 轻量、仍保 freeze smoke）。
[dependencies]
diport = { path = "../../crates/diport" }
rss-runtime.workspace = true
consistency = { path = "../../crates/consistency", optional = true }
vocab = { path = "../../crates/vocab", optional = true }
deadpool-redis = { workspace = true, optional = true }
# redacted 结构化日志（仅 backend）：`rss_redact::redact_error` funnel + `tracing`（`crates/observ` 与 typed metric enums：错误经 redact）。
secure = { path = "../../crates/secure", optional = true }
rss-redact = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# 构造期 TTL 校验错误（fail-fast，非静默钳制）。
thiserror = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros"], optional = true }

[features]
default = []
backend = ["dep:deadpool-redis", "dep:secure", "dep:rss-redact", "dep:tracing", "dep:thiserror", "dep:vocab", "dep:sha2", "dep:tokio"]
# Live tests are owned by tests/redis-integration, which enables this existing feature directly.
integration = ["backend", "dep:consistency"]

[dev-dependencies]
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros"] }
rstest = { workspace = true }
vocab = { path = "../../crates/vocab" }
