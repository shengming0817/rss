[package]
name = "mqtt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# adapter 依赖基础 + 引擎 + DI-infra（diport，见下，impl 其 port trait）；实现其上层 trait 的具体服务 crate 在落地该 trait 时按需添加，
# 不预连全服务层（见 architecture.md §分层「adapters 实现基础/引擎/服务定义的 trait」+ PR #137 review A1/B1/C1）。
[dependencies]
vocab = { path = "../../crates/vocab" }
ids = { path = "../../crates/ids" }
base64 = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true, features = ["std"] }
rustls-pki-types = { workspace = true }
url = { workspace = true }
x509-parser = { workspace = true }
# The session is a single managed resource; it intentionally does not implement raw-topic ports.
diport = { path = "../../crates/diport" }
identity = { path = "../../crates/identity" }
# Production MQTT v5 I/O is always compiled; the explicit rustls config installs the ring provider.
# ref: bytebeamio/rumqtt rumqttc/examples/async_manual_acks_v5.rs@rumqttc-0.25.0
rumqttc = { workspace = true, features = ["use-rustls-no-provider"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
metrics = { workspace = true }

[features]
# Production MQTT is always compiled. This feature gates only the Docker-backed broker tests.
broker-tests = ["testkit/containers"]
# Test-only uplink saturation probe. Must stay [dev-dependencies]-only (LAYER-DEPS-09).
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
anyhow = { workspace = true }
testkit = { path = "../../crates/testkit" }
rcgen = { workspace = true }
static_assertions = { workspace = true }
syn = { workspace = true, features = ["visit"] }
metrics-exporter-prometheus = { workspace = true }
deviceloop = { path = "../../crates/deviceloop" }
