# package 名 `prometheus-adapter`：crates.io 存在同名 `prometheus` crate，若 package 也叫 `prometheus` 则
# `cargo -p prometheus` 与该 package-id 歧义（Cargo/deny package identity
# 同名 adapter 须加 `-adapter` 后缀）。`[lib] name = "prometheus"` 保留裸导入面（`use prometheus::…` 不污染），
# deny.toml ban 按 package 名（`prometheus-adapter`）照常守。与 `redis-adapter` 同范式。
[package]
name = "prometheus-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "prometheus"

[lints]
workspace = true

# adapter 实现 DI-infra port（diport：ManagedResource 始终 + MetricsExporter 于 backend）。W 阶段真身只用
# diport（必填）+ backend 门控的 Prometheus 后端；G0 stub 预连的基础/引擎 crate（vocab/ids/secure/…）本切片
# 不用，已裁（否则 cargo-udeps 红）；不预连全层。
# lib 只引 metrics-exporter-prometheus（持 PrometheusHandle 渲染）；`metrics` facade 仅测试用（发射点），入
# dev-dependencies——lib 不直接引用 `metrics::`，避免 cargo-udeps 多余依赖。
[dependencies]
diport = { path = "../../crates/diport" }
rss-runtime.workspace = true
metrics-exporter-prometheus = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
# 接 Prometheus 后端：装进程级 recorder + 持 render 句柄，impl diport::MetricsExporter。feature-off 时为空壳
# （仅 freeze smoke 类型断言）、不引入后端依赖——同 s3 的 backend 门控范式。
backend = ["dep:metrics-exporter-prometheus", "dep:thiserror"]

[dev-dependencies]
# backend_tests（`--features backend`）：metrics = 发射点 facade（with_local_recorder / counter! / gauge!，
# 仅测试用，故纯 dev-dep）；tokio = 异步 shutdown() 生命周期测试。`metrics-exporter-prometheus` 不在此重复
# 声明——backend_tests 经 cfg(feature="backend") 编译，届时上面的 optional dep 已激活、即可直接引用（避免
# dev-dep 与 optional dep 双重声明）。
metrics = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
