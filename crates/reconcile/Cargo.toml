[package]
name = "rss-reconcile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
readme = "README.md"
description = "Durable tenant-scoped reconciliation and recovery"
categories = ["asynchronous", "database"]
keywords = ["reconcile", "worker", "recovery"]
publish = ["crates-io"]

[dependencies]
rss-request-context.workspace = true
rss-redact.workspace = true
thiserror.workspace = true
futures = { workspace = true, features = ["std", "async-await"] }
tokio = { workspace = true, features = ["macros", "sync"] }
tokio-util.workspace = true

[features]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "sync", "test-util"] }
anyhow.workspace = true

[lints]
workspace = true
