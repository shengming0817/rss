[package]
name = "testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# 服务层 test-support 脚手架：HTTP 契约测试 harness（per-contract 测试模板，#1136）。
# 唯一 workspace shipped 出边为 rss-conformance，且保持零 adapter 依赖：域 crate 经 [dev-dependencies] 消费本 crate
# 写契约测试，不拉任何 adapter crate；由 workspace lints、`clippy.toml` 与 contract tests 约束。
[dependencies]
rss_conformance = { package = "rss-conformance", path = "../conformance", version = "0.1.0" }
axum = { workspace = true }                          # Router / Body / Request / to_bytes（被测 router 类型）
tower = { workspace = true, features = ["util"] }    # ServiceExt::oneshot 驱动（in-process，无 TCP）
serde = { workspace = true }                         # ContractRequest.json 的 Serialize 约束 + WireError derive
serde_json = { workspace = true }                    # body 序列化 / 反序列化（schema 对齐 + error envelope 解析）
toml = { workspace = true }                          # consistency crash matrix fixture DSL（fixture-*.toml）解析
thiserror = { workspace = true }                     # TestkitError 库错误枚举
# 有界等待（#1495）：`wait` 模块始终可用；time/sync 给 poll + Notify，macros/rt 给单测 runtime。
tokio = { workspace = true, features = ["time", "sync", "macros", "rt"] }
# 容器 fixture（#1137，仅 `containers` feature）：testcontainers 起真 pg/redis/rabbitmq；
# anyhow = FixtureError（测试体 `?` 组合）。默认构建 / 契约 harness 消费方不拉此树。
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true, features = ["postgres", "redis", "rabbitmq", "minio"] }
anyhow = { workspace = true, optional = true }
url = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

[features]
default = []
# 容器 fixture（#1137）+ tenant-scope conformance 骨架（#1437）：adapter 集成测试 + journeys durable journey
# 经各自 `integration` feature 传递激活（`testkit/containers`）。契约 harness（#1136，axum oneshot）始终可用。
# conformance 骨架对 tenant 类型泛型化；testkit 的唯一内部 shipped 出边为 rss-conformance，仍为零 adapter 依赖。
containers = ["dep:testcontainers", "dep:testcontainers-modules", "dep:anyhow", "dep:url", "dep:sqlx", "dep:rcgen"]
integration = ["containers"]

# RemoteOnly catalog Test targets：Cargo `[[test]] required-features = ["integration"]`
# 是 eligibility 唯一 owner（INTEGRATION-SHARD-ELIGIBILITY-01）。
[dev-dependencies]
eventing.workspace = true                              # public Eventing lifecycle external-crate T2 carrier
uuid = { workspace = true }                          # 自测：path 参数 newtype（UUID 解析）维度
trybuild = { workspace = true }                      # provider owner-private receipt compile reds
tokio = { workspace = true, features = ["test-util"] }  # wait 自测：start_paused 虚拟时钟验证 await_delay
