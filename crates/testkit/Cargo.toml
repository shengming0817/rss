[package]
name = "testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
# Provider fixtures are absent from the default bounded-wait surface.
testcontainers = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
containers = ["dep:testcontainers", "dep:anyhow", "dep:rcgen", "dep:serde_json", "tokio/sync", "tokio/process", "tokio/io-util"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
