[package]
name = "testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# 服务层 test-support 脚手架：HTTP 契约测试 harness（per-contract 测试模板，#1136）。
# 零 workspace 依赖（出边全外部 crate）⇒ 零 adapter 依赖：域 crate 经 [dev-dependencies] 消费本 crate
# 写契约测试，不拉任何 adapter crate（rust-standards.md §命名「域 crate 单测不依赖平台 adapter crate」）。
[dependencies]
axum = { workspace = true }                          # Router / Body / Request / to_bytes（被测 router 类型）
tower = { workspace = true, features = ["util"] }    # ServiceExt::oneshot 驱动（in-process，无 TCP）
serde = { workspace = true }                         # ContractRequest.json 的 Serialize 约束 + WireError derive
serde_json = { workspace = true }                    # body 序列化 / 反序列化（schema 对齐 + error envelope 解析）
thiserror = { workspace = true }                     # TestkitError 库错误枚举
# 容器 fixture（#1137，仅 `containers` feature）：testcontainers 起真 pg/redis/rabbitmq；tokio time 重试；
# anyhow = FixtureError（测试体 `?` 组合）。默认构建 / 契约 harness 消费方不拉此树。
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true, features = ["postgres", "redis", "rabbitmq"] }
tokio = { workspace = true, optional = true, features = ["time"] }
anyhow = { workspace = true, optional = true }

[features]
default = []
# 容器 fixture（#1137）：adapter 集成测试 + journeys durable journey 经各自 `integration` feature 传递激活
# （`testkit/containers`）。契约 harness（#1136，axum oneshot）始终可用、不受本 feature 影响。
containers = ["dep:testcontainers", "dep:testcontainers-modules", "dep:tokio", "dep:anyhow"]

[dev-dependencies]
tokio = { workspace = true }                         # harness 自测的 async runtime
uuid = { workspace = true }                          # 自测：path 参数 newtype（UUID 解析）维度
