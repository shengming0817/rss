[package]
name = "rss-timeseries-clickhouse"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
readme = "README.md"
description = "Recoverable ClickHouse time series storage with PostgreSQL admission"
publish = ["crates-io"]
[dependencies]
rss-timeseries.workspace = true
rss-request-context.workspace = true
rss-contract.workspace = true
clickhouse.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls"] }
futures = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["time", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
zeroize.workspace = true
bytes.workspace = true
url.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
[features]
default = []
integration = []
[dev-dependencies]
anyhow.workspace = true
[lints]
workspace = true
