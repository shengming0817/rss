[package]
name = "identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# 明文种子登录（with_seed_user + in-mem user repo）仅追踪弹 / demo 用——经 feature 门控做编译期边界：
# 生产组合根不启用即不编译，防 W 误用明文凭据路径（RW-G1 PR #186 F1，machine boundary）。
[features]
seed-login = []

[dependencies]
vocab = { path = "../vocab" }
ids = { path = "../ids" }
secure = { path = "../secure" }
support = { path = "../support" }
runctx = { path = "../runctx" }
consistency = { path = "../consistency" }
primitives = { path = "../primitives" }
httpserve = { path = "../httpserve" }
authn = { path = "../authn" }
bootstrap = { path = "../bootstrap" }
eventexec = { path = "../eventexec" }
observ = { path = "../observ" }
distributed = { path = "../distributed" }
deviceloop = { path = "../deviceloop" }
generated = { path = "../../generated" }
thiserror = { workspace = true }
# 域形 repo/service DI port（ports 模块）的 async dyn 派发：native AFIT + dynosaur dyn-compatible wrapper +
# trait-variant Send 变体（同 diport 范式，ADR-003/ADR-004 C1）。归属域 crate 而非 diport：repo port 签名
# 引用域内实体，不得收敛 diport（Option 2/ADR-005）。dynosaur/trait-variant 依赖经 deny.toml 白名单收敛
# （DIPORT-MACRO-CONFINE-01′：diport + 定义 repo port 的域 crate）。
dynosaur = { workspace = true }
trait-variant = { workspace = true }
# 登录服务：注入 diport::Publisher（发 session-created outbox fact）+ Clock（会话到期）。
diport = { path = "../diport" }
# session-created event payload 编码为 provider-agnostic 字节（PublishRequest.payload）。
serde_json = { workspace = true }
# EventId 独立 opaque UUID（F1：不复用 session_id，session_id 已被 secure 列敏感，不得进 broker metadata）。
uuid = { workspace = true, features = ["v4"] }
# 登录路径结构化 span（不记 password；observability.md §日志）。
tracing = { workspace = true }

[dev-dependencies]
# 登录服务异步单测 runtime。Publisher / Clock 替身在 #[cfg(test)] 内手写（域单测不依赖 adapter crate，
# rust-standards.md §命名）。
# ports 模块 smoke：mockall mock（native-AFIT）经 new_box 装入 DynRoleRepo（PORT-SHAPE-01/02）。
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
mockall = { workspace = true }
