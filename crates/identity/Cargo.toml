[package]
name = "identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# 种子登录（with_seed_credential：argon2 哈希凭据 in-mem CredentialRepo 替身；会话生命周期 provider 由组合根注入）仅 test / demo 用——
# 经 feature 门控做编译期边界：生产组合根不启用即不编译，防种子凭据路径误入生产（machine boundary）。
[features]
seed-login = ["secure/test-support"]
# test-support：暴露受控 AuthGrant/refresh/login 构造器，供**下游 adapter crate**（如 postgres）集成
# 测试跨 crate 驱动密封的领域 funnel。生产构建不启用即不编译，seal 不变；与 authn / runctx 的
# `test-support` 同信任模型。
test-support = ["httpserve/test-util"]
# Exposes only the generated `identity.session-created` payload type needed by the closed L2
# fault-matrix seam. This is deliberately separate from the broader domain test-support bundle.
fault-matrix-test-support = []

[dependencies]
rss-contract.workspace = true
rss-request-context.workspace = true
vocab = { path = "../vocab" }
ids = { path = "../ids" }
secure = { path = "../secure" }
support = { path = "../support" }
runctx = { path = "../runctx" }
consistency = { path = "../consistency" }
primitives = { path = "../primitives" }
httpserve = { path = "../httpserve" }
diagctx = { package = "rss-diag-context", path = "../diagctx" }
authn = { path = "../authn" }
bootstrap = { path = "../bootstrap" }
eventexec = { path = "../eventexec" }
observ = { path = "../observ" }
distributed = { path = "../distributed" }
deviceloop = { path = "../deviceloop" }
generated = { path = "../../generated" }
thiserror = { workspace = true }
sha2 = { workspace = true }
# 域形 repo/service DI port（ports 模块）的 async dyn 派发：native AFIT + dynosaur dyn-compatible wrapper +
# trait-variant Send 变体（同 diport 范式，ADR-003/ADR-004 C1）。归属域 crate 而非 diport：repo port 签名
# 引用域内实体，不得收敛 diport（Option 2/ADR-005）。dynosaur/trait-variant 依赖经 deny.toml 白名单收敛
# （DIPORT-MACRO-CONFINE-02：diport + 定义 repo port 的域 crate）。
dynosaur = { workspace = true }
trait-variant = { workspace = true }
# 登录服务：注入 provider/Clock，原子持久化 AuthGrant、初始 refresh 与 session-created outbox fact。
diport = { path = "../diport" }
# session-created event payload 编码为 provider-agnostic 字节（PublishRequest.payload）。
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
# EventId 独立 opaque UUID（F1：不复用 session_id，session_id 已被 secure 列敏感，不得进 broker metadata）。
uuid = { workspace = true, features = ["v4", "v5"] }
# 登录路径结构化 span（不记 password；`crates/observ`、`secure::redact_error` 与 typed metric enums）。
tracing = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
identity = { path = ".", features = ["test-support"] }
diport = { path = "../diport", features = ["test-support"] }
eventexec = { path = "../eventexec", features = ["internal-test-support"] }
# 登录服务异步单测 runtime。Publisher / Clock 替身在 #[cfg(test)] 内手写；域单测不依赖 adapter crate。
# application 真实 refresh/security 行为单测：mockall mock（RefreshTokenStore 等边界路径）。
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
mockall = { workspace = true }
# 表驱动域单测（newtype parse / RBAC authz）。
rstest = { workspace = true }
# authz 纯逻辑单测构造 Principal（test-support feature 仅 dev/test 生效，生产 seal 不变）。
authn = { path = "../authn", features = ["test-support"] }
httpserve = { path = "../httpserve", features = ["test-util"] }
secure = { path = "../secure", features = ["test-support"] }
# identity.login 契约测试样板（#1136 login_contract）：testkit oneshot harness + axum 挂载样板 handler。
# testkit 零 adapter 依赖（dev-dep 消费不破「域单测不依赖 adapter crate」）；axum 构建样板 router。
testkit = { path = "../testkit" }
trybuild = { workspace = true }
tracewiretest = { path = "../tracewiretest" }
