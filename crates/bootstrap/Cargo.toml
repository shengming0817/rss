[package]
name = "bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# 负例拓扑断言伪造 funnel（`SubscriberBinding::from_test_parts`）。
# 生产构建无此 feature ⇒ 入口编译期不存在（Medium / LAYER-DEPS-09）；跨 crate 测试消费方经
# [dev-dependencies] 显式启用。
test-support = []

# bootstrap 属服务层，按 Cargo manifest 与 deny.toml 连接基础+引擎+diport。
# 一般不依赖兄弟服务（resolver 等由 assembly 注入，不在此预连，PR #137 review F1）；
# **受控例外**：依赖 httpserve 的**编译期路由类型词汇**（ListenerRouter<L> / UnfinalizedRoutes，typed
# route funnel #1113/#1103），经 ADR-009 sanction 的 `bootstrap → httpserve` 边（layers.rs route_funnel_allows，
# INVARIANT LAYER-DEPS-ROUTE-FUNNEL-01）。F1 的「不向兄弟服务要 runtime provider」原则不变——本边仅取类型词汇。
[dependencies]
vocab = { path = "../vocab" }
ids = { path = "../ids" }
secure = { path = "../secure" }
support = { path = "../support" }
runctx = { path = "../runctx" }
consistency = { path = "../consistency" }
primitives = { path = "../primitives" }
# 受控 `bootstrap → httpserve` 边（ADR-009）：route_group 的 listener-typed builder ListenerRouter<L> +
# finalize_routes 产出的 sealed UnfinalizedRoutes（auth-finalize-before-bind funnel）。裸 axum::Router 不出 httpserve。
httpserve = { path = "../httpserve" }
# DI-infra：ManagedResource port trait + DynManagedResource（Send dyn wrapper）+ ShutdownError 单源。
# 服务→DI-infra 下行依赖（layers.rs allows）。dynosaur 派发统一替代原 async-trait（ADR-003）。
diport = { path = "../diport" }
# 关闭逆序编排范式（无 async Drop）。tokio::time 做有界超时、spawn 做 panic 隔离，
# tokio-util::CancellationToken 做关闭取消广播；ManagedResource 的 dyn 分发由 diport（dynosaur）承载。
# 关闭聚合错误（ShutdownFailureKind / ResourceShutdownError）用 thiserror，不在公共 port 暴露 anyhow。
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# test-util：tokio 虚拟时钟（start_paused）做确定性超时测试，不靠真实 sleep（防 flaky）。
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time"] }
# finalize_routes 的 listener 隔离行为测试（ROUTE-LISTENER-TYPED-01 类型层守的运行期补充）：
# tower::ServiceExt::oneshot 对 per-listener Router（经 UnfinalizedRoutes::into_router_for_test 取回）发请求，
# 断言路由不串台；axum 仅用于测试构建请求与 handler。
tower = { workspace = true, features = ["util"] }
axum = { workspace = true }
# 隔离测试经 httpserve 的 test-util feature 取回裸 Router（`UnfinalizedRoutes::into_router_for_test`）做 oneshot；
# 生产构建无此 feature ⇒ 该入口编译期不存在（ADR-009 §6 Soft→Medium）。
httpserve = { path = "../httpserve", features = ["test-util"] }
trybuild = { workspace = true }
