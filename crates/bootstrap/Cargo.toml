[package]
name = "bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# bootstrap 属服务层，按 architecture.md §分层「服务依赖基础+引擎+DI-infra」连基础+引擎+diport，
# 不依赖兄弟服务（resolver 等由组合根 bins/server / assembly 注入，不在此预连）。见 PR #137 review F1。
[dependencies]
vocab = { path = "../vocab" }
ids = { path = "../ids" }
secure = { path = "../secure" }
support = { path = "../support" }
runctx = { path = "../runctx" }
consistency = { path = "../consistency" }
primitives = { path = "../primitives" }
# DI-infra：ManagedResource port trait + DynManagedResource（Send dyn wrapper）+ ShutdownError 单源。
# 服务→DI-infra 下行依赖（layers.rs allows）。dynosaur 派发统一替代原 async-trait（ADR-003）。
# SubscriberHandler::handle 消费 diport::Message（不引兄弟服务 eventexec）。
diport = { path = "../diport" }
# SubscriberHandler::handle 返回 BoxFuture（手写 box——bootstrap 不用 dynosaur，dynosaur 收敛于 diport）。
futures = { workspace = true }
# 关闭逆序编排范式（无 async Drop）。tokio::time 做有界超时、spawn 做 panic 隔离，
# tokio-util::CancellationToken 做关闭取消广播；ManagedResource 的 dyn 分发由 diport（dynosaur）承载。
# 关闭聚合错误（ShutdownFailureKind / ResourceShutdownError）用 thiserror，不在公共 port 暴露 anyhow。
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# 域 init 阶段路由组注册闭包参数（register: FnOnce(axum::Router) -> ...）——签名冻结需要，
# 无运行时依赖（todo!() 体不调用；实现阶段由 httpserve 组合驱动，组合根注入）。
axum = { workspace = true }

[dev-dependencies]
# test-util：tokio 虚拟时钟（start_paused）做确定性超时测试，不靠真实 sleep（防 flaky）。
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time"] }
# finalize_routes 的 listener 隔离测试（INVARIANT BOOTSTRAP-ROUTE-LISTENER-SEGREGATION-01）：
# tower::ServiceExt::oneshot 对 per-listener Router 发请求，断言一个 listener 的路由不会出现在
# 另一个 listener 的 Router 上（sanctioned handler 测试 idiom，rust-standards.md §覆盖率）。仅测试用。
tower = { workspace = true, features = ["util"] }
