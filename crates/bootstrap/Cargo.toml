[package]
name = "bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# bootstrap 属服务层，按 architecture.md §分层「服务依赖基础+引擎」只连基础+引擎，不依赖兄弟服务
# （resolver 等需要的服务由组合根 bins/server / assembly 注入，不在此预连）。见 PR #137 review F1。
[dependencies]
vocab = { path = "../vocab" }
ids = { path = "../ids" }
secure = { path = "../secure" }
support = { path = "../support" }
runctx = { path = "../runctx" }
consistency = { path = "../consistency" }
primitives = { path = "../primitives" }
# 关闭逆序编排范式（无 async Drop）。tokio::time 做有界超时、spawn 做 panic 隔离，
# tokio-util::CancellationToken 做关闭取消广播；async-trait 让 ManagedResource 可 dyn 分发。
# 关闭失败用本 crate typed ShutdownError（thiserror）表达，不在公共 port 暴露 anyhow。
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# test-util：tokio 虚拟时钟（start_paused）做确定性超时测试，不靠真实 sleep（防 flaky）。
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time"] }
