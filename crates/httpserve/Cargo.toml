[package]
name = "httpserve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# test-util：门控 funnel 测试辅助（`UnfinalizedRoutes`/`AuthenticatedRoutes::into_router_for_test`、
# `routes::unfinalized_for_test`）。生产构建（默认 = 无此 feature）里这些入口**编译期不存在**——Soft→Medium
# 升级（ADR-009 §6 / 内置 review #7），生产代码无法取裸 Router 绕过 funnel。跨 crate 测试消费方经 dev-dependency
# 显式启用（bootstrap/audit/bins，及 httpserve 自身集成测试经下方 self dev-dep）。
test-util = []

[dependencies]
# 基础/引擎（仅用到的两个 path dep；ids/secure/support/runctx/consistency 未用 → 不声明，避免 cargo-udeps 多余依赖）
vocab = { path = "../vocab" }           # CoreError / CoreErrorKind / PublicDetail（wire error mapper 单源）
primitives = { path = "../primitives" } # AuthPlan / resolve_requirement / HealthReport（健康聚合）
# HTTP runtime（生态对标 axum + tower，不自造中间件 trait）
axum = { workspace = true }
tower = { workspace = true }                             # EnforceLayer/EnforceService impl tower::Layer/Service（axum from_fn 不可用于 MethodRouter::layer）
futures = { workspace = true }         # panic_recovery 中间件 catch_unwind（AssertUnwindSafe + FutureExt）
# wire DTO 序列化（error envelope / readyz 响应）
serde = { workspace = true }
serde_json = { workspace = true }
# 请求关联 id 生成
uuid = { workspace = true, features = ["v4"] }
# 结构化 span / 日志
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] } # ServiceExt::oneshot 驱动 mock 请求
# typed route funnel 负向证据（#1113/#1103，ADR-009）：编译期 Hard 不变式的 compile-fail 回归锁
# （未认证 router 不可 bind、AuthenticatedRoutes 外部不可 mint、Internal 不可 mount_primary）。
trybuild = { workspace = true }
# self dev-dep 启用 test-util：httpserve 的**集成测试**（tests/runtime.rs / funnel_ui.rs / ui）把 httpserve 当
# 普通 dep 编译（非 lib `cfg(test)`），需此 feature 才见 `*_for_test`/`unfinalized_for_test`（标准 self dev-dep 模式）。
httpserve = { path = ".", features = ["test-util"] }
