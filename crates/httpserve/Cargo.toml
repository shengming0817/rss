[package]
name = "httpserve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# test-util：显式开启后的 raw 测试面是 residual Medium guard（`*_for_test`）；独立 default-feature
# cargo-check 证明生产 feature graph 里这些入口编译期全部不存在，ROUTE-MOUNT-NOBYPASS-01 为 Hard。
# 跨 crate 测试消费方经 dev-dependency 显式启用（bootstrap/audit/bins，及 httpserve 自身集成测试经下方
# self dev-dep），不改变独立生产 graph。
test-util = []

[dependencies]
# 基础/引擎（仅用到的 path dep；ids/secure/support/consistency 未用 → 不声明，避免 cargo-udeps 多余依赖）
vocab = { path = "../vocab" }           # CoreError / CoreErrorKind / PublicDetail（wire error mapper 单源）
primitives = { path = "../primitives" } # AuthPlan / resolve_requirement / HealthReport（健康聚合）
diagctx = { path = "../diagctx" }       # correlation 诊断信道，service→base（ADR-002 §D1-bis）
# enforce 在 Require-Allow 后建 runctx::scope（ambient tenant/principal 与 route auth 决策对齐，#1105 F2）；
# AppCtx 由组合根验签桥经 PendingScopeCtx extension 传入（httpserve 不依赖 authn，只 scope 已构造的 AppCtx）。
runctx = { path = "../runctx" }
# Auth decision audit sink / injected clock（finalize_auth_with_audit）。
diport = { path = "../diport" }
# HTTP runtime（生态对标 axum + tower，不自造中间件 trait）
axum = { workspace = true }
http-body-util = { workspace = true }  # Limited：stream-level 字节硬顶（#1106 FIX-1，body-limit 中间件）
tower = { workspace = true }                             # EnforceLayer/EnforceService impl tower::Layer/Service（axum from_fn 不可用于 MethodRouter::layer）
tower-http = { workspace = true, features = ["set-header"] } # security-headers（SetResponseHeaderLayer，#1106 批次2）
futures = { workspace = true }         # panic_recovery 中间件 catch_unwind（AssertUnwindSafe + FutureExt）
# wire DTO 序列化（error envelope / readyz 响应）
serde = { workspace = true }
serde_json = { workspace = true }
# 请求关联 id 生成
uuid = { workspace = true, features = ["v4"] }
# 结构化 span / 日志
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] } # 全请求 server budget；timeout 通过 drop 取消整条 request future

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] } # ServiceExt::oneshot 驱动 mock 请求
# typed route funnel 负向证据（#1113/#1103，ADR-009）：编译期 Hard 不变式的 compile-fail 回归锁
# （未认证 router 不可 bind、AuthenticatedRoutes 外部不可 mint、non-Primary 不可 mount Primary endpoint）。
trybuild = { workspace = true }
# self dev-dep 启用 test-util：httpserve 的**集成测试**（tests/runtime.rs / funnel_trybuild.rs / ui）把 httpserve 当
# 普通 dep 编译（非 lib `cfg(test)`），需此 feature 才见 `*_for_test`/`unfinalized_for_test`（标准 self dev-dep 模式）。
httpserve = { path = ".", features = ["test-util"] }
