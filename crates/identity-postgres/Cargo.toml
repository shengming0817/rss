[package]
name = "rss-identity-postgres"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
[dependencies]
hmac = "0.12"
base64 = "0.22"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
rss-audit-core.workspace = true
rss-audit-postgres = { workspace = true, features = ["messaging"] }
rand_core.workspace = true
ring.workspace = true
rss-identity-core.workspace = true
rss-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
rss-request-context.workspace = true
rss-transactional-messaging = { workspace = true, features = ["producer"] }
rss-transactional-messaging-postgres.workspace = true
futures = "0.3"
zeroize.workspace = true
url = "2.5"
thiserror.workspace = true
[dev-dependencies]
syn = { workspace = true, features = ["visit"] }
[lints]
workspace = true
