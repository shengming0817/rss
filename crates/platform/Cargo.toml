[package]
name = "rss-platform"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "Typed asynchronous application waist for the RSS Platform Public API"
publish = ["crates-io"]
categories = ["development-tools"]
keywords = ["application", "framework", "typed", "dispatch", "async"]

[dependencies]
rss-contract.workspace = true
rss-request-context.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "macros"] }
trybuild.workspace = true

[features]
default = []

[lints]
workspace = true
