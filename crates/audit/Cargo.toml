[package]
name = "audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
test-support = []

[dependencies]
vocab = { path = "../vocab" }
ids = { path = "../ids" }
runctx = { path = "../runctx" }
diagctx = { package = "rss-diag-context", path = "../diagctx", version = "0.1.0" }
secure = { path = "../secure" }
consistency = { path = "../consistency" }
observ = { path = "../observ" }
primitives = { path = "../primitives" }
httpserve = { path = "../httpserve" }
authn = { path = "../authn" }
bootstrap = { path = "../bootstrap" }
generated = { path = "../../generated" }
# Audit read/write 域形 repo ports（ADR-005 Option 2）：async dyn 派发 = trait_variant Send 变体 + dynosaur wrappers
# （DIPORT-MACRO-CONFINE-02 白名单：定义自身 repo port 的域 crate 可依赖；deny.toml + xtask 两侧同步加 audit）。
dynosaur = { workspace = true }
trait-variant = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# session-created 订阅 handler 入参：diport::Message（跨域事件信封）。
diport = { path = "../diport" }
# 解码 session-created event payload（generated 派生类型）。
serde_json = { workspace = true }
# 跨租户 admin 读 HTTP handler（GET /api/v1/audit/entries）：axum Query/Json + route_group 挂载。
axum = { workspace = true }
# 审计 handler 失败路径（decode / tenant / append）结构化日志——审计管道失败不可静默（observability.md §日志）。
tracing = { workspace = true }
# 跨租户 admin 读分页游标（vocab::Cursor 是 base64url 不透明 token；in-mem 编码子链下标）。
base64 = { workspace = true }

[dev-dependencies]
# 订阅 handler / async repo 单测 runtime。verifier / repo 替身在 #[cfg(test)] 内手写（域单测不依赖 adapter crate）。
tokio = { workspace = true }
# 表驱动域单测（链篡改逐字段参数化）。
rstest = { workspace = true }
# admin 读 handler 集成测试：tower::ServiceExt::oneshot 驱动 axum Router（参数绑定 / 状态码 / 响应体）。
tower = { workspace = true }
# test-support：handler 单测经 runctx::test_support::app_ctx + scope 注入 AppCtx tenant（仅自测，不进生产构建）。
runctx = { path = "../runctx", features = ["test-support"] }
# admin 读路由 finalize 测试经 httpserve test-util 的 typed plaintext exit 取回 Router 做 oneshot；
# 生产构建无此 feature ⇒ 该入口编译期不存在（ADR-009 §6 Soft→Medium）。
httpserve = { path = "../httpserve", features = ["test-util"] }
authn = { path = "../authn", features = ["test-support"] }
trybuild = { workspace = true }
testkit = { path = "../testkit" }
