[package]
name = "securederive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# 字段级脱敏 derive（#[derive(Redact)]，#1360）的 proc-macro 实现。
# 编译期纯工具：从 `#[redact(...)]` 字段策略派生 `Redact` + 安全 `Debug` impl，收口到
# `secure` 的 `redact_struct` 公开 funnel（`Redacted::new` 仍 pub(crate) 封闭，外部不可伪造安全值）。
# 不依赖 `secure` crate——只生成 `::secure::…` 绝对路径 token（无编译环；secure 内自用经
# `extern crate self as secure` 解析）。intra-base DAG rank 低于 secure（layers.rs BASIS_CRATES）。
[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# expand() 直测（覆盖 token 生成 + fail-closed 错误分支）：解析 DeriveInput → 断言展开/报错。
syn = { workspace = true }
# 端到端 compile-fail golden（未标注字段 / secret+show 误标 / 未知 mode → 编译错误，Hard）。
trybuild = { workspace = true }

[lints]
workspace = true
