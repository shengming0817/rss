[package]
name = "runtimeexec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
test-support = ["eventexec/internal-test-support", "tokio/sync"]

[dependencies]
eventing.workspace = true
rss-platform.workspace = true
anyhow = { workspace = true }
assembly-schema = { path = "../assembly-schema" }
bootstrap = { path = "../bootstrap" }
diport = { path = "../diport" }
eventexec = { path = "../eventexec" }
listenerlifecycle = { path = "../listenerlifecycle" }
primitives = { path = "../primitives" }
runtimeinventorymint = { path = "../runtimeinventorymint" }
rss-redact.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }

[dev-dependencies]
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
static_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "net"] }
tracing-subscriber = { workspace = true, features = ["json"] }
trybuild = { workspace = true }
