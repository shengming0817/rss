[package]
name = "rss-projection-postgres"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
readme = "README.md"
description = "PostgreSQL ordered journals and atomic projection checkpoints"
categories = ["asynchronous", "database"]
keywords = ["projection", "postgres", "checkpoint"]
publish = ["crates-io"]

[dependencies]
thiserror.workspace = true
rss-projection.workspace = true
rss-request-context.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
uuid = { workspace = true, features = ["v4"] }
futures = { workspace = true, features = ["std"] }

[features]
default = []
integration = []

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-util.workspace = true

[lints]
workspace = true
