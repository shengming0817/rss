[package]
name = "workspacefacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# 暴露 synthetic cargo metadata JSON builder，供 façade 自测与 xtask 消费方 anti-vacuity 夹具单源。
test-support = []

[dependencies]
guppy = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_path_to_error = { workspace = true }
# Required：解析同一份 metadata JSON 的 raw dependency declarations（Guppy PackageLink 会
# 折叠同 from→to 的多 rename / 多 target 声明，见 guppy graph/build.rs PackageLinkImpl::new）。
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
workspacefacts = { path = ".", features = ["test-support"] }

[lints]
workspace = true
