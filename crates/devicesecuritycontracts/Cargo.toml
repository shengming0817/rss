[package]
name = "rss-device-security-contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license-file = "../../LICENSE"
repository.workspace = true
readme = "README.md"
description = "Draft device-security contract DTOs and schema metadata for RSS candidates"
categories = ["data-structures", "development-tools"]
keywords = ["device-security", "contracts", "schema", "dto", "rss"]

[features]
default = []

[dependencies]
rss-contract.workspace = true
serde = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
regress = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
