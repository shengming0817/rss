[package]
name = "authn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# test-support：暴露 `test_support::principal` 供**下游域 crate**（如 identity）单测构造 `Principal`
# （authz 纯逻辑入参）。仅 test/dev 构建启用，生产不编译——VerifiedJwt 派生 seal 与
# AUTHN-VERIFIEDJWT-SEAL-01 在生产构建中保持不可表达。与既有 runctx `test-support` 同范式。
test-support = []

[dependencies]
vocab = { path = "../vocab" }
ids = { path = "../ids" }
secure = { path = "../secure" }
support = { path = "../support" }
runctx = { path = "../runctx" }
consistency = { path = "../consistency" }
primitives = { path = "../primitives" }
# verify→mint bridge：经 diport::Pdp 验签后 seal VerifiedJwt / VerifiedServiceToken（#1158, ADR-006）。
diport = { path = "../diport" }
thiserror = { workspace = true }
# SessionId::generate —— UUID v4 随机会话 id（RW-G1）。
uuid = { workspace = true, features = ["v4"] }
# JWT / service-token 结构化解码（base64url payload + JSON claims）——不验签（验签延后 verifier DI port）。
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# 表驱动单测（row_visibility / Jwt::parse 等）。
rstest = { workspace = true }
# test-support：单测经 runctx::test_support::app_ctx 构造 AppCtx（仅 authn 自测启用，不进生产构建）。
runctx = { path = "../runctx", features = ["test-support"] }
# verify→mint bridge 单测经 #[tokio::test] 驱动 async verify（stub Pdp 验证 verify→seal 路径）。
tokio = { workspace = true, features = ["macros", "rt"] }
# 跨 crate 漏斗证明：外部 crate 不可 seal / 构造 VerifiedJwt（compile-fail UI 锁）。
trybuild = { workspace = true }
