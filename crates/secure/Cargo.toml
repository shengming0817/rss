[package]
name = "secure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
thiserror = { workspace = true }
# 密码哈希原语（secure::password，#1188）：argon2id PHC 哈希 + 内建 constant-time 验签 + 随机盐（OsRng）。
argon2 = { workspace = true }
# 字段级脱敏 derive（#[derive(Redact)]，#1360）：intra-base DAG 前向边 secure → securederive（layers.rs）。
# proc-macro 生成 `::secure::…` 路径，secure 内自用经 lib.rs 的 `extern crate self as secure` 解析。
securederive = { path = "../securederive" }
# SHA-256：RedactionMode::Hash 的确定性不可逆 PII 关联摘要（#1360）+ secure::refresh token 不可逆持久化
# 查找键（#1325）。default-features=false（无 std oid 等额外面）；与 password(argon2) / authn(hmac) 同源。
sha2 = { workspace = true }
# secure::refresh（#1325）：base64url 编码不透明 secret。
base64 = { workspace = true }
# PasswordHash PHC 字符串 drop 时清零堆内存（纵深防御，避免哈希物料残留进程内存）。
zeroize = { workspace = true }
# 解密产物明文封装（secure::aead::Plaintext，#1469）：SecretSlice<u8> 承载 ADR-011 D5 no-decrypt-in-debug
# —— Debug=[REDACTED] + Drop-zeroize，明文永不可 {:?} 渲染（FIELDPROT-NODBG-DECRYPT-01）。
secrecy = { workspace = true }
# AAD tenant 坐标收敛为已校验租户 ID，避免 ProtectionContext 接受裸 tenant 字符串。
vocab = { path = "../vocab" }

[dev-dependencies]
# 表驱动单测（脱敏模式 / key 判敏感 / URL 凭据剥离参数化，#1360）。
rstest = { workspace = true }
# DerivedAad 类型墙 compile-fail 回归锁（#1469）：open(&env, env.aad()) 回灌 stored AAD 须编译失败
# （&ProtectionAad ≠ &DerivedAad），承载 FIELDPROT-AAD-DERIVE-FROM-CTX-01 的 synthetic red case。
trybuild = { workspace = true }

[lints]
workspace = true
