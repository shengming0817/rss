[package]
name = "secure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
test-support = []

[dependencies]
rss-request-context.workspace = true
thiserror = { workspace = true }
vocab = { path = "../vocab" }
# 密码哈希原语（secure::password，#1188）：argon2id PHC 哈希 + constant-time digest 比较 + 有界 KDF 验签 + 随机盐（OsRng）。
argon2 = { workspace = true }
unicode-normalization = { workspace = true }
# 字段级脱敏 derive（#[derive(Redact)]，#1360）：intra-base DAG 前向边 secure → securederive（layers.rs）。
# proc-macro 生成 `::secure::…` 路径，secure 内自用经 lib.rs 的 `extern crate self as secure` 解析。
securederive = { path = "../securederive" }
# SHA-256：redaction HMAC 关联令牌 + secure::refresh token 不可逆持久化查找键（#1325）。
# default-features=false（无 std oid 等额外面）；与 password(argon2) / authn(hmac) 同源。
sha2 = { workspace = true }
# RedactField 白名单覆盖：UUID / 时间戳这类可观测标量需要稳定文本视图供 hash/last4 等读取值 mode 使用（#1409）。
uuid = { workspace = true }
time = { workspace = true }
# 生产 transport endpoint typed funnel：用 canonical URL parser 校验 scheme/host，防手写 authority split
# 被 userinfo 伪装 host 绕过（同 adapters/otel::OtelEndpoint 模式）。
url = { workspace = true }
# secure::refresh（#1325）：base64url 编码不透明 secret。
base64 = { workspace = true }
# HMAC-SHA256 子密钥派生 + 盲索引计算（secure::blind_index，#1478）。
# ref: RustCrypto/MACs hmac/README.md@master（Hmac<Sha256> new_from_slice→update→finalize）
hmac = { workspace = true }
# 常数时间等值比较（BlindIndexValue::ct_eq，防时序侧信道；FIELDPROT-BLINDIDX-EQUALITYONLY-01）。
# ref: dalek-cryptography/subtle src/lib.rs@main
subtle = { workspace = true }
# drop 时自动清零堆内存（零信任纵深防御）：BlindIndexKey / SubKey（#1478，类型层 Hard，#[derive(ZeroizeOnDrop)]）
# + PasswordHash PHC 字符串（#317，避免哈希物料残留进程内存）。zeroize_derive feature 启用 derive proc-macro；
# workspace base 已开 alloc。同 crates/diport/Cargo.toml:42 范式。
zeroize = { workspace = true, features = ["zeroize_derive"] }
# 解密产物明文封装（secure::aead::Plaintext，#1469）：SecretSlice<u8> 承载 ADR-011 D5 no-decrypt-in-debug
# —— Debug=[REDACTED] + Drop-zeroize，明文永不可 {:?} 渲染（FIELDPROT-NODBG-DECRYPT-01）。
secrecy = { workspace = true }

[dev-dependencies]
# 表驱动单测（脱敏模式 / key 判敏感 / URL 凭据剥离参数化，#1360）。
rstest = { workspace = true }
# DerivedAad 类型墙 compile-fail 回归锁（#1469）：open(&env, env.aad()) 回灌 stored AAD 须编译失败
# （&ProtectionAad ≠ &DerivedAad），承载 FIELDPROT-AAD-DERIVE-FROM-CTX-01 的 synthetic red case。
trybuild = { workspace = true }

[lints]
workspace = true
