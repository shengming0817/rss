[package]
name = "diport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
test-support = []
dlq-test-support = []

# diport 与其它 crate 一致继承 workspace lints（含 `unsafe_code = "forbid"`）。
# 实测（PR-diport spike）：dynosaur 0.3 宏生成的 `unsafe transmute` 经 def-site hygiene
# **不触发** consumer crate 的 `unsafe_code` lint——即便 `forbid` 也编译通过（anti-vacuity
# 已验证 forbid 对本 crate 手写 unsafe 仍生效）。故 ADR-003 §3 的 forbid→deny 例外**不需要**，
# diport 无 unsafe carve-out。dynosaur→diport 收敛仍由 deny.toml wrapper 守（DI port 集中 +
# 单一 dyn-dispatch 依赖点），与 unsafe 无关。
[lints]
workspace = true

[dependencies]
eventing.workspace = true
rss-contract.workspace = true
rss-request-context.workspace = true
sagaauthmint = { path = "../sagaauthmint" }
dlqauthmint = { path = "../dlqauthmint" }
# DI port 的 async dyn 派发：native AFIT + dynosaur 宏生成 dyn-compatible wrapper（ADR-003）。
dynosaur = { workspace = true }
# Send-bounded async DI port：trait_variant 生成 Send 变体，dynosaur bridge(dyn) 据此生成
# Send 的 Dyn wrapper（ShutdownStack 经 tokio::spawn 做 panic 隔离需要 Send future）。
trait-variant = { workspace = true }
thiserror = { workspace = true }
# SecretMaterial / SecretCoordinate 的字段级脱敏 Debug：#[derive(secure::Redact)]（#1360）。
# secure 是基础层 L0（人人可依赖）；DiPort 依赖基础合规（layers.rs DiPort=>Basis）。
secure = { path = "../secure" }
# AuditEvent.tenant_id: Option<vocab::TenantId>（基础层强类型租户标识；跨租户主体可为空）。DiPort 依赖基础合规。
vocab = { path = "../vocab" }
ids = { path = "../ids" }
# OutboxEmitter port 签名引 consistency::outbox::Entry（引擎类型）。DiPort 依赖引擎合规（layers.rs DiPort=>Basis|Engine）。
consistency = { path = "../consistency" }
# KeyProvider 的 KeyName/KeyVersion/KeyRef 常数时间 key-id 匹配复用 primitives::crypto::constant_time_eq
# （防 timing oracle，ADR-011 §D3）。DiPort 依赖引擎合规（layers.rs DiPort=>Basis|Engine）。
primitives = { path = "../primitives" }
# SagaDurableStore port 的 SagaId(uuid::Uuid)：saga 实例标识下沉 diport（eventexec::SagaId re-export 本类型）。
uuid = { workspace = true }
# PKI URI SANs require a standards-aware absolute-URI parser rather than delimiter-only checks.
url = { workspace = true }
# Subscriber port 返回 MessageStream = Pin<Box<dyn Stream + Send>>（futures::Stream）。
futures = { workspace = true }
# Service-token replay deadlines are typed, absolute Tokio deadlines so every adapter operation
# shares one cancellation boundary instead of minting per-stage relative timeouts. `rt` exposes
# JoinError for the payload-free ShutdownError task-failure classifier.
tokio = { workspace = true, features = ["rt", "time", "sync"] }
# DLX archive provider observations carry a fixed SHA-256 integrity checksum.
sha2 = { workspace = true }
# Subscriber::subscribe 取消信号：tokio_util::sync::CancellationToken（与 bootstrap shutdown 同源）。
tokio-util = { workspace = true }

# SecretMaterial ZeroizeOnDrop：secret 材料 drop 时自动清零（零信任，类型层 Hard）。
# `zeroize_derive` feature 启用 proc-macro derive（ZeroizeOnDrop）；`alloc` 已在 workspace 基础上开。
zeroize = { workspace = true, features = ["zeroize_derive"] }

[dev-dependencies]
diport = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
trybuild = { workspace = true }
# 验证 mockall mock 可装入 dynosaur DynX wrapper（#1049 待决项 PORT-SHAPE：mock × native-AFIT/Send 变体）。
mockall = { workspace = true }
