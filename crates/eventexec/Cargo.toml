[package]
name = "eventexec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Subscriber DI port + Message 原语迁 diport（#1075）；本 crate 消费 diport::Message（HandlerFn/ConsumerFn 入参）。
diport = { path = "../diport" }
futures = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# run_dispatch 对 Nack 丢弃 / Requeue 耗尽做结构化日志（防静默消息丢失，observability.md §日志）。
tracing = { workspace = true }
# outbox relay/sweeper 引擎接缝（OutboxSource/OutboxRelay/OutboxSweeper/Entry/Disposition）。
consistency = { path = "../consistency" }
# WorkerHealth 三态聚合（HealthStatus/ProbeName）。
primitives = { path = "../primitives" }
# relay_loop / sweeper_loop interval 计时 + RelayWorker/SweeperWorker Mutex<JoinHandle>。
tokio = { workspace = true, features = ["time", "sync"] }
# CancellationToken（relay_loop/sweeper_loop 取消信号）。
tokio-util = { workspace = true }

[dev-dependencies]
# test-util feature 提供 tokio::time::advance/pause（start_paused=true 控 interval tick）。
tokio = { workspace = true, features = ["test-util"] }
