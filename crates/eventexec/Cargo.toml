[package]
name = "eventexec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
l2-test-support = []
internal-test-support = []

[lints]
workspace = true

[dependencies]
rss-transactional-messaging.workspace = true
rss-contract.workspace = true
rss-request-context.workspace = true
rss-diag-context = { path = "../diagctx", version = "0.1.0" }
# 非消息 DLQ / saga 能力仍由 diport 提供；消息 runtime 直接消费 transactional messaging native ports。
diport = { path = "../diport" }
# reconcile harness 经 vocab::Epoch 传递 lease epoch（Context::epoch / LeaseToken.epoch 同源，#1123）。
vocab = { path = "../vocab" }
futures = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# run_dispatch 对 Nack 丢弃 / Requeue 耗尽做结构化日志（防静默消息丢失，`crates/observ`、`rss_redact::redact_error` 与 typed metric enums）。
tracing = { workspace = true }
# 非消息 saga / projection / reconcile 引擎接缝。
consistency = { path = "../consistency" }
# Keyed command idempotency aliases are derived inside the runtime boundary; raw business keys
# never cross into persistence providers.
rss-redact.workspace = true
rss-data-protection.workspace = true
# command consumer 侧 typed decode（serde_json::from_slice::<R>）——runtime 职责归位 eventexec（#1124）；
# producer 侧 command::emit_async 仍收已编码 Vec<u8>（编码在组合根 bridge），emit 路径不经 eventexec serde。
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
# tenant authority token uses compact base64url segments.
base64 = { workspace = true }
# WorkerHealth 三态聚合（HealthStatus/ProbeName）。
primitives = { path = "../primitives" }
# consumer Fresh 路径还原 producer 透传的 W3C traceparent（#1224，handle_fresh build_consume_span）；
# 只依赖此 helper、不直接 import otel（otel 收口在 tracewire/adapters-otel）。
tracewire = { package = "rss-trace-context", path = "../tracewire", version = "0.1.0" }
# 非消息 eventexec algorithms 的 Tokio execution support。
tokio = { workspace = true, features = ["rt", "time", "sync"] }
# CancellationToken（非消息 runtime 取消信号）。
tokio-util = { workspace = true }
# retention/projection/reconcile 等非 TransactionalMessaging canonical family 仍经 metrics facade 发射。硬依赖、非 optional——idiomatic
# metrics facade 范式：库无条件发射，executable（组合根）选 recorder（装 PromExporter 才导出，否则 facade
# 自身 no-op）；不留 public no-op metrics 让生产静默降级（#1209 review F3 fail-closed）。同 tracing 层级。
metrics = { workspace = true }
sha2 = { workspace = true }
# Canonical archive scratch bytes are zeroized if encoding unwinds before ownership moves into
# rss_data_protection::Plaintext; no capsule-derived String/Vec may outlive this funnel.
zeroize = { workspace = true }

[dev-dependencies]
diport = { path = "../diport", features = ["test-support", "dlq-test-support"] }
testkit = { path = "../testkit" }
# test-util feature 提供 tokio::time::advance/pause（start_paused=true 控 interval tick）。
tokio = { workspace = true, features = ["test-util"] }
# #2054：OTel 测试脚手架移入 publish=false、dev-only carrier，不进入候选 feature/API 图。
tracewiretest = { path = "../tracewiretest" }
# TC5 T007.5 tracing 字段断言：捕获 error 级事件字段名/值（CapLayer subscriber）。
tracing-subscriber = { workspace = true }
# RECONCILE-TENANCY-REQ-01：production 三参数签名为 Hard owner；UI 以缺 trigger 作 Medium 代表性误用。
trybuild = { workspace = true }
# 非 TransactionalMessaging family 的 metrics facade 测试（with_local_recorder + render 断言）；同 adapters/prometheus 范式。
metrics-exporter-prometheus = { workspace = true }
