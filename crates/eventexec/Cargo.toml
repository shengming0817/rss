[package]
name = "eventexec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Subscriber DI port + Message 原语迁 diport（#1075）；本 crate 消费 diport::Message（HandlerFn/ConsumerFn 入参）。
diport = { path = "../diport" }
futures = { workspace = true }
thiserror = { workspace = true }
# 注：tokio-util（CancellationToken）随 EventSubscriber 迁 diport 后本 crate 不再使用，已移除。
uuid = { workspace = true, features = ["v4"] }
# run_dispatch 对 Nack 丢弃 / Requeue 耗尽做结构化日志（防静默消息丢失，observability.md §日志）。
tracing = { workspace = true }

[dev-dependencies]
# run_dispatch 异步单测 runtime（RW-G1 分发驱动）。
tokio = { workspace = true }
