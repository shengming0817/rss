[package]
name = "runctx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# 测试支撑：暴露 `test_support::app_ctx` 供下游 crate（如 authn）单测构造 `AppCtx`。
# 生产构建不启用（消费方仅经 `[dev-dependencies]` 开启）⇒ 测试 facet impl 不进生产构建。
# 伪造门（只有 authn 能 impl `PrincipalFacet` ⇒ 造 `AppCtx`）由 dylint `rss_principal_facet_impl_allowlist`
# 守（Medium，#1105）；本 feature 下 `test_support::app_ctx` 是 pub 构造旁路——只准 dev-dep 启用，由 xtask
# `layer-deps` 的 LAYER-DEPS-09 机器守（shipped 依赖表启用 `runctx/test-support` 即报，Medium）。
test-support = []

[dependencies]
# task_local! / LocalKey / TaskLocalFuture 均在 tokio core（rt feature；workspace 已含 rt-multi-thread）。
# runctx 刻意不依赖 tracing —— 可观测 ID 走 consumer 的 span，控制流值入 RequestCtx，二者在
# 依赖图上不可互通（ADR-002 §D1，Hard 边界）。同样不依赖 serde：RequestCtx 不可从 body 反序列化构造。
tokio = { workspace = true }
thiserror = { workspace = true }
# intra-base sanctioned 边（ADR-002 §D3）：AppCtx 的 tenant payload 收敛为具体 vocab::tenant::TenantId。
# base 层 DAG：vocab ◁ ids ◁ secure ◁ support ◁ runctx（docs/rules/architecture.md §分层）。
vocab = { path = "../vocab" }
# RequestCtx 的字段级 Debug 脱敏 derive（tenant + Arc<dyn PrincipalFacet> payload 均 `#[redact(sensitivity = internal)]`）。
secure = { path = "../secure" }

[dev-dependencies]
# 仅测试 fixture（tid helper）用：把 label 确定性映射成 canonical UUID 串再经 TenantId::parse 构造。
uuid = { workspace = true }
