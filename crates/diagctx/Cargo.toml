[package]
name = "rss-diag-context"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license-file = "../../LICENSE"
repository.workspace = true
readme = "README.md"
description = "Validated diagnostic correlation values with optional Tokio task-local propagation"
categories = ["asynchronous", "development-tools::debugging"]
keywords = ["diagnostics", "correlation", "context", "observability"]

[lints]
workspace = true

[dependencies]
# task_local! / LocalKey / TaskLocalFuture 均只需 Tokio `rt` feature。
# Diagnostic correlation is independent of request authorization and tracing/serde integrations.
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[features]
default = []
task-local = ["dep:tokio"]
