[package]
name = "rss-diag-context"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license-file = "../../LICENSE"
repository.workspace = true
readme = "README.md"
description = "Task-scoped diagnostic correlation context for Rust applications"
categories = ["asynchronous", "development-tools::debugging"]
keywords = ["diagnostics", "correlation", "context", "observability"]

[lints]
workspace = true

[dependencies]
# task_local! / LocalKey / TaskLocalFuture 均只需 Tokio `rt` feature。
# diagctx 刻意不依赖 vocab / tracing / serde：它只承载**诊断**信号（correlation），与 runctx（授权控制流值）
# 在 crate 图上物理隔离（ADR-002 §D1-bis）——「诊断信道被误读为授权源」即一处可被 review 一眼抓的跨 import。
tokio = { version = "1", default-features = false, features = ["rt"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[features]
default = []
