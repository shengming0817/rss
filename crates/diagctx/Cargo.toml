[package]
name = "diagctx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# task_local! / LocalKey / TaskLocalFuture 均在 tokio core（rt feature；workspace 已含 rt-multi-thread）。
# diagctx 刻意不依赖 vocab / tracing / serde：它只承载**诊断**信号（correlation），与 runctx（授权控制流值）
# 在 crate 图上物理隔离（ADR-002 §D1-bis）——「诊断信道被误读为授权源」即一处可被 review 一眼抓的跨 import。
tokio = { workspace = true }
thiserror = { workspace = true }
