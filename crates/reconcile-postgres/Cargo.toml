[package]
name = "rss-reconcile-postgres"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
readme = "README.md"
description = "PostgreSQL durable reconciliation and fenced transactions"
categories = ["asynchronous", "database"]
keywords = ["reconcile", "postgres", "worker"]
publish = ["crates-io"]

[dependencies]
thiserror.workspace = true
rss-reconcile.workspace = true
rss-request-context.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
uuid = { workspace = true, features = ["v4"] }
futures = { workspace = true, features = ["std"] }

rss-redact.workspace = true
rss-transactional-messaging = { workspace = true, optional = true }
rss-transactional-messaging-postgres = { workspace = true, optional = true }

[features]
default = []
integration = []
transactional-messaging = ["dep:rss-transactional-messaging", "dep:rss-transactional-messaging-postgres"]

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-util.workspace = true

[lints]
workspace = true
