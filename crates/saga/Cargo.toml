[package]
name = "rss-saga"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
readme = "README.md"
description = "Tenant-scoped durable Saga execution and recovery"
publish = ["crates-io"]
[features]
default = []
rss-runtime = ["dep:rss-runtime", "tokio/sync"]
[dependencies]
rss-contract.workspace = true
rss-redact.workspace = true
rss-request-context.workspace = true
rss-data-protection.workspace = true
rss-runtime = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
zeroize.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
futures = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros"] }
tokio-util.workspace = true
[dev-dependencies]
ring.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
anyhow.workspace = true
[lints]
workspace = true
