[package]
name = "rss-examples"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "rss-examples"

[lints]
workspace = true

[features]
default = []
diagnostic = ["dep:rss-diag-context"]
task-local = ["diagnostic", "rss-diag-context/task-local", "dep:tokio"]
trace = ["dep:rss-trace-context", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk"]
redact = ["dep:rss-redact"]
derive = ["redact", "rss-redact/derive"]
protection = ["dep:rss-data-protection", "dep:rss-request-context", "dep:ring"]
lifecycle = ["dep:rss-runtime", "dep:tokio", "dep:rss-request-context"]
core = ["dep:rss-transactional-messaging"]
memory = ["core", "dep:rss-request-context", "dep:rss-transactional-messaging-testkit", "dep:rss-transactional-messaging-runtime", "dep:tokio"]
producer = ["memory", "rss-transactional-messaging/producer", "rss-transactional-messaging-testkit/producer", "rss-transactional-messaging-runtime/producer", "dep:rss-contract", "dep:rss-request-context"]
consumer = ["memory", "rss-transactional-messaging/consumer", "rss-transactional-messaging-testkit/consumer", "rss-transactional-messaging-runtime/consumer", "dep:rss-contract", "dep:rss-request-context"]
providers = ["core", "rss-transactional-messaging/producer", "rss-transactional-messaging/consumer", "dep:rss-transactional-messaging-postgres", "dep:rss-transactional-messaging-amqp", "rss-transactional-messaging-runtime/producer", "rss-transactional-messaging-runtime/consumer", "dep:tokio", "dep:rss-contract", "dep:rss-request-context", "dep:serde", "dep:serde_json", "dep:sqlx"]
managed = ["providers", "dep:rss-runtime", "rss-transactional-messaging-postgres/rss-runtime", "rss-transactional-messaging-amqp/managed-runtime", "rss-transactional-messaging-runtime/managed-runtime"]
managed-worker = ["producer", "lifecycle", "rss-transactional-messaging-runtime/managed-runtime"]

outbox-writer = ["dep:sqlx", "dep:tokio", "dep:serde", "dep:serde_json", "dep:rss-request-context", "core", "rss-transactional-messaging/producer", "dep:rss-contract", "dep:rss-transactional-messaging-postgres"]
relay-only = ["core", "rss-transactional-messaging/producer"]

execution-pg = ["dep:sqlx", "dep:tokio", "dep:tokio-util", "dep:serde", "dep:serde_json", "dep:rss-request-context"]
reconcile-pg = ["execution-pg", "dep:rss-reconcile", "dep:rss-reconcile-postgres"]
device-command-pg = ["execution-pg", "dep:rss-device-command", "dep:rss-device-command-postgres", "dep:rss-contract", "dep:rss-transactional-messaging", "rss-transactional-messaging/producer", "rss-transactional-messaging/consumer", "dep:rss-transactional-messaging-postgres"]
projection-pg = ["execution-pg", "dep:rss-projection", "dep:rss-projection-postgres"]
saga-pg = ["execution-pg", "dep:rss-saga", "dep:rss-saga-postgres", "dep:rss-contract", "dep:rss-data-protection", "dep:ring", "dep:uuid"]

reconcile-messaging = ["reconcile-pg", "rss-reconcile-postgres/transactional-messaging", "dep:rss-transactional-messaging", "dep:rss-transactional-messaging-postgres"]
saga-runtime = ["saga-pg", "rss-saga/rss-runtime", "rss-saga-postgres/rss-runtime", "dep:rss-runtime"]

reconcile-core = ["dep:rss-reconcile", "dep:rss-request-context"]
device-command-core = ["dep:rss-device-command", "dep:rss-request-context"]
projection-core = ["dep:rss-projection", "dep:rss-request-context"]
saga-core = ["dep:rss-saga", "dep:rss-request-context", "dep:rss-contract"]

mqtt = ["dep:rss-mqtt", "dep:rss-request-context", "core", "rss-transactional-messaging/producer", "dep:rumqttc-v5-next", "dep:rustls", "dep:rustls-pki-types", "dep:tokio", "tokio/fs", "tokio/io-util", "dep:serde", "dep:serde_json", "dep:tracing-subscriber", "dep:rss-contract"]
mqtt-consumer = ["mqtt", "rss-mqtt/consumer"]
observation-core = ["dep:rss-observation", "dep:rss-contract"]
observation-pg = ["observation-core", "execution-pg", "dep:rss-observation-postgres"]
observation-projection = ["observation-pg", "rss-observation-postgres/projection", "dep:rss-projection"]
observation-handoff = ["observation-projection", "rss-observation-postgres/projection-postgres", "dep:rss-projection-postgres"]
ledger-core = ["dep:rss-ledger", "dep:rss-request-context"]
ledger-pg = ["ledger-core", "core", "execution-pg", "dep:rss-ledger-postgres"]
ledger-all = ["ledger-messaging", "rss-ledger-postgres/integration"]
ledger-messaging = ["ledger-pg", "rss-ledger-postgres/messaging", "dep:rss-transactional-messaging-postgres", "core", "rss-transactional-messaging/producer", "dep:rss-contract"]
recovery-core = ["dep:rss-transactional-messaging-recovery", "core", "dep:rss-request-context", "dep:tokio"]
recovery-pg = ["recovery-core", "execution-pg", "dep:rss-transactional-messaging-postgres", "rss-transactional-messaging-postgres/recovery", "dep:rss-data-protection", "dep:ring", "dep:rss-contract"]
recovery-s3 = ["recovery-core", "dep:rss-transactional-messaging-recovery-s3", "dep:aws-sdk-s3", "dep:aws-smithy-http-client", "dep:rss-data-protection", "dep:ring", "dep:serde", "dep:serde_json"]
recovery-archive = ["recovery-pg", "recovery-s3"]
recovery-managed = ["recovery-archive", "rss-transactional-messaging-postgres/rss-runtime"]

[dependencies]
anyhow.workspace = true
rss-transactional-messaging-postgres = { workspace = true, optional = true }
rss-transactional-messaging-amqp = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"], optional = true }
rss-diag-context = { path = "../diagctx", version = "0.1.0", default-features = false, optional = true }
rss-trace-context = { path = "../tracewire", version = "0.1.0", optional = true }
rss-redact = { path = "../redact", version = "0.1.0", default-features = false, optional = true }
rss-data-protection = { workspace = true, optional = true }
rss-request-context = { workspace = true, optional = true }
rss-contract = { workspace = true, optional = true }
rss-runtime = { workspace = true, optional = true }
rss-transactional-messaging = { path = "../transactional-messaging", version = "0.2.0", default-features = false, optional = true }
rss-transactional-messaging-runtime = { path = "../transactional-messaging-runtime", version = "0.1.0", default-features = false, optional = true }
rss-transactional-messaging-testkit = { path = "../transactional-messaging-testkit", version = "0.1.0", default-features = false, optional = true }
ring = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { workspace = true, optional = true }


tokio-util = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
rss-reconcile = { workspace = true, optional = true }
rss-reconcile-postgres = { workspace = true, optional = true }
rss-device-command = { workspace = true, optional = true }
rss-device-command-postgres = { workspace = true, optional = true }
rss-projection = { workspace = true, optional = true }
rss-projection-postgres = { workspace = true, optional = true }
rss-saga = { workspace = true, optional = true }
rss-saga-postgres = { workspace = true, optional = true }

rss-mqtt = { workspace = true, optional = true }
rss-observation = { workspace = true, optional = true }
rss-observation-postgres = { workspace = true, optional = true }
rss-ledger = { workspace = true, optional = true }
rss-ledger-postgres = { workspace = true, optional = true }
rss-transactional-messaging-recovery = { workspace = true, optional = true }
rss-transactional-messaging-recovery-s3 = { workspace = true, optional = true }
rumqttc-v5-next = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }

[[bin]]
name = "providers"
path = "src/bin/providers.rs"
required-features = ["providers"]

[[bin]]
name = "reconcile"
path = "src/bin/reconcile.rs"
required-features = ["reconcile-pg"]

[[bin]]
name = "device-command"
path = "src/bin/device-command.rs"
required-features = ["device-command-pg"]

[[bin]]
name = "projection"
path = "src/bin/projection.rs"
required-features = ["projection-pg"]

[[bin]]
name = "saga"
path = "src/bin/saga.rs"
required-features = ["saga-pg"]

[[bin]]
name = "outbox-writer"
path = "src/bin/outbox-writer.rs"
required-features = ["outbox-writer"]

[[bin]]
name = "mqtt"
path = "src/bin/mqtt.rs"
required-features = ["mqtt"]

[[bin]]
name = "observation"
path = "src/bin/observation.rs"
required-features = ["observation-handoff"]

[[bin]]
name = "observation-install"
path = "src/bin/observation-install.rs"
required-features = ["observation-handoff"]

[[bin]]
name = "ledger"
path = "src/bin/ledger.rs"
required-features = ["ledger-pg"]

[[bin]]
name = "ledger-install"
path = "src/bin/ledger-install.rs"
required-features = ["ledger-pg"]

[[bin]]
name = "recovery"
path = "src/bin/recovery.rs"
required-features = ["recovery-pg"]

[[bin]]
name = "recovery-install"
path = "src/bin/recovery-install.rs"
required-features = ["recovery-pg"]

[[bin]]
name = "recovery-archive"
path = "src/bin/recovery-archive.rs"
required-features = ["recovery-archive"]
