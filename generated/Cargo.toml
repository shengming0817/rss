[package]
name = "generated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
test-support = []

[dependencies]
# typify 派生码用全限定 ::serde::{Serialize,Deserialize}（derive feature）。所有 codegen 机器
# （typify/schemars/syn）留在 xtask，见 docs/rules/architecture.md §83/§126。
serde = { workspace = true }
# typify 把 schema `{"type":"string","format":"uuid"}` 派生为 `::uuid::Uuid`（如 identity.session-created
# 的 subject，#1277 F1：wire UUID 字段类型层强制，非 UUID 在 decode 即失败）。
uuid = { workspace = true, features = ["serde"] }
# event glue 的 `CONTRACT: ContractBinding` 常量绑定（#1193；domain + id 同源类型化）。基础层 vocab，
# allows(Generated, Basis)=true（layers.rs）已授权；不引入循环。
vocab = { path = "../crates/vocab" }
assembly-schema = { path = "../crates/assembly-schema" }
requestidmint = { path = "../crates/requestidmint" }
# generated DTO 的 Debug 由 contract schema 字段级 x-pii/x-redaction 派生为 secure::Redact（#1358）。
secure = { path = "../crates/secure" }
# typify emits regress-backed parsers for contract schema string patterns.
regress = { workspace = true }
# HTTP response envelopes implement Axum's native IntoResponse/Result seam directly; status remains
# owned by generated HttpResponseBinding rather than a domain-side mapping table.
axum = { workspace = true }
# Declared-response factories materialize validator-approved fixed envelopes without exposing
# mutable DTO fields at the handler seam.
serde_json = { workspace = true }

[dev-dependencies]
# contract roundtrip 回归测试用（仅 tests/，不进 generated 产物 / 公开 API；F7）。
jsonschema = { workspace = true }
trybuild = { workspace = true }
assembly-schema = { path = "../crates/assembly-schema", features = ["test-support"] }

[[test]]
name = "runtime_inventory_construction_trybuild"
path = "tests/runtime_inventory_construction.rs"

[lints]
workspace = true
