[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rss-request-context.workspace = true
assembly-schema = { path = "../crates/assembly-schema" }
# consistency: dotted-id 文法单源（#1126）——R7 IdentSyntax `is_dotted_id` 反向 delegate
# `consistency::Topic::parse`，消除 contract 声明面与运行期构造面的镜像漂移。xtask 是组合根
# （Layer::Root），依赖 Engine 层 consistency 合法（layers::allows(Root, Engine)）。
consistency = { path = "../crates/consistency" }
rss-contract.workspace = true
observ = { path = "../crates/observ" }
vocab = { path = "../crates/vocab" }
workspacefacts = { path = "../crates/workspacefacts" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
syn = { workspace = true, features = ["visit"] }
proc-macro2 = { workspace = true }
quote = { workspace = true }
rustix = { workspace = true }
public-api = { workspace = true }
rustdoc-types = { workspace = true }
semver = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
glob = { workspace = true }

[dev-dependencies]
assembly-schema = { path = "../crates/assembly-schema", features = ["test-support"] }
rstest = { workspace = true }
workspacefacts = { path = "../crates/workspacefacts", features = ["test-support"] }

[lints]
workspace = true
