[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# consistency: dotted-id 文法单源（#1126）——R7 IdentSyntax `is_dotted_id` 反向 delegate
# `consistency::Topic::parse`，消除 contract 声明面与运行期构造面的镜像漂移。xtask 是组合根
# （Layer::Root），依赖 Engine 层 consistency 合法（layers::allows(Root, Engine)）。
consistency = { path = "../crates/consistency" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
typify = { workspace = true }
schemars = { workspace = true }
prettyplease = { workspace = true }
syn = { workspace = true, features = ["visit"] }   # visit: CMD-FUNNEL-01 守卫 AST 扫描子进程构造点
proc-macro2 = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
