[package]
name = "rss-trace-context-package-proof"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
release_package = { package = "__RELEASE_PACKAGE__", version = "=__RELEASE_VERSION__", registry = "local" }
serde_json = "1"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
