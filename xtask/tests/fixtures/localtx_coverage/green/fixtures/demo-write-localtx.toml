schemaVersion = 1
id = "demo-write-localtx"
contractId = "demo.write"
txModel = "tenant-scoped-uow"
spec = "journeys/demo-write-localtx-journey.toml"
runner = "journeys/tests/localtx_validation_journey.rs"
marker = "DEMO_WRITE"

[[cases]]
id = "demo-write-happy"
scenario = "happy"
httpStatus = 200
errorCode = "none"
retryable = false
attempts = 1
commits = 1
redactSentinels = ["demo-secret"]

[[cases]]
id = "demo-write-auth-failure"
scenario = "auth-failure"
httpStatus = 401
errorCode = "unauthorized"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["demo-session"]

[[cases]]
id = "demo-write-validation-failure"
scenario = "validation-failure"
httpStatus = 400
errorCode = "invalid-request"
retryable = false
attempts = 0
commits = 0
redactSentinels = ["demo-invalid"]

[[cases]]
id = "demo-write-contention"
scenario = "contention"
httpStatus = 200
errorCode = "none"
retryable = false
attempts = 2
commits = 2
redactSentinels = ["demo-contention"]
