name = "runtime"
profile = "demo"
domains = ["identity"]
topology = "durable-shared"
frameworkContracts = []

[[listeners]]
kind = "primary"
domains = ["identity"]

[[diportProviders]]
id = "settings-key-provider"
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "settings"
lifecycle = "active"
durability = "persistent"
purpose = "SECRET_BAIT must never enter generated Rust"
outputs = ["resources"]

[[diportProviders]]
id = "listener-rate-limiter"
port = "diport::RateLimiter"
provider = "ratelimit::GovernorLimiter"
providerCrate = "ratelimit"
consumer = "httpserve"
lifecycle = "active"
durability = "ephemeral-memory"
purpose = "active-empty-output"
outputs = []

[[diportProviders]]
id = "service-token-replay-store"
port = "diport::ServiceTokenReplayStore"
provider = "postgres::PgServiceTokenReplayStore"
providerCrate = "postgres"
consumer = "oidc"
lifecycle = "active"
durability = "persistent"
scope = "cluster-global"
failurePosture = "fail-closed"
purpose = "cluster-global fail-closed replay protection"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "dlx-archive-key-provider"
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "same-constructor-distinct-role"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "dlx-hot-key-provider"
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "same-constructor-distinct-hot-role"
outputs = ["probes", "resources", "workers"]
