schemaVersion = 1
[[assemblies]]
name = "demo"
lifecycle = "supported"
[assemblies.binary]
package = "demo"
target = "demo-server"
[assemblies.image]
dockerfile = "Dockerfile"
target = "demo-runtime"
[assemblies.configSchema]
kind = "json-schema"
path = "assemblies/demo/config.schema.json"
[assemblies.healthInventory]
owner = "runtimeexec"
listener = "health"
[assemblies.journey]
kind = "cargo-test"
package = "journeys"
target = "demo_runtime"
test = "demo_is_ready"

[assemblies.deployment.runtimePlan]
path = "assemblies/demo/runtime-plan.json"
profile = "demo"

[[assemblies.deployment.workloads]]
name = "demo"
image = "ghcr.io/gocell/rss-demo@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
[assemblies.deployment.workloads.identity]
name = "demo"
serviceAccount = "demo"
[assemblies.deployment.workloads.resources.requests]
cpu = "100m"
memory = "128Mi"
[assemblies.deployment.workloads.resources.limits]
cpu = "1"
memory = "256Mi"
[[assemblies.deployment.workloads.probes]]
kind = "readiness"
port = 8081

[[assemblies.deployment.services]]
name = "demo"
workload = "demo"
[[assemblies.deployment.services.ports]]
name = "health"
port = 8081
exposure = "serviceExposed"

[[assemblies]]
name = "sourcecheck"
lifecycle = "compile-only"
reason = "no deployable composition root"
