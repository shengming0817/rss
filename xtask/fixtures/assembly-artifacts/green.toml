schemaVersion = 2
[[assemblies]]
name = "demo"
lifecycle = "supported"
[assemblies.binary]
package = "demo"
target = "demo-server"
[assemblies.image]
dockerfile = "Dockerfile"
target = "demo-runtime"
[assemblies.configSchema]
kind = "json-schema"
path = "assemblies/demo/config.schema.json"
[assemblies.healthInventory]
owner = "runtimeexec"
listener = "health"
[assemblies.journey]
kind = "cargo-test"
package = "journeys"
target = "demo_runtime"
test = "demo_is_ready"

[[assemblies]]
name = "sourcecheck"
lifecycle = "compile-only"
reason = "no deployable composition root"
