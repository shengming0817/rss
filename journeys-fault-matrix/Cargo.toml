[package]
name = "journeys-fault-matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]

[dev-dependencies]
amqp = { path = "../adapters/amqp" }
consistency = { path = "../crates/consistency" }
deadpool-redis = { workspace = true }
diport = { path = "../crates/diport", features = ["test-support"] }
eventexec = { path = "../crates/eventexec", features = ["test-support"] }
generated = { path = "../generated" }
postgres = { path = "../adapters/postgres", features = [
    "domain-audit",
    "domain-identity",
    "domain-settings",
    "fault-matrix-test-support",
] }
redis-adapter = { path = "../adapters/redis", features = [
    "backend",
    "fault-matrix-test-support",
] }
secure = { path = "../crates/secure" }
testkit = { path = "../crates/testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vocab = { path = "../crates/vocab" }

[features]
integration = ["testkit/containers", "amqp/integration", "redis-adapter/integration"]

# RemoteOnly catalog Test targets：Cargo `[[test]] required-features = ["integration"]`
# 是 eligibility 唯一 owner（INTEGRATION-SHARD-ELIGIBILITY-01）。
[[test]]
name = "consistency_fault_matrix_journey"
path = "tests/consistency_fault_matrix_journey.rs"
required-features = ["integration"]

[[test]]
name = "l2_dr_recovery_journey"
path = "tests/l2_dr_recovery_journey.rs"
required-features = ["integration"]

[[test]]
name = "saga_fault_recovery"
path = "tests/saga_fault_recovery.rs"
required-features = ["integration"]
