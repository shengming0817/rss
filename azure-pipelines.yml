# Narrow Azure build-validation carrier for #1815. The typed xtask job owns the
# LocalOnly inventory and exact-set decision; this file must not duplicate either.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0

  - bash: |
      set -euo pipefail
      cargo install --locked --version 0.9.137 cargo-nextest
    displayName: Install pinned test runner

  - bash: |
      set -euo pipefail
      cargo run --locked -p xtask -- ci run --job ci-local-only --required-evidence-output "$(Agent.TempDirectory)/localonly-execution.json"
    displayName: Run typed LocalOnly evidence job

  - task: PublishPipelineArtifact@1
    displayName: Publish LocalOnly execution report
    condition: succeeded()
    inputs:
      targetPath: $(Agent.TempDirectory)/localonly-execution.json
      artifact: localonly-execution
