# Cargo 仓库级配置。
# build.target-dir：direct Cargo 与 `hack/cargo.sh` 共用的 worktree-local 默认值。
# linked worktree 各自解析到自己的 `.cache/cargo-target`，不共享可变构建产物。
# ref: https://doc.rust-lang.org/cargo/reference/config.html#buildtarget-dir
[build]
target-dir = ".cache/cargo-target"

# alias：让文档承诺的 `cargo xtask ...` 治理入口可直接执行（否则 cargo 报 `no such command: xtask`）。
# 单一事实源：xtask/src/main.rs 子命令 + contracts/README.md。
# ref: https://doc.rust-lang.org/cargo/reference/config.html#alias
[alias]
xtask = "run -p xtask --"
