# RSS 演示栈（#1134 验收 harness）：postgres + redis + minio + rabbitmq + vault + server。
#
# 用途：本地证明同一镜像的独立 migration Job + serving 进程、readyz、非 root 与只读 rootfs。
# 非生产编排（Vault 使用 dev TLS + in-memory storage；生产用 k8s + 私有 CA TLS + 真 OIDC/Vault，见 docs/ops/202606271438-003-container-image.md）。
# deploy/smoke.sh：必须显式选择 developer|release。stock compose 保持全 Local、不依赖 SPIRE；
# Remote placement + SPIFFE fixture 不全时默认失败，仅 developer + RSS_SMOKE_ALLOW_SKIP=1 可输出
# `NOT PRODUCTION EVIDENCE` 后跳过。release 全流程成功只输出 `RELEASE IMAGE ON DEMO INFRA EVIDENCE`：
# 它证明 release image 跑通本演示栈，不证明生产 TLS、secret manager 或正式基础设施配置。
#
# 跑：  docker compose -f deploy/docker-compose.yml up --build -d
# 验：  curl -fsS http://localhost:${RSS_HEALTH_HOST_PORT:-8083}/health/v1/readyz   # all-Local → 必经 smoke
# 关：  docker compose -f deploy/docker-compose.yml down -v
#
# .env.example 只承载非 Secret 配置；基础设施 bootstrap 文件和 serving bundle 均从
# deploy/demo-secrets 精确挂载，server 环境中不出现旧 Secret 变量。

x-minio-image: &minio-image minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

services:
  postgres:
    image: postgres:16-alpine # 演示用；生产钉 digest（see 部署文档 §复现性）。
    env_file: [.env.example, ./demo-secrets/postgres.env]
    # reason: migration Job 须在 PostgreSQL healthy 后执行；serving 仅在 Job 成功后启动并核验 ledger。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    # 仅演示期暴露，便于宿主 psql 排查；**绑 127.0.0.1**（仅本机可达，不上局域网）；生产 PG 不对外。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./demo-secrets/pg-writer-password:/run/rss-demo-secrets/pg-writer-password:ro
      - ./demo-secrets/pg-reader-password:/run/rss-demo-secrets/pg-reader-password:ro
      - ./demo-secrets/pg-dlx-archiver-password:/run/rss-demo-secrets/pg-dlx-archiver-password:ro
      - ./demo-secrets/pg-dlx-verifier-password:/run/rss-demo-secrets/pg-dlx-verifier-password:ro
      - ./demo-secrets/pg-dlx-purger-password:/run/rss-demo-secrets/pg-dlx-purger-password:ro

  redis:
    image: redis:7-alpine # 演示用；生产钉 digest 并启 TLS / AUTH。
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:3.13.6-management-alpine # 演示用；生产钉 digest 并启 TLS / AUTH。
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: *minio-image # 演示用固定 release+digest；生产用托管 S3 或启 TLS 的对象存储。
    env_file: [.env.example, ./demo-secrets/minio.env]
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data

  minio-init:
    image: *minio-image # 复用 server 镜像内置 mc，避免演示栈额外拉 minio/mc。
    env_file: [.env.example, ./demo-secrets/minio.env]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./demo-secrets/dlx-archive-access-key:/run/rss-demo-secrets/dlx-archive-access-key:ro
      - ./demo-secrets/dlx-archive-secret-key:/run/rss-demo-secrets/dlx-archive-secret-key:ro
    entrypoint:
      - sh
      - -ec
      - |
        mc alias set local "$${RSS_S3_ENDPOINT_URL}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${RSS_S3_BUCKET}"
        mc stat "local/$${RSS_S3_BUCKET}" >/dev/null
        mc mb --ignore-existing --with-lock "local/$${RSS_DLX_ARCHIVE_S3_BUCKET}"
        mc retention set --default COMPLIANCE 31d "local/$${RSS_DLX_ARCHIVE_S3_BUCKET}"
        printf '%s' '{"Rules":[{"ID":"rss-dlx-archive-expiration","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":32},"NoncurrentVersionExpiration":{"NoncurrentDays":32}},{"ID":"rss-dlx-archive-delete-markers","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"ExpiredObjectDeleteMarker":true}}]}' \
          | mc ilm rule import "local/$${RSS_DLX_ARCHIVE_S3_BUCKET}"
        policy_file="$$(mktemp)"
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketVersioning","s3:GetBucketObjectLockConfiguration","s3:GetLifecycleConfiguration"],"Resource":["arn:aws:s3:::'"$${RSS_DLX_ARCHIVE_S3_BUCKET}"'"]},{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:GetObjectVersion","s3:GetObjectAttributes","s3:GetObjectRetention"],"Resource":["arn:aws:s3:::'"$${RSS_DLX_ARCHIVE_S3_BUCKET}"'/*"]}]}' >"$${policy_file}"
        mc admin policy create local rss-dlx-archiver "$${policy_file}"
        rm -f "$${policy_file}"
        mc admin user add local \
          "$$(cat /run/rss-demo-secrets/dlx-archive-access-key)" \
          "$$(cat /run/rss-demo-secrets/dlx-archive-secret-key)"
        mc admin policy attach local rss-dlx-archiver \
          --user "$$(cat /run/rss-demo-secrets/dlx-archive-access-key)"

  vault:
    image: hashicorp/vault:1.17 # 演示用 dev-tls；生产钉 digest 并使用正式 Vault 集群。
    command:
      - sh
      - -ec
      - |
        mkdir -p /vault/tls
        vault server -dev -dev-tls \
          -dev-tls-cert-dir=/vault/tls \
          -dev-tls-san=vault \
          -dev-root-token-id="$$(cat /run/rss-demo-secrets/vault-root-token)" \
          -dev-listen-address=0.0.0.0:8200
    env_file: [.env.example]
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-tls:/vault/tls
      - ./demo-secrets/vault-root-token:/run/rss-demo-secrets/vault-root-token:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "VAULT_ADDR=https://127.0.0.1:8200 VAULT_CACERT=/vault/tls/vault-ca.pem VAULT_TOKEN=\"$$(cat /run/rss-demo-secrets/vault-root-token)\" vault status >/dev/null",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  vault-init:
    image: hashicorp/vault:1.17
    env_file: [.env.example]
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - vault-tls:/run/rss-demo-vault:ro
      - ./demo-secrets/vault-root-token:/run/rss-demo-secrets/vault-root-token:ro
      - ./demo-secrets/vault-dlx-hot-token:/run/rss-demo-secrets/vault-dlx-hot-token:ro
      - ./demo-secrets/vault-dlx-archive-token:/run/rss-demo-secrets/vault-dlx-archive-token:ro
    command:
      - sh
      - -ec
      - |
        export VAULT_ADDR="$${RSS_VAULT_ADDR}"
        export VAULT_CACERT="$${RSS_VAULT_CA_CERT_PEM_PATH}"
        export VAULT_TOKEN="$$(cat /run/rss-demo-secrets/vault-root-token)"
        vault secrets enable -path="$${RSS_VAULT_TRANSIT_MOUNT}" transit 2>/dev/null || true
        vault secrets enable -path=secret -version=2 kv 2>/dev/null || true
        vault kv put -mount=secret tenants/a/.rss-readiness value=ready >/dev/null
        vault write "$${RSS_VAULT_TRANSIT_MOUNT}/keys/$${RSS_SETTINGS_CONFIG_VALUE_KEY_NAME}" derived=true
        vault write "$${RSS_VAULT_TRANSIT_MOUNT}/keys/$${RSS_DLX_PAYLOAD_KEY_NAME}" derived=true
        vault write "$${RSS_VAULT_TRANSIT_MOUNT}/keys/$${RSS_DLX_ARCHIVE_KEY_NAME}" derived=true
        printf 'path "%s/encrypt/%s" { capabilities = ["update"] }\npath "%s/decrypt/%s" { capabilities = ["update"] }\n' \
          "$${RSS_VAULT_TRANSIT_MOUNT}" "$${RSS_DLX_PAYLOAD_KEY_NAME}" \
          "$${RSS_VAULT_TRANSIT_MOUNT}" "$${RSS_DLX_PAYLOAD_KEY_NAME}" \
          | vault policy write rss-dlx-hot -
        printf 'path "%s/encrypt/%s" { capabilities = ["update"] }\npath "%s/decrypt/%s" { capabilities = ["update"] }\n' \
          "$${RSS_VAULT_TRANSIT_MOUNT}" "$${RSS_DLX_ARCHIVE_KEY_NAME}" \
          "$${RSS_VAULT_TRANSIT_MOUNT}" "$${RSS_DLX_ARCHIVE_KEY_NAME}" \
          | vault policy write rss-dlx-archive -
        vault write auth/token/create \
          id="$$(cat /run/rss-demo-secrets/vault-dlx-hot-token)" \
          policies=rss-dlx-hot \
          no_default_policy=true \
          no_parent=true \
          renewable=false >/dev/null
        vault write auth/token/create \
          id="$$(cat /run/rss-demo-secrets/vault-dlx-archive-token)" \
          policies=rss-dlx-archive \
          no_default_policy=true \
          no_parent=true \
          renewable=false >/dev/null
        vault write -f "$${RSS_VAULT_TRANSIT_MOUNT}/keys/$${RSS_ACCESS_TOKEN_SIGNING_ACTIVE_KEY_ID}" type=ecdsa-p256

  rss-access-jwks-init:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rss-server:dev
    entrypoint: ["/usr/local/bin/rss"]
    command: ["rss-access-jwks", "export-vault-transit"]
    env_file: [.env.example]
    depends_on:
      vault-init:
        condition: service_completed_successfully
    # init job writes merged JWKS (Active+Retiring+Next per env) to the volume; server consumes read-only.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - vault-tls:/run/rss-demo-vault:ro
      - rss-access-jwks:/run/rss-access-token
      - ./demo-secrets/runtime-serving-secret-bundle:/var/run/rss/secrets/serving-secret-bundle:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  migration:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rss-server:dev
    entrypoint: ["/usr/local/bin/rss"]
    command: ["postgres", "migrate-all"]
    env_file: [.env.example, ./demo-secrets/migration.env]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    user: "65532:65532"
    volumes:
      - ./demo-secrets/pg-migrator-password:/run/rss-demo-secrets/pg-migrator-password:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: .. # 仓库根 = 构建上下文（Dockerfile 在根；.dockerignore 裁剪）。
      dockerfile: Dockerfile
    image: rss-server:dev
    env_file: [.env.example]
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      rss-access-jwks-init:
        condition: service_completed_successfully
    # 全部端口绑 127.0.0.1（仅本机演示可达，不暴露到局域网/所有网卡）。宿主 smoke 经 localhost 验证不受影响。
    # Internal/Admin 是控制/管理面：即便本机演示也不应对外，loopback 绑定收紧默认暴露面。
    ports:
      - "127.0.0.1:${RSS_PRIMARY_HOST_PORT:-8080}:8080" # Primary（业务 API；scaffold 期无路由）
      - "127.0.0.1:${RSS_ADMIN_HOST_PORT:-8082}:8082" # Admin（管理面：audit route，按 Admin listener 鉴权）
      - "127.0.0.1:${RSS_HEALTH_HOST_PORT:-8083}:8083" # Health（healthz / readyz / metrics）— 匿名 NoAuth 面，loopback-only 落实内部网络边界（#1253）
    # ── 运行时加固：非 root + 只读 rootfs + 丢能力（证明 acceptance「read-only rootfs compatible」）──
    user: "65532:65532" # distroless:nonroot 内置 uid；显式声明便于审计。
    read_only: true # 只读根文件系统；server 不写盘（日志走 stdout，TLS 走 rustls 无磁盘状态）。
    tmpfs:
      - /tmp # 唯一可写：临时目录兜底（当前进程不依赖，留作安全网）。
    volumes:
      - vault-tls:/run/rss-demo-vault:ro
      - rss-access-jwks:/run/rss-access-token:ro
      - ./password-blocklist.demo.sha256:/run/rss-password-blocklist.sha256:ro
      - ./demo-secrets/runtime-serving-secret-bundle:/var/run/rss/secrets/serving-secret-bundle:ro
      - ./demo-secrets/aws-credentials:/run/rss-demo-secrets/aws-credentials:ro
    cap_drop:
      - ALL # 不需任何 Linux capability（仅 bind 高位端口 8080-8083，无需 NET_BIND_SERVICE）。
    security_opt:
      - no-new-privileges:true # 禁 setuid 提权。
    restart: on-failure

volumes:
  vault-tls:
  rss-access-jwks:
  minio-data:
