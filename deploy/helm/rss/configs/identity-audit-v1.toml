schemaVersion = 1
[listeners]
requestBudgetMs = 30000
[listeners.primary]
bind = "127.0.0.1:{{ .primaryPort }}"
[listeners.admin]
bind = "127.0.0.1:{{ .adminPort }}"
[listeners.health]
bind = "127.0.0.1:{{ .healthPort }}"
[identity]
issuer = "https://identity.example.com"
audience = "rss-identityaudit"
keyId = "identity-access-es256"
accessTtlSeconds = 900
authGrantTtlSeconds = 2592000
refreshTtlSeconds = 2592000
passwordBlocklistPath = "/run/rss/password-blocklist.sha256"
[oidc]
issuer = "https://identity.example.com"
audience = "rss-identityaudit"
jwksPath = "/run/rss/oidc.jwks.json"
refreshSeconds = 30
[postgres.connection]
host = "postgres.example.com"
port = 5432
database = "rss"
sslMode = "verifyFull"
sslRootCertPath = "/run/rss/postgres-ca.pem"
[postgres.writer]
username = "rss_identity_writer"
maxConnections = {{ .poolCeilings.writer }}
[postgres.reader]
username = "rss_identity_reader"
maxConnections = {{ .poolCeilings.reader }}
[postgres.auditAdmin]
username = "rss_audit_admin"
maxConnections = {{ required "identityaudit auditAdmin pool ceiling is required" .poolCeilings.auditAdmin }}
[vault]
addr = "https://vault.example.com:8200"
caCertPemPath = "/run/rss/vault-ca.pem"
transitMount = "transit"
signingKeyName = "identity-access"
dlxPayloadKeyName = "identityaudit-dlx-payload"
readinessSeconds = 10
[eventing]
auditChainKeyId = 1
tenantAuthorityTtlSeconds = 3600
tenantAuthorityClockSkewSeconds = 60
