{{- $profile := include "rss.profile" . -}}
{{- $phase := include "rss.phase" . -}}
{{- if eq $phase "serving" }}
{{- $planSource := include "rss.planSource" . -}}
{{- $plan := $planSource | mustFromJson -}}
{{- range $service := $plan.services }}
{{- $hasHealthPort := false -}}
{{- range $port := $service.ports -}}
{{- if and (eq $port.name "health") (eq $port.exposure "serviceExposed") -}}{{- $hasHealthPort = true -}}{{- end -}}
{{- end -}}
{{- if $hasHealthPort }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rss.resourceName" (dict "root" $ "name" (printf "%s-monitor" $service.name)) }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $service.workload) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rss.selectorLabels" (dict "root" $ "workload" $service.workload) | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  endpoints:
    - port: health
      path: /health/v1/metrics
      scheme: http
{{- end }}
{{- end }}
{{- end }}
