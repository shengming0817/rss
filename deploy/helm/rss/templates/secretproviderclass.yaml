{{- $profile := include "rss.profile" . -}}
{{- $phase := include "rss.phase" . -}}
{{- $planSource := include "rss.planSource" . -}}
{{- $plan := $planSource | mustFromJson -}}
{{- range $workload := $plan.workloads }}
{{- $storeId := "" -}}
{{- range $binding := $workload.secretBindings -}}
{{- if has $phase $binding.consumers -}}
{{- if eq $storeId "" -}}{{- $storeId = $binding.vault.storeId -}}
{{- else if ne $storeId $binding.vault.storeId -}}{{- fail "phase secret bindings must use exactly one Vault store" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if eq $storeId "" -}}{{- fail "phase requires at least one Vault secret binding" -}}{{- end -}}
{{- if or (gt (len $storeId) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $storeId)) -}}{{- fail "Vault storeId must be a DNS label for CSI service discovery" -}}{{- end -}}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "rss.secretProviderClassName" (dict "root" $ "profile" $profile "workload" $workload.name "phase" $phase) }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $workload.name) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ printf "https://%s.vault.svc:8200" $storeId | quote }}
    roleName: {{ printf "rss-%s-%s" $profile $phase | quote }}
    objects: |
      {{- range $binding := $workload.secretBindings }}
      {{- if has $phase $binding.consumers }}
      - objectName: {{ include "rss.secretFileName" $binding.purpose | quote }}
        secretPath: {{ $binding.vault.refKey | quote }}
        secretKey: "value"
        {{- with $binding.vault.refVersion }}
        objectVersion: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
{{ end }}
