{{- $profile := include "rss.profile" . -}}
{{- $planSource := include "rss.planSource" . -}}
{{- $plan := $planSource | mustFromJson -}}
{{- $seen := dict -}}
{{- range $workload := $plan.workloads }}
{{- if not (hasKey $seen $workload.identity.serviceAccount) }}
{{- $_ := set $seen $workload.identity.serviceAccount true -}}
{{- $serviceAccountName := include "rss.serviceAccountName" (dict "root" $ "identity" $workload.identity.serviceAccount) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $workload.name) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
