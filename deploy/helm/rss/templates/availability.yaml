{{- $profile := include "rss.profile" . -}}
{{- $phase := include "rss.phase" . -}}
{{- if eq $phase "serving" }}
{{- $planSource := include "rss.planSource" . -}}
{{- $plan := $planSource | mustFromJson -}}
{{- if not (has $plan.availabilityClass (list "highlyAvailable" "maintenanceWindow")) -}}{{- fail "DeploymentPlan contains an unsupported availability class" -}}{{- end -}}
{{- $budget := required "DeploymentPlan replicaDatabaseBudget is required" $plan.replicaDatabaseBudget -}}
{{- range $workload := $plan.workloads }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rss.resourceName" (dict "root" $ "name" (printf "%s-pdb" $workload.name)) }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $workload.name) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "rss.selectorLabels" (dict "root" $ "workload" $workload.name) | nindent 6 }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rss.resourceName" (dict "root" $ "name" (printf "%s-hpa" $workload.name)) }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $workload.name) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rss.resourceName" (dict "root" $ "name" $workload.name) }}
  minReplicas: {{ $budget.minReplicas }}
  maxReplicas: {{ $budget.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
{{- end }}
