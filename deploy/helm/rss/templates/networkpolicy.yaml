{{- $profile := include "rss.profile" . -}}
{{- $phase := include "rss.phase" . -}}
{{- $planSource := include "rss.planSource" . -}}
{{- $plan := $planSource | mustFromJson -}}
{{- range $role := $plan.dependencyPeerRoles -}}
{{- if not (has $role (list "dns" "vault" "postgresql" "amqp" "redis" "objectStorage" "oidc")) -}}{{- fail "DeploymentPlan contains an unsupported dependency peer role" -}}{{- end -}}
{{- end -}}
{{- if eq $phase "migration" -}}
{{- range $requiredRole := list "dns" "vault" "postgresql" -}}
{{- if not (has $requiredRole $plan.dependencyPeerRoles) -}}{{- fail (printf "migration dependency peer role is missing: %s" $requiredRole) -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- range $workload := $plan.workloads }}
{{- $component := $workload.name -}}
{{- if eq $phase "migration" -}}{{- $component = printf "%s-migration" $component -}}{{- end -}}
{{- $hasWorkloadOnly := false -}}
{{- range $service := $plan.services -}}
{{- if eq $service.workload $workload.name -}}
{{- range $port := $service.ports -}}
{{- if eq $port.exposure "workloadOnly" -}}{{- $hasWorkloadOnly = true -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rss.resourceName" (dict "root" $ "name" (printf "%s-%s-default-deny" $workload.name $phase)) }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $component) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rss.selectorLabels" (dict "root" $ "workload" $component) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rss.resourceName" (dict "root" $ "name" (printf "%s-%s-egress" $workload.name $phase)) }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $component) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rss.selectorLabels" (dict "root" $ "workload" $component) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- range $role := $plan.dependencyPeerRoles }}
    {{- $enabled := eq $phase "serving" -}}
    {{- if and (eq $phase "migration") (has $role (list "dns" "vault" "postgresql")) -}}{{- $enabled = true -}}{{- end -}}
    {{- if $enabled }}
    {{- if eq $role "dns" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- else }}
    - to:
        - namespaceSelector:
            matchLabels:
              rss.gocell.io/dependency-role: {{ $role | quote }}
          podSelector:
            matchLabels:
              rss.gocell.io/dependency-role: {{ $role | quote }}
      ports:
        - protocol: TCP
          port: {{ include "rss.dependencyPort" $role }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- if eq $phase "serving" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rss.resourceName" (dict "root" $ "name" (printf "%s-serving-ingress" $workload.name)) }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $workload.name) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rss.selectorLabels" (dict "root" $ "workload" $workload.name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              rss.gocell.io/allowed-client-of: {{ $profile | quote }}
      ports:
        {{- range $service := $plan.services }}
        {{- if eq $service.workload $workload.name }}
        {{- range $port := $service.ports }}
        {{- if and (eq $port.exposure "serviceExposed") (ne $port.name "health") }}
        - protocol: TCP
          port: {{ $port.name }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
    {{- if $hasWorkloadOnly }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "rss.name" $ }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        {{- range $service := $plan.services }}
        {{- if eq $service.workload $workload.name }}
        {{- range $port := $service.ports }}
        {{- if eq $port.exposure "workloadOnly" }}
        - protocol: TCP
          port: {{ $port.name }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: health
{{- end }}
{{- end }}
