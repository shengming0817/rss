{{- $profile := include "rss.profile" . -}}
{{- $phase := include "rss.phase" . -}}
{{- if eq $phase "serving" }}
{{- $planSource := include "rss.planSource" . -}}
{{- $plan := $planSource | mustFromJson -}}
{{- range $service := $plan.services }}
{{- $hasExposedPort := false -}}
{{- range $port := $service.ports -}}
{{- if eq $port.exposure "serviceExposed" -}}
{{- $hasExposedPort = true -}}
{{- end -}}
{{- end -}}
{{- if $hasExposedPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rss.resourceName" (dict "root" $ "name" $service.name) }}
  labels:
    {{- include "rss.labels" (dict "root" $ "profile" $profile "workload" $service.workload) | nindent 4 }}
  annotations:
    {{- include "rss.fingerprintAnnotations" $plan | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rss.selectorLabels" (dict "root" $ "workload" $service.workload) | nindent 4 }}
  ports:
    {{- range $port := $service.ports }}
    {{- if eq $port.exposure "serviceExposed" }}
    - name: {{ $port.name }}
      port: {{ $port.port }}
      targetPort: {{ $port.name }}
      protocol: TCP
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
