apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rss-runtime-runtime-serving-secrets
  labels:
    helm.sh/chart: rss-0.1.0
    app.kubernetes.io/name: rss
    app.kubernetes.io/instance: rss
    app.kubernetes.io/component: runtime
    app.kubernetes.io/managed-by: Helm
    rss.gocell.io/profile: runtime
  annotations:
    rss.gocell.io/assembly-fingerprint: sha256:08aec02367b22e4585ed3c0bf13b70ebc64766bb779caca3e0a36e5c8aa6ec84
    rss.gocell.io/runtime-plan-fingerprint: sha256:a9df245015e1d65741b48942cb798fcb7ab17bdf358fc8d9ec1cf75cb608701a
    rss.gocell.io/deployment-fingerprint: sha256:fea324bc609396fa597453cde992b0eed25910283c58a206f3eb38c8f411c9f8
spec:
  provider: vault
  parameters:
    vaultAddress: https://rss-vault.vault.svc:8200
    roleName: rss-runtime-serving
    objects: |
      - objectName: "database-url"
        secretPath: "runtime/serving-database-url"
        secretKey: "value"
      - objectName: "serving-secret-bundle"
        secretPath: "runtime/serving-secret-bundle"
        secretKey: "value"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rss-runtime-monitor
  labels:
    helm.sh/chart: rss-0.1.0
    app.kubernetes.io/name: rss
    app.kubernetes.io/instance: rss
    app.kubernetes.io/component: runtime
    app.kubernetes.io/managed-by: Helm
    rss.gocell.io/profile: runtime
  annotations:
    rss.gocell.io/assembly-fingerprint: sha256:08aec02367b22e4585ed3c0bf13b70ebc64766bb779caca3e0a36e5c8aa6ec84
    rss.gocell.io/runtime-plan-fingerprint: sha256:a9df245015e1d65741b48942cb798fcb7ab17bdf358fc8d9ec1cf75cb608701a
    rss.gocell.io/deployment-fingerprint: sha256:fea324bc609396fa597453cde992b0eed25910283c58a206f3eb38c8f411c9f8
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rss
      app.kubernetes.io/instance: rss
      app.kubernetes.io/component: runtime
  namespaceSelector:
    matchNames:
    - rss-system
  endpoints:
  - port: health
    path: /health/v1/metrics
    scheme: http
