apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rss-identityaudit-identityaudit-serving-secrets
  labels:
    helm.sh/chart: rss-0.1.0
    app.kubernetes.io/name: rss
    app.kubernetes.io/instance: rss
    app.kubernetes.io/component: identityaudit
    app.kubernetes.io/managed-by: Helm
    rss.gocell.io/profile: identityaudit
  annotations:
    rss.gocell.io/assembly-fingerprint: sha256:4b364f28288b2da1bc992adbfeb9ca8923edc7456a4bcae1cbd8eb33048e0cd2
    rss.gocell.io/runtime-plan-fingerprint: sha256:057713f9ee2e3f588b0cebe2cdf85ce29e2b32456f6d27e8816650bd91273280
    rss.gocell.io/deployment-fingerprint: sha256:9c024f9106a38fc5e4b044a668524bf89ada9ddd73645c8d5dc323dbb336de7b
spec:
  provider: vault
  parameters:
    vaultAddress: https://rss-vault.vault.svc:8200
    roleName: rss-identityaudit-serving
    objects: |
      - objectName: "database-url"
        secretPath: "identityaudit/serving-database-url"
        secretKey: "value"
      - objectName: "serving-secret-bundle"
        secretPath: "identityaudit/serving-secret-bundle"
        secretKey: "value"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rss-identityaudit-monitor
  labels:
    helm.sh/chart: rss-0.1.0
    app.kubernetes.io/name: rss
    app.kubernetes.io/instance: rss
    app.kubernetes.io/component: identityaudit
    app.kubernetes.io/managed-by: Helm
    rss.gocell.io/profile: identityaudit
  annotations:
    rss.gocell.io/assembly-fingerprint: sha256:4b364f28288b2da1bc992adbfeb9ca8923edc7456a4bcae1cbd8eb33048e0cd2
    rss.gocell.io/runtime-plan-fingerprint: sha256:057713f9ee2e3f588b0cebe2cdf85ce29e2b32456f6d27e8816650bd91273280
    rss.gocell.io/deployment-fingerprint: sha256:9c024f9106a38fc5e4b044a668524bf89ada9ddd73645c8d5dc323dbb336de7b
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rss
      app.kubernetes.io/instance: rss
      app.kubernetes.io/component: identityaudit
  namespaceSelector:
    matchNames:
    - rss-system
  endpoints:
  - port: health
    path: /health/v1/metrics
    scheme: http
