[package]
name = "postgres-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
rss-runtime = ["rss-transactional-messaging-postgres/rss-runtime", "rss-examples/managed"]

[dev-dependencies]
rss-examples = { path = "../../crates/examples", features = ["providers", "outbox-writer"] }
rss-projection.workspace = true
rss-projection-postgres = { workspace = true, features = ["integration"] }
tokio-util.workspace = true
rss-transactional-messaging-recovery.workspace = true
rss-data-protection.workspace = true
ring.workspace = true
rss-observation.workspace = true
rss-observation-postgres = { workspace = true, features = ["integration", "projection-postgres"] }
serde_json.workspace = true
tempfile.workspace = true
rss-transactional-messaging-postgres = { workspace = true, features = ["integration", "recovery"] }
rss-transactional-messaging.workspace = true
rss-transactional-messaging-runtime.workspace = true
rss-transactional-messaging-testkit.workspace = true
rss-contract.workspace = true
rss-request-context.workspace = true
rss-runtime.workspace = true
testkit = { path = "../../crates/testkit", features = ["containers"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "any", "migrate", "json"] }
anyhow.workspace = true
