# RW-G1 追踪弹验收规格（journeys 单源；可执行验收 = journeys/tests/identity_login_audit_journey.rs）。
# 目的：证明 G0 冻结接缝能拼成闭环——identity 登录 → in-mem outbox → 分发 → audit append。
# 通过 = 放行 W 宽扇出（见 issue #999、epic #991）。

id = "identity-login-audit"
title = "identity 登录接缝 → outbox(in-mem) → audit append 验接缝"
issue = 999
# kind=service-seam-tracer：验证**冻结接缝服务层闭环**，非用户可见的完整 HTTP 登录旅程。
# status=green 表示**接缝已绿**（service-seam）——HTTP/axum、JWT、durable outbox/幂等仍 OOS（见 [out_of_scope]），
# 不代表面向用户的登录旅程已就绪；真实 HTTP login journey 待 W 落地后另立并标 green。
kind = "service-seam-tracer"
status = "green"

# 组装在其上的 demo topology（substrate crates）。
topology = ["bootstrap", "eventexec", "identity", "audit", "memory"]

# 端到端步骤（与集成测试一一对应）。
steps = [
  "bootstrap::compose 跑 identity/audit 的 Domain::init，Registry 收集登录路由组 + session-created 订阅",
  "组合根把 SubscriberHandler adapt 成 eventexec::HandlerFn，run_dispatch 驱动 MemBus 订阅流",
  "LoginService 校验凭据 → authn::SessionId::generate → 发布 identity.session-created（MemBus publisher）",
  "audit 订阅 handler 解码 payload → diport::AuditEvent → MemAuditSink.record",
]

# 验收断言（通过判据）。
[expect]
route_group = "Primary listener, prefix=/api/v1/identity"
audit_records = 1
audit_action = "login"
audit_resource_kind = "session"
tenant_threaded = true       # 租户经 payload 贯穿到审计记录
rejected_login_audits = 0    # 负路径：登录失败不产生审计事件

# 显式留 W（不在本追踪弹范围）。
[out_of_scope]
http_axum = "httpserve mount_primary/finalize_auth 逐字节 HTTP journey（topology 仅经 route_group 声明参与，未跑 axum）"
jwt = "真实 JWT 签发/校验、密码哈希、authn::Session/Principal 聚合（authn 仅 SessionId::generate 入链）"
contract_active = "契约 lifecycle=active graduate + active serving 校验"
audit_chain = "audit domain 哈希链（link_hash/verify_chain/AuditEntry）+ 域内持久化"
consumer_idempotency = "L2 OutboxFact consumer 幂等/去重——in-mem 单投递不触发；真实 broker 重投幂等留 W"
correlation = "outbox envelope correlation_id / request_id 透传到 AuditEvent（当前 None）；trace 关联留 W"
