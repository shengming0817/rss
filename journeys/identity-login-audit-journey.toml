# identity 登录 durable outbox 闭环验收规格（journeys 单源；可执行验收 =
# journeys/tests/identity_login_audit_journey.rs，durable 拓扑变体 =
# journeys/tests/identity_login_audit_durable_journey.rs，`--features integration`）。
# 目的：证明 L2 OutboxFact 闭环——identity 登录 → durable outbox 发射 → ConsumerBase 幂等消费 → audit append。
# 源起 RW-G1 追踪弹（#999，验冻结接缝）；#1100/T008 graduate 为 durable L2 闭环 + 契约 active。

id = "identity-login-audit"
title = "identity 登录 → durable outbox → ConsumerBase 幂等消费 → audit append（L2 闭环）"
issue = 1100
# kind=service-closure：验证 L2 OutboxFact 服务层闭环（登录 emit → outbox → 消费幂等去重 → audit）。
# status=green：demo 拓扑闭环 + 重投幂等已绿；durable（postgres/amqp）拓扑变体经 integration feature 验。
# 仍 OOS：HTTP/axum 逐字节登录旅程、JWT/密码哈希、envelope trace/correlation 注入（见 [out_of_scope]）。
kind = "service-closure"
status = "green"

# demo 拓扑（默认，in-process 替身）；durable 拓扑（postgres outbox + relay + PgInbox 幂等）经
# identity_login_audit_durable_journey.rs（`--features integration`）验，substrate 增 postgres。
topology = ["bootstrap", "eventexec", "identity", "audit", "memory"]
topology_durable = ["bootstrap", "eventexec", "identity", "audit", "postgres"]

# 端到端步骤（与集成测试一一对应）。
steps = [
  "bootstrap::compose 跑 identity/audit 的 Domain::init，Registry 收集登录路由组 + session-created 订阅（订阅元数据单源自 generated SPEC.subscriptions()）",
  "Registry 只声明 generated subscription identity；journey 复用 audit decode + repo append 构造测试 handler，ConsumerBase 驱动 MemBus 订阅流（claim→handle→commit/release 幂等）",
  "LoginService 校验凭据 → mint Session（authn::SessionId::generate 桥接域 SessionId）→ 构造 EventEntry（EventId=独立 opaque UUID，非 session_id）→ 经 SessionLifecycle co-tx 把 session 行 + outbox 行落同一本地事务",
  "（durable）relay CAS 中继 outbox entry 到 broker，message_id=EventId；（demo）MemSessionLifecycle 直发 MemBus，Message.id=EventId",
  "audit 消费路径以 EventId 幂等去重（ConsumerBase claim）后解码 payload → AuditRecord → AuditWriteRepo.append",
]

# 验收断言（通过判据）。
[expect]
route_group = "Primary listener, prefix=/api/v1/identity"
contract_lifecycle = "active"   # 契约 graduate draft→active（R8/R11/R14 过）
audit_records = 1
audit_action = "login"
audit_resource_kind = "session"
tenant_threaded = true          # 租户经 payload 贯穿到审计记录
event_id_threaded = true        # EventId（独立 opaque id，非 session_id）经 Message.id 贯穿到消费幂等键
consumer_idempotency = true     # relay 重投同一 EventId → audit 仅 append 一次（acc #2）
rejected_login_audits = 0       # 负路径：登录失败不产生审计事件

# 显式留 W（不在本闭环范围）。
[out_of_scope]
http_axum = "httpserve generated endpoint mount/finalize_auth 逐字节 HTTP journey（topology 仅经 route_group 声明参与，未跑 axum）"
jwt = "真实 JWT 签发/校验、密码哈希、authn::Session/Principal 聚合（authn 仅 SessionId::generate 入链）"
audit_chain = "audit domain 哈希链（link_hash/verify_chain/AuditEntry）+ 域内持久化"
correlation = "outbox envelope trace/correlation/occurred_at reserved-key 受控注入（funnel 现 fail-closed 拒 reserved、无 sealed setter）；payload→AuditEvent correlation 透传需 payload schema 升版，留 W"
projection_rebuild = "L3 CQRS 投影读模型 + 断点续投重建测试（投影基建 T010/P10 未落地）——本轮交付 L2 replay-via-redelivery 幂等收敛"
