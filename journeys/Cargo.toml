[package]
name = "journeys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autolib = false

[lints]
workspace = true

# journeys — tests-only 验收 journey 组合根（组合根层，可依赖所有库 crate）。
# RW-G1 追踪弹的端到端 journey 在 tests/ 内组装 in-mem topology（identity + audit + memory 经
# bootstrap/eventexec 接线）；被组装 crate 全部为 dev-dependencies。

[[test]]
name = "audit_list_tenant_entries_localtx_journey"
path = "tests/audit_list_tenant_entries_localtx_journey.rs"
required-features = ["integration"]

[[test]]
name = "identity_logout_grant_journey"
path = "tests/identity_logout_grant_journey.rs"
required-features = ["integration"]

[[test]]
name = "identity_password_change_localtx_journey"
path = "tests/identity_password_change_localtx_journey.rs"
required-features = ["integration"]

[[test]]
name = "identity_refresh_localtx_journey"
path = "tests/identity_refresh_localtx_journey.rs"
required-features = ["integration"]

[[test]]
name = "settings_secret_publish_localtx_journey"
path = "tests/settings_secret_publish_localtx_journey.rs"
required-features = ["integration"]

[[test]]
name = "security_provider_closeout"
path = "tests/security_provider_closeout.rs"

[[test]]
name = "settingsonly_runtime"
path = "tests/settingsonly_runtime.rs"

[[test]]
name = "identityaudit_runtime"
path = "tests/identityaudit_runtime.rs"
required-features = ["integration"]

[[test]]
name = "production_runtime"
path = "tests/production_runtime.rs"

[[test]]
name = "runtime_inventory"
path = "tests/runtime_inventory.rs"

[[test]]
name = "two_replica_runtime"
path = "tests/two_replica_runtime.rs"
required-features = ["integration"]

# journey 集成测试组装根：组合根可依赖所有库 crate（deny.toml wrappers 已含 journeys）。
[dev-dependencies]
# seed-login：启用 identity 的明文种子登录构造器（仅 journeys/demo；生产组合根不启用，PR #186 F1）。
# test-support：journey 测试显式构造 TenantRepoScope，证明外部测试只能走测试入口而非裸 TenantId。
identity = { path = "../crates/identity", features = ["seed-login", "test-support"] }
authn = { path = "../crates/authn", features = ["test-support"] }
audit = { path = "../crates/audit", features = ["test-support"] }
httpserve = { path = "../crates/httpserve", features = ["test-util"] }
# #1800：通过 production explicit-values seam 验证 typed Vault allowlist closeout；仅启测试接缝，
# Journey 自身不启动 runtime、容器或真实 provider。
runtime = { path = "../assemblies/runtime", features = ["integration"] }
settingsonly = { path = "../assemblies/settingsonly", features = ["test-support"] }
identityaudit = { path = "../assemblies/identityaudit", features = ["test-support"] }
# seed-data：启用 settings 的 in-mem 配置 / flag 仓储构造器（仅 journeys/demo；生产组合根不启用）。
# test-support：journey 测试显式构造 TenantRepoScope，证明外部测试只能走测试入口而非裸 TenantId。
settings = { path = "../crates/settings", features = ["seed-data", "test-support"] }
bootstrap = { path = "../crates/bootstrap" }
eventexec = { path = "../crates/eventexec" }
deviceloop = { path = "../crates/deviceloop" }
# run_consumer 幂等消费驱动的载体类型：HandleResult / InboxStore / StoredOutboxEntry / IdemKey / ConsumerGroup。
consistency = { path = "../crates/consistency" }
diport = { path = "../crates/diport" }
secure = { path = "../crates/secure", features = ["test-support"] }
# #1160 durable journey：correlation ambient 信道，端到端断言 outbox→relay→broker→consumer metadata 保真。
diagctx = { path = "../crates/diagctx" }
runctx = { path = "../crates/runctx", features = ["test-support"] }
primitives = { path = "../crates/primitives" }
# settings 配置发布 journey 需 TenantId 构造 + 事件 payload 解码。
vocab = { path = "../crates/vocab" }
# #1277：登录种子的 canonical user id（ids::UserId）与登录标识（username）解耦——审计 actor 取 canonical id。
ids = { path = "../crates/ids" }
generated = { path = "../generated" }
memory = { path = "../adapters/memory" }
crypto-adapter = { path = "../adapters/crypto" }
vault = { path = "../adapters/vault", features = ["backend"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
# 组合根边界错误聚合（error-handling.md：应用边界可 anyhow）。
anyhow = { workspace = true }
# adapt 在 handler Err→Nack 处记录错误（兜底可观测，与 eventexec/audit 日志同链）。
tracing = { workspace = true }
# durable 拓扑 journey（`integration` feature）：PgStore/PgEmitter/PgOutbox/PgInboxStore 端到端闭环。
postgres = { path = "../adapters/postgres", features = ["domain-settings", "domain-identity", "domain-audit", "journey-fault-support", "test-support"] }
sqlx = { workspace = true }
# #1171 §6：AMQP at-least-once journey（`integration` feature）——AmqpSubscriber/AmqpPublisher 真 broker
# 驱动 run_consumer_ackable。无 integration feature 时 amqp 退化为 sealed-marker 签名壳（非本文件编译）。
amqp = { path = "../adapters/amqp" }
# F6：durable journey 经 payload 解码关联本轮 session-created entry（F1 后 idem_key = 独立 EventId ≠ session_id）。
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
# F9：从 canonical UUID 字符串算 16B 原始字节，断言 tenant/actor 贯穿审计链 canonical 输入。
uuid = { workspace = true, features = ["v4"] }
# 集成测试容器 fixture（#1137）：durable journey 经 testkit self-provision postgres（无需手工 libpq env），
# 经 testkit/containers，仅 integration feature 下激活；testkit 是 Service 层 test-support 库，只准 dev-dep 消费（LAYER-DEPS-08 check_test_support_confinement）。
testkit = { path = "../crates/testkit" }

[features]
# durable 拓扑 journey（identity_login_audit_durable_journey.rs）需真实 postgres——默认不编译/不跑，
# 经 `--features integration` 显式启用。testkit/containers 经此传递激活 testcontainers（self-provision pg，
# 无需手工预置；设 PGHOST 等则对接长存外部 pg，对齐 adapters/postgres 集成测试约定）。
integration = ["testkit/containers", "amqp/integration"]
