# Settings config background projection definition.
id = "settings.config-projection"
kind = "projection"
domain = "settings"
version = "v3"
owner = "settings"
consistencyLevel = "WorkflowEventual"
lifecycle = "active"

[schemas]
projection = "projection.schema.json"

[capabilities.workflow]
mode = "projection"
inputs = ["settings.config-version-changed"]
ordering = "serial-in-order"
checkpoint = "required"
replay = "required"
