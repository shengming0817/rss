# Rollback restores a historical value by appending a new version and fact in one transaction.
id = "settings.config-rollback"
kind = "http"
domain = "settings"
version = "v6"
owner = "settings"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/settings/configs/{key}/rollbacks"
method = "POST"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
successStatus = 201
idempotency = "non-idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "settings.config-rollback"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["settings.config-version-changed"]

[effectProfile]
effects = ["auth", "business-write", "business-transaction", "outbox", "publish"]
