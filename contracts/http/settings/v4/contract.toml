# Authoritative settings config read. Cache is revision-validated and never a correctness source.
id = "settings.config-get"
kind = "http"
domain = "settings"
version = "v4"
owner = "settings"
consistencyLevel = "LocalOnly"
lifecycle = "active"
path = "/api/v1/settings/configs/{key}"
method = "GET"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
successStatus = 200
idempotency = "idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "settings.config-get"

[effectProfile]
effects = ["auth", "read"]
