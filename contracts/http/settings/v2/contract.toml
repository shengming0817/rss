# settings secret-publish HTTP 契约（active）——secret 引用坐标写入，请求/响应绝无 secret 材料。
# L1 LocalTx：SecretRepo 单次原子 CAS 写坐标，无 outbox；并发冲突零写且 handler 不自动重试。
# graduate draft→active（#1430 PERSIST-009 settings 首条 durable module 闭环）：挂活路由 + 鉴权 = permission。
id = "settings.secret-publish"
kind = "http"
domain = "settings"
version = "v2"
owner = "settings"
consistencyLevel = "LocalTx"
lifecycle = "active"
path = "/api/v1/settings/secrets"
method = "POST"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
successStatus = 201
idempotency = "non-idempotent"

# 租户作用域特权写：Primary listener JWT verify 强制已认证主体（缺/匿名 fail-closed 401）；
# 租户来自验签 claim（非 pre-auth X-Tenant-ID header）。permission 声明意图，PDP graduate 后细粒度 enforce。
[endpoints.http.auth]
mode = "permission"
permission = "settings.secret-publish"

[capabilities.localTx]
boundary = "single-domain"
txModel = "repo-atomic-cas"
retry = "bounded-transient"
commitUnknown = "not-retryable"

[effectProfile]
effects = ["auth", "write", "transaction"]
