# Authoritative, fresh settings secret material resolve. The tenant is taken only from the
# authenticated route evidence; the stored SecretRef selects the allowlisted external store.
id = "settings.secret-resolve"
kind = "http"
domain = "settings"
version = "v7"
owner = "settings"
consistencyLevel = "LocalOnly"
lifecycle = "active"
path = "/api/v1/settings/secrets/{key}/material"
method = "GET"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
successStatus = 200
idempotency = "idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "settings.secret-resolve"

[effectProfile]
effects = ["auth", "read"]
