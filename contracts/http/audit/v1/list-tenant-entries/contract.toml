# Audited SuperAdmin read of one explicit target tenant. The durable audit append is the L1 write
# unit of work; the admin read starts only after that append commits successfully.
id = "audit.list-tenant-entries"
kind = "http"
domain = "audit"
version = "v1"
owner = "audit"
consistencyLevel = "LocalTx"
lifecycle = "active"
path = "/api/v1/audit/tenants/{tenantId}/entries"
method = "GET"

[endpoints.http]
successStatus = 200
idempotency = "non-idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "audit:read"

[endpoints.http.projection]
fields = [
  { field = "auditTenantId", permission = "audit:field:tenant_id", obligationKey = "audit.tenant_id", responsePath = "data[].tenantId" },
  { field = "auditActor", permission = "audit:field:actor", obligationKey = "audit.actor", responsePath = "data[].actor" },
  { field = "auditResourceId", permission = "audit:field:resource_id", obligationKey = "audit.resource_id", responsePath = "data[].resourceId" },
]

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[capabilities.localTx]
boundary = "single-domain"
txModel = "tenant-scoped-uow"
retry = "bounded-transient"
commitUnknown = "not-retryable"

[effectProfile]
effects = ["auth", "read", "projection", "write", "transaction", "cross-tenant-audit"]
