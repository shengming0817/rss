# Tenant-scoped audit entry read. This route never accepts a target tenant and performs no write.
id = "audit.list-entries"
kind = "http"
domain = "audit"
version = "v1"
owner = "audit"
consistencyLevel = "LocalOnly"
lifecycle = "active"
path = "/api/v1/audit/entries"
method = "GET"

[endpoints.http.auth]
mode = "permission"
permission = "audit:read"

[endpoints.http.projection]
fields = [
  { field = "auditTenantId", permission = "audit:field:tenant_id", obligationKey = "audit.tenant_id", responsePath = "data[].tenantId" },
  { field = "auditActor", permission = "audit:field:actor", obligationKey = "audit.actor", responsePath = "data[].actor" },
  { field = "auditResourceId", permission = "audit:field:resource_id", obligationKey = "audit.resource_id", responsePath = "data[].resourceId" },
]

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[effectProfile]
effects = ["auth", "read", "projection"]
