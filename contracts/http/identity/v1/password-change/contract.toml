# 当前认证主体密码变更 HTTP 契约。credential/account/grant/family/outbox 同事务提交 ⇒ L2。
id = "identity.password-change"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/identity/password/change"
method = "POST"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
selfScoped = true
successStatus = 200
idempotency = "non-idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "identity:profile:write"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["identity.security-event"]

[effectProfile]
effects = ["auth", "business-write", "business-transaction", "outbox", "publish"]
