# 当前认证主体 profile HTTP 契约。self-scoped authenticated read ⇒ L0。
id = "identity.profile"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "LocalOnly"
lifecycle = "active"
path = "/api/v1/identity/profile"
method = "GET"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
selfScoped = true
successStatus = 200
idempotency = "idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "identity:profile:read"

[endpoints.http.projection]
fields = [
  { field = "identityProfileSubject", permission = "identity:profile:field:subject", obligationKey = "identity.profile.subject", responsePath = "data.subject" },
  { field = "identityProfileTenantId", permission = "identity:profile:field:tenant_id", obligationKey = "identity.profile.tenant_id", responsePath = "data.tenantId" },
]

[effectProfile]
effects = ["auth", "read", "projection"]
