# identity 登录 HTTP 契约。
# 登录写本地会话 + 发布 session-created outbox fact ⇒ consistencyLevel = OutboxFact（L2）。
id = "identity.login"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/identity/login"
method = "POST"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http.auth]
mode = "public"
reason = "login is pre-auth; tenant scope is populated from X-Tenant-ID"

[endpoints.http.headers]
"X-Tenant-ID" = "populate-only"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["identity.session-created"]

[effectProfile]
effects = ["auth", "write", "transaction", "outbox", "publish"]
