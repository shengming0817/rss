# RBAC 角色分配 HTTP 契约。binding 写 + identity.role-assigned outbox fact ⇒ L2。
id = "identity.roles-assign"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/identity/roles/{roleId}/bindings"
method = "POST"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
successStatus = 201
idempotency = "non-idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "identity:role:assign"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["identity.role-assigned"]

[effectProfile]
effects = ["auth", "write", "transaction", "outbox", "publish"]
