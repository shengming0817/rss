# ABAC policy 更新 HTTP 契约。policy CAS 更新 + identity.policy-updated outbox fact ⇒ L2。
id = "identity.policies-update"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/identity/policies/{policyId}"
method = "PUT"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http.auth]
mode = "permission"
permission = "identity:policy:update"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["identity.policy-updated"]

[effectProfile]
effects = ["auth", "write", "transaction", "outbox", "publish"]
