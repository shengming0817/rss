# RBAC 角色撤销 HTTP 契约。binding 删除 + identity.role-revoked outbox fact ⇒ L2。
id = "identity.roles-revoke"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/identity/roles/{roleId}/bindings/{subject}"
method = "DELETE"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http.auth]
mode = "permission"
permission = "identity:role:revoke"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["identity.role-revoked"]
