# identity refresh-token 轮换 HTTP 契约。
# 正常轮换不发事件；检测到重用时，grant/family 与 security-event 在同一 producer 事务提交。
id = "identity.refresh"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/identity/refresh"
method = "POST"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
successStatus = 201
idempotency = "non-idempotent"

[endpoints.http.auth]
mode = "public"
reason = "refresh presents the refresh token as its own credential; access token may already be expired"

[endpoints.http.headers]
"X-Tenant-ID" = "populate-only"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["identity.security-event"]

[effectProfile]
effects = ["auth", "business-write", "business-transaction", "outbox", "publish"]
