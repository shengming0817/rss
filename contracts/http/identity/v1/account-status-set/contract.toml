# 管理员声明账户期望状态；实际变更时 epoch/grant revoke 与 security-event 同事务提交，同状态为空操作。
id = "identity.account-status-set"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/identity/accounts/{userId}/status"
method = "PUT"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
successStatus = 200
idempotency = "idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "identity:account-security:write"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["identity.security-event"]

[effectProfile]
effects = ["auth", "business-write", "business-transaction", "outbox", "publish"]
