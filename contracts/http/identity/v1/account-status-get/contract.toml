# 管理员读取租户内账户安全状态。
id = "identity.account-status-get"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "LocalOnly"
lifecycle = "active"
path = "/api/v1/identity/accounts/{userId}/status"
method = "GET"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http]
successStatus = 200
idempotency = "idempotent"

[endpoints.http.auth]
mode = "permission"
permission = "identity:account-security:read"

[effectProfile]
effects = ["auth", "read"]
