# ABAC policy 创建 HTTP 契约。policy 写入 + identity.policy-updated outbox fact ⇒ L2。
id = "identity.policies-create"
kind = "http"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
path = "/api/v1/identity/policies"
method = "POST"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[endpoints.http.auth]
mode = "permission"
permission = "identity:policy:create"

[capabilities.outbox]
role = "producer"
atomicity = "same-transaction"
emits = ["identity.policy-updated"]
