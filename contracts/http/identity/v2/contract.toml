# Identity reconcile loop contract used by the consistency fault matrix.
id = "identity.reconcile-loop"
kind = "http"
domain = "identity"
version = "v2"
owner = "identity"
consistencyLevel = "DeviceLatent"
lifecycle = "draft"

[schemas]
request = "request.schema.json"
response = "response.schema.json"

[capabilities.deviceLatent]
loop = "reconcile"

[reconcile]
tenancy = "tenant-scoped"
trigger = "interval"
fencing = "required"
lateMessagePolicy = "idempotent"
