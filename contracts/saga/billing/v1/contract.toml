# Billing checkout saga 契约（draft）——证明 kind:saga 扇出闭环：codegen（generated/src/saga/billing_v1）
# + governance（SAGA-CONTRACT-01：R1 saga⇒L3 + R10 saga block 结构语义）+ golden。不接 assembly（draft），
# 但 retry/timeout 会派生为 generated POLICY，组合根转 SagaPolicy 后驱动 eventexec runtime。形态冻结见
# contracts/README.md §[saga]；治理见 docs/rules/saga.md §Governance。
id = "billing.checkout"
kind = "saga"
domain = "billing"
version = "v1"
# owner=billing 暂无对应域 crate（draft demo，roadmap）；owner→crate 存在性治理见 issue #1246。
owner = "billing"
consistencyLevel = "WorkflowEventual"
lifecycle = "draft"

[schemas]
payload = "payload.schema.json"

[saga]
compensationOrder = "reverse"
steps = [
    { name = "reserve_funds", receiptSchema = "reserve.schema.json", effectScope = "billing.reserve-funds", compensationEffectScope = "billing.release-funds", idempotencyClass = "deterministic-key", compensationInput = "receipt", retryClass = "transient" },
    { name = "capture", receiptSchema = "capture.schema.json", effectScope = "billing.capture", compensationEffectScope = "billing.refund", idempotencyClass = "deterministic-key", compensationInput = "receipt", retryClass = "never" },
]

[saga.retry]
maxAttempts = 3
timeBudgetMillis = 30000
backoff = "exponential"
initialBackoffMillis = 100
maxBackoffMillis = 5000
jitter = "full"

[capabilities.workflow]
mode = "saga"
