# identity role-revoked event 契约（active）——RBAC 角色撤销 outbox 闭环（#1190/T021，US5）。
# 格式冻结见 contracts/README.md；单一事实源 docs/rules/architecture.md §核心载体。
# 角色撤销 emit 的 outbox fact ⇒ consistencyLevel = OutboxFact（L2，binding 删 + outbox 同事务）。
# payload 含 subject（US5 场景 2：撤销目标 binding 的主体，供下游会话失效编排）。
# active：RBAC 角色撤销 → durable outbox → relay → audit append 闭环，audit 即其 subscriber（R14/R22）。
id = "identity.role-revoked"
kind = "event"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
# active event 必填（R8）：稳定 dotted topic（broker routing key）+ 投递语义（R11 仅放行 at-least-once）。
topic = "identity.role-revoked"
delivery = "at-least-once"

[schemas]
payload = "payload.schema.json"

[capabilities.outbox]
role = "fact"

# active event 须有 subscriber（R14，EVENT-ACTIVE-SUB-01）：audit 域消费，consumer group 稳定。
[[subscriptions]]
consumer = "audit"
group = "audit.role-revoked"
execution = "adapter-native"

[subscriptions.topology]
partitionKey = "none"
readiness = "required"
