# identity security-event event 契约——持久凭据安全生命周期的 durable outbox fact。
id = "identity.security-event"
kind = "event"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
topic = "identity.security-event"
delivery = "at-least-once"

[schemas]
payload = "payload.schema.json"

[capabilities.outbox]
role = "fact"

[[subscriptions]]
consumer = "audit"
group = "audit.security-event"
execution = "adapter-native"
externalEffectPolicy = "transactional-only"

[subscriptions.topology]
partitionKey = "none"
readiness = "required"
