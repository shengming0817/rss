# identity session-created event 契约（active）——登录 durable outbox 闭环（#1100/T008）。
# 格式冻结见 contracts/README.md；格式由 `assembly_schema::ContractManifest` 解析；语义由 contract validation 与 codegen 持有。
# 登录成功 emit 的 outbox fact ⇒ consistencyLevel = OutboxFact（L2）。audit 域订阅消费、以 EventId 幂等去重。
# active：登录 → durable outbox → relay → audit append 闭环已落地（#1100），audit 即其 subscriber（R14）。
id = "identity.session-created"
kind = "event"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
# active event 必填（R8）：稳定 dotted topic（broker routing key）+ 投递语义（R11 仅放行 at-least-once）。
topic = "identity.session-created"
delivery = "at-least-once"

[schemas]
payload = "payload.schema.json"

[capabilities.outbox]
role = "fact"

# active event 须有 subscriber（R14，EVENT-ACTIVE-SUB-01）：audit 域消费，consumer group 稳定。
# topology 声明 partition/readiness gate；audit 订阅注册单源读 generated SPEC.subscriptions()（不再手维护平行 const）。
[[subscriptions]]
consumer = "audit"
group = "audit.session-created"
execution = "adapter-native"
externalEffectPolicy = "transactional-only"

[subscriptions.topology]
partitionKey = "none"
readiness = "required"
