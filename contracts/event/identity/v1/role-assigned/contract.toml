# identity role-assigned event 契约（active）——RBAC 角色分配 outbox 闭环（#1190/T021，US5）。
# 格式冻结见 contracts/README.md；格式由 `assembly_schema::ContractManifest` 解析；语义由 contract validation 与 codegen 持有。
# 角色分配 emit 的 outbox fact ⇒ consistencyLevel = OutboxFact（L2，binding 写 + outbox 同事务）。
# active：RBAC 角色分配 → durable outbox → relay → audit append 闭环，audit 即其 subscriber（R14/R22）。
id = "identity.role-assigned"
kind = "event"
domain = "identity"
version = "v1"
owner = "identity"
consistencyLevel = "OutboxFact"
lifecycle = "active"
# active event 必填（R8）：稳定 dotted topic（broker routing key）+ 投递语义（R11 仅放行 at-least-once）。
topic = "identity.role-assigned"
delivery = "at-least-once"

[schemas]
payload = "payload.schema.json"

[capabilities.outbox]
role = "fact"

# active event 须有 subscriber（R14，EVENT-ACTIVE-SUB-01）：audit 域消费，consumer group 稳定。
[[subscriptions]]
consumer = "audit"
group = "audit.role-assigned"
execution = "adapter-native"
externalEffectPolicy = "transactional-only"

[subscriptions.topology]
partitionKey = "none"
readiness = "required"
