# Seed command 契约（draft）——request 形态冻结 + codegen 产 emit/register wrapper 证明 + 双侧对称治理
# 演练，不接真实域消费者。格式冻结见 contracts/README.md；单一事实源 docs/rules/architecture.md §核心载体。
#
# command 是 framework-neutral 分发机制（claimer / outbox provider 可互换），故 owner=_framework（R2 #1124）。
id = "seed.do-thing"
kind = "command"
domain = "_seed"
version = "v1"
owner = "_framework"
consistencyLevel = "OutboxFact"
lifecycle = "draft"
# per-kind command 字段：稳定 dotted topic `<domain>.commands.<name>`（broker routing key）。
# draft 故 R8 非强制（此处演练格式 + 锁 golden）；topic 段首须 [a-z]（canonical dotted）→ 用 `seed.` 非 `_seed.`。
topic = "seed.commands.do-thing"

[schemas]
request = "request.schema.json"

[capabilities.outbox]
role = "command"
