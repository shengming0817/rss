[package]
name = "eventing-composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
audit-consumers = [
  "dep:audit",
  "dep:crypto-adapter",
  "postgres/domain-audit",
]
settings-consumers = [
  "dep:settings",
  "postgres/domain-settings",
]
test-support = []

[dependencies]
rss-request-context.workspace = true
anyhow = { workspace = true }
audit = { path = "../../crates/audit", optional = true }
bootstrap = { path = "../../crates/bootstrap" }
consistency = { path = "../../crates/consistency" }
crypto-adapter = { path = "../../adapters/crypto", optional = true }
diport = { path = "../../crates/diport" }
distributed = { path = "../../crates/distributed" }
eventexec = { path = "../../crates/eventexec" }
futures = { workspace = true }
generated = { path = "../../generated" }
metrics = { workspace = true }
postgres = { path = "../../adapters/postgres" }
primitives = { path = "../../crates/primitives" }
settings = { path = "../../crates/settings", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
vocab = { path = "../../crates/vocab" }

[dev-dependencies]
eventexec = { path = "../../crates/eventexec", features = ["l2-test-support"] }
postgres = { path = "../../adapters/postgres", features = ["consumer-tx-composition-test-support"] }
settings = { path = "../../crates/settings", features = ["test-support"] }
testkit = { path = "../../crates/testkit" }
tracing-subscriber = { workspace = true }
trybuild = { workspace = true }
