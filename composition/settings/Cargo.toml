[package]
name = "settings-composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "settings_composition"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
bootstrap = { path = "../../crates/bootstrap" }
diport = { path = "../../crates/diport" }
postgres = { path = "../../adapters/postgres", features = ["domain-settings"] }
primitives = { path = "../../crates/primitives" }
secure = { path = "../../crates/secure" }
settings = { path = "../../crates/settings" }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
vocab = { path = "../../crates/vocab" }
vault = { path = "../../adapters/vault", features = ["backend"] }

[features]
test-support = ["postgres/test-support"]

[dev-dependencies]
postgres = { path = "../../adapters/postgres", features = ["domain-settings", "test-support"] }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
