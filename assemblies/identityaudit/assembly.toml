name = "identityaudit"
profile = "demo"
domains = ["identity", "audit"]
topology = "demo"

[[listeners]]
kind = "primary"
domains = ["identity"]

[[listeners]]
kind = "admin"
domains = ["audit"]

[[diportProviders]]
port = "diport::Signer"
provider = "vault::VaultSigner"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-access-token-signing"
outputs = ["resources"]

[[diportProviders]]
port = "diport::Pdp"
provider = "oidc::OidcProvider"
providerCrate = "oidc"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-credential-verification-capability-witness"
outputs = ["resources"]

[[diportProviders]]
port = "diport::AuditSink"
provider = "postgres::PgAuthAuditSink"
providerCrate = "postgres"
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "http-auth-decision-audit"
outputs = ["resources", "workers"]
