schemaVersion = 2
name = "identityaudit"
profile = "production"
domains = ["identity", "audit"]
topology = "durable-isolated"
frameworkContracts = [{ id = "runtime.inventory", listener = "admin" }]
workflowActivations = [
    { mode = "projection", id = "audit.session-projection", definitionVersion = "v2", definitionSchemaDigest = "sha256:f741f3d37379a56dcafe564b4b7c79d495e8a683534abcc9216cb87a1ab1bf82", targetGeneration = "v2", activation = "disabled" },
]

[[listeners]]
kind = "primary"
domains = ["identity"]

[[listeners]]
kind = "admin"
domains = ["audit"]

[[listeners]]
kind = "health"
domains = []

[[diportProviders]]
id = "event-publisher"
port = "diport::Publisher"
provider = "amqp::AmqpPublisher"
providerCrate = "amqp"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "identity-outbox-relay-amqp-publish"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "event-subscriber"
port = "diport::AckableSubscriber"
provider = "amqp::AmqpSubscriber"
providerCrate = "amqp"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "identity-audit-event-consume-at-least-once"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "identity-signer"
port = "diport::Signer"
provider = "vault::VaultSigner"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-access-token-signing"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "dlx-archive-key-provider"
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "identityaudit-dead-letter-hot-payload-protection"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "listener-pdp"
port = "diport::Pdp"
provider = "oidc::OidcProvider"
providerCrate = "oidc"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-credential-verification-capability-witness"
outputs = ["probes", "resources"]

[[diportProviders]]
id = "auth-audit-sink"
port = "diport::AuditSink"
provider = "postgres::PgAuthAuditSink"
providerCrate = "postgres"
requiredFeatures = ["auth-audit-sink"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "http-auth-decision-audit"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "listener-rate-limiter"
port = "diport::RateLimiter"
provider = "redis::RedisRateLimiter"
providerCrate = "redis"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
scope = "cluster-global"
failurePosture = "fail-open"
purpose = "trusted-client distributed request rate limiting before authentication"
outputs = []

[[diportProviders]]
id = "distributed-lock-store"
port = "diport::LockStore"
provider = "redis::RedisLockStore"
providerCrate = "redis"
requiredFeatures = ["backend"]
consumer = "distributed"
lifecycle = "active"
durability = "persistent"
purpose = "outbox-maintenance-distributed-lock-fencing"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "distributed-cas-store"
port = "diport::CasStore"
provider = "postgres::PgCasStore"
providerCrate = "postgres"
consumer = "distributed"
lifecycle = "active"
durability = "persistent"
purpose = "outbox-maintenance-distributed-state-cas"
outputs = ["probes", "resources", "workers"]
