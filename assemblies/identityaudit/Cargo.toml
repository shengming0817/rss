[package]
name = "identityaudit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
assembly-schema = { path = "../../crates/assembly-schema" }

[lib]
name = "identityaudit"
path = "src/lib.rs"

[features]
default = []
# Empty marker: sole eligibility owner for the runtime-image acceptance target.
artifact-acceptance = []
test-support = [
    "httpd/test-support",
    "httpserve/test-util",
    "runtimeexec/test-support",
    "dep:ids",
    "dep:ratelimit",
]

[[bin]]
name = "identityaudit-server"
path = "src/main.rs"

[[test]]
name = "artifact_acceptance"
path = "tests/artifact_acceptance.rs"

[[test]]
name = "runtime_image_acceptance"
path = "tests/runtime_image_acceptance.rs"
required-features = ["artifact-acceptance"]

[dependencies]
rss-request-context.workspace = true
amqp = { path = "../../adapters/amqp", features = ["backend"] }
anyhow = { workspace = true }
assembly-schema = { path = "../../crates/assembly-schema" }
audit = { path = "../../crates/audit" }
audit-composition = { path = "../../composition/audit" }
authn = { path = "../../crates/authn" }
axum = { workspace = true }
base64 = { workspace = true }
bootstrap = { path = "../../crates/bootstrap" }
crypto-adapter = { path = "../../adapters/crypto" }
diport = { path = "../../crates/diport" }
deadpool-redis = { workspace = true }
distributed = { path = "../../crates/distributed" }
eventexec = { path = "../../crates/eventexec" }
eventing-composition = { path = "../../composition/eventing", features = ["audit-consumers"] }
generated = { path = "../../generated" }
httpd = { path = "../../adapters/httpd" }
authmint = { path = "../../crates/authmint" }
httpserve = { path = "../../crates/httpserve" }
identity = { path = "../../crates/identity" }
ids = { path = "../../crates/ids", optional = true }
identity-composition = { path = "../../composition/identity" }
jsonschema = { workspace = true }
oidc = { path = "../../adapters/oidc", features = ["backend"] }
postgres = { path = "../../adapters/postgres", features = ["domain-identity", "domain-audit", "auth-audit-sink"] }
prometheus_adapter = { package = "prometheus-adapter", path = "../../adapters/prometheus", features = ["backend"] }
primitives = { path = "../../crates/primitives" }
redis = { package = "redis-adapter", path = "../../adapters/redis", features = ["backend"] }
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots"] }
runtimeexec = { path = "../../crates/runtimeexec" }
runctx = { path = "../../crates/runctx" }
secure = { path = "../../crates/secure" }
schemars = { workspace = true }
ratelimit = { path = "../../adapters/ratelimit", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vault = { path = "../../adapters/vault", features = ["backend"] }
vocab = { path = "../../crates/vocab" }
zeroize = { workspace = true }

[dev-dependencies]
ratelimit = { path = "../../adapters/ratelimit" }
audit-composition = { path = "../../composition/audit", features = ["test-support"] }
httpserve = { path = "../../crates/httpserve", features = ["test-util"] }
identity-composition = { path = "../../composition/identity", features = ["test-support"] }
postgres = { path = "../../adapters/postgres", features = ["domain-identity", "domain-audit", "auth-audit-sink", "test-support"] }
p256 = { workspace = true }
testkit = { path = "../../crates/testkit" }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
