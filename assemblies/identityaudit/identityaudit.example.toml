# identityaudit schemaVersion=2 sample. Export all fixed secret environment variables before
# launch; secret values are never stored in this document. Plaintext providers are accepted only
# at literal loopback IP addresses.
schemaVersion = 2

[listeners]
requestBudgetMs = 30000

[listeners.primary]
bind = "127.0.0.1:8080"

[listeners.admin]
bind = "127.0.0.1:8081"

[listeners.health]
bind = "127.0.0.1:8083"

[identity]
issuer = "https://identity.example.com"
audience = "rss-identityaudit"
keyId = "identity-access-es256"
accessTtlSeconds = 900
authGrantTtlSeconds = 2592000
refreshTtlSeconds = 2592000
passwordBlocklistPath = "/run/rss/password-blocklist.sha256"

[oidc]
issuer = "https://identity.example.com"
audience = "rss-identityaudit"
jwksPath = "/run/rss/oidc.jwks.json"
refreshSeconds = 30

[postgres.connection]
host = "postgres.example.com"
port = 5432
database = "rss"
sslRootCertPath = "/run/rss/postgres-ca.pem"

[postgres.writer]
username = "rss_identity_writer"
maxConnections = 10

[postgres.reader]
username = "rss_identity_reader"
maxConnections = 10

[postgres.auditAdmin]
username = "rss_audit_admin"
maxConnections = 5

[vault]
addr = "https://vault.example.com:8200"
caCertPemPath = "/run/rss/vault-ca.pem"
transitMount = "transit"
signingKeyName = "identity-access-es256"
dlxPayloadKeyName = "identityaudit-dlx-payload"
readinessSeconds = 10

[eventing]
amqpCaCertPemPath = "/run/rss/amqp-ca.pem"
auditChainKeyId = 1
tenantAuthorityTtlSeconds = 3600
tenantAuthorityClockSkewSeconds = 60

[redis]
caCertPemPath = "/run/rss/redis-ca.pem"
