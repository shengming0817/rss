schemaVersion = 1

[[assemblies]]
name = "identityaudit"
lifecycle = "supported"

[assemblies.binary]
package = "identityaudit"
target = "identityaudit-server"

[assemblies.image]
dockerfile = "Dockerfile"
target = "identityaudit-runtime"

[assemblies.configSchema]
kind = "json-schema"
path = "assemblies/identityaudit/config.schema.json"

[assemblies.healthInventory]
owner = "runtimeexec"
listener = "health"

[assemblies.journey]
kind = "cargo-test"
package = "journeys"
target = "identityaudit_runtime"
test = "identityaudit_login_audit_ready_sigterm_drain"

[assemblies.deployment]
migrationMode = "forwardOnlyTwoPhase"
availabilityClass = "maintenanceWindow"
drainSeconds = 50
migrationArtifact = { image = "ghcr.io/gocell/rss-operator@sha256:8cf9af483e68f4c086f8fc49dca072fe43b528f35b2e95da309d5d29a310f35d", sourceRevision = "0f386a442354452055c8dcd621316ed1768fdbdf" }
migrationExecutionBudget = { activeDeadlineSeconds = 900, backoffLimit = 0 }
replicaDatabaseBudget = { minReplicas = 2, maxReplicas = 10, poolCeilings = { writer = 10, reader = 10, auditAdmin = 5 }, databaseConnectionLimit = 400, reservedConnections = 100 }

[assemblies.deployment.runtimePlan]
path = "assemblies/identityaudit/runtime-plan.json"
profile = "production"

[[assemblies.deployment.workloads]]
name = "identityaudit"
image = "ghcr.io/gocell/rss-identityaudit@sha256:0dc0251564b714e89c8d098560ddfe69eb08c87fb85ac87323c54a7650126592"
sourceRevision = "0f386a442354452055c8dcd621316ed1768fdbdf"
applicationConfig = "identityAuditV1"
ingressPeerIdentities = ["spiffe://rss.local/ns/rss/sa/ingress-gateway"]
[assemblies.deployment.workloads.identity]
name = "identityaudit"
serviceAccount = "identityaudit"
[assemblies.deployment.workloads.resources.requests]
cpu = "250m"
memory = "256Mi"
[assemblies.deployment.workloads.resources.limits]
cpu = "2"
memory = "1Gi"
[[assemblies.deployment.workloads.secretBindings]]
purpose = "migrationDatabaseUrl"
consumers = ["migration"]
vault = { storeId = "rss-vault", refKey = "identityaudit/database-url" }
[[assemblies.deployment.workloads.secretBindings]]
purpose = "servingDatabaseUrl"
consumers = ["serving"]
vault = { storeId = "rss-vault", refKey = "identityaudit/serving-database-url" }
[[assemblies.deployment.workloads.secretBindings]]
purpose = "servingSecretBundle"
consumers = ["serving"]
vault = { storeId = "rss-vault", refKey = "identityaudit/serving-secret-bundle" }
[[assemblies.deployment.workloads.probes]]
kind = "startup"
port = 8083
[[assemblies.deployment.workloads.probes]]
kind = "readiness"
port = 8083
[[assemblies.deployment.workloads.probes]]
kind = "liveness"
port = 8083

[[assemblies.deployment.services]]
name = "identityaudit"
workload = "identityaudit"
[[assemblies.deployment.services.ports]]
name = "admin"
port = 8081
exposure = "serviceExposed"
[[assemblies.deployment.services.ports]]
name = "health"
port = 8083
exposure = "serviceExposed"
[[assemblies.deployment.services.ports]]
name = "http"
port = 8080
exposure = "serviceExposed"

[[assemblies]]
name = "runtime"
lifecycle = "supported"

[assemblies.binary]
package = "server"
target = "server"

[assemblies.image]
dockerfile = "Dockerfile"
target = "runtime"

[assemblies.configSchema]
kind = "typed-env-catalog"
path = "assemblies/runtime/src/config.rs"

[assemblies.healthInventory]
owner = "runtimeexec"
listener = "health"

[assemblies.journey]
kind = "compose-smoke-v1"
path = "deploy/smoke.sh"

[assemblies.deployment]
migrationMode = "forwardOnlyTwoPhase"
availabilityClass = "maintenanceWindow"
drainSeconds = 20
migrationArtifact = { image = "ghcr.io/gocell/rss-operator@sha256:8cf9af483e68f4c086f8fc49dca072fe43b528f35b2e95da309d5d29a310f35d", sourceRevision = "0f386a442354452055c8dcd621316ed1768fdbdf" }
migrationExecutionBudget = { activeDeadlineSeconds = 900, backoffLimit = 0 }
replicaDatabaseBudget = { minReplicas = 2, maxReplicas = 3, poolCeilings = { writer = 5, reader = 5, dlxArchiver = 10, dlxVerifier = 10, dlxPurger = 10 }, databaseConnectionLimit = 200, reservedConnections = 50 }

[assemblies.deployment.runtimePlan]
path = "assemblies/runtime/runtime-plan.json"
profile = "production"

[[assemblies.deployment.workloads]]
name = "runtime"
image = "ghcr.io/gocell/rss-runtime@sha256:d92c6a81b2ff50096bcda80885427d1f59a25b5f483f7055523504925d16ab23"
sourceRevision = "0f386a442354452055c8dcd621316ed1768fdbdf"
applicationConfig = "none"
[assemblies.deployment.workloads.identity]
name = "runtime"
serviceAccount = "runtime"
[assemblies.deployment.workloads.resources.requests]
cpu = "500m"
memory = "512Mi"
[assemblies.deployment.workloads.resources.limits]
cpu = "4"
memory = "2Gi"
[[assemblies.deployment.workloads.secretBindings]]
purpose = "migrationDatabaseUrl"
consumers = ["migration"]
vault = { storeId = "rss-vault", refKey = "runtime/database-url" }
[[assemblies.deployment.workloads.secretBindings]]
purpose = "servingDatabaseUrl"
consumers = ["serving"]
vault = { storeId = "rss-vault", refKey = "runtime/serving-database-url" }
[[assemblies.deployment.workloads.secretBindings]]
purpose = "servingSecretBundle"
consumers = ["serving"]
vault = { storeId = "rss-vault", refKey = "runtime/serving-secret-bundle" }
[[assemblies.deployment.workloads.probes]]
kind = "startup"
port = 8083
[[assemblies.deployment.workloads.probes]]
kind = "readiness"
port = 8083
[[assemblies.deployment.workloads.probes]]
kind = "liveness"
port = 8083

[[assemblies.deployment.services]]
name = "runtime"
workload = "runtime"
[[assemblies.deployment.services.ports]]
name = "admin"
port = 8082
exposure = "serviceExposed"
[[assemblies.deployment.services.ports]]
name = "health"
port = 8083
exposure = "serviceExposed"
[[assemblies.deployment.services.ports]]
name = "http"
port = 8080
exposure = "serviceExposed"

[[assemblies.deployment.services]]
name = "runtime-internal"
workload = "runtime"
[[assemblies.deployment.services.ports]]
name = "internal"
port = 8081
exposure = "workloadOnly"

