schemaVersion = 1

[[assemblies]]
name = "identityaudit"
lifecycle = "supported"

[assemblies.binary]
package = "identityaudit"
target = "identityaudit-server"

[assemblies.image]
dockerfile = "Dockerfile"
target = "identityaudit-runtime"

[assemblies.configSchema]
kind = "json-schema"
path = "assemblies/identityaudit/config.schema.json"

[assemblies.healthInventory]
owner = "runtimeexec"
listener = "health"

[assemblies.journey]
kind = "cargo-test"
package = "journeys"
target = "identityaudit_runtime"
test = "identityaudit_login_audit_ready_sigterm_drain"

[assemblies.deployment.runtimePlan]
path = "assemblies/identityaudit/runtime-plan.json"
profile = "production"

[[assemblies.deployment.workloads]]
name = "identityaudit"
image = "ghcr.io/gocell/rss-identityaudit@sha256:0dc0251564b714e89c8d098560ddfe69eb08c87fb85ac87323c54a7650126592"
[assemblies.deployment.workloads.identity]
name = "identityaudit"
serviceAccount = "identityaudit"
[assemblies.deployment.workloads.resources.requests]
cpu = "250m"
memory = "256Mi"
[assemblies.deployment.workloads.resources.limits]
cpu = "2"
memory = "1Gi"
[[assemblies.deployment.workloads.secretRefs]]
kind = "kubernetesSecret"
name = "rss-identityaudit"
key = "database-url"
[[assemblies.deployment.workloads.secretRefs]]
kind = "kubernetesSecret"
name = "rss-identityaudit"
key = "oidc-client-secret"
[[assemblies.deployment.workloads.secretRefs]]
kind = "vaultRef"
storeId = "rss-vault"
refKey = "identityaudit/signing"
[[assemblies.deployment.workloads.probes]]
kind = "startup"
port = 8082
[[assemblies.deployment.workloads.probes]]
kind = "readiness"
port = 8082
[[assemblies.deployment.workloads.probes]]
kind = "liveness"
port = 8082

[[assemblies.deployment.services]]
name = "identityaudit"
workload = "identityaudit"
[[assemblies.deployment.services.ports]]
name = "admin"
port = 8081
exposure = "serviceExposed"
[[assemblies.deployment.services.ports]]
name = "health"
port = 8082
exposure = "serviceExposed"
[[assemblies.deployment.services.ports]]
name = "http"
port = 8080
exposure = "serviceExposed"

[[assemblies]]
name = "runtime"
lifecycle = "supported"

[assemblies.binary]
package = "server"
target = "server"

[assemblies.image]
dockerfile = "Dockerfile"
target = "runtime"

[assemblies.configSchema]
kind = "typed-env-catalog"
path = "assemblies/runtime/src/config.rs"

[assemblies.healthInventory]
owner = "runtimeexec"
listener = "health"

[assemblies.journey]
kind = "compose-smoke-v1"
path = "deploy/smoke.sh"

[assemblies.deployment.runtimePlan]
path = "assemblies/runtime/runtime-plan.json"
profile = "production"

[[assemblies.deployment.workloads]]
name = "runtime"
image = "ghcr.io/gocell/rss-runtime@sha256:d92c6a81b2ff50096bcda80885427d1f59a25b5f483f7055523504925d16ab23"
[assemblies.deployment.workloads.identity]
name = "runtime"
serviceAccount = "runtime"
[assemblies.deployment.workloads.resources.requests]
cpu = "500m"
memory = "512Mi"
[assemblies.deployment.workloads.resources.limits]
cpu = "4"
memory = "2Gi"
[[assemblies.deployment.workloads.secretRefs]]
kind = "kubernetesSecret"
name = "rss-runtime"
key = "database-url"
[[assemblies.deployment.workloads.secretRefs]]
kind = "kubernetesSecret"
name = "rss-runtime"
key = "oidc-client-secret"
[[assemblies.deployment.workloads.secretRefs]]
kind = "kubernetesSecret"
name = "rss-runtime"
key = "service-token-signing-key"
[[assemblies.deployment.workloads.secretRefs]]
kind = "vaultRef"
storeId = "rss-vault"
refKey = "runtime/keyring"
[[assemblies.deployment.workloads.probes]]
kind = "startup"
port = 8082
[[assemblies.deployment.workloads.probes]]
kind = "readiness"
port = 8082
[[assemblies.deployment.workloads.probes]]
kind = "liveness"
port = 8082

[[assemblies.deployment.services]]
name = "runtime"
workload = "runtime"
[[assemblies.deployment.services.ports]]
name = "admin"
port = 8081
exposure = "serviceExposed"
[[assemblies.deployment.services.ports]]
name = "health"
port = 8082
exposure = "serviceExposed"
[[assemblies.deployment.services.ports]]
name = "http"
port = 8080
exposure = "serviceExposed"

[[assemblies.deployment.services]]
name = "runtime-internal"
workload = "runtime"
[[assemblies.deployment.services.ports]]
name = "internal"
port = 8083
exposure = "workloadOnly"

[[assemblies]]
name = "settingsonly"
lifecycle = "supported"

[assemblies.binary]
