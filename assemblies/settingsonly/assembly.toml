name = "settingsonly"
profile = "demo"
domains = ["settings"]
topology = "demo"
frameworkContracts = []

[[listeners]]
kind = "primary"
domains = ["settings"]

[[diportProviders]]
id = "settings-key-provider"
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "settings"
lifecycle = "active"
durability = "persistent"
purpose = "settings-configvalue-at-rest-encryption"
outputs = ["resources"]

[[diportProviders]]
id = "settings-secret-resolver"
port = "diport::SecretResolver"
provider = "vault::VaultSecretResolver"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "settings"
lifecycle = "active"
durability = "persistent"
purpose = "settings-secret-material-resolution"
outputs = ["resources"]
