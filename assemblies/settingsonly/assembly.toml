schemaVersion = 2
name = "settingsonly"
profile = "production"
domains = ["settings"]
topology = "durable-isolated"
typedDomainInputs = true
frameworkContracts = [{ id = "runtime.inventory", listener = "admin" }]
workflowActivations = [
    { mode = "projection", id = "settings.config-projection", definitionVersion = "v3", definitionSchemaDigest = "sha256:ce6e2126b5d5831f67955d1db29fc7c0c1cc339cdf4cec1ad2486f5fb778b4d8", targetGeneration = "v3", activation = "active" },
]

[[listeners]]
kind = "primary"
domains = ["settings"]

[[listeners]]
kind = "admin"
domains = []

[[listeners]]
kind = "health"
domains = []

[[diportProviders]]
id = "settings-key-provider"
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "settings"
lifecycle = "active"
durability = "persistent"
purpose = "settings-configvalue-at-rest-encryption"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "listener-pdp"
port = "diport::Pdp"
provider = "oidc::OidcProvider"
providerCrate = "oidc"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-credential-verification"
outputs = ["probes", "resources"]

[[diportProviders]]
id = "auth-audit-sink"
port = "diport::AuditSink"
provider = "postgres::PgAuthAuditSink"
providerCrate = "postgres"
requiredFeatures = ["auth-audit-sink"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "http-auth-decision-audit"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "listener-rate-limiter"
port = "diport::RateLimiter"
provider = "redis::RedisRateLimiter"
providerCrate = "redis"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
scope = "cluster-global"
failurePosture = "fail-open"
purpose = "trusted-client distributed request rate limiting (pre-auth, DoS/brute-force protection)"
outputs = []

[[diportProviders]]
