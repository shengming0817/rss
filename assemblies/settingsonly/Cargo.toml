[package]
name = "settingsonly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
assembly-schema = { path = "../../crates/assembly-schema" }

[lib]
name = "settingsonly"
path = "src/lib.rs"

[[bin]]
name = "settingsonly-server"
path = "src/main.rs"

[[test]]
name = "settingsonly_artifact_acceptance"
path = "tests/artifact_acceptance.rs"

[features]
default = []
test-support = [
    "settings-composition/test-support",
    "httpserve/test-util",
    "runtimeexec/test-support",
]

[dependencies]
anyhow = { workspace = true }
amqp = { path = "../../adapters/amqp", features = ["backend"] }
authn = { path = "../../crates/authn" }
aws-credential-types = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-http-client = { workspace = true }
axum = { workspace = true }
assembly-schema = { path = "../../crates/assembly-schema" }
bootstrap = { path = "../../crates/bootstrap" }
consistency = { path = "../../crates/consistency" }
crypto = { package = "crypto-adapter", path = "../../adapters/crypto" }
diport = { path = "../../crates/diport" }
distributed = { path = "../../crates/distributed" }
eventexec = { path = "../../crates/eventexec" }
eventing-composition = { path = "../../composition/eventing", features = ["settings-consumers"] }
generated = { path = "../../generated" }
httpd = { path = "../../adapters/httpd" }
httpserve = { path = "../../crates/httpserve" }
oidc = { path = "../../adapters/oidc", features = ["backend"] }
postgres = { path = "../../adapters/postgres", features = ["domain-settings", "auth-audit-sink"] }
prometheus_adapter = { package = "prometheus-adapter", path = "../../adapters/prometheus", features = [
    "backend",
] }
primitives = { path = "../../crates/primitives" }
ratelimit = { path = "../../adapters/ratelimit" }
redis = { package = "redis-adapter", path = "../../adapters/redis", features = ["backend"] }
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots"] }
runtimeexec = { path = "../../crates/runtimeexec" }
runctx = { path = "../../crates/runctx" }
schemars = { workspace = true }
secure = { path = "../../crates/secure" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
settings = { path = "../../crates/settings", features = ["seed-data"] }
settings-composition = { path = "../../composition/settings" }
s3 = { path = "../../adapters/s3", features = ["backend"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vault = { path = "../../adapters/vault", features = ["backend"] }
vocab = { path = "../../crates/vocab" }
zeroize = { workspace = true }

[dev-dependencies]
httpserve = { path = "../../crates/httpserve", features = ["test-util"] }
vault = { path = "../../adapters/vault", features = ["backend", "test-support"] }
base64 = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
postgres = { path = "../../adapters/postgres", features = ["domain-settings", "auth-audit-sink", "test-support"] }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
secure = { path = "../../crates/secure" }
jsonschema = { workspace = true }
serde_json = { workspace = true }
settings-composition = { path = "../../composition/settings", features = ["test-support"] }
testkit = { path = "../../crates/testkit", features = ["containers"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-rustls = { workspace = true }
vocab = { path = "../../crates/vocab" }
wiremock = { workspace = true }
