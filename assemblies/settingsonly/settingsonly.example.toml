# settingsonly schemaVersion=2 production sample. Secret values live only in the fixed serving
# secret bundle; AMQP requires distinct settingsAmqpPublisherUrl/settingsAmqpSubscriberUrl fields,
# with no single-URL alias or ambient credential fallback.
schemaVersion = 2
profile = "production"
topology = "durable-isolated"

[listeners]
requestBudgetMs = 15000

[listeners.primary]
bind = "127.0.0.1:8080"

[listeners.admin]
bind = "127.0.0.1:8082"

[listeners.health]
bind = "127.0.0.1:8083"

[federated]
issuer = "https://issuer.example.com"
audience = "rss-settingsonly"
jwksPath = "/run/rss/federated.jwks.json"
refreshSeconds = 30
trustedKinds = ["user", "device", "admin", "superAdmin"]

[postgres]
host = "postgres.example.com"
port = 5432
database = "rss"
sslMode = "verifyFull"
sslRootCertPath = "/run/rss/postgres-ca.pem"
readinessSeconds = 15

[postgres.writer]
username = "rss_settings_writer"
maxConnections = 10

[postgres.reader]
username = "rss_settings_reader"
maxConnections = 10

[postgres.dlxArchiver]
username = "rss_dlx_archiver"
maxConnections = 2

[postgres.dlxVerifier]
username = "rss_dlx_verifier"
maxConnections = 2

[postgres.dlxPurger]
username = "rss_dlx_purger"
maxConnections = 2

[vault]
addr = "https://vault.example.com:8200"
caCertPemPath = "/run/rss/vault-ca.pem"
transitMount = "transit"
settingsKeyName = "settings-config-value"
readinessSeconds = 10

[[vault.tenantStoreAllowlist]]
tenantId = "00000000-0000-4000-8000-000000000147"
storeId = "vault"
mount = "secret"
kvPathPrefix = "tenants/settings"

[eventing]
amqpCaCertPemPath = "/run/rss/amqp-ca.pem"
publisherConfirmTimeoutMs = 5000

[redis]
caCertPemPath = "/run/rss/redis-ca.pem"
readinessSeconds = 5

[tenantAuthority]
ttlSeconds = 3600
clockSkewSeconds = 60

[dlx]
hotKeyName = "settings-dlx-hot"
archiveKeyName = "settings-dlx-archive"
readinessSeconds = 5

[s3]
endpoint = "https://s3.example.com"
region = "us-east-1"
archiveBucket = "rss-settingsonly-dlx"
forcePathStyle = false
caCertPemPath = "/run/rss/s3-ca.pem"
readinessSeconds = 5

[readiness]
startupTimeoutSeconds = 30

[drain]
totalSeconds = 60
