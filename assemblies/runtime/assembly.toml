schemaVersion = 2
name = "runtime"
profile = "production"
domains = ["settings", "identity", "audit"]
topology = "durable-shared"
frameworkContracts = [{ id = "runtime.inventory", listener = "admin" }]
workflowActivations = [
    { mode = "projection", id = "settings.config-projection", definitionVersion = "v3", definitionSchemaDigest = "sha256:ce6e2126b5d5831f67955d1db29fc7c0c1cc339cdf4cec1ad2486f5fb778b4d8", targetGeneration = "v3", activation = "disabled" },
    { mode = "projection", id = "audit.session-projection", definitionVersion = "v2", definitionSchemaDigest = "sha256:f741f3d37379a56dcafe564b4b7c79d495e8a683534abcc9216cb87a1ab1bf82", targetGeneration = "v2", activation = "disabled" },
]

[[listeners]]
kind = "primary"
domains = ["settings", "identity"]

[[listeners]]
kind = "internal"
domains = []

[[listeners]]
kind = "admin"
domains = ["audit"]

[[listeners]]
kind = "health"
domains = []

[[diportProviders]]
id = "device-revocation-store"
port = "diport::RevocationStore"
provider = "postgres::PgRevocationStore"
providerCrate = "postgres"
requiredFeatures = []
consumer = "deviceloop"
lifecycle = "active"
durability = "persistent"
purpose = "device-certificate-revocation"
outputs = ["probes", "workers"]

# eventbus 真传输 topology-gated 接线（#1251）：durable 拓扑下注入真 amqp publisher/subscriber（lapin，
# backend feature）。consistency-engine port（OutboxRelay、InboxStore）经 topology resolver
# 在代码中接线 + 编译期 feature 门控（type-system Hard），非 diport-infra port，不在此声明。
# production profile 下 publisher/subscriber 均为 active persistent 真后端。
[[diportProviders]]
id = "event-publisher"
port = "diport::Publisher"
provider = "amqp::AmqpPublisher"
providerCrate = "amqp"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "outbox-relay-amqp-publish"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "event-subscriber"
port = "diport::AckableSubscriber"
provider = "amqp::AmqpSubscriber"
providerCrate = "amqp"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "event-consume-at-least-once"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "identity-signer"
port = "diport::Signer"
provider = "vault::VaultSigner"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-access-token-signing"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "settings-key-provider"
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "settings"
lifecycle = "active"
durability = "persistent"
purpose = "settings-configvalue-at-rest-encryption"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "settings-secret-resolver"
port = "diport::SecretResolver"
provider = "vault::VaultSecretResolver"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "settings"
lifecycle = "active"
durability = "persistent"
purpose = "settings-secret-material-resolution"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "listener-pdp"
port = "diport::Pdp"
provider = "oidc::OidcProvider"
providerCrate = "oidc"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-credential-verification"
outputs = ["probes", "resources"]

[[diportProviders]]
id = "service-token-replay-store"
port = "diport::ServiceTokenReplayStore"
provider = "postgres::PgServiceTokenReplayStore"
providerCrate = "postgres"
consumer = "oidc"
lifecycle = "active"
durability = "persistent"
scope = "cluster-global"
failurePosture = "fail-closed"
purpose = "service-token-atomic-replay-consume"
outputs = ["probes", "resources", "workers"]

# HTTP auth 决策审计 sink：runtime 经 audit domain 注入 postgres durable flat sink（PgAuthAuditSink）。
[[diportProviders]]
id = "auth-audit-sink"
port = "diport::AuditSink"
provider = "postgres::PgAuthAuditSink"
providerCrate = "postgres"
requiredFeatures = ["auth-audit-sink"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "http-auth-decision-audit"
outputs = ["probes", "resources", "workers"]

# edge 防护：per-peer-IP 限流（#1106，pre-auth DoS/brute-force 防护）——httpserve 消费、active。
[[diportProviders]]
id = "listener-rate-limiter"
port = "diport::RateLimiter"
provider = "ratelimit::GovernorLimiter"
providerCrate = "ratelimit"
consumer = "httpserve"
lifecycle = "active"
durability = "ephemeral-memory"
purpose = "per-peer-IP request rate limiting (pre-auth, DoS/brute-force 防护)"
outputs = []

# distributed lock/CAS providers（#1571 go-live）：runtime 经 `wire_distributed(&SharedRuntimeDeps)` 从
# `deps.redis.infra().lock_store()` + `deps.pg.infra().cas_store()` 构造 `DistributedRuntimeDeps`，并作为
# event transport outbox maintenance coordinator 的必填参数注入。production 不保留 draft CAS 旁路。
[[diportProviders]]
id = "distributed-lock-store"
port = "diport::LockStore"
provider = "redis::RedisLockStore"
providerCrate = "redis"
requiredFeatures = ["backend"]
consumer = "distributed"
lifecycle = "active"
durability = "persistent"
purpose = "distributed-lock-fencing"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "distributed-cas-store"
port = "diport::CasStore"
provider = "postgres::PgCasStore"
providerCrate = "postgres"
consumer = "distributed"
lifecycle = "active"
durability = "persistent"
purpose = "distributed-state-cas"
outputs = ["probes", "resources", "workers"]

# S3 object-store provider（#1164）：runtime canary 对真实 bucket 执行 put/get/delete/get-miss，
# readiness 失败即摘流；adapter 经 backend feature 启 AWS SDK 真身。
[[diportProviders]]
id = "runtime-object-store"
port = "diport::ObjectStore"
provider = "s3::S3Store"
providerCrate = "s3"
requiredFeatures = ["backend"]
consumer = "runtime"
lifecycle = "active"
durability = "persistent"
purpose = "runtime-s3-readiness-canary"
outputs = ["resources"]

# DLX lifecycle funnel (#1168/#1536-#1539): all cross-tenant PostgreSQL operations stay behind
# the exact-role fixed-function repository; the archive store is only constructible after the
# startup WORM capability gate; the existing KeyProvider port carries a distinct archive workload.
[[diportProviders]]
id = "dlx-lifecycle-repository"
port = "diport::DlxLifecycleRepository"
provider = "postgres::PgDlxLifecycleRepository"
providerCrate = "postgres"
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "dead-letter-archive-receipt-purge-reconcile"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "dlx-archive-store"
port = "diport::DlxArchiveStore"
provider = "s3::VerifiedS3DlxArchiveStore"
providerCrate = "s3"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "dead-letter-compliance-worm-archive"
outputs = ["probes", "workers"]

[[diportProviders]]
id = "dlx-archive-key-provider"
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "dead-letter-independent-archive-key-provider"
outputs = ["probes", "resources", "workers"]
