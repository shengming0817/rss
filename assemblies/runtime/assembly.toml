name = "runtime"
profile = "demo"

[[diportProviders]]
port = "diport::RevocationStore"
provider = "softca::InMemRevocationLedger"
providerCrate = "softca"
consumer = "deviceloop"
lifecycle = "draft"
durability = "ephemeral-memory"
purpose = "device-certificate-revocation"

# eventbus 真传输 topology-gated 接线（#1251）：durable 拓扑下注入真 amqp publisher/subscriber（lapin，
# backend feature）。consistency-engine port（OutboxSource/Relay、IdempotencyStore）经 topology resolver
# 在代码中接线 + 编译期 feature 门控（type-system Hard），非 diport-infra port，不在此声明。
# profile 仍为 demo：翻 production 受阻于上方 RevocationStore 尚为 draft/ephemeral（#1252/#1254）。
# 生产化 checklist：① #1252 RevocationStore → persistent provider；② #1254 device 接线；③ 本文件 profile demo→production
[[diportProviders]]
port = "diport::Publisher"
provider = "amqp::AmqpPublisher"
providerCrate = "amqp"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "outbox-relay-amqp-publish"

[[diportProviders]]
port = "diport::AckableSubscriber"
provider = "amqp::AmqpSubscriber"
providerCrate = "amqp"
requiredFeatures = ["backend"]
consumer = "eventexec"
lifecycle = "active"
durability = "persistent"
purpose = "event-consume-at-least-once"

[[diportProviders]]
port = "diport::Signer"
provider = "vault::VaultSigner"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-access-token-signing"

[[diportProviders]]
port = "diport::KeyProvider"
provider = "vault::VaultKeyProvider"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "settings"
lifecycle = "active"
durability = "persistent"
purpose = "settings-configvalue-at-rest-encryption"

[[diportProviders]]
port = "diport::Pdp"
provider = "oidc::OidcProvider"
providerCrate = "oidc"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "jwt-credential-verification"

# edge 防护：per-peer-IP 限流（#1106，pre-auth DoS/brute-force 防护）——httpserve 消费、active。
[[diportProviders]]
port = "diport::RateLimiter"
provider = "ratelimit::GovernorLimiter"
providerCrate = "ratelimit"
consumer = "httpserve"
lifecycle = "active"
durability = "ephemeral-memory"
purpose = "per-peer-IP request rate limiting (pre-auth, DoS/brute-force 防护)"

# distributed lock/CAS providers（#1571 go-live）：runtime 经 `wire_distributed(&SharedRuntimeDeps)` 从
# `deps.redis.infra().lock_store()` + `deps.pg.infra().cas_store()` 构造 `DistributedRuntimeDeps`，并作为
# event transport outbox maintenance coordinator 的必填参数注入。Redis CAS 仍是 draft alternative。
[[diportProviders]]
port = "diport::LockStore"
provider = "redis::RedisLockStore"
providerCrate = "redis"
consumer = "distributed"
lifecycle = "active"
durability = "persistent"
purpose = "distributed-lock-fencing"

[[diportProviders]]
port = "diport::CasStore"
provider = "postgres::PgCasStore"
providerCrate = "postgres"
consumer = "distributed"
lifecycle = "active"
durability = "persistent"
purpose = "distributed-state-cas"

[[diportProviders]]
port = "diport::CasStore"
provider = "redis::RedisCasStore"
providerCrate = "redis"
consumer = "distributed"
lifecycle = "draft"
durability = "persistent"
purpose = "distributed-state-cas-redis-alternative"
