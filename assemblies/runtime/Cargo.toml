[package]
name = "runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# 组合根（Root 层）：抽自 bins/rss + bins/server 的共享运行时编排逻辑（#1309 消除 bins 双写）。
# lib 形态：组合根接线逻辑落 lib（`tests/` 集成测试可达 `runtime::*`）。
[lib]
name = "runtime"
path = "src/lib.rs"

[dependencies]
bootstrap = { path = "../../crates/bootstrap" }
httpserve = { path = "../../crates/httpserve" }
authn = { path = "../../crates/authn" }
# 验签桥建 runctx::AppCtx + runctx::scope 绑定 ambient（tenant/principal），下游（enforce + handler +
# diport emit）经 runctx::try_current 取（#1105，ADR-002 §D5）。
runctx = { path = "../../crates/runctx" }
vocab = { path = "../../crates/vocab" }
primitives = { path = "../../crates/primitives" }
diport = { path = "../../crates/diport" }
# 生产验签 provider（真 RustCrypto ES256/HS256；backend feature 开 impl diport::Pdp）。安全同批门：依赖图引真
# verifier、不引 stub（memory adapter 经 deny.toml 禁 server/rss；runtime 同策）。
oidc = { path = "../../adapters/oidc", features = ["backend"] }
# settings 域（SecretService + SettingsService + empty_flag_store 工厂）。
# seed-data feature 开：empty_flag_store（in-mem 空 flag store）可用——生产 flag store 待 #1120，
# 当前空 store 满足 fail-closed 语义（未知 flag 返回 false）。
settings = { path = "../../crates/settings", features = ["seed-data"] }
# audit 域（AuditDomain + AuditChainHasher/DynAuditRepo port；#1230 wire_audit）。
audit = { path = "../../crates/audit" }
# identity 域（LoginService + IdentityDomain；identity.login active serving）。
identity = { path = "../../crates/identity" }
# 生产 MacVerifier backend（RustCrypto hmac/sha2；audit keyed-HMAC 链 verifier，#1230）。
crypto-adapter = { path = "../../adapters/crypto" }
# postgres adapter（PgStore + PgConfig + PoolReadiness + PgConfigRepo + PgSecretRepo + PgDbReadiness + PgAuditRepo + 采样组件）。
postgres = { path = "../../adapters/postgres" }
# eventbus 真传输 topology-gated 接线（#1251/#1434）：durable transport = amqp publisher/subscriber
# （backend=真 lapin，不拉 testkit）+ eventexec relay/consumer 执行体；consumer 幂等走 PG inbox。
amqp = { path = "../../adapters/amqp", features = ["backend"] }
# Redis adapter（package=redis-adapter，import 名 redis；RedisRuntimeDeps + distlock/CAS/idempotency）。
redis = { package = "redis-adapter", path = "../../adapters/redis", features = ["backend"] }
eventexec = { path = "../../crates/eventexec" }
deadpool-redis = { workspace = true }
# Vault KV v2 secret 解析 adapter（VaultSecretResolver + TenantStoreAllowlist；backend feature 开）。
vault = { path = "../../adapters/vault", features = ["backend"] }
# vault secret resolver + Transit Signer 的 HTTP client（组合根 Join 阶段选 TLS feature 并注入预配置 Client，#1252）。
# rustls-tls-webpki-roots = reqwest 经 `__rustls-ring` 选 ring crypto provider（**禁** aws-lc-rs，与 deny.toml openssl/aws-lc ban
# 一致）+ webpki-roots（打包 Mozilla 根，CDLA-Permissive-2.0 已在 deny allow-list）；对齐 sqlx/redis/otel 的 ring 口径。
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots"] }
axum = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# verify_jwt(&DynPdp) future 为 !Send（DynPdp !Sync，DIPORT-ASYNC-ARC-SEND-01）；OidcProvider::verify 纯 CPU 无真
# await ⇒ future 首 poll 即 ready。验签桥经 now_or_never() 同步驱动该 ready future，使中间件 future 保持 Send。
futures = { workspace = true }
# 从配置（env）解 ES256 SEC1 公钥（base64url）。
base64 = { workspace = true }
# 运行时入口（#1320）：tokio 多线程运行时（#[tokio::main]）+ net（PgStore/serve）+ signal（SIGTERM/SIGINT 优雅关停）
# + time（ShutdownStack 超时）+ macros（测试）+ rt-multi-thread。
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
# 关闭取消广播（ShutdownStack root token + httpd serve graceful shutdown）。
tokio-util = { workspace = true }
# HTTP 传输 adapter：HttpServer bind + axum::serve + ManagedResource（经 ShutdownStack 托管）。
httpd = { path = "../../adapters/httpd" }
# in-mem keyed 限流 adapter（GovernorLimiter：per-peer-IP GCRA，diport::RateLimiter impl；#1106 rate-limit wiring）。
# lifecycle=active providerCrate 须直接依赖（contract-fanout.md §DI provider）。
ratelimit = { path = "../../adapters/ratelimit" }
# 生产 tracing subscriber（init_tracing：fmt + RUST_LOG env filter + 可选 otel 桥接 Layer）——否则运行时入口日志全 no-op。
# 同时供 dev e2e 捕获 tracing 输出断言（auth_e2e 埋点）。registry()/fmt::layer() 经默认 fmt feature（fmt→registry）可用。
tracing-subscriber = { workspace = true }
# 可观测性导出 adapter（#1253 Join 接线）：otel = OTLP/gRPC trace 导出 + tracing 桥接 Layer；
# prometheus-adapter（[lib] name = "prometheus"）= 进程级 metrics recorder + /metrics exposition 渲染。
# 二者 backend feature 引真实后端（feature-off 为空壳，组合根需真身故启 backend）。
otel = { path = "../../adapters/otel", features = ["backend"] }
prometheus-adapter = { path = "../../adapters/prometheus", features = ["backend"] }

[features]
# 需要真实后端的集成测试（event transport 使用 postgres + RabbitMQ；其它测试可按需用 Redis）。
# testkit/containers：激活 testcontainers fixture（PgFixture/RabbitFixture/RedisFixture）。
# identity/seed-login：启用 LoginService::with_seed_credential（仅 e2e 测试用；生产组合根不启用）。
integration = ["testkit/containers", "identity/seed-login"]

[dev-dependencies]
# tokio 已是生产 dep（#1320 `#[tokio::main]`）——其 macros + rt-multi-thread feature 同时供 `#[tokio::test]`，不再单列 dev-dep。
# oneshot 驱动已组装 router（health/auth e2e 单元级断言；真实 socket serve 由 httpd + 冒烟 e2e 覆盖）。
tower = { workspace = true, features = ["util"] }
# e2e 铸 ES256/HS256 测试 JWT（dev-only；生产依赖图无签发能力）。
p256 = { workspace = true, features = ["ecdsa"] }
hmac = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
# 集成测试 postgres fixture（testcontainers，仅 integration feature 激活）。
# deny.toml memory wrapper 不含 runtime，故 MemSecretResolver 在 e2e 中用 inline 结构代替（无需 memory dep）。
testkit = { path = "../../crates/testkit" }
# auth_e2e 经 httpserve test-util 构造 funnel 输入（`routes::unfinalized_for_test`）+ 取回裸 Router
# （`AuthenticatedRoutes::into_router_for_test`）做 oneshot；生产构建无此 feature ⇒ 这些入口编译期不存在（ADR-009 §6）。
httpserve = { path = "../../crates/httpserve", features = ["test-util"] }
generated = { path = "../../generated" }
ids = { path = "../../crates/ids" }
secure = { path = "../../crates/secure" }
sqlx = { workspace = true }
# event_transport 单测构造 SubscriberBinding（group 字段类型 consistency::ConsumerGroup）。
consistency = { path = "../../crates/consistency" }
# refresh/login mint→verify e2e（#1252）：wiremock 模拟 vault Transit `/sign`（动态 ES256 签）+ serde_json 编解
# mock 请求/响应；vocab::{TenantId,PrincipalKind} 构造 JwtIssuer::issue 入参（hermetic，无 live vault）。
wiremock = { workspace = true }
serde_json = { workspace = true }
