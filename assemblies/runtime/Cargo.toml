[package]
name = "runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
assembly-schema = { path = "../../crates/assembly-schema" }

# 组合根（Root 层）：抽自 bins/rss + bins/server 的共享运行时编排逻辑（#1309 消除 bins 双写）。
# lib 形态：组合根接线逻辑落 lib（`tests/` 集成测试可达 `runtime::*`）。
[lib]
name = "runtime"
path = "src/lib.rs"

[[test]]
name = "auth_e2e"
path = "tests/auth_e2e.rs"
required-features = ["integration"]

[[test]]
name = "refresh_mint_e2e"
path = "tests/refresh_mint_e2e.rs"
required-features = ["integration"]

[[test]]
name = "key_rotation_e2e"
path = "tests/key_rotation_e2e.rs"
required-features = ["integration"]

[dependencies]
settingsonly = { path = "../settingsonly" }
settings-composition = { path = "../../composition/settings" }
identity-composition = { path = "../../composition/identity" }
audit-composition = { path = "../../composition/audit" }
eventing-composition = { path = "../../composition/eventing", features = ["audit-consumers", "settings-consumers"] }
assembly-schema = { path = "../../crates/assembly-schema" }
bootstrap = { path = "../../crates/bootstrap" }
runtimeexec = { path = "../../crates/runtimeexec" }
authmint = { path = "../../crates/authmint" }
sagaauthmint = { path = "../../crates/sagaauthmint" }
httpserve = { path = "../../crates/httpserve" }
authn = { path = "../../crates/authn" }
# 验签桥建 runctx::AppCtx + runctx::scope 绑定 ambient（tenant/principal），下游（enforce + handler +
# diport emit）经 runctx::try_current 取（#1105，ADR-002 §D5）。
runctx = { path = "../../crates/runctx" }
vocab = { path = "../../crates/vocab" }
primitives = { path = "../../crates/primitives" }
diport = { path = "../../crates/diport" }
secure = { path = "../../crates/secure" }
distributed = { path = "../../crates/distributed" }
consistency = { path = "../../crates/consistency" }
# 生产验签 provider（真 RustCrypto ES256/HS256；backend feature 开 impl diport::Pdp）。安全同批门：依赖图引真
# verifier、不引 stub（memory adapter 经 deny.toml 禁 server/rss；runtime 同策）。
oidc = { path = "../../adapters/oidc", features = ["backend"] }
# settings 域（SecretService + SettingsService + empty_flag_store 工厂）。
# seed-data feature 开：empty_flag_store（in-mem 空 flag store）可用——生产 flag store 待 #1120，
# 当前空 store 满足 fail-closed 语义（未知 flag 返回 false）。
settings = { path = "../../crates/settings", features = ["seed-data"] }
# audit 域（AuditDomain + AuditChainHasher/read-write ports；#1230 wire_audit）。
audit = { path = "../../crates/audit" }
# identity 域（LoginService + IdentityDomain；identity.login active serving）。
identity = { path = "../../crates/identity" }
ids = { path = "../../crates/ids", optional = true }
# 生产 MacVerifier backend（RustCrypto hmac/sha2；audit keyed-HMAC 链 verifier，#1230）。
crypto-adapter = { path = "../../adapters/crypto" }
# postgres adapter（PgStore + PgConfig + PoolReadiness + PgConfigRepo + PgSecretRepo + PgDbReadiness + PgAuditRepo + 采样组件）。
postgres = { path = "../../adapters/postgres", features = ["domain-settings", "domain-identity", "domain-audit", "auth-audit-sink"] }
# eventbus 真传输 topology-gated 接线（#1251/#1434）：durable transport = amqp publisher/subscriber
# （backend=真 lapin，不拉 testkit）+ eventexec relay/consumer 执行体；consumer 幂等走 PG inbox。
amqp = { path = "../../adapters/amqp", features = ["backend"] }
# Redis adapter（package=redis-adapter，import 名 redis；RedisRuntimeDeps + distlock/CAS/inbox）。
redis = { package = "redis-adapter", path = "../../adapters/redis", features = ["backend"] }
# S3 object-store adapter（backend 真 AWS SDK Client；runtime 组合根显式注入 rustls+ring HTTP client）。
s3 = { path = "../../adapters/s3", features = ["backend"] }
eventexec = { path = "../../crates/eventexec" }
generated = { path = "../../generated" }
metrics = { workspace = true }
deadpool-redis = { workspace = true }
# Vault KV v2 secret 解析 adapter（VaultSecretResolver + TenantStoreAllowlist；backend feature 开）。
vault = { path = "../../adapters/vault", features = ["backend"] }
# vault secret resolver + Transit Signer 的 HTTP client（组合根 Join 阶段选 TLS feature 并注入预配置 Client，#1252）。
# rustls-tls-webpki-roots = reqwest 经 `__rustls-ring` 选 ring crypto provider（**禁** aws-lc-rs，与 deny.toml openssl/aws-lc ban
# 一致）+ webpki-roots（打包 Mozilla 根，CDLA-Permissive-2.0 已在 deny allow-list）；对齐 sqlx/redis/otel 的 ring 口径。
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots"] }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-smithy-http-client = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# runtime 其它模块仍使用 BoxFuture / stream；认证桥不再同步轮询 futures（#1828）。
futures = { workspace = true }
# 从配置（env）解 ES256 SEC1 公钥（base64url）。
base64 = { workspace = true }
# OIDC JWKS 维护命令：解 Vault Transit P-256 public key PEM 并输出 ES256 JWK。
p256 = { workspace = true, features = ["ecdsa", "pem"] }
uuid = { workspace = true, features = ["v4"] }
# 运行时入口（#1320）：tokio 多线程运行时（#[tokio::main]）+ net（PgStore/serve）+ signal（SIGTERM/SIGINT 优雅关停）
# + time（ShutdownStack 超时）+ macros（测试）+ rt-multi-thread。
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
# 关闭取消广播（ShutdownStack root token + httpd serve graceful shutdown）。
tokio-util = { workspace = true }
# HTTP 传输 adapter：HttpServer bind + axum::serve + ManagedResource（经 ShutdownStack 托管）。
httpd = { path = "../../adapters/httpd" }
# in-mem keyed 限流 adapter（GovernorLimiter：per-peer-IP GCRA，diport::RateLimiter impl；#1106 rate-limit wiring）。
# lifecycle=active providerCrate 须直接依赖（contract-fanout.md §DI provider）。
ratelimit = { path = "../../adapters/ratelimit" }
# 生产 tracing subscriber（prepare_runtime：snapshot-backed RUST_LOG filter + 可选 otel 桥接 Layer）——否则运行时入口日志全 no-op。
# 同时供 dev e2e 捕获 tracing 输出断言（auth_e2e 埋点）。registry()/fmt::layer() 经默认 fmt feature（fmt→registry）可用。
tracing-subscriber = { workspace = true }
# 可观测性导出 adapter（#1253 Join 接线）：otel = OTLP/gRPC trace 导出 + tracing 桥接 Layer；
# prometheus-adapter（[lib] name = "prometheus"）= 进程级 metrics recorder + /metrics exposition 渲染。
# 二者 backend feature 引真实后端（feature-off 为空壳，组合根需真身故启 backend）。
otel = { path = "../../adapters/otel", features = ["backend"] }
prometheus-adapter = { path = "../../adapters/prometheus", features = ["backend"] }

[features]
# 需要真实后端的集成测试（event transport 使用 postgres + RabbitMQ；其它测试可按需用 Redis）。
# testkit/containers：激活 testcontainers fixture（PgFixture/RabbitFixture/RedisFixture）。
# identity/seed-login：启用 LoginService::with_seed_credential；同时门控 identity wire e2e 所需的
# explicit-value route assembly seam（仅 integration 测试用；默认生产 library 不编译这些入口）。
integration = [
  "testkit/containers",
  "identity/seed-login",
  "amqp/integration-test-support",
  "httpserve/test-util",
  "runtimeexec/test-support",
  "settings-composition/test-support",
  "dep:ids",
]

[dev-dependencies]
# Enable SubscriberBinding::from_test_parts / from_parts_for_test for topology fixtures
# (LAYER-DEPS-09：仅 dev-dep)。
bootstrap = { path = "../../crates/bootstrap", features = ["test-support"] }
ids = { path = "../../crates/ids" }
eventing-composition = { path = "../../composition/eventing", features = ["test-support"] }
vault = { path = "../../adapters/vault", features = ["backend", "test-support"] }
aws-smithy-http-client = { workspace = true, features = ["test-util"] }
http = "1"
metrics-exporter-prometheus = { workspace = true }
settings-composition = { path = "../../composition/settings", features = ["test-support"] }
# Direct service tests bypass the HTTP router only through the explicitly test-gated receipt mint.
settings = { path = "../../crates/settings", features = ["test-support"] }
# 默认单测仅启用 lazy typed capability bundle；不连接 postgres。
postgres = { path = "../../adapters/postgres", features = ["domain-settings", "domain-identity", "domain-audit", "auth-audit-sink", "test-support"] }
# runtime 单元/e2e 测试需要显式构造 domain-local TenantRepoScope；生产依赖不启用 test-support。
authn = { path = "../../crates/authn", features = ["test-support"] }
audit = { path = "../../crates/audit", features = ["test-support"] }
identity = { path = "../../crates/identity", features = ["test-support"] }
# dev-only 虚拟时间（JWKS poll 测试）；生产 tokio feature set 不引 `test-util`。
tokio = { workspace = true, features = ["test-util"] }
# oneshot 驱动已组装 router（health/auth e2e 单元级断言；真实 socket serve 由 httpd + 冒烟 e2e 覆盖）。
tower = { workspace = true, features = ["util"] }
hmac = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
static_assertions = { workspace = true }
trybuild = { workspace = true }
# 集成测试 postgres fixture（testcontainers，仅 integration feature 激活）。
# deny.toml memory wrapper 不含 runtime，故 MemSecretResolver 在 e2e 中用 inline 结构代替（无需 memory dep）。
testkit = { path = "../../crates/testkit" }
# auth_e2e 经 httpserve test-util 构造 funnel 输入（`routes::unfinalized_for_test`）+ 取回裸 Router
# （`AuthenticatedRoutes::into_router_for_test`）做 oneshot；生产构建无此 feature ⇒ 这些入口编译期不存在（ADR-009 §6）。
httpserve = { path = "../../crates/httpserve", features = ["test-util"] }
sqlx = { workspace = true }
# refresh/login mint→verify e2e（#1252）：wiremock 模拟 vault Transit `/sign`（动态 ES256 签）+ serde_json 编解
# mock 请求/响应；authn::AuthGrant 借出 grant-bound typed issuer 入参（hermetic，无 live vault）。
wiremock = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
# Runtime launch unit tests exercise real mTLS serve registration/drain with hermetic TLS material;
# the constructor and rcgen dependency are absent from default httpd production artifacts.
httpd = { path = "../../adapters/httpd", features = ["test-support"] }
