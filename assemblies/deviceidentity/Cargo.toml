[package]
name = "deviceidentity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
assembly-schema = { path = "../../crates/assembly-schema" }

[lib]
name = "deviceidentity"
path = "src/lib.rs"

[features]
default = []
integration = ["testkit/containers"]

[dependencies]
anyhow = { workspace = true }
assembly-schema = { path = "../../crates/assembly-schema" }
bootstrap = { path = "../../crates/bootstrap" }
deviceloop = { path = "../../crates/deviceloop" }
identity = { path = "../../crates/identity" }
identity-composition = { path = "../../composition/identity", features = ["device-mqtt"] }
mqtt = { path = "../../adapters/mqtt" }
postgres = { path = "../../adapters/postgres", features = ["domain-identity"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }

[dev-dependencies]
diport = { path = "../../crates/diport" }
eventexec = { path = "../../crates/eventexec", features = ["test-support"] }
identity = { path = "../../crates/identity", features = ["test-support"] }
ids = { path = "../../crates/ids" }
postgres = { path = "../../adapters/postgres", features = ["domain-identity", "test-support"] }
rumqttc = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
testkit = { path = "../../crates/testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vocab = { path = "../../crates/vocab" }
