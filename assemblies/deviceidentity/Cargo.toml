[package]
name = "deviceidentity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
assembly-schema = { path = "../../crates/assembly-schema" }

[lib]
name = "deviceidentity"
path = "src/lib.rs"

[features]
default = []
artifact-acceptance = ["test-support"]
test-support = ["identity-composition/test-support"]

[[bin]]
name = "deviceidentity-server"
path = "src/main.rs"

[[test]]
name = "runtime_image_acceptance"
path = "tests/runtime_image_acceptance.rs"
required-features = ["artifact-acceptance"]

[dependencies]
anyhow = { workspace = true }
authmint = { path = "../../crates/authmint" }
axum = { workspace = true }
assembly-schema = { path = "../../crates/assembly-schema" }
authn = { path = "../../crates/authn" }
bootstrap = { path = "../../crates/bootstrap" }
deviceloop = { path = "../../crates/deviceloop" }
diport = { path = "../../crates/diport" }
identity = { path = "../../crates/identity" }
identity-composition = { path = "../../composition/identity", features = ["device-mqtt"] }
eventexec = { path = "../../crates/eventexec" }
ids = { path = "../../crates/ids" }
httpd = { path = "../../adapters/httpd" }
httpserve = { path = "../../crates/httpserve" }
mqtt = { path = "../../adapters/mqtt" }
oidc = { path = "../../adapters/oidc", features = ["backend"] }
postgres = { path = "../../adapters/postgres", features = ["domain-identity", "auth-audit-sink"] }
prometheus_adapter = { package = "prometheus-adapter", path = "../../adapters/prometheus", features = ["backend"] }
redis = { package = "redis-adapter", path = "../../adapters/redis", features = ["backend"] }
runtimeexec = { path = "../../crates/runtimeexec" }
runctx = { path = "../../crates/runctx" }
secure = { path = "../../crates/secure" }
primitives = { path = "../../crates/primitives" }
rss-request-context = { path = "../../crates/request-context" }
schemars = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
url = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }
vault = { path = "../../adapters/vault", features = ["backend"] }
vocab = { path = "../../crates/vocab" }

[dev-dependencies]
httpserve = { path = "../../crates/httpserve", features = ["test-util"] }
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
