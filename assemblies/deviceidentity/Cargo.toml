[package]
name = "deviceidentity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
assembly-schema = { path = "../../crates/assembly-schema" }

[lib]
name = "deviceidentity"
path = "src/lib.rs"

[features]
default = []
test-support = ["identity-composition/test-support"]

[dependencies]
anyhow = { workspace = true }
assembly-schema = { path = "../../crates/assembly-schema" }
bootstrap = { path = "../../crates/bootstrap" }
deviceloop = { path = "../../crates/deviceloop" }
identity = { path = "../../crates/identity" }
identity-composition = { path = "../../composition/identity", features = ["device-mqtt"] }
mqtt = { path = "../../adapters/mqtt" }
postgres = { path = "../../adapters/postgres", features = ["domain-identity"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
