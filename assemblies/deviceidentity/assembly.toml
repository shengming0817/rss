schemaVersion = 2
name = "deviceidentity"
profile = "production"
domains = ["identity"]
topology = "durable-isolated"
typedDomainInputs = true
frameworkContracts = []
workflowActivations = []

[[listeners]]
kind = "primary"
domains = ["identity"]

[[listeners]]
kind = "internal"
domains = []

[[listeners]]
kind = "health"
domains = []

[[diportProviders]]
id = "device-certificate-store"
port = "identity::CertificateReconcileRepository"
provider = "postgres::PgDeviceCertificateRepository"
providerCrate = "postgres"
requiredFeatures = ["domain-identity"]
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "production-device-certificate-persistence"
outputs = ["probes"]

[[diportProviders]]
id = "device-command-store"
port = "identity::DeviceCommandStore"
provider = "postgres::PgDeviceCommandStore"
providerCrate = "postgres"
requiredFeatures = ["domain-identity"]
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "production-device-command-and-outbox-persistence"
outputs = ["probes", "workers"]

[[diportProviders]]
id = "device-production-artifact-source"
port = "identity::CertificateArtifactSource"
provider = "identity_composition::ExternalPkiArtifactSource"
providerCrate = "identity-composition"
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "receipt-bound-external-csr-vault-signing"
outputs = []

[[diportProviders]]
id = "external-csr-resolver"
port = "diport::ExternalCsrResolver"
provider = "httpd::SpiffeMtlsExternalCsrResolver"
providerCrate = "httpd"
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "read-only-external-csr-evidence"
outputs = ["probes", "resources"]

[[diportProviders]]
id = "vault-external-pki"
port = "diport::ExternalPkiProviderClosure"
provider = "vault::VaultExternalPkiProviderClosure"
providerCrate = "vault"
requiredFeatures = ["backend"]
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "production-csr-signing"
outputs = ["probes", "resources"]

[[diportProviders]]
id = "listener-pdp"
port = "diport::Pdp"
provider = "oidc::OidcProvider"
providerCrate = "oidc"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "federated-device-policy-authentication"
outputs = ["probes", "resources"]

[[diportProviders]]
id = "auth-audit-sink"
port = "diport::AuditSink"
provider = "postgres::PgAuthAuditSink"
providerCrate = "postgres"
requiredFeatures = ["auth-audit-sink"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
purpose = "durable-http-auth-decision-audit"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "listener-rate-limiter"
port = "diport::RateLimiter"
provider = "redis::RedisRateLimiter"
providerCrate = "redis"
requiredFeatures = ["backend"]
consumer = "httpserve"
lifecycle = "active"
durability = "persistent"
scope = "cluster-global"
failurePosture = "fail-open"
purpose = "pre-auth-gcra-with-startup-self-check"
outputs = []


[[diportProviders]]
id = "device-mqtt-session"
port = "mqtt::MqttSession"
provider = "mqtt::MqttSession"
providerCrate = "mqtt"
consumer = "identity"
lifecycle = "active"
durability = "persistent"
purpose = "authenticated-persistent-device-transport"
outputs = ["probes", "resources", "workers"]

[[diportProviders]]
id = "device-revocation-store"
port = "diport::RevocationStore"
provider = "postgres::PgRevocationStore"
providerCrate = "postgres"
consumer = "deviceloop"
lifecycle = "active"
durability = "persistent"
purpose = "device-certificate-revocation"
outputs = ["probes", "workers"]
