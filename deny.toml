# RSS cargo-deny：supply-chain 策略 + 分层强制（Medium 载体）。
# 分层强制分级（见 plan / docs/rules/architecture.md §Rust 原生强制）：
#   Hard① crate 依赖图：未声明就 import 不到。
#   Hard② cargo 无环：下层依赖上层会闭环 → cargo 拒绝。
#   Medium 本文件 wrappers：域 / adapter crate 只能被组合根依赖——补「同层互斥」「上层误依赖 leaf」。
#   Medium `cargo xtask layer-deps`（source-centric，接入 verify）：读各成员 Cargo.toml [dependencies]，
#     按 §分层 矩阵全覆盖（含本 wrappers 表达不了的「无 back-path 基础/引擎→上层」反向边），
#     并守本文件 wrappers ⟷ 源分类一致性（LAYER-DEPS-06）。免疫裸名×crates.io 命名冲突。
#   下列 wrappers 是分层 defense-in-depth（与 layer-deps 并存）。adapter package 名须与其依赖的同名
#     crates.io crate **不同**（如 redis adapter 的 package = `redis-adapter`，`[lib] name = "redis"` 保留裸导入），
#     否则 bare-name ban 会误伤传递引入的同名外部 crate。详见 architecture.md §扁平 workspace 结构 命名约定。
[graph]
all-features = true

[advisories]
yanked = "deny"
# advisories 门双轨（issue #1133）：`cargo deny check advisories` 与 `cargo audit` 同查 RustSec、互为独立
# 第二实现（防御纵深）。二者各有独立 ignore 机制：本 `ignore`（按 feature-resolved 依赖图）vs cargo-audit 的
# `--ignore`（在 xtask `step_cargo_audit`，扫 Cargo.lock 全量——会多报 phantom 条目，如 rsa RUSTSEC-2023-0071）。
# 不变式（守卫 `deny_audit_ignore_lists_reconciled`，xtask/src/verify.rs，Medium）：**本 ignore ⊆ cargo-audit
# --ignore**——deny 接受的任一**图内** advisory 必须同步到 cargo-audit 侧，否则 deny 绿而 audit 红（一过一红、
# 阻断合入）。反向 audit 可多 ignore（phantom-only，本图里没有，无需在此 ignore）。故本表当前为空（无图内豁免）。
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots（sqlx tls-rustls 传递引入）打包 Mozilla 根 CA 集，以 CDLA-Permissive-2.0（Community
  # Data License Agreement，宽松数据许可）授权该 CA 数据。仅此依赖使用，#1116 postgres adapter 激活。
  "CDLA-Permissive-2.0",
  # Boost Software License 1.0（OSI 批准 + FSF Free/Libre，宽松无 copyleft、二进制无需署名）。
  # `xxhash-rust`（redis-rs 1.x 传递依赖，BSL-1.0 单授权，无 Apache/MIT 备选）经 deadpool-redis 引入，
  # #1009 redis adapter 激活。`ryu`/`whoami` 等同名 BSL 条目均 dual-license 走 Apache，不依赖本条。
  "BSL-1.0",
]
# 本仓成员均 publish = false，跳过其 license 校验（license 校验只针对外部依赖）。
private = { ignore = true }

[bans]
multiple-versions = "warn"     # pre-GA 容忍多版本；趋近 GA 收紧为 deny
wildcards = "deny"             # 禁外部 `*` 版本依赖
allow-wildcard-paths = true    # 但放行内部 workspace path 依赖（无版本即隐式 `*`，合法）
deny = [
  # 供应链 phantom 守卫（issue #1133）：rsa 当前是 phantom Cargo.lock 条目（经 sqlx-mysql，mysql feature 未启用 ⇒
  # `cargo tree -i rsa --all-features --target all` 为空、不编译进产物），其 RUSTSEC-2023-0071（Marvin Attack、
  # 无修复版本）在 cargo-audit 侧 `--ignore`（见 xtask `step_cargo_audit`）。本 ban 是把「phantom 论证」从 Soft
  # 升 Medium 的**机器守卫**：rsa 一旦进入 feature-resolved 依赖图（如有人启用 mysql feature），`deny check bans`
  # 即非零退出——强制显式决策（移除本 ban + 修复/重新评估漏洞 + 同步 cargo-audit --ignore）。图外时本 ban 为 no-op。
  { crate = "rsa" },
  # JWT 验签供应链收敛（issue #1195 / 1109-A1）：oidc adapter 改用纯 RustCrypto（p256/hmac/sha2）做 ES256+HS256
  # 验签后，jsonwebtoken 退出依赖图。本 ban 防重新引入——jsonwebtoken v9 后端 = ring（被迫钉死 =9.3.1），v10 显式
  # 后端会拉 rsa（上方已 ban）/ aws-lc-sys（OpenSSL 派生 license 不在 allow-list）。重新引入须显式决策（移除本
  # ban + 论证 crypto 后端 license/供应链）。图外时为 no-op（同 rsa）。use-instead 走 p256/hmac/sha2（RustCrypto）。
  { crate = "jsonwebtoken" },
  # 外部禁用（provider 收敛）
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
  # DI port 收敛（ADR-003 + ADR-005）：dynosaur（dyn-dispatch 宏）+ trait-variant（Send 变体生成）只能被
  # **DI port 定义点 crate** 依赖——provider-agnostic infra port 定义点 `diport`（DI-infra 层），及**定义
  # 自身 repo/service DI port 的域 crate**（Option 2：域 repo port 必然引用域内实体，不得收敛 diport）。
  # INVARIANT: DIPORT-MACRO-CONFINE-01′（ADR-005 把原 `-01`「仅 diport / 单一依赖点」放宽为白名单——repo
  #   port 多点定义后「单一依赖点」前提失效；provider-agnostic vs 域形 port 的 category line 见 ADR-005）。
  # 注：实测 dynosaur 0.3 生成的 unsafe 经 def-site hygiene **不触发** consumer forbid（无 unsafe 例外），
  #   故本 wrapper 是「DI port 定义点集中」架构守卫（Medium），非 unsafe 收敛——放宽白名单零安全代价。
  # ⚠ wrappers 须与 xtask `EXTERNAL_CONFINEMENT_WRAPPERS` 白名单**集合相等**（DIPORT-MACRO-CONFINE-01′ 守：
  #   漏列→域的合法 dynosaur 依赖被误拦；多列→开洞）。新增 sanctioned 域 crate 时同步两侧。
  # port-trait impl-sealing（谁可 impl）：cargo-deny 限「依赖」非「impl」。diport impl-site allowlist 由
  #   dylint 自写 lint `rss_diport_impl_allowlist`（AST 级，Medium，INVARIANT DIPORT-IMPL-ALLOWLIST-01）
  #   承载；adapter→域 impl 域 repo port 经分层 wrapper（见下 identity 行加 postgres）+ source edge 校验放行。
  { crate = "dynosaur", wrappers = ["diport", "identity", "settings"] },
  { crate = "trait-variant", wrappers = ["diport", "identity", "settings"] },
  # 分层（target-centric wrappers）：域 crate 只能被组合根（server/rss/xtask + 后续 assembly）依赖，
  # **外加**实现该域 repo/service port 的 adapter（adapter→域 = DIP 内向边，Option 2/ADR-005；如 identity
  # 的 RoleRepo 由 postgres impl）。覆盖：跨域互斥 + 服务/引擎/基础 → 域 的误依赖。
  # ⚠ INVARIANT(LAYER-WRAP-01)：新增任何组合根 crate（assembly/bin/journeys）须同步加入下列每条 wrappers，
  #   否则其对域/adapter/generated 的合法依赖会被 deny 误拦。此一致性的持久守卫 = `cargo xtask layer-deps`
  #   的 LAYER-DEPS-06（wrappers ⟷ 源分类交叉核对，接入 verify CI 门；issue #1022 落地）。
  #   `journeys` 是验收 journey 组合根（RW-G1，#999）——故出现在每条域/adapter/generated wrappers。
  #   adapter wrapper 经 LAYER-DEPS-06 反向②补强：必须有真实 adapter→domain source edge。
  # postgres impl RoleRepo + SessionLifecycle（合并 co-tx 创建 + find/revoke，#1083/#1192/#1278）；memory impl
  #   SessionLifecycle（demo provider，#1192/#1278）——均 adapter→域 DIP 内向边（Option 2/ADR-005），故加入 identity wrapper。
  { crate = "identity", wrappers = ["server", "rss", "xtask", "journeys", "postgres", "memory"] },
  # postgres impl ConfigRepo + ConfigUnitOfWork（co-tx，#1249）+ SecretRepo（#1274）——adapter→域 DIP 内向边（Option 2/ADR-005），故加入 settings wrapper；
  # memory impl SecretResolver 是 diport::SecretResolver provider（provider-agnostic infra port）——impl 归 adapter/组合根，与 settings 域形 SecretRepo 不同 crate。
  { crate = "settings", wrappers = ["server", "rss", "xtask", "journeys", "postgres"] },
  { crate = "audit", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "contractreg", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "syshealth", wrappers = ["server", "rss", "xtask", "journeys"] },
  # adapter crate 只能被组合根依赖（不被域 / 服务依赖；组合根注入）。ban 按 **package 名** 匹配——
  # adapter package 名须与其依赖的同名 crates.io crate 区分（redis adapter package = `redis-adapter`、
  # prometheus adapter package = `prometheus-adapter`，见各自 Cargo.toml），避免误伤同名 crates.io crate。
  { crate = "postgres", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "redis-adapter", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "amqp", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "mqtt", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "s3", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "oidc", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "grpc", wrappers = ["server", "rss", "xtask", "journeys"] },
  # httpd HTTP 传输 adapter（#1320 运行时入口）：HttpServer + ManagedResource，只被组合根依赖。
  { crate = "httpd", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "otel", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "prometheus-adapter", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "vault", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "softca", wrappers = ["server", "rss", "xtask", "journeys"] },
  { crate = "ratelimit", wrappers = ["server", "rss", "xtask", "journeys"] },
  # in-mem DI port provider adapter（RW-G1 追踪弹）：dev/test-only——**禁生产 bin（server/rss）依赖**，
  # 只准验收 journey + tooling（DEV_ADAPTER_ROOTS）依赖。机器边界 = xtask layers.rs DEV_ADAPTERS +
  # layer-deps LAYER-DEPS-07（正向收窄 required + 反向排除生产 bin）。wrapper 须恰为 dev 组合根。
  { crate = "memory", wrappers = ["journeys", "xtask"] },
  # 注：testkit（crates/testkit，含 #1137 容器 fixture + #1136 契约 harness）是 Service 层 test-support 库，
  # 不在此 ban——其「只准 [dev-dependencies] 消费」由 xtask layers.rs TEST_SUPPORT_CRATES + layer-deps
  # LAYER-DEPS-08（check_test_support_confinement：任一 shipped 边指向 testkit 即报）守，testcontainers 树经
  # `containers` feature + dev-dep-only 不进产物。
  # generated（contract 派生 wire 类型）只能被域 crate + 组合根依赖（防服务/引擎/基础层误依赖）。
  { crate = "generated", wrappers = ["identity", "settings", "audit", "contractreg", "syshealth", "server", "rss", "xtask", "journeys"] },
]

# 注意：cargo-deny 只扫描本（根 stable）workspace。`lints/` 是独立嵌套 workspace（根 Cargo.toml
# exclude），故下列 sources 策略**不覆盖** `lints/` 的依赖——其唯一 git 源 `clippy_utils`
# （rust-lang 官方 rust-clippy，rev 与 nightly 配对）经人工审核，见 lints/README.md。
[sources]
unknown-registry = "deny"
unknown-git = "deny"
