# RSS cargo-deny supply-chain policy plus selected direct-parent wrapper constraints.
# Cargo/rustc owns declared dependency validity and cycle rejection. Adapter package names must
# differ from same-named crates.io packages:
#     crates.io crate **不同**（如 redis adapter 的 package = `redis-adapter`，`[lib] name = "redis"` 保留裸导入），
#     否则 bare-name ban 会误伤传递引入的同名外部 crate。
[graph]
all-features = true

[advisories]
yanked = "deny"
# advisories 门双轨（issue #1133）：`cargo deny check advisories` 与 `cargo audit` 同查 RustSec、互为独立
# 第二实现（防御纵深）。二者各有独立 ignore 机制：本 `ignore`（按 feature-resolved 依赖图）vs cargo-audit 的
# `--ignore`（Makefile 中 cargo-audit 扫 Cargo.lock 全量，会多报 phantom 条目，如 rsa
# RUSTSEC-2023-0071）。本列表仍只覆盖 feature-resolved dependency graph。
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots（sqlx tls-rustls 传递引入）打包 Mozilla 根 CA 集，以 CDLA-Permissive-2.0（Community
  # Data License Agreement，宽松数据许可）授权该 CA 数据。仅此依赖使用，#1116 postgres adapter 激活。
  "CDLA-Permissive-2.0",
  # Boost Software License 1.0（OSI 批准 + FSF Free/Libre，宽松无 copyleft、二进制无需署名）。
  # `xxhash-rust`（redis-rs 1.x 传递依赖，BSL-1.0 单授权，无 Apache/MIT 备选）经 deadpool-redis 引入，
  # #1009 redis adapter 激活。`ryu`/`whoami` 等同名 BSL 条目均 dual-license 走 Apache，不依赖本条。
  "BSL-1.0",
]
# 本仓成员均 publish = false，跳过其 license 校验（license 校验只针对外部依赖）。
private = { ignore = true }

[bans]
multiple-versions = "warn"     # pre-GA 容忍多版本；趋近 GA 收紧为 deny
wildcards = "deny"             # 禁外部 `*` 版本依赖
allow-wildcard-paths = true    # 但放行内部 workspace path 依赖（无版本即隐式 `*`，合法）
deny = [
  # 供应链 phantom 守卫（issue #1133）：rsa 当前是 phantom Cargo.lock 条目（经 sqlx-mysql，mysql feature 未启用 ⇒
  # `cargo tree -i rsa --all-features --target all` 为空、不编译进产物），其 RUSTSEC-2023-0071（Marvin Attack、
  # 无修复版本）在 cargo-audit 侧 `--ignore`。本 ban 是把「phantom 论证」从 Soft
  # 升 Medium 的**机器守卫**：rsa 一旦进入 feature-resolved 依赖图（如有人启用 mysql feature），`deny check bans`
  # 即非零退出——强制显式决策（移除本 ban + 修复/重新评估漏洞 + 同步 cargo-audit --ignore）。图外时本 ban 为 no-op。
  { crate = "rsa" },
  # JWT 验签供应链收敛（issue #1195 / 1109-A1）：oidc adapter 改用纯 RustCrypto（p256/hmac/sha2）做 ES256+HS256
  # 验签后，jsonwebtoken 退出依赖图。本 ban 防重新引入——jsonwebtoken v9 后端 = ring（被迫钉死 =9.3.1），v10 显式
  # 后端会拉 rsa（上方已 ban）/ aws-lc-sys（OpenSSL 派生 license 不在 allow-list）。重新引入须显式决策（移除本
  # ban + 论证 crypto 后端 license/供应链）。图外时为 no-op（同 rsa）。use-instead 走 p256/hmac/sha2（RustCrypto）。
  { crate = "jsonwebtoken" },
  # Adapter 厚薄纪律（ADR-023 / #1494）：禁 FSM 框架 `statig` 进入依赖图——业务生命周期状态机只属
  # domain/引擎（consistency/deviceloop/…），adapters 仅薄委托。图外时本 ban 为 no-op；一旦 adapters
  # （或其它 crate）引入即 `deny check bans` 失败。INVARIANT: ADAPTER-THIN-FSM-01 { level = "Medium",
  # exec = "check", source = "config" }。
  { crate = "statig" },
  # 外部禁用（provider 收敛）
  { crate = "native-tls", use-instead = "rustls" },
  { crate = "tokio-native-tls", use-instead = "tokio-rustls" },
  { crate = "async-native-tls", use-instead = "rustls" },
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
  { crate = "async-openssl", use-instead = "rustls" },
  { crate = "aws-lc-rs", use-instead = "rustls ring provider" },
  { crate = "aws-lc-sys", use-instead = "rustls ring provider" },
  # DI port 收敛（ADR-003 + ADR-005）：dynosaur（dyn-dispatch 宏）+ trait-variant（Send 变体生成）只能被
  # **DI port 定义点 crate** 依赖——provider-agnostic infra port 定义点 `diport`（DI-infra 层），及**定义
  # 自身 repo/service DI port 的域 crate**（Option 2：域 repo port 必然引用域内实体，不得收敛 diport）。
  # INVARIANT: DIPORT-MACRO-CONFINE-02 { level = "Medium", exec = "check", source = "config" }（ADR-005 把原 `-01`「仅 diport / 单一依赖点」放宽为白名单——repo
  #   port 多点定义后「单一依赖点」前提失效；provider-agnostic vs 域形 port 的 category line 见 ADR-005）。
  # 注：实测 dynosaur 0.3 生成的 unsafe 经 def-site hygiene **不触发** consumer forbid（无 unsafe 例外），
  #   故本 wrapper 是「DI port 定义点集中」架构守卫（Medium），非 unsafe 收敛——放宽白名单零安全代价。
  # Cargo-deny constrains dependency parents, not Rust impl sites.
  { crate = "dynosaur", wrappers = ["diport"] },
  { crate = "trait-variant", wrappers = ["diport"] },
  # WORKSPACEFACTS-CONFINEMENT-01：workspacefacts is retained as a standalone metadata façade;
  # its test-support self edge is the only current workspace parent.
  { crate = "workspacefacts", wrappers = ["workspacefacts"] },
  { crate = "guppy", wrappers = ["workspacefacts"] },
  # 分层（target-centric wrappers）：只列 all-features 最终图中的真实 direct parents。
  # `cargo deny check -D unused-wrapper` rejects stale wrapper entries.
  # adapter→domain wrapper 仍必须有 shipped source edge。
  # SAGA-OPERATOR-MINT-01：高权限 Saga operator mint 仅 DI proof owner 可持有。
  { crate = "sagaauthmint", wrappers = ["diport"] },
  # DLQ-OPERATOR-MINT-01：DLQ operator mint 仅 DI proof owner 可持有。
  { crate = "dlqauthmint", wrappers = ["diport"] },
  # HTTP-REQUEST-ID-AUTHORITY-01：只有 HTTP middleware mint opaque carrier。
  { crate = "requestidmint", wrappers = ["httpserve"] },
  # RUNTIME-INVENTORY-MINT-01：assembly-schema only names the token in the private-field receipt
  # constructor; runtimeexec mints full-plan receipts and live observations.
  { crate = "runtimeinventorymint", wrappers = ["assembly-schema", "runtimeexec"] },
  # 注：testkit（crates/testkit，含 #1137 容器 fixture + #1136 契约 harness）是 Service 层 test-support 库，
  # 不在此 ban；integration packages only enable containers through dev-dependencies.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
