[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/shengming0817/rss"

# 外部依赖版本单源（single source of truth）。成员经 `dep.workspace = true` opt-in。
# CI 的 `--locked` standard Cargo invocations keep these declarations aligned with Cargo.lock.
[workspace.dependencies]
rss-ledger-postgres = { path = "crates/ledger-postgres", version = "0.1.0" }
rss-ledger = { path = "crates/ledger", version = "0.1.0" }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
rss-transactional-messaging-recovery-s3 = { path = "crates/transactional-messaging-recovery-s3", version = "0.1.0" }
aws-sdk-s3 = { version = "=1.142.0", default-features = false, features = ["rt-tokio"] }
base64 = "0.22"
backon = { version = "1.6", default-features = false, features = ["std"] }
rss-mqtt = { path = "crates/mqtt", version = "0.1.0" }
rumqttc-v5-next = { version = "=0.34.0", default-features = false, features = ["use-rustls-ring"] }
bytes = "1"
log = "0.4"
rdkafka = { version = "=0.39.0", default-features = false, features = ["ssl-vendored"] }
rss-transactional-messaging-kafka = { path = "crates/transactional-messaging-kafka", version = "0.1.0" }
rss-platform = { path = "crates/platform", version = "0.3.0" }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower = { version = "0.5", default-features = false }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
rss-transactional-messaging-recovery = { path = "crates/transactional-messaging-recovery", version = "0.1.0" }
# Versions and sources are declared here; consumers select only their required features.
# dynosaur and trait-variant remain exact-pinned for rss-runtime's async dispatch macros.
# sqlx and lapin use Rustls with the ring provider; cargo-deny rejects alternative TLS providers.
rss-saga-postgres = { path = "crates/saga-postgres", version = "0.1.0" }
rss-saga = { path = "crates/saga", version = "0.1.0" }
rss-device-command = { path = "crates/device-command", version = "0.1.0" }
rss-device-command-postgres = { path = "crates/device-command-postgres", version = "0.1.0" }
rss-reconcile-postgres = { path = "crates/reconcile-postgres", version = "0.1.0" }
rss-reconcile = { path = "crates/reconcile", version = "0.1.0" }
tempfile = "3"
rss-observation = { path = "crates/observation", version = "0.1.0" }
rss-observation-postgres = { path = "crates/observation-postgres", version = "0.1.0" }
rss-projection-postgres = { path = "crates/projection-postgres", version = "0.1.0" }
rss-projection = { path = "crates/projection", version = "0.1.0" }
rss-contract = { path = "crates/contract", version = "0.1.0" }
rss-request-context = { path = "crates/request-context", version = "0.1.0" }
rss-transactional-messaging = { path = "crates/transactional-messaging", version = "0.2.0" }
rss-transactional-messaging-runtime = { path = "crates/transactional-messaging-runtime", version = "0.1.0" }
rss-transactional-messaging-testkit = { path = "crates/transactional-messaging-testkit", version = "0.1.0" }
rss-transactional-messaging-amqp = { path = "crates/transactional-messaging-amqp", version = "0.1.0" }
rss-transactional-messaging-postgres = { path = "crates/transactional-messaging-postgres", version = "0.1.0" }
rss-redact-derive = { path = "crates/redact-derive", version = "0.1.0" }
rss-redact = { path = "crates/redact", version = "0.1.0" }
rss-data-protection = { path = "crates/data-protection", version = "0.1.0" }
rss-runtime = { path = "crates/runtime", version = "0.1.0" }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1" }
futures = { version = "0.3", default-features = false }
subtle = "2"
ring = "0.17"
dynosaur = "=0.3.0"
trait-variant = "=0.1.2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
rcgen = "0.14.8"
sqlx = { version = "=0.9.0", default-features = false }
deadpool-redis = { version = "0.23", default-features = false, features = ["rt_tokio_1", "tokio-comp", "tls-rustls", "tls-rustls-webpki-roots", "tokio-rustls-comp", "script"] }
lapin = { version = "4", default-features = false, features = ["default-runtime", "rustls--ring", "rustls-webpki-roots-certs"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
secrecy = { version = "0.10" }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
opentelemetry_sdk = "0.32"
url = "2"
time = { version = "0.3", default-features = false, features = ["parsing"] }
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
proc-macro-crate = "3"
rstest = "0.24"
static_assertions = "1.1.0"
trybuild = "1"
testcontainers = "0.27"

# 工程护栏（成员经 `[lints] workspace = true` 继承）。
[workspace.lints.rust]
unsafe_code = "forbid"          # 默认全局 forbid；例外按 crate 自定义 [lints] 解禁

[workspace.lints.clippy]
cognitive_complexity = "warn"   # CLAUDE.md ≤15（阈值在 clippy.toml）
disallowed_methods = "warn"     # 具体列表在 clippy.toml（clock 注入纪律）
disallowed_types = "warn"
disallowed_macros = "warn"
panic = "deny"                  # panic 纪律由 workspace lint policy 与 clippy.toml 强制；测试模块只允许 item-level #[allow] carve-out
unwrap_used = "deny"
expect_used = "deny"
