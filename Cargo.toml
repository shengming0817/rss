# RSS 扁平 Cargo workspace。Cargo manifests own the dependency graph; deny.toml adds supply-chain
# and selected wrapper constraints.
[workspace]
resolver = "2"
members = [
  "tests/ledger-postgres-integration",
  "crates/ledger-postgres",
  "crates/ledger",
  "tests/archive-integration",
  "crates/transactional-messaging-recovery-s3",
  "crates/mqtt",
  "tests/mqtt-integration",
  "crates/axum",
  "crates/transactional-messaging-recovery",
  "crates/saga",
  "crates/saga-postgres",
  "tests/saga-postgres-integration",
  "crates/device-command",
  "crates/device-command-postgres",
  "tests/device-command-postgres-integration",
  "crates/reconcile",
  "crates/reconcile-postgres",
  "tests/reconcile-postgres-integration",
  "crates/observation",
  "crates/observation-postgres",
  "crates/projection",
  "crates/projection-postgres",
  "tests/projection-postgres-integration",
  "crates/contract",
  "crates/request-context",
  "crates/platform",
  "crates/transactional-messaging",
  "crates/transactional-messaging-runtime",
  "crates/transactional-messaging-testkit",
  "crates/redact-derive",
  "crates/redact",
  "crates/data-protection",
  "crates/runtime",
  "crates/diagctx",
  "crates/tracewire",
  "crates/testkit",
  "crates/transactional-messaging-postgres",
  "crates/transactional-messaging-amqp",
  "crates/transactional-messaging-kafka",
  "tests/kafka-integration",
  "tests/amqp-integration",
  "tests/postgres-integration",
]

