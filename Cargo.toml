# RSS 扁平 Cargo workspace（骨架）。
# 结构树 / 分层 / 命名单一事实源：docs/rules/architecture.md §扁平 workspace 结构 + §分层。
# 分层强制：crate 依赖图（Hard，编译期）+ deny.toml wrappers（Medium，CI）。见 deny.toml。
[workspace]
resolver = "2"
members = [
  # 基础（仅 std + 外部 crate，不依赖内部分组）
  "crates/vocab",
  "crates/ids",
  # secure 的字段级脱敏 derive（#[derive(Redactable)]）proc-macro；intra-base DAG 低于 secure（secure → securederive 前向边）
  "crates/securederive",
  "crates/secure",
  "crates/support",
  "crates/runctx",
  "crates/diagctx",
  # 引擎 / 原语（依赖基础）
  "crates/consistency",
  "crates/primitives",
  # DI-infra（依赖基础 + 引擎；被服务 / 域 / adapter / 组合根消费——DI port trait 单源 + dynosaur unsafe 收敛）
  "crates/diport",
  # 服务（依赖基础 + 引擎 + DI-infra）
  "crates/httpserve",
  "crates/authn",
  "crates/bootstrap",
  "crates/eventexec",
  "crates/observ",
  "crates/distributed",
  "crates/deviceloop",
  # 服务层 test-support：HTTP 契约测试脚手架（oneshot harness；经 [dev-dependencies] 被域/组合根消费，不进生产 shipped 图）
  "crates/testkit",
  # 域（依赖基础 + 引擎 + 服务 + generated；互不依赖）
  "crates/identity",
  "crates/settings",
  "crates/audit",
  "crates/contractreg",
  "crates/syshealth",
  # adapters（实现基础 / 引擎 / 服务 trait；不被域依赖）
  "adapters/postgres",
  "adapters/redis",
  "adapters/amqp",
  "adapters/mqtt",
  "adapters/s3",
  "adapters/oidc",
  "adapters/grpc",
  "adapters/httpd",
  "adapters/otel",
  "adapters/prometheus",
  "adapters/vault",
  "adapters/softca",
  "adapters/ratelimit",
  # in-mem DI port provider（RW-G1 追踪弹验接缝；测试 / demo 注入用，被 journeys 组合根消费）
  "adapters/memory",
  # 组合根（可依赖所有库 crate）
  "assemblies/runtime",
  "bins/server",
  "bins/rss",
  "xtask",
  # 验收 journey 组合根（demo 组装根 + 端到端集成测试；RW-G1 追踪弹）
  "journeys",
  # 契约派生（committed，被域依赖）
  "generated",
]
# 自写 dylint lint workspace（nightly rustc_private，自成独立 workspace）——显式排除，
# 不参与根 stable 1.96 构建。隔离主靠 lints/Cargo.toml 的 [workspace]，此处作可见防线。
exclude = ["lints"]

# 自写 dylint lint 注册入口；对 cargo build/test/check 惰性（仅 `cargo dylint` 读取），
# 配合 exclude 使 stable 构建永不触碰 lints/ 的 nightly 工具链。
# 运行：`cargo dylint --all`（须 `cargo install cargo-dylint dylint-link`）。见 lints/。
[workspace.metadata.dylint]
libraries = [
  { path = "lints/rss_domain_no_serialize" },
  { path = "lints/rss_spawn_missing_scope" },
  { path = "lints/rss_crosstenant_callsite" },
  { path = "lints/rss_diport_impl_allowlist" },
  { path = "lints/rss_authplan_callsite" },
  { path = "lints/rss_authenticated_callsite" },
  { path = "lints/rss_diport_error_debug_redacted" },
  { path = "lints/rss_pdp_impl_adapter_only" },
  { path = "lints/rss_projection_append_only" },
  { path = "lints/rss_partition_serial_allowlist" },
  { path = "lints/rss_diport_envelope_reserved_writer" },
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"

# 外部依赖版本单源（single source of truth）。成员经 `dep.workspace = true` opt-in。
# 多数 pin 已有成员引用、进 Cargo.lock；少数前瞻预留（inert，暂无成员引用）须带注释标注。
# pin 必须被 Cargo.lock 的 resolved 版本满足（或为带注释的 inert 前瞻）——由 `cargo xtask wsdeps-drift` 守（#1185）。
[workspace.dependencies]
# 运行时 / 序列化 / 错误 / 日志
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }   # CancellationToken（tokio_util::sync::CancellationToken，cargo feature = "rt"）；见 bootstrap shutdown 范式
tokio-stream = { version = "0.1", features = ["net"] }   # TcpListenerStream（adapters/grpc serve_with_incoming_shutdown：自绑 listener 读回 ephemeral 端口供测试）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 基础持有/解析只需默认 std feature；v4 生成与 serde 由真实需要的 crate 各自 opt-in（per-crate features），不在 workspace 默认面铺开供应链/构建面。
uuid = { version = "1" }
futures = "0.3"
# 编码 / 加密原语（基础层 + 引擎原语 opt-in）
base64 = "0.22"   # vocab Cursor base64url（URL_SAFE_NO_PAD）不透明 token 解码校验
subtle = "2"      # primitives constant_time_eq 常数时间比较（RustCrypto 工业标准，免自维护 black_box 屏障）。ref: dalek-cryptography/subtle src/lib.rs@main
# softca dev-CA 签名 provider（adapters/softca，#1010）：ECDSA P-256 sign-bytes 原语
# （EcdsaKeyPair generate_pkcs8 / from_pkcs8 / sign）。ring 0.17 已因 rustls←sqlx/redis 在树、LICENSE 判
# ISC 在 deny allow-list 内 ⇒ 零新增 crypto license 面（对标 adapters/oidc 选 ring 同款理由）；仅 softca
# backend feature 直接消费。ref: briansmith/ring src/signature/ecdsa.rs@0.17.14
ring = "0.17"
# 密码哈希（secure::password，#1188）：argon2id PHC 哈希 + 内建 constant-time 验签 + 随机盐。default `rand`
# 给 `SaltString::generate`；额外 `std` 经 password-hash/std → rand_core/std 拉起 getrandom，暴露
# `password_hash::rand_core::OsRng`（CSPRNG 盐源）。ref: RustCrypto/argon2 argon2/src/lib.rs@master
# （Apache-2.0 OR MIT，deny allow-list 内；传递 blake2/password-hash 同许可）。
argon2 = { version = "0.5", features = ["std"] }
# DI port trait 的 async dyn 派发：native AFIT + dynosaur 宏生成 dyn-compatible wrapper（ADR-003）。
# exact-pin（pre-1.0，new_box/new_arc/bridge API 仍破坏式演进；升级须审 changelog）。仅 diport
# 可依赖（deny.toml wrapper 守 DI port 集中 + 单一 dyn-dispatch 依赖点；别处 import 不到宏）。
# 注：实测 dynosaur 0.3 生成的 unsafe 不触发 consumer forbid（def-site hygiene），无 unsafe 例外（见 diport）。
dynosaur = "=0.3.0"
# Send-bounded async DI port：trait_variant 生成 Send 变体，dynosaur `bridge(dyn)` 据此生成
# Send 的 Dyn wrapper（ShutdownStack 经 tokio::spawn 做 panic 隔离需要 Send future）。
# exact-pin：与 dynosaur 耦合的 dyn-infra，codegen 互操作随版本演进，升级须同审。
trait-variant = "=0.1.2"
# HTTP / gRPC（服务层前瞻）
axum = "0.8"
tower = "0.5"
tower-http = "0.6"   # 服务层中间件前瞻（rate-limit/body-limit/security-headers，见 #1106）；当前无成员引用，inert
# 限流 provider（adapters/ratelimit，#1011）：keyed GCRA 限流器，x/time/rate（token bucket）的 Rust 工业等价。
# 自带 monotonic clock（DefaultClock/QuantaClock；FakeRelativeClock 供确定性测试）——不经 diport::Clock
# （wall-clock SystemTime，错的时间基），故不触 clippy disallowed-methods（ban 仅约束我们直调 now()）。
# ref: antifuchs/governor src/state/keyed.rs
governor = "0.8"
# gRPC 传输（adapters/grpc，#1011）+ otel OTLP/gRPC 导出（adapters/otel）共用一份。tonic 0.14 把 prost 集成
# 拆出 tonic-prost/tonic-prost-build（core tonic codec-agnostic）。grpc 直接消费 tonic（server+router，不启 tls：
# plaintext，TLS 三模式 deferred P2-6）+ tonic-health（标准 gRPC 健康服务，server scaffold 的 baseline service）；
# prost 当前仅经 tonic-prost 传递进 lock@0.14（直接 workspace 消费随 P2-7 proto codegen 落地）。与 otel 的
# opentelemetry-otlp 0.32（grpc-tonic → tonic 0.14.6）统一到 0.14，避免 0.13/0.14 双版本（#1185）。
# ref: hyperium/tonic examples/src/health/server.rs@master
tonic = "0.14"
tonic-health = "0.14"
prost = "0.14"
# 持久化（postgres adapter，#1116）
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }  # tls-rustls 显式关 openssl 传递路径（与 deny.toml openssl ban 一致）；migrate+macros = Migrator + sqlx::migrate!
# redis adapter 幂等 claimer（#1009）：rustls-only（禁 openssl/native-tls，与 deny.toml openssl ban 一致）；
# re-export redis cmd API + passthrough TLS feature。明文 redis:// / TLS rediss:// 由 URL scheme 决定。
deadpool-redis = { version = "0.23", default-features = false, features = ["rt_tokio_1", "tokio-comp", "tls-rustls", "tokio-rustls-comp"] }
# AMQP broker I/O（adapters/amqp，仅 `integration` feature 编译）。default-features=false 关 TLS：
# lapin 的 rustls/native-tls 后端会拉 aws-lc-sys(OpenSSL 派生 license) / ring(license-file)，二者均不在
# deny.toml license allow-list（cargo-deny 连 optional 树也校验）⇒ 本 PR 仅明文 `amqp://`（local broker
# 集成测试 / per-domain vhost 隔离够用）。default-runtime = tokio executor + reactor。生产 AMQPS/TLS
# provider license 甄别 = follow-up（见 PR body）。ref: lapin examples/pubsub.rs@main
lapin = { version = "4", default-features = false, features = ["default-runtime"] }
# MQTT broker I/O（adapters/mqtt，#1010，仅 `integration` feature 编译）。MQTT v5（`rumqttc::v5`）——
# publish 经 `PublishProperties.correlation_data` 携带 event_id、订阅侧读回填入 `Message.id`，与 amqp
# `message_id` 传播对称，保跨进程「至少一次 + 幂等」去重。default-features=false 关 TLS：rumqttc 的
# use-rustls / use-native-tls 后端会拉 ring / aws-lc-sys（license 不在 deny.toml allow-list，cargo-deny
# 连 optional 树也校验）⇒ 本 PR 仅明文 `mqtt://`（local mosquitto 集成测试够用）；生产 mqtts/mTLS
# （依赖 softca）= follow-up。对标 gocell mqtt adapter@paho.mqtt.rust。ref: bytebeamio/rumqtt rumqttc/examples/asyncpubsub.rs@main
rumqttc = { version = "0.25", default-features = false }
# 对象存储 provider（adapters/s3，#1011）：AWS 官方 SDK，对标 gocell s3.ObjectUploader@aws-sdk-go-v2。
# default-features=false 关默认 HTTPS client（default-https-client 会拉 aws-lc-rs / ring，二者 license
# 均不在 deny.toml allow-list，cargo-deny 连 optional 树也校验——同 lapin 上文的 TLS 收口理由）。adapter
# 只持有 Client（组合根 / 集成测试注入 endpoint + 连接器）；plaintext MinIO 集成测试用裸 http 连接器，生产
# HTTPS/TLS provider license 甄别 = follow-up（见 PR body）。ref: awslabs/aws-sdk-rust sdk/s3/src/client.rs
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
# Vault Transit 签名 HTTP 客户端（adapters/vault，#1011）：TLS-agnostic —— default-features=false 不绑 crypto
# provider（不进 ring/aws-lc-rs/openssl/rustls，deny 全绿；http 即可达本地 dev Vault）。production HTTPS 的
# TLS provider（rustls+ring，对齐 sqlx）由组合根 Join 阶段经 reqwest tls feature 选定后注入预配置 Client
# （对标 s3 注入 aws Client 不配 TLS）。ref: jmgilman/vaultrs vaultrs/src/api/transit/requests.rs
reqwest = { version = "0.12", default-features = false }
# Vault token 内存清零（adapters/vault，#1011 F5）：Zeroizing<String> drop 时清零密钥物料。
# default-features=false + alloc：只取 String Zeroize impl，不拉 std/derive（Apache-2.0 OR MIT，deny allow-list 内）。
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# aws-sdk-s3 客户端测试 mock（dev-only，adapters/s3）：canned 响应规则注入确定性单测。经 test-util 传递
# 引入 hyper（MIT，dev-only mock http client 载体），但**不拉 TLS crypto**（ring/aws-lc-rs/openssl/rustls
# 均不进树，deny 全绿）。production lib 仍 crypto-free。smithy-rs 官方非实验 mock crate。
aws-smithy-mocks = "0.2"
# reqwest 客户端测试 mock server（dev-only，adapters/vault）：loopback canned 响应 endpoint，让 reqwest 真发
# 请求、测真实编排（URL percent-encode / X-Vault-Token header / 非 2xx 状态分支 / timeout），不抽 transport
# trait（vault 永远只用 reqwest 一个 provider，seam 是只为测试的多余抽象）——对标 s3 aws-smithy-mocks「传输边界
# mock、测真实编排」范式。默认仅明文 HTTP，**不拉 TLS crypto**（ring/aws-lc-rs/openssl/rustls 均不进树，deny
# 全绿，同 aws-smithy-mocks 收口理由）。ref: LukeMathWalker/wiremock-rs src/server.rs@main
wiremock = "0.6"
# JWT/JWS 验签原语（adapters/oidc，#1195 / 1109-A1）：纯 RustCrypto，对标 RustCrypto + spiffe/rust-spiffe
# JWT-SVID 验签面。diport::Pdp port 只需「入站 token 验签」（签名 + exp/nbf + iss + aud），非完整 OAuth/OIDC
# client flow（discovery/PKCE/token 交换 + live JWKS-over-HTTP 拉取留 #1109/T003）。**替换 #1011 的
# jsonwebtoken 切片**：jsonwebtoken v9 后端 = ring，被迫钉死 =9.3.1（v10 显式后端会拉 rsa〔deny ban,
# RUSTSEC-2023-0071〕/ aws-lc-sys〔OpenSSL 派生 license 不在 allow-list〕）；且其只能整 crate 拒对称算法
# （无 service-token HS256 路径）、exp/nbf 隐式取系统时钟（违 rust-standards「Clock 构造器注入」护栏）。
# RustCrypto 纯 Rust（Apache-2.0/MIT，零新增 ring 面）：ES256（p256 ecdsa，JWT 路径）+ HS256（hmac+sha2,
# service-token 路径），常数时间比较复用 primitives::crypto::constant_time_eq（CRYPTO-CONST-TIME-01）。
# ES256 公钥经 SEC1 未压缩点注入（构造器签名跨 JWKS PR 稳定——T003 JWKS x/y 同形）。jsonwebtoken 已从
# deny.toml ban（防重新引入）。ref: RustCrypto/elliptic-curves p256 + RustCrypto/MACs hmac + spiffe/rust-spiffe
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# 可观测性导出（adapters/otel，#1011）：tracing span → OTLP/gRPC 导出。opentelemetry-otlp 选
# grpc-tonic + tls-ring（rustls 走 ring，**禁** tls-aws-lc：aws-lc-sys 的 OpenSSL 派生 license 不在
# deny.toml allow-list，与 sqlx/redis tls-rustls 同口径）+ tls-webpki-roots（打包 Mozilla 根，webpki-roots
# CDLA-Permissive-2.0 已在 allow-list）。default-features=false 关默认 http/reqwest exporter，仅留 gRPC 面。
# 注：opentelemetry-otlp 0.32 传递引入 tonic 0.14；workspace `tonic`/`prost` pin 已统一到 0.14（#1011/#1185），
# grpc adapter 直接消费同一份，无 0.13/0.14 双版本。ref: open-telemetry/opentelemetry-rust
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-webpki-roots"] }
# tracing span → OTel SDK 桥接 Layer（组合根 registry().with(layer) 注册）。0.33 配对 opentelemetry 0.32。
# ref: tokio-rs/tracing-opentelemetry
tracing-opentelemetry = "0.33"
# OtelEndpoint::insecure_localhost 的 loopback 校验：用 canonical URL parser 解析 scheme/host/userinfo，
# 不手写 authority split（防 `http://localhost@evil` userinfo 伪装 host 绕过）。已在树（idna 等传递依赖）。
# ref: servo/rust-url url/src/lib.rs（Url::host/username/password）
url = "2"
# 指标 facade + Prometheus 后端（adapters/prometheus，#1011）。Rust 可观测 facade 选 `metrics` crate（冻结
# 迁移决策 gocell-rust-crate-mapping.md：slog+otel+prometheus → tracing+tracing-opentelemetry+metrics facade）；
# 发射点经 `metrics::counter!` 全局 facade，adapter 持 PrometheusHandle 渲染 exposition。
# default-features=false 关 http-listener/push-gateway——避免拉 hyper/rustls/ring/aws-lc（TLS + HTTP-server
# 供应链面；/metrics HTTP serving 是组合根/httpserve 关注点，不在 adapter；同 s3/lapin 的 TLS 收口范式，
# deny license allow-list 是机器门：ring/aws-lc 不在 allow-list ⇒ 入树即红，仅余 recorder + render 子树）。
# 注：m-e-p default-features=false 子树无 tokio；workspace 内 tokio 经 diport→tokio-util 已在树，与本依赖无关。
# ref: metrics-rs/metrics metrics-exporter-prometheus/src/exporter/builder.rs@metrics-exporter-prometheus-v0.18.3
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# settings 域 feature-flag 求值（#1013）：SemVer / 日期 rollout operator 的解析比较。均 MIT OR Apache-2.0
# （deny.toml allow-list 内），已在 Cargo.lock 传递树中——升为直接依赖不引入新供应链面。time 仅取 parsing
# feature（Rfc3339），不拉 std clock（求值无系统时钟，clippy disallowed-methods 不触）。
# semver 亦供 xtask wsdeps-drift 治理（#1185，解析 [workspace.dependencies] pin↔Cargo.lock resolved 版本）。
# ref: Unleash/unleash-types-rs src/client_features.rs@main（SEMVER_*/DATE_* constraint 语义）
semver = "1"
time = { version = "0.3", default-features = false, features = ["parsing"] }
# 契约 codegen（xtask 专用；generated crate 不引入这些——见 docs/rules/architecture.md §83/§126）
typify = "0.7"
schemars = "0.8.22"          # reason: 钉 0.8——typify 0.7 消费 schemars::schema::RootSchema（0.8 形态），勿误升 1.x
prettyplease = "0.2"
syn = { version = "2", features = ["full", "parsing"] }
# securederive proc-macro（#[derive(Redactable)]）的 token 生成 + AST：与 syn 配对的标准 proc-macro 三件套。
# 均 MIT OR Apache-2.0（deny.toml allow-list 内），已在 syn/typify 传递树——升直接依赖不引入新供应链面。
quote = "1"
proc-macro2 = "1"
toml = "0.8"
# 测试
rstest = "0.24"
trybuild = "1"   # diport DI port trait 的 dyn-compatible compile-pass/fail 回归锁（Medium）
mockall = "0.13"
insta = "1"   # inert 前瞻预留（snapshot 测试，暂未引入任何成员）
# testcontainers 真集成（#1137，crates/testkit `containers` feature）：起真 postgres/redis/rabbitmq 容器。
# 仅经 testkit `containers` feature + 各 adapter/journeys 的 `integration` feature 传递激活（默认构建 / verify
# 不拉此树）。docker 为运行期依赖（编译不需）；CI 集成 lane（#1145）提供 docker。ref: testcontainers/testcontainers-rs-modules-community
testcontainers = "0.27"
testcontainers-modules = "0.15"

# 工程护栏（成员经 `[lints] workspace = true` 继承）。
[workspace.lints.rust]
unsafe_code = "forbid"          # 默认全局 forbid；例外按 crate 自定义 [lints] 解禁

[workspace.lints.clippy]
cognitive_complexity = "warn"   # CLAUDE.md ≤15（阈值在 clippy.toml）
disallowed_methods = "warn"     # 具体列表在 clippy.toml（clock 注入纪律）
disallowed_types = "warn"
disallowed_macros = "warn"
panic = "deny"                  # panic 纪律（rust-standards.md/error-handling.md 要求 deny）；测试模块 item-level #[allow] carve-out
unwrap_used = "deny"
expect_used = "deny"
