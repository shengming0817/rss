# RSS 扁平 Cargo workspace。Cargo manifests own the dependency graph; deny.toml adds supply-chain
# and selected wrapper constraints.
[workspace]
resolver = "2"
members = [
  "crates/saga",
  "crates/saga-postgres",
  "tests/saga-postgres-integration",
  "crates/device-command",
  "crates/device-command-postgres",
  "tests/device-command-postgres-integration",
  "crates/reconcile",
  "crates/reconcile-postgres",
  "tests/reconcile-postgres-integration",
  "crates/observation",
  "crates/observation-postgres",
  "crates/projection",
  "crates/projection-postgres",
  "tests/projection-postgres-integration",
  # Foundation Public：公开值与只读请求上下文；零 internal workspace 生产依赖。
  "crates/contract",
  "crates/request-context",
  # Platform Public：只依赖 Foundation Public 的 provider-free 应用窄腰。
  "crates/platform",
  # Transactional Messaging Public：provider-neutral message/transaction/receipt/settlement core。
  "crates/transactional-messaging",
  # Transactional Messaging Runtime Public：provider-neutral relay/consumer algorithms + managed task glue。
  "crates/transactional-messaging-runtime",
  # Transactional Messaging Testkit Public：provider-neutral conformance + deterministic memory doubles。
  "crates/transactional-messaging-testkit",
  # 基础（仅 std + 外部 crate）
  "crates/vocab",
  "crates/ids",
  # 字段级脱敏 runtime + derive；proc-macro 仅由 rss-redact 包装。
  "crates/redact-derive",
  "crates/redact",
  # Provider-neutral storage protection primitives.
  "crates/data-protection",
  # Provider-neutral lifecycle ownership and bounded shutdown.
  "crates/runtime",
  "crates/secure",
  "crates/support",
  "crates/runctx",
  "crates/diagctx",
  "crates/dlqauthmint",
  "crates/requestidmint",
  # 引擎 / 原语（依赖基础）
  "crates/consistency",
  "crates/primitives",
  # W3C traceparent capture/restore 生产单源（#1224），被 httpd/postgres/eventexec 依赖。
  "crates/tracewire",
  # publish=false、dev-dependency-only 的 OTel 测试 subscriber / exporter 脚手架。
  "crates/tracewiretest",
  # Cargo workspace facts（guppy 薄适配；仅 tooling/verification consumer）。
  "crates/workspacefacts",
  # DI-infra（依赖基础 + 引擎；被服务 / 域 / adapter / 组合根消费——DI port trait 单源 + dynosaur unsafe 收敛）
  "crates/diport",
  "crates/listenerlifecycle",
  # 服务（依赖基础 + 引擎 + DI-infra）
  "crates/httpserve",
  "crates/eventexec",
  "crates/observ",
  "crates/distributed",
  # 服务层 test-support：HTTP 契约测试脚手架（oneshot harness；经 [dev-dependencies] 被域/组合根消费，不进生产 shipped 图）
  "crates/testkit",
  # 域（依赖基础 + 引擎 + 服务 + generated；互不依赖）
  # adapters（实现基础 / 引擎 / 服务 trait；不被域依赖）
  "crates/transactional-messaging-postgres",
  "adapters/redis",
  "crates/transactional-messaging-amqp",
  "adapters/s3",
  "adapters/grpc",
  "adapters/httpd",
  "adapters/otel",
  "adapters/prometheus",
  "adapters/vault",
  "adapters/ratelimit",
  # MacVerifier 生产 backend（RustCrypto hmac/sha2；audit keyed-HMAC 链 verifier，#1230）
  "adapters/crypto",
  # in-mem DI port provider（RW-G1 追踪弹验接缝；测试 / demo 注入用，被 journeys 组合根消费）
  "adapters/memory",
  # Live provider tests are ordinary reverse-dependency workspace packages.
  "tests/amqp-integration",
  "tests/postgres-integration",
  "tests/redis-integration",
  "tests/s3-integration",
]

